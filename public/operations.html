<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Operations | Shop&Drop</title><style>body{font:16px Arial,sans-serif;background:#f3f5f8;color:#17202a;margin:0}main{max-width:1100px;margin:auto;padding:24px}.panel{background:white;padding:20px;border-radius:12px;margin:16px 0;overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #ddd;text-align:left;padding:10px}button{padding:10px;background:#0f766e;color:white;border:0;border-radius:6px;cursor:pointer}.warn{background:#fff2d7;padding:12px;border-radius:8px}</style></head><body><main><a href="/admin.html">← Admin Centre</a><h1>Order operations · demo</h1><p class="warn">Read-only. No live payments, refunds, courier bookings or seller transfers are available. Payment and shipment records are not independently verified.</p><button id="refresh">Refresh reports</button><p id="message" role="status"></p><section class="panel"><h2>Orders and delivery status</h2><div id="orders"></div></section><section class="panel"><h2>Seller reconciliation preview</h2><div id="sellers"></div></section><section class="panel"><h2>Refund review queue</h2><div id="refunds"></div></section></main><script>
const money=x=>(Number(x)/100).toLocaleString('en-ZA',{style:'currency',currency:'ZAR'});
const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url){let r=await fetch(url,{credentials:'same-origin'});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function table(headers,rows){if(!rows.length)return '<p>No records.</p>';return '<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function load(){message.textContent='Loading…';try{const [o,s,r]=await Promise.all([api('/api/admin/order-operations'),api('/api/admin/seller-reconciliation'),api('/api/admin/refund-review')]);orders.innerHTML=table(['Order','Status','Payment record','Delivery record','Tracking','Order subtotal'],o.orders.map(x=>[x.id,x.order_status,x.payment_status,x.shipment_status,x.tracking_number,money(x.total_cents)]));sellers.innerHTML=table(['Seller','Orders','Gross order value','Recorded paid','Recorded refunded'],s.sellers.map(x=>[x.store_name,x.order_count,money(x.gross_order_cents),money(x.recorded_paid_order_cents),money(x.recorded_refunded_order_cents)]));refunds.innerHTML=table(['Order','Order status','Payment record','Subtotal'],r.orders.map(x=>[x.id,x.order_status,x.payment_status,money(x.total_cents)]));message.textContent='Demo records loaded. No funds moved.'}catch(e){message.textContent=e.message}}
document.getElementById('refresh').addEventListener('click',load);load();
</script></body></html>
