<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop&Drop R2-B Test</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.5}label{display:block;margin-top:12px}input{width:100%;box-sizing:border-box;padding:12px}button{margin:14px 6px 0 0;padding:12px}pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:16px}</style></head><body><h1>Shop&amp;Drop R2-B Account &amp; Session Test</h1><p>Isolated diagnostic. No V26.24 page is modified.</p><label>Email</label><input id="e" type="email"><label>New Shop&amp;Drop password</label><input id="p" type="password"><button id="su">1. Create Test Account</button><button id="si">2. Sign In After Confirmation</button><button id="ss">3. Check Session</button><pre id="o">READY.</pre><script src="./supabase-auth-r2b.js"></script><script>
const o=document.getElementById("o"),e=document.getElementById("e"),p=document.getElementById("p");
su.onclick=async()=>{if(!e.value||!p.value){o.textContent="Enter email and a new Shop&Drop password.";return}o.textContent="CREATING...";const r=await ShopDropR2B.signUp(e.value.trim(),p.value);o.textContent=r.ok?"SIGNUP REQUEST ACCEPTED\n\nCheck your email and confirm the account before signing in.\nHTTP status: "+r.status:"SIGNUP REVIEW REQUIRED\nHTTP status: "+r.status+"\n"+JSON.stringify(r.body,null,2)};
si.onclick=async()=>{if(!e.value||!p.value){o.textContent="Enter the same email and Shop&Drop password.";return}o.textContent="SIGNING IN...";const r=await ShopDropR2B.signIn(e.value.trim(),p.value);o.textContent=r.ok?"SIGN IN PASS\n\nAuthenticated session/JWT received.\nHTTP status: "+r.status:"SIGN IN REVIEW REQUIRED\nHTTP status: "+r.status+"\n"+JSON.stringify(r.body,null,2)};
ss.onclick=()=>{const s=ShopDropR2B.summary();o.textContent=s?"SESSION PASS\n\n"+JSON.stringify(s,null,2):"NO R2-B SESSION FOUND."};
</script></body></html>
