<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell on Shop&Drop</title><style>body{font:16px Arial;background:#f3f5f8;color:#17202a;margin:0}main{max-width:650px;margin:5vh auto;background:#fff;padding:28px;border-radius:12px}input,select,button{width:100%;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #cbd5e1}button{background:#0f766e;color:#fff;border:0;font-weight:700}.note{background:#ecfdf5;padding:14px;border-radius:8px}</style></head><body><main><a href="/">← Shop&Drop</a><h1>Sell something — FREE</h1><div class=note>No company or website required. List for free. Shop&Drop receives 10% of the product selling price only when your item sells.</div><p>Sign in or register as a customer first, then apply as a seller. Seller details are kept private from public product listings.</p><form id=form><label>Seller type</label><select id=type><option value=individual>Private individual</option><option value=home_business>Home business / maker</option><option value=second_hand>Second-hand seller</option><option value=business>Business / company</option></select><label>Name for your private seller account</label><input id=store required minlength=2 placeholder="Your name or business name"><label>Country code</label><input id=country placeholder="e.g. ZA, IQ, GB"><label>Cellphone</label><input id=phone placeholder="Cellphone number"><label>WhatsApp (optional)</label><input id=whatsapp placeholder="WhatsApp number"><button>Submit seller application</button></form><p id=message></p></main><script>form.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/sellers/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sellerType:type.value,storeName:store.value,countryCode:country.value,phone:phone.value,whatsapp:whatsapp.value})}),d=await r.json();message.textContent=r.ok?'Application received. Your seller details will remain private on public product listings.':(d.error||'Unable to apply')};</script></body></html>
