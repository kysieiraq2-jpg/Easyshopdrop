<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell on Shop&Drop</title><style>body{font:16px Arial;background:#f3f5f8;color:#17202a;margin:0}main{max-width:650px;margin:4vh auto;background:#fff;padding:28px;border-radius:12px}input,select,button{width:100%;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #cbd5e1}button{background:#0f766e;color:#fff;border:0;font-weight:700}.note{background:#ecfdf5;padding:14px;border-radius:8px}.message{padding:12px;border-radius:8px;background:#fff7ed}a{color:#0f766e}@media(max-width:700px){main{margin:0;border-radius:0;padding:22px}}</style></head><body><main><a href="./index.html">← Shop&Drop</a><h1>Sell something — FREE</h1><div class=note>No company or website required. List for free. Shop&Drop receives 10% of the product selling price only when your item sells.</div><p>Sign in or register as a customer first, then apply as a seller. Seller details are kept private from public product listings.</p><form id=form><label>Seller type</label><select id=type><option value=individual>Private individual</option><option value=home_business>Home business / maker</option><option value=second_hand>Second-hand seller</option><option value=business>Business / company</option></select><label>Seller / business name</label><input id=store required minlength=2 placeholder="Your name or business name"><label>Country code</label><input id=country required maxlength=2 placeholder="e.g. ZA, IQ, GB"><label>Cellphone</label><input id=phone required inputmode=tel placeholder="Cellphone number"><label>WhatsApp (optional)</label><input id=whatsapp inputmode=tel placeholder="WhatsApp number"><button>Submit seller application</button></form><p id=message class=message hidden></p></main><script src="./common.js"></script><script>form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;if(country.value.trim().length!==2){ShopDrop.msg(message,'Please enter a two-letter country code, for example ZA.','error');return}if(ShopDrop.isStatic){ShopDrop.msg(message,'Preview mode: the form layout is working. Seller applications require the Shop&Drop backend and will not be submitted from GitHub Pages.');return}try{await ShopDrop.api('/api/sellers/apply',{method:'POST',body:JSON.stringify({sellerType:type.value,storeName:store.value.trim(),countryCode:country.value.trim().toUpperCase(),phone:phone.value.trim(),whatsapp:whatsapp.value.trim()})});ShopDrop.msg(message,'Application received. Your seller details will remain private on public product listings.')}catch(e){ShopDrop.msg(message,e.message,'error')}};</script></body></html>
