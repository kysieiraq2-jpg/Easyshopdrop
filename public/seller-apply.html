<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a seller | Easy Shop & Drop SA</title><style>body{font:16px Arial;background:#f2f5f8;color:#17202a;margin:0}main{max-width:580px;margin:8vh auto;background:white;padding:30px;border-radius:12px}input,button{font:inherit;padding:12px;border-radius:7px}input{width:95%;border:1px solid #ccc}button{background:#0f766e;color:white;border:0;margin-top:12px;cursor:pointer}</style><main><a href="/">← Marketplace</a><h1>Sell on Easy Shop & Drop SA</h1><p>Sign in as a customer first. Apply to open a store; your application requires administrator approval.</p><form id="form"><label for="store">Your store name</label><p><input id="store" required minlength="3" maxlength="100" placeholder="Business or store name"></p><button>Submit application</button></form><p id="message" role="status"></p><a href="/seller.html">Seller Centre</a></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/sellers/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({storeName:document.getElementById('store').value})});const d=await r.json();document.getElementById('message').textContent=r.ok?'Application received. Status: pending approval.':(d.error||'Unable to apply');};</script></html>
