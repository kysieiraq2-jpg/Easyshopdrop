<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account | Shop&Drop</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f5f8;color:#17202a}header{background:#101827;color:white;padding:18px}header a{color:white;margin-right:20px}main{max-width:980px;margin:25px auto;padding:0 16px}.panel{background:white;padding:22px;border-radius:12px;margin:15px 0}button,input,select{padding:10px;margin:5px;border-radius:6px;border:1px solid #cbd5e1}button{cursor:pointer;background:#0f766e;color:white}.muted{color:#64748b}.item{border-bottom:1px solid #eee;padding:12px 0}a{color:#0f766e}</style></head><body><header><a href="./index.html">Shop&Drop</a><a href="./checkout.html">Checkout</a><a href="./account.html">My Account</a></header><main><h1>My account</h1><section class="panel" id="who">Loading…</section><section class="panel"><h2>My orders</h2><div id="orders"></div></section></main><script src="./common.js"></script><script>const {api,esc,money}=ShopDrop;async function load(){if(ShopDrop.isStatic){who.innerHTML='<b>Preview mode</b><p>Live account details require the Shop&Drop backend.</p>';orders.textContent='Order history will appear here after the backend is connected and you sign in.';return}try{const m=await api('/api/me');if(!m.user)throw Error('Sign in on the home page first');who.textContent=m.user.full_name+' ('+m.user.email+')';const d=await api('/api/orders');orders.innerHTML=d.orders.map(o=>`<div class="item"><a href="./order.html?id=${o.id}">Order ${esc(o.id)}</a> — ${money(o.total_cents)} — ${esc(o.status)}</div>`).join('')||'No orders yet.'}catch(e){who.textContent=e.message}}load();</script></body></html>
