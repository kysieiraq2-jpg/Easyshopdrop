<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop&Drop R4 Cancellations Test v2</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.5}
button{display:block;margin:16px 0;padding:14px 18px;font:inherit}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:16px}
.note{background:#f7f2e9;padding:14px}
</style></head><body>
<h1>Shop&amp;Drop R4 Cancellations Browser Test v2</h1>
<p class="note"><b>Non-destructive diagnostic.</b> This test sends no valid cancellation payload and does not modify V26.24.</p>
<button id="test">Run Browser CORS + Auth Protection Test</button>
<pre id="out">READY.</pre>
<script>
const endpoint='https://dtkdvvxpwonywtsgqmdx.supabase.co/functions/v1/cancellations', apikey='sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q', out=document.getElementById("out");
document.getElementById("test").onclick=async()=>{
  out.textContent="TESTING...";
  try {
    /* A cross-origin POST with application/json triggers the browser's real
       CORS preflight automatically. No Authorization header is supplied,
       so if preflight succeeds the function itself must return 401. */
    const r=await fetch(endpoint,{
      method:"POST",
      mode:"cors",
      headers:{
        "apikey":apikey,
        "content-type":"application/json",
        "x-client-info":"shopdrop-r4-browser-test-v2"
      },
      body:JSON.stringify({diagnostic_only:true}),
      cache:"no-store"
    });
    const text=await r.text();
    const allowOrigin=r.headers.get("access-control-allow-origin");
    if(r.status===401) {
      out.textContent="R4 CANCELLATIONS PASS\nBrowser cross-origin request completed.\nUnauthenticated request blocked.\nHTTP status: 401\nAllow-Origin: "+(allowOrigin||"(not exposed/readable)")+"\nResponse: "+text;
    } else {
      out.textContent="R4 CANCELLATIONS REVIEW REQUIRED\nHTTP status: "+r.status+"\nAllow-Origin: "+allowOrigin+"\nResponse: "+text;
    }
  } catch(e) {
    out.textContent="R4 CANCELLATIONS REVIEW REQUIRED\nBrowser blocked the cross-origin request.\nError: "+String(e);
  }
};
</script></body></html>
