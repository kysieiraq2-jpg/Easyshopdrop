<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop&Drop R5 Admin 403 Test</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.5}
input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0 14px;font:inherit}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:16px}
.note{background:#f7f2e9;padding:14px}
</style></head><body>
<h1>Shop&amp;Drop R5 Admin Authorization Test</h1>
<p class="note"><b>Controlled diagnostic.</b> Sign-in is real, but the test payload cannot be inserted while Admin authority is inactive. This page does not modify V26.24.</p>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label>Shop&amp;Drop password</label><input id="password" type="password" autocomplete="current-password">
<button id="run">Sign In + Test Admin Barrier</button>
<pre id="out">READY.</pre>
<script>
const U='https://dtkdvvxpwonywtsgqmdx.supabase.co', E='https://dtkdvvxpwonywtsgqmdx.supabase.co/functions/v1/change-requests', K='sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q';
const out=document.getElementById("out");
document.getElementById("run").onclick=async()=>{
 out.textContent="SIGNING IN...";
 try {
   const auth=await fetch(U+"/auth/v1/token?grant_type=password",{
     method:"POST",
     headers:{"apikey":K,"content-type":"application/json"},
     body:JSON.stringify({
       email:document.getElementById("email").value.trim(),
       password:document.getElementById("password").value
     }),
     cache:"no-store"
   });
   const a=await auth.json();
   if(!auth.ok || !a.access_token){
     out.textContent="SIGN IN REVIEW REQUIRED\nHTTP status: "+auth.status;
     return;
   }
   out.textContent="SIGNED IN. TESTING ADMIN BARRIER...";
   const r=await fetch(E,{
     method:"POST",
     mode:"cors",
     headers:{
       "apikey":K,
       "Authorization":"Bearer "+a.access_token,
       "content-type":"application/json",
       "x-client-info":"shopdrop-r5-admin-403-test"
     },
     body:JSON.stringify({diagnostic_only:true}),
     cache:"no-store"
   });
   const text=await r.text();
   out.textContent=(r.status===403)
     ? "R5 ADMIN BARRIER PASS\nAuthenticated user was blocked while Admin authority is inactive.\nHTTP status: 403\nResponse: "+text
     : "R5 ADMIN BARRIER REVIEW REQUIRED\nHTTP status: "+r.status+"\nResponse: "+text;
 } catch(e) {
   out.textContent="R5 ADMIN BARRIER REVIEW REQUIRED\nError: "+String(e);
 }
};
</script></body></html>
