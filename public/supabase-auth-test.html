<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop&Drop R2-A Auth Test</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.5}button{font:inherit;padding:12px 16px}pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:16px}.note{padding:14px;background:#f7f2e9}</style></head>
<body><h1>Shop&amp;Drop R2-A Authentication Connection Test</h1>
<p class="note"><b>Non-destructive diagnostic.</b> No user is registered or signed in, and no Shop&amp;Drop data is changed.</p>
<button id="run">Run R2-A Test</button><pre id="result">READY — no test has run.</pre>
<script src="./common.js"></script><script src="./supabase-auth-session.js"></script>
<script>
const out=document.getElementById("result");
document.getElementById("run").onclick=async()=>{
 out.textContent="TESTING...";
 const r=await window.ShopDropAuthSessionR2A.authHealth();
 out.textContent=r.ok
 ? `PASS

GitHub Pages reached Supabase Authentication.
The configured publishable key was accepted.
No user was created and no Shop&Drop data was changed.

HTTP status: ${r.status}
Response: ${r.body}`
 : `REVIEW REQUIRED

Stage: ${r.stage||"unknown"}
HTTP status: ${r.status??"n/a"}
Message: ${r.message||r.body||"No response body"}`;
};
</script></body></html>
