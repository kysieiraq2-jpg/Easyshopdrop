<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator Sign In | Shop&Drop</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#f4f6f8;color:#17202a}.wrap{max-width:650px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:14px;margin:18px 0}.notice{background:#eef2ff;padding:15px;border-radius:10px}input,button{width:100%;padding:12px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px}button{background:#0f766e;color:#fff;border:0}.message{padding:12px;background:#fff7ed;border-radius:8px}.muted{color:#64748b}</style></head><body><main class=wrap><a href="./index.html">← Shop&Drop</a><h1>Administrator Sign In</h1><div class=notice><b>Restricted access.</b> Only pre-authorised Shop&Drop administrators can enter the Admin Control Centre. Administrator privileges cannot be created from this public page.</div><section class=card><form id=form><label>Administrator email</label><input id=email type=email required autocomplete=username><label>Password</label><input id=password type=password required autocomplete=current-password><button>Secure administrator sign in</button></form><p id=message class=message hidden></p><p class=muted>Live access is verified by the backend before any administration page or data is opened.</p></section></main><script src="./common.js"></script><script>form.onsubmit=async e=>{e.preventDefault();if(ShopDrop.isStatic){ShopDrop.msg(message,'Preview mode: administrator authentication is intentionally disabled on GitHub Pages. The live backend will verify approved administrator credentials and role before access.');return}try{const d=await ShopDrop.api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});if(d.user?.role!=='admin'){await ShopDrop.api('/api/logout',{method:'POST'});throw Error('This account is not authorised for administrator access.')}location.href='./admin.html'}catch(x){ShopDrop.msg(message,x.message,'error')}}</script><script src="v26-bridge.js"></script></body></html>
