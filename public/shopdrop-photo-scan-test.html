<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">

  <title>
    Shop&Drop Photograph Screening Test
  </title>

  <style>
    body {
      font: 16px system-ui, sans-serif;
      max-width: 680px;
      margin: 24px auto;
      padding: 16px;
      line-height: 1.5;
    }

    button, input {
      font: inherit;
      margin: 12px 0;
    }

    button {
      padding: 12px 20px;
    }

    li {
      margin: 12px 0;
    }
  </style>
</head>

<body>
  <h1>
    Shop&Drop Photograph Screening Test
  </h1>

  <p>
    Select up to six photographs from your
    phone, tablet, laptop or computer.
  </p>

  <p>
    Photographs are checked locally in
    your browser. They are not uploaded
    or published by this test.
  </p>

  <input
    id="photos"
    type="file"
    accept="image/*"
    multiple
  >

  <div>
    <button id="start" type="button">
      Scan photographs
    </button>
  </div>

  <p
    id="status"
    role="status"
    aria-live="polite"
  >
    Ready to test.
  </p>

  <ol id="results"></ol>

  <script type="module">
    import {scanPhotos} from
      './shopdrop-free-photo-screen.mjs';

    const input =
      document.getElementById('photos');

    const button =
      document.getElementById('start');

    const status =
      document.getElementById('status');

    const list =
      document.getElementById('results');

    button.addEventListener(
      'click',
      async () => {
        button.disabled = true;
        list.replaceChildren();

        const started = performance.now();

        try {
          const results =
            await scanPhotos(
              input.files,
              progress => {
                status.textContent =
                  progress.state === 'scanning'
                    ? 'Scanning photograph ' +
                      progress.current +
                      ' of ' +
                      progress.total + '...'
                    : 'Scanning completed.';
              }
            );

          for (const result of results) {
            const item =
              document.createElement('li');

            item.textContent =
              result.name + ' — ' +
              result.status + ' — ' +
              result.reason + ' — ' +
              result.seconds + ' seconds';

            list.append(item);
          }

          const seconds = (
            (performance.now() - started) /
            1000
          ).toFixed(1);

          status.textContent =
            'Finished ' +
            results.length +
            ' photographs in ' +
            seconds +
            ' seconds.';

        } catch (error) {
          status.textContent =
            error.message ||
            'Scanning failed.';
        } finally {
          button.disabled = false;
        }
      }
    );
  </script>
</body>
</html>
