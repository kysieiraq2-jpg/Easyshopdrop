<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order details | Shop&Drop</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f5f8;color:#17202a}header{background:#101827;color:white;padding:18px}header a{color:white;margin-right:20px}main{max-width:980px;margin:25px auto;padding:0 16px}.panel{background:white;padding:22px;border-radius:12px;margin:15px 0}button,input,select{padding:10px;margin:5px;border-radius:6px;border:1px solid #cbd5e1}button{cursor:pointer;background:#0f766e;color:white}.muted{color:#64748b}.item{border-bottom:1px solid #eee;padding:12px 0}a{color:#0f766e}</style></head><body><header><a href="/">Shop&Drop</a><a href="/checkout.html">Checkout</a><a href="/account.html">My Account</a></header><main><h1>Order details</h1><section class="panel" id="summary">Loading…</section><section class="panel"><h2>Items</h2><div id="items"></div></section></main><script>const money=c=>(c/100).toLocaleString('en-ZA',{style:'currency',currency:'ZAR'});const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}</script><script>const id=new URLSearchParams(location.search).get('id');async function load(){try{const d=await api('/api/orders/'+encodeURIComponent(id));const o=d.order;summary.innerHTML=`<p>Order: ${esc(o.id)}</p><p>Status: ${esc(o.status)}</p><p>Payment: ${esc(o.payment_status||'unpaid')}</p><p>Shipment: ${esc(o.shipment_status||'not created')}</p><p>Tracking: ${esc(o.tracking_number||'Not available')}</p><h3>Total: ${money(o.total_cents)}</h3>`;items.innerHTML=d.items.map(x=>`<div class="item">${esc(x.name)} × ${x.quantity} — ${money(x.unit_price_cents*x.quantity)}</div>`).join('')}catch(e){summary.textContent=e.message}}load();</script></body></html>
