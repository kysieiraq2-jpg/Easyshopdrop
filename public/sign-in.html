<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | Shop&Drop</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#f4f6f8;color:#17202a}.wrap{max-width:650px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:14px;margin:18px 0}input,button{width:100%;padding:12px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px}button{background:#0f766e;color:#fff;border:0}.note{background:#eef2ff;padding:14px;border-radius:10px}.message{padding:12px;background:#fff7ed;border-radius:8px}</style></head><body><main class=wrap><a href="./index.html">← Shop&Drop</a><h1>Sign in to Shop&Drop</h1><div class=note>Browse Shop&Drop without signing in. Sign in when you want to buy, sell, list a service, request transport, track your transactions or manage your account.</div><section class=card><form id=form><label>Email</label><input id=email type=email required autocomplete=email><label>Password</label><input id=password type=password required autocomplete=current-password><button>Sign in</button></form><p id=message class=message hidden></p><p>New to Shop&Drop? <a href="./register.html">Create your free account</a>.</p></section></main><script src="./common.js"></script><script>form.onsubmit=async e=>{e.preventDefault();if(ShopDrop.isStatic){ShopDrop.msg(message,'Preview mode: the sign-in page is ready. Secure account authentication activates with the Shop&Drop backend.');return}try{const d=await ShopDrop.api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});location.href=d.user?.role==='admin'?'./admin.html':'./account.html'}catch(x){ShopDrop.msg(message,x.message,'error')}}</script><script src="v26-bridge.js"></script></body></html>
