
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Complaints & Suggestions | Shop&Drop</title>

<link rel="stylesheet" href="./v26-professional.css">

<style>
/*
 SHOPDROP_FEEDBACK_PROFESSIONAL_V1
 Cosmetic improvements only.
 Original feedback form and integrations preserved.
*/

.shopdrop-feedback-page{
  max-width:760px;
  margin:0 auto;
  padding:24px 16px 48px;
}

.shopdrop-feedback-back{
  display:inline-block;
  margin-bottom:20px;
  color:#0f766e;
  text-decoration:none;
  font-weight:600;
}

.shopdrop-feedback-back:hover{
  text-decoration:underline;
}

.shopdrop-feedback-heading{
  margin:0 0 10px;
  font-size:clamp(28px,5vw,38px);
  line-height:1.2;
  color:#17202a;
}

.shopdrop-feedback-description{
  color:#64748b;
  margin:0 0 24px;
  line-height:1.6;
}

.shopdrop-feedback-card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:clamp(20px,4vw,32px);
  box-shadow:0 8px 24px rgba(20,31,44,.06);
}

.shopdrop-feedback-form{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.shopdrop-feedback-field{
  display:flex;
  flex-direction:column;
  gap:7px;
  min-width:0;
}

.shopdrop-feedback-field label{
  font-size:15px;
  font-weight:600;
  color:#334155;
}

.shopdrop-feedback-field input,
.shopdrop-feedback-field select,
.shopdrop-feedback-field textarea{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  min-height:50px;
  margin:0;
  padding:12px 14px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:#fff;
  color:#17202a;
  font:inherit;
  font-size:16px;
  line-height:1.4;
  box-sizing:border-box;
}

.shopdrop-feedback-field textarea{
  min-height:130px;
  resize:vertical;
}

.shopdrop-feedback-field input:focus,
.shopdrop-feedback-field select:focus,
.shopdrop-feedback-field textarea:focus{
  outline:2px solid #0f766e;
  outline-offset:1px;
  border-color:#0f766e;
}

.shopdrop-feedback-field input::placeholder,
.shopdrop-feedback-field textarea::placeholder{
  color:#64748b;
}

.shopdrop-feedback-submit{
  display:block;
  width:100%;
  min-height:52px;
  margin-top:8px;
  padding:13px 20px;
  border:0;
  border-radius:10px;
  background:#0f766e;
  color:#fff;
  font:inherit;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.shopdrop-feedback-submit:hover{
  background:#115e59;
}

.shopdrop-feedback-submit:focus-visible{
  outline:3px solid #0f766e;
  outline-offset:3px;
}

@media(max-width:600px){
  .shopdrop-feedback-page{
    padding:20px 14px 36px;
  }

  .shopdrop-feedback-card{
    padding:20px 16px;
  }

  .shopdrop-feedback-form{
    gap:16px;
  }
}
</style>
</head>

<body>

<main class="shopdrop-feedback-page">

<a class="shopdrop-feedback-back" href="./index.html">
  ← Shop&Drop Homepage
</a>

<h1 class="shopdrop-feedback-heading">
  Complaints &amp; Suggestions
</h1>

<p class="shopdrop-feedback-description">
  Send your complaint or suggestion to Shop&amp;Drop.
  Please provide enough information for us to understand your enquiry.
</p>

<section class="shopdrop-feedback-card">

<form
  class="shopdrop-feedback-form"
  data-shopdrop-form="feedback"
>

<div class="shopdrop-feedback-field">
  <label for="feedbackType">Enquiry type</label>
  <select id="feedbackType" required>
    <option value="">Complaint or Suggestion</option>
    <option>Complaint</option>
    <option>Suggestion</option>
  </select>
</div>

<div class="shopdrop-feedback-field">
  <label for="feedbackCategory">Category</label>
  <select id="feedbackCategory" required>
    <option>Buyer</option>
    <option>Seller</option>
    <option>Product / Listing</option>
    <option>Other Services</option>
    <option>Dispatching &amp; Transport</option>
    <option>Payment / Payout</option>
    <option>Courier / Delivery</option>
    <option>Website / Technical</option>
    <option>Other</option>
  </select>
</div>

<div class="shopdrop-feedback-field">
  <label for="feedbackSubject">Subject</label>
  <input
    id="feedbackSubject"
    required
    placeholder="Enter the subject"
  >
</div>

<div class="shopdrop-feedback-field">
  <label for="feedbackDetails">Details</label>
  <textarea
    id="feedbackDetails"
    required
    placeholder="Describe your complaint or suggestion"
  ></textarea>
</div>

<div class="shopdrop-feedback-field">
  <label for="feedbackEmail">Email for reply (optional)</label>
  <input
    id="feedbackEmail"
    type="email"
    placeholder="Your email address"
  >
</div>

<div class="shopdrop-feedback-field">
  <label for="feedbackWhatsApp">WhatsApp for reply (optional)</label>
  <input
    id="feedbackWhatsApp"
    inputmode="tel"
    placeholder="Your WhatsApp number"
  >
</div>

<button
  class="shopdrop-feedback-submit"
  type="submit"
>
  Submit Complaint / Suggestion
</button>

</form>

</section>

</main>

<script src="common.js"></script>
<script src="v26-consolidated.js"></script>
<script src="v26-bridge.js"></script>
<script defer src="shopdrop-info-language.js"></script>

</body>
</html>
