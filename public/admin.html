<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Control Centre</title><style>body{font-family:Arial;background:#f3f5f8;margin:0}.wrap{max-width:1100px;margin:auto;padding:25px}.box{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#eef2ff;border-radius:9px}.btn{padding:8px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;cursor:pointer}</style></head><body><div class=wrap><a href="/">← Marketplace</a><h1>Admin Control Centre</h1><div id=stats class=grid></div><div class=box><h2>Seller applications</h2><div id=sellers></div></div></div><script>async function api(p,o={}){let r=await fetch(p,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});let d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){try{let a=await api('/api/admin/summary');stats.innerHTML='<div class=stat>Users<br><b>'+a.users+'</b></div><div class=stat>Approved sellers<br><b>'+a.sellers+'</b></div><div class=stat>Products<br><b>'+a.products+'</b></div><div class=stat>Orders<br><b>'+a.orders+'</b></div>;let s=await api('/api/admin/sellers');sellers.innerHTML=s.sellers.map(x=>`<p><b>${x.store_name}</b> — ${x.email} — ${x.status} <button class=btn onclick="setS('${x.id}','approved')">Approve</button><button class=btn onclick="setS('${x.id}','suspended')">Suspend</button></p>`).join('')}catch(e){alert(e.message)}}async function setS(id,status){await api('/api/admin/sellers/'+id,{method:'POST',body:JSON.stringify({status})});load()}load()</script></body></html>
