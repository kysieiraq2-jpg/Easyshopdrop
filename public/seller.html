<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Centre</title><style>body{font-family:Arial;background:#f3f5f8;margin:0;color:#17202a}.wrap{max-width:1050px;margin:auto;padding:25px}.box{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#eef6f5;border-radius:9px}.form input{padding:10px;margin:4px}.btn{padding:9px 13px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;cursor:pointer}.primary{background:#0f766e;color:#fff}</style></head><body><div class=wrap><a href="/">← Marketplace</a><h1>Seller Centre</h1><p><a href="/seller-apply.html">Apply to become a seller</a></p><div class=grid id=stats></div><div class=box><h2>Store profile</h2><div id=profile></div><input id=store placeholder="Store name"><input id=slug placeholder="Store slug"><input id=desc placeholder="Description"><button class="btn primary" onclick=save()>Save</button></div><div class=box><h2>Add product</h2><input id=n placeholder=Name><input id=c placeholder=Category><input id=p type=number placeholder="Price in cents"><input id=s type=number placeholder=Stock><input id=i placeholder="Image URL (optional)"><input id=photo type=file accept="image/jpeg,image/png,image/webp"><button class=btn onclick="uploadPhoto()">Upload product photo</button><span id=uploadStatus></span><button class="btn primary" onclick=add()>Submit for approval</button></div><div class=box><h2>Products</h2><p>Select a product to edit its name, category, price, stock and image URL. Edits require fresh admin approval.</p><div id=products></div></div></div><script>async function api(p,o={}){let r=await fetch(p,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});let d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){try{let m=await api('/api/me');if(!m.user||m.user.role!=='seller')throw Error('Seller login required on the main site.');let d=await api('/api/seller/profile');profile.innerHTML=`Status: <b>${d.profile.status}</b> · Commission: ${d.profile.commission_rate}%`;store.value=d.profile.store_name||'';slug.value=d.profile.slug||'';desc.value=d.profile.description||'';let p=await api('/api/seller/products');products.replaceChildren();p.products.forEach(x=>{const row=document.createElement('p');row.textContent=`${x.name} — R${(x.price_cents/100).toFixed(2)} — ${x.stock} stock — ${x.status} `;const btn=document.createElement('button');btn.textContent='Edit';btn.onclick=async()=>{const name=prompt('Product name',x.name);if(name===null)return;const category=prompt('Category',x.category);if(category===null)return;const price=prompt('Price in cents',x.price_cents);if(price===null)return;const stock=prompt('Stock',x.stock);if(stock===null)return;const imageUrl=prompt('HTTPS image URL',x.image_url||'');if(imageUrl===null)return;try{await api('/api/seller/products/'+x.id,{method:'PATCH',body:JSON.stringify({name,category,priceCents:Number(price),stock:Number(stock),imageUrl,description:x.description})});load()}catch(e){alert(e.message)}};row.append(btn);products.append(row)});let summary=await api('/api/seller/summary');stats.innerHTML='<div class=stat>Products<br><b>'+summary.total+'</b></div><div class=stat>Approved<br><b>'+summary.approved+'</b></div><div class=stat>Pending<br><b>'+summary.pending+'</b></div><div class=stat>Orders<br><b>'+summary.orders+'</b></div><div class=stat>Units in stock<br><b>'+summary.units+'</b></div><div class=stat>Order gross<br><b>R'+(Number(summary.gross_cents)/100).toFixed(2)+'</b></div>'}catch(e){alert(e.message)}}async function save(){await api('/api/seller/profile',{method:'POST',body:JSON.stringify({storeName:store.value,slug:slug.value,description:desc.value})});load()}async function uploadPhoto(){try{let file=photo.files[0];if(!file)throw Error('Choose a photo first');if(file.size>2000000)throw Error('Photo must be under 2 MB');let base64=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});let result=await api('/api/seller/images',{method:'POST',body:JSON.stringify({base64})});i.value=result.imageUrl;uploadStatus.textContent='Photo uploaded for this product'}catch(e){uploadStatus.textContent=e.message}}async function add(){try{await api('/api/seller/products',{method:'POST',body:JSON.stringify({name:n.value,category:c.value,priceCents:Number(p.value),stock:Number(s.value),imageUrl:i.value})});load()}catch(e){alert(e.message)}}load()</script></body></html>
