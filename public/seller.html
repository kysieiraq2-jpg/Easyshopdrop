<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Centre</title><style>body{font-family:Arial;background:#f3f5f8;margin:0;color:#17202a}.wrap{max-width:1050px;margin:auto;padding:25px}.box{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#eef6f5;border-radius:9px}.form input{padding:10px;margin:4px}.btn{padding:9px 13px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;cursor:pointer}.primary{background:#0f766e;color:#fff}.message{padding:10px;margin-top:10px;background:#eef2ff;border-radius:7px}@media(max-width:650px){.wrap{padding:14px}.box input{display:block;width:100%;margin:8px 0}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class=wrap><a href="./index.html">← Marketplace</a><h1>Seller Centre</h1><p><a href="./seller-apply.html">Apply to become a seller</a></p><div id=pageStatus class=message hidden></div><div class=grid id=stats></div><div class=box><h2>Store profile</h2><div id=profile></div><input id=store placeholder="Store name"><input id=slug placeholder="Store web address — created automatically" readonly><input id=desc placeholder="Description"><button class="btn primary" onclick=save()>Save store profile</button><div id=profileStatus class=message hidden></div></div><div class=box><h2>Add product</h2><input id=n placeholder=Name><input id=c placeholder=Category><input id=p type=number placeholder="Selling price (e.g. 199.99)"><input id=s type=number placeholder=Stock><input id=i placeholder="Image URL (optional)"><input id=photo type=file accept="image/jpeg,image/png,image/webp"><button class=btn onclick="uploadPhoto()">Upload product photo</button><span id=uploadStatus></span><button class="btn primary" onclick=add()>Submit for approval</button><div id=productStatus class=message hidden></div></div><div class=box><h2>Products</h2><p>Select a product to edit its name, category, price, stock and image URL. Edits require fresh admin approval.</p><div id=products></div></div></div><script src="./common.js"></script><script>const {api}=ShopDrop;async function load(){if(ShopDrop.isStatic){pageStatus.hidden=false;pageStatus.textContent='Preview mode: Seller Centre layout can be tested here. Live seller profiles, products and uploads require the Shop&Drop backend.';return}try{let m=await api('/api/me');if(!m.user||m.user.role!=='seller')throw Error('Seller login required on the main site.');let d=await api('/api/seller/profile');profile.innerHTML=`Status: <b>${d.profile.status}</b> · Commission: ${d.profile.commission_rate}%`;store.value=d.profile.store_name||'';slug.value=d.profile.slug||'';desc.value=d.profile.description||'';let p=await api('/api/seller/products');products.replaceChildren();p.products.forEach(x=>{const row=document.createElement('p');row.textContent=`${x.name} — R${(x.price_cents/100).toFixed(2)} — ${x.stock} stock — ${x.status} `;const btn=document.createElement('button');btn.textContent='Edit';btn.onclick=async()=>{const name=prompt('Product name',x.name);if(name===null)return;const category=prompt('Category',x.category);if(category===null)return;const price=prompt('Selling price', (x.price_cents/100).toFixed(2));if(price===null)return;const stock=prompt('Stock',x.stock);if(stock===null)return;const imageUrl=prompt('HTTPS image URL',x.image_url||'');if(imageUrl===null)return;try{await api('/api/seller/products/'+x.id,{method:'PATCH',body:JSON.stringify({name,category,priceCents:Math.round(Number(price)*100),stock:Number(stock),imageUrl,description:x.description})});load()}catch(e){alert(e.message)}};row.append(btn);products.append(row)});let summary=await api('/api/seller/summary');stats.innerHTML='<div class=stat>Products<br><b>'+summary.total+'</b></div><div class=stat>Approved<br><b>'+summary.approved+'</b></div><div class=stat>Pending<br><b>'+summary.pending+'</b></div><div class=stat>Orders<br><b>'+summary.orders+'</b></div><div class=stat>Units in stock<br><b>'+summary.units+'</b></div><div class=stat>Order gross<br><b>R'+(Number(summary.gross_cents)/100).toFixed(2)+'</b></div>'}catch(e){pageStatus.hidden=false;pageStatus.textContent=e.message}}async function save(){profileStatus.hidden=false;if(!store.value.trim()){profileStatus.textContent='Enter your store name first.';store.focus();return}if(ShopDrop.isStatic){profileStatus.textContent='Preview mode: your store profile will be saved after the backend is connected.';return}await api('/api/seller/profile',{method:'POST',body:JSON.stringify({storeName:store.value,slug:slug.value,description:desc.value})});load()}async function uploadPhoto(){try{let file=photo.files[0];if(!file)throw Error('Choose a photo first');if(file.size>2000000)throw Error('Photo must be under 2 MB');let base64=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});let result=await api('/api/seller/images',{method:'POST',body:JSON.stringify({base64})});i.value=result.imageUrl;uploadStatus.textContent='Photo uploaded for this product'}catch(e){uploadStatus.textContent=e.message}}async function add(){productStatus.hidden=false;if(!n.value.trim()){productStatus.textContent='Enter a product name.';n.focus();return}if(!c.value.trim()){productStatus.textContent='Enter or choose a category.';c.focus();return}if(!(Number(p.value)>0)){productStatus.textContent='Enter a valid selling price.';p.focus();return}if(!(Number(s.value)>=0)){productStatus.textContent='Enter the stock quantity.';s.focus();return}if(ShopDrop.isStatic){productStatus.textContent='Product details look ready. Live submission for approval requires the Shop&Drop backend.';return}try{await api('/api/seller/products',{method:'POST',body:JSON.stringify({name:n.value,category:c.value,priceCents:Math.round(Number(p.value)*100),stock:Number(s.value),imageUrl:i.value})});load()}catch(e){productStatus.textContent=e.message}}load()</script></body></html>
