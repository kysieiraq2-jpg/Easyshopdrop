<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product details | Easy Shop & Drop SA</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f5f8;color:#17202a}header{background:#101827;color:white;padding:18px}header a{color:white;margin-right:20px}main{max-width:980px;margin:25px auto;padding:0 16px}.panel{background:white;padding:22px;border-radius:12px;margin:15px 0}button,input,select{padding:10px;margin:5px;border-radius:6px;border:1px solid #cbd5e1}button{cursor:pointer;background:#0f766e;color:white}.muted{color:#64748b}.item{border-bottom:1px solid #eee;padding:12px 0}a{color:#0f766e}</style></head><body><header><a href="/">Easy Shop & Drop SA</a><a href="/checkout.html">Checkout</a><a href="/account.html">My Account</a></header><main><section class="panel" id="detail">Loading product…</section><section class="panel"><h2>Customer reviews</h2><div id="reviews"></div></section></main><script>const money=c=>(c/100).toLocaleString('en-ZA',{style:'currency',currency:'ZAR'});const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}</script><script>const id=new URLSearchParams(location.search).get('id');async function load(){try{const d=await api('/api/products/'+encodeURIComponent(id)),p=d.product;document.getElementById('detail').innerHTML=`<h1>${esc(p.name)}</h1><p>${esc(p.description)}</p><p>${esc(p.category)} · ${esc(p.store_name)}</p><h2>${money(p.price_cents)}</h2><p>Stock: ${p.stock}</p><label>Quantity <input id="qty" type="number" min="1" max="${p.stock}" value="1"></label><button onclick="add()">Add to cart</button>`;document.getElementById('reviews').innerHTML=d.reviews.map(r=>`<div class="item">${'★'.repeat(r.rating)} — ${esc(r.full_name)}<p>${esc(r.review_text)}</p></div>`).join('')||'No reviews yet.'}catch(e){detail.textContent=e.message}}async function add(){try{const q=Number(qty.value);if(!Number.isInteger(q)||q<1)throw Error('Invalid quantity');const c=await api('/api/cart');const old=c.items.find(x=>x.product_id===id);await api('/api/cart',{method:'POST',body:JSON.stringify({productId:id,quantity:(old?.quantity||0)+q})});alert('Added to cart')}catch(e){alert(e.message)}}load();</script></body></html>
