<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Shop&Drop</title><style>body{font:16px Arial;margin:0;background:#f3f5f8;color:#17202a}header{background:#101827;padding:18px}header a{color:white;margin-right:18px}main{max-width:900px;margin:25px auto;padding:0 16px}.panel{background:#fff;padding:22px;border-radius:12px;margin:15px 0}button,input{padding:10px;border-radius:7px;border:1px solid #cbd5e1}button{background:#0f766e;color:#fff}.muted{color:#64748b}</style></head><body><header><a href="./index.html">Shop&Drop</a><a href="./checkout.html">Shopping Bag</a><a href="./account.html">Account</a></header><main><section class=panel id=detail>Loading…</section><section class=panel><h2>Customer reviews</h2><div id=reviews></div></section></main><script>const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');const money=(c,cur='ZAR')=>(c/100).toLocaleString(undefined,{style:'currency',currency:cur});async function api(p,o={}){let r=await fetch(p,{headers:{'Content-Type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}const id=new URLSearchParams(location.search).get('id');async function load(){try{let d=await api('/api/products/'+encodeURIComponent(id)),p=d.product,sale=p.is_special&&p.special_price_cents!=null;detail.innerHTML=`${p.image_url?`<img src="${esc(p.image_url)}" style="max-width:100%;max-height:380px">`:''}<h1>${esc(p.name)}</h1><p class=muted>${esc(p.brand||'')} · ${esc(p.condition||'')}</p><p>${esc(p.description)}</p><h2>${money(sale?p.special_price_cents:p.price_cents,p.currency_code||'ZAR')}</h2><p>Stock: ${p.stock} · Delivery scope: ${esc(p.delivery_scope||'national')}</p><label>Quantity <input id=qty type=number min=1 max=${p.stock} value=1></label> <button onclick=add()>Add to bag</button><p class=muted>Seller identity and direct contact details are kept private. Purchase and payment remain within Shop&Drop.</p>`;reviews.innerHTML=d.reviews.map(r=>`<p>${'★'.repeat(r.rating)} — Verified buyer<br>${esc(r.review_text)}</p>`).join('')||'No reviews yet.'}catch(e){detail.textContent=e.message}}async function add(){try{let q=Number(qty.value),c=await api('/api/cart'),old=c.items.find(x=>x.product_id===id);await api('/api/cart',{method:'POST',body:JSON.stringify({productId:id,quantity:(old?.quantity||0)+q})});alert('Added to shopping bag')}catch(e){alert(e.message)}}load()</script></body></html>
