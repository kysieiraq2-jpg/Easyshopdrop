<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop&Drop</title>
<style>
:root{--ink:#17202a;--muted:#64748b;--bg:#f3f5f8;--card:#fff;--accent:#0f766e;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.top{background:#101827;color:#fff}.wrap{max-width:1200px;margin:auto;padding:0 22px}.topbar{height:42px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#cbd5e1}.brandrow{display:flex;align-items:center;gap:20px;padding:18px 0}.brand{font-size:26px;font-weight:800;white-space:nowrap}.brand b{color:#34d399}.search{flex:1;display:flex;background:#fff;border-radius:8px;overflow:hidden}.search input{flex:1;border:0;padding:13px 15px;font-size:15px;outline:0}.search button{border:0;background:#f59e0b;padding:0 20px;font-weight:700}.links{display:flex;gap:15px;align-items:center;font-size:14px}.links a{color:#fff;text-decoration:none}.hero{background:#fff;border-bottom:1px solid var(--line)}.cats{display:flex;gap:22px;overflow:auto;padding:14px 0;font-size:14px;white-space:nowrap}.cats a{color:#334155;text-decoration:none;cursor:pointer}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;padding-top:24px}.side,.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}.side{padding:18px;height:max-content}.side h3{margin-top:0}.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 0;cursor:pointer;color:#334155}.content h1{margin:0}.meta{color:var(--muted);font-size:14px;margin:7px 0 18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{overflow:hidden}.pic{height:190px;background:#e9eef3;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-weight:700}.body{padding:14px}.title{min-height:42px;font-weight:650}.stars{color:#d97706}.price{font-size:21px;font-weight:800;margin:8px 0}.old{text-decoration:line-through;color:#94a3b8;font-size:13px}.add{width:100%;border:0;background:var(--accent);color:#fff;padding:11px;border-radius:7px;font-weight:700;cursor:pointer}.drawer{position:fixed;right:0;top:0;height:100%;width:min(390px,95vw);background:#fff;box-shadow:-8px 0 30px #0003;padding:22px;display:none;z-index:5;overflow:auto}.drawer.show{display:block}.drawer h2{margin-top:0}.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0}.btn{border:1px solid #cbd5e1;background:#fff;padding:9px;border-radius:7px;cursor:pointer}.primary{background:#0f766e;color:#fff;border-color:#0f766e}.form input{display:block;width:100%;padding:11px;margin:7px 0;border:1px solid #cbd5e1;border-radius:7px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{background:#fff;width:min(430px,92vw);padding:24px;border-radius:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:8px;display:none;z-index:20}.toast.show{display:block}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:repeat(2,1fr)}.links a:nth-child(n+2){display:none}}@media(max-width:560px){.brand{font-size:20px}.brandrow{gap:9px}.grid{grid-template-columns:1fr}.topbar{display:none}}
</style></head>
<body>
<header class="top"><div class="wrap">
 <div class="topbar"><span>South Africa · Prices in ZAR</span><span>Secure shopping · Seller marketplace</span></div>
 <div class="brandrow"><div class="brand"> <b>Shop&Drop</b> </div><div class="search"><input id="search" placeholder="Search for products, brands and more" onkeydown="if(event.key==='Enter')searchProducts()"><button onclick="searchProducts()">Search</button></div><div class="links"><a href="#" onclick="openAccount()">Sign in</a><a href="/account.html">My orders</a><a href="#" onclick="openCart()">Cart <span id="cartCount">(0)</span></a></div></div>
</div></header>
<nav class="hero"><div class="wrap cats" id="cats"></div></nav>
<main class="wrap layout"><aside class="side"><h3>Shop by category</h3><div id="sideCats"></div><hr><button onclick="openAccount()">Sign in / Register</button><button onclick="loadWishlist()">My Wishlist</button><a href="/seller.html">Seller Centre</a><br><a href="/admin.html">Admin Centre</a></aside>
<section class="content"><h1 id="heading">Featured products</h1><div class="meta" id="meta">Great products from trusted sellers around the world.</div><div class="grid" id="products"></div></section></main>
<div class="drawer" id="cartDrawer"><button class="btn" onclick="closeCart()">Close</button><h2>Your cart</h2><div id="cartItems"></div><h3 id="cartTotal"></h3><a class="btn primary" style="display:block;text-align:center" href="/checkout.html">Checkout</a></div>
<div class="drawer" id="wishDrawer"><button class="btn" onclick="wishDrawer.classList.remove('show')">Close</button><h2>Wishlist</h2><div id="wishItems"></div></div>
<div class="modal" id="accountModal"><div class="modalbox"><button class="btn" style="float:right" onclick="accountModal.classList.remove('show')">×</button><h2 id="accountTitle">Sign in</h2><div class="form"><input id="name" placeholder="Full name"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn primary" style="width:100%" onclick="submitAuth()">Continue</button></div><p><button class="btn" onclick="toggleAuth()">Switch sign in / register</button></p><div id="accountInfo"></div></div></div>
<div class="toast" id="toast"></div>
<script>
let cart=[],register=false;
const money=c=>(c/100).toLocaleString('en-ZA',{style:'currency',currency:'ZAR'});
async function api(p,o={}){let r=await fetch(p,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function msg(x){toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)}
async function loadCats(){let d=await api('/api/categories');cats.innerHTML='<a onclick="loadProducts()">All</a>'+d.categories.map(c=>`<a onclick="loadProducts('${encodeURIComponent(c.category)}')">${c.category} (${c.product_count})</a>`).join('');sideCats.innerHTML=d.categories.map(c=>`<button onclick="loadProducts('${encodeURIComponent(c.category)}')">${c.category}</button>`).join('')}
async function loadProducts(cat=''){let q=search.value;let d=await api('/api/products?q='+encodeURIComponent(q)+'&category='+cat);heading.textContent=cat?decodeURIComponent(cat):q?`Search: ${q}`:'Featured products';meta.textContent=d.products.length+' products';products.innerHTML=d.products.map(p=>`<article class=card><div class=pic>${p.image_url?`<img src="${p.image_url}" style="max-width:100%;max-height:100%">`:'PRODUCT IMAGE'}</div><div class=body><div class=stars>${p.rating?('★'.repeat(Math.round(p.rating))):'☆'} <span class=muted>${p.review_count} reviews</span></div><div class=title><a href="/product.html?id=${p.id}">${esc(p.name)}</a></div><div class=muted>${esc(p.store_name)}</div><div class=price>${money(p.price_cents)}</div><div class=muted>${p.stock>0?'In stock':'Out of stock'}</div><br><button class=add onclick="add('${p.id}',${p.price_cents})">Add to cart</button><button class=btn style="width:100%;margin-top:6px" onclick="wish('${p.id}')">♡ Wishlist</button></div></article>`).join('')}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function searchProducts(){loadProducts()}
async function add(id,price){try{let m=await api('/api/me');if(!m.user){openAccount();return}let old=cart.find(x=>x.id===id);let q=(old?.quantity||0)+1;await api('/api/cart',{method:'POST',body:JSON.stringify({productId:id,quantity:q})});await loadCart();msg('Added to cart')}catch(e){msg(e.message)}}
async function loadCart(){try{let d=await api('/api/cart');cart=d.items;cartCount.textContent='('+cart.reduce((a,x)=>a+x.quantity,0)+')';cartItems.innerHTML=cart.length?cart.map(x=>`<div class=row><span>${esc(x.name)} × ${x.quantity}</span><b>${money(x.price_cents*x.quantity)}</b></div>`).join(''):'Cart is empty';cartTotal.textContent=cart.length?'Total: '+money(cart.reduce((a,x)=>a+x.price_cents*x.quantity,0)):''}catch{}}
function openCart(){cartDrawer.classList.add('show');loadCart()}function closeCart(){cartDrawer.classList.remove('show')}
async function checkout(){try{if(!cart.length)return msg('Cart is empty');let d=await api('/api/orders',{method:'POST',body:JSON.stringify({items:cart.map(x=>({productId:x.product_id,quantity:x.quantity}))})});msg('Order created');await loadCart();closeCart();alert('Order '+d.order.id+' created. Payment is ready for provider integration.')}catch(e){msg(e.message)}}
function openAccount(){accountModal.classList.add('show')}
function toggleAuth(){register=!register;accountTitle.textContent=register?'Create account':'Sign in';name.style.display=register?'block':'none'}
async function submitAuth(){try{let d;if(register)d=await api('/api/register',{method:'POST',body:JSON.stringify({fullName:name.value,email:email.value,password:pass.value})});else d=await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});accountModal.classList.remove('show');msg('Welcome '+d.user.full_name);await loadCart()}catch(e){msg(e.message)}}
async function wish(id){try{let m=await api('/api/me');if(!m.user)return openAccount();await api('/api/wishlist',{method:'POST',body:JSON.stringify({productId:id})});msg('Saved to wishlist')}catch(e){msg(e.message)}}
async function loadWishlist(){try{let d=await api('/api/wishlist');wishItems.innerHTML=d.products.map(p=>`<div class=row>${esc(p.name)} <b>${money(p.price_cents)}</b></div>`).join('');wishDrawer.classList.add('show')}catch(e){msg(e.message)}}
loadCats();loadProducts();loadCart();toggleAuth();
</script></body></html>
