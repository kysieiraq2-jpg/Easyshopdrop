<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">
<title>Vehicle Advertisement Draft | Shop&Drop</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f6f8;
  color:#17202a;
  font:16px Arial,sans-serif
}
header{
  background:#101827;
  color:white;
  padding:18px
}
main{
  max-width:760px;
  margin:20px auto;
  padding:16px
}
section{
  background:white;
  padding:20px;
  border-radius:12px
}
label{display:block;margin:14px 0}
input,select,textarea,button{
  display:block;
  width:100%;
  padding:12px;
  margin-top:6px;
  font:inherit;
  border-radius:7px;
  border:1px solid #cbd5e1
}
button{
  background:#0f766e;
  color:white;
  border:0
}
button:disabled{opacity:.5}
.muted{color:#64748b}
#result{
  white-space:pre-wrap;
  overflow-wrap:anywhere
}
</style>
</head>
<body>
<header>
  <strong>Shop&Drop</strong>
  <div>Vehicle Advertisement Submission</div>
</header>
<main>
<section>
<h1>Advertise your vehicle</h1>
<p class="muted">
  Development-only form. This page is not
  connected to public browsing or bookings.
  Eligible advertisements publish automatically after successful photograph submission.
</p>

<form id="draftForm">
  <label>
    Vehicle advertisement title
    <input id="title" required minlength="3"
           maxlength="120"
           placeholder="Example: Bakkie transport">
  </label>

  <label>
    Vehicle type
    <select id="type">
      <option value="">Choose type</option>
      <option>Delivery vehicle / van</option>
      <option>Light truck</option>
      <option>Heavy truck</option>
      <option>Extra-heavy transport</option>
      <option>Other / specialist transport</option>
    </select>
  </label>

  <label>
    Description
    <textarea id="description"
              maxlength="2000"
              rows="4"></textarea>
  </label>

  <label>
    Vehicle base town
    <input id="town" maxlength="120">
  </label>

  <label>
    Vehicle base province
    <input id="province" maxlength="120">
  </label>

  <label>
    Service coverage
    <select id="coverage">
      <option value="">Not selected</option>
      <option value="local">Local</option>
      <option value="selected">Selected areas</option>
      <option value="nationwide">
        Anywhere in South Africa
      </option>
    </select>
  </label>

  <label>
  Vehicle photographs (1 to 6)
  <input id="vehiclePhotos"
         type="file"
         accept="image/jpeg,image/png,image/webp"
         multiple required>
</label>
<p class="muted">
  Maximum 10 MB per photograph.
</p>
<button id="submit" type="submit">
    Submit vehicle advertisement
  </button>
</form>

<p id="result" role="status"
   aria-live="polite">
  No draft created.
</p>
</section>
</main>

<script src="./shopdrop-ad-gallery-uploader.js"></script>
<script type="module">
import {createClient} from
  'https://esm.sh/@supabase/supabase-js@2';

const client=createClient(
  'https://dtkdvvxpwonywtsgqmdx.supabase.co',
  'sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q',
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const form=document.getElementById('draftForm');
const result=document.getElementById('result');
const button=document.getElementById('submit');

const value=id=>
  document.getElementById(id).value.trim();

form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(button.disabled)return;

  button.disabled=true;
  result.textContent='Checking signed-in account...';

  try{
    const {data:userData,error:userError}=
      await client.auth.getUser();

    if(userError || !userData?.user?.id){
      throw Error(
        'Please sign in to Shop&Drop first.'
      );
    }

    const title=value('title');

    if(title.length<3 || title.length>120){
      throw Error('Enter a valid vehicle title.');
    }


    const photos=Array.from(
      document.getElementById(
        'vehiclePhotos'
      ).files||[]
    );

    if(photos.length<1||photos.length>6){
      throw Error(
        'Select between 1 and 6 photographs.'
      );
    }

    if(!value('type')||
       !value('town')||
       !value('province')||
       !value('coverage')){
      throw Error(
        'Vehicle type, town, province and coverage are required.'
      );
    }

    for(const photo of photos){
      if(
        !['image/jpeg','image/png','image/webp']
          .includes(photo.type)||
        photo.size<1||
        photo.size>10485760
      ){
        throw Error(
          'Use JPEG, PNG or WebP photographs, maximum 10 MB each.'
        );
      }
    }

    const record={
      provider_id:userData.user.id,
      vehicle_title:title,
      vehicle_description:value('description')||null,
      vehicle_type:value('type')||null,
      base_town:value('town')||null,
      base_province:value('province')||null,
      coverage_mode:value('coverage')||null,
      covered_areas:[],
      listing_status:'draft'
    };

    const {data,error}=await client
      .from('shopdrop_vehicle_adverts')
      .insert(record)
      .select('id,listing_status')
      .single();

    if(error)throw Error(
      error.message||'Draft could not be saved.'
    );


    result.textContent=
      'Vehicle saved. Uploading photographs...';

    const uploader=
      window.ShopDropAdGalleryUploader;

    if(!uploader?.uploadGallery){
      throw Error(
        'Photograph uploader unavailable. '+
        'Advertisement ID: '+data.id
      );
    }

    try{
      const uploaded=
        await uploader.uploadGallery({
          client,
          kind:'vehicle',
          advertisementId:data.id,
          files:photos
        });

      const {
        data:published,
        error:statusError
      }=await client
        .from('shopdrop_vehicle_adverts')
        .select('listing_status')
        .eq('id',data.id)
        .single();

      if(statusError)throw statusError;

      result.textContent=
        uploaded.savedCount+
        ' photograph(s) uploaded.\n'+
        'Advertisement ID: '+data.id+'\n'+
        'Status: '+published.listing_status;

      if(published.listing_status==='approved'){
        result.textContent+=
          '\nAutomatically published in browsing.';
      }

      form.reset();

    }catch(uploadError){
      result.textContent=
        'Advertisement ID: '+data.id+
        '\nPhotograph upload incomplete: '+
        (uploadError?.message||'Unknown error')+
        '\nKeep this ID. Do not create a duplicate.';
    }

  }catch(error){
    result.textContent=
      error?.message||'Draft creation failed.';
  }finally{
    button.disabled=false;
  }
});
</script>
</body>
</html>
