<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Shop&Drop</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#f4f6f8;color:#17202a}.wrap{max-width:650px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:14px;margin:18px 0}input,button{width:100%;padding:12px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px}button{background:#0f766e;color:#fff;border:0}.note{background:#ecfdf5;padding:14px;border-radius:10px}.message{padding:12px;background:#fff7ed;border-radius:8px}</style></head><body><main class=wrap><a href="./index.html">← Shop&Drop</a><h1>Create your free account</h1><div class=note>One simple Shop&Drop account can be used to buy and, after seller/provider approval where required, to sell products or services. We ask for extra information only when it is needed for a transaction.</div><section class=card><form id=form><label>Full name</label><input id=fullName required minlength=2 autocomplete=name><label>Email</label><input id=email type=email required autocomplete=email><label>Password</label><input id=password type=password required minlength=8 autocomplete=new-password placeholder="8+ characters recommended; choose a password you can remember"><button>Create account</button></form><p id=message class=message hidden></p><p>Already registered? <a href="./sign-in.html">Sign in</a>.</p></section></main><script src="./common.js"></script><script>form.onsubmit=async e=>{e.preventDefault();if(ShopDrop.isStatic){ShopDrop.msg(message,'Preview mode: registration layout is ready. Verification and secure account creation activate with the Shop&Drop backend.');return}try{await ShopDrop.api('/api/register',{method:'POST',body:JSON.stringify({fullName:fullName.value.trim(),email:email.value.trim(),password:password.value})});location.href='./account.html'}catch(x){ShopDrop.msg(message,x.message,'error')}}</script><script src="v26-bridge.js"></script></body></html>
