<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop&Drop R3-A</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.5}label{display:block;margin-top:12px}input{width:100%;box-sizing:border-box;padding:12px}button{display:block;margin-top:14px;padding:12px}pre{white-space:pre-wrap;background:#f5f5f5;padding:16px}</style></head><body><h1>Shop&amp;Drop R3-A Profile RLS Ownership Test</h1><p><b>Read-only isolated diagnostic.</b> No V26.24 page is modified.</p><label>Email</label><input id=e type=email><label>Shop&amp;Drop password</label><input id=p type=password><button id=si>1. Sign In</button><button id=own>2. Read My Own Profile</button><button id=other>3. Try To Read Another Profile</button><pre id=o>READY.</pre><script src="./supabase-r3-profile-rls.js"></script><script>
si.onclick=async()=>{let r=await ShopDropR3A.signIn(e.value.trim(),p.value);o.textContent=r.ok?"SIGN IN PASS\nHTTP status: "+r.status:"SIGN IN REVIEW REQUIRED\nHTTP status: "+r.status};
own.onclick=async()=>{let r=await ShopDropR3A.own(),a=Array.isArray(r.body)?r.body:[];o.textContent=r.ok&&a.length===1?"OWN PROFILE PASS\nExactly 1 own profile row was visible.\nHTTP status: "+r.status:"OWN PROFILE REVIEW REQUIRED\nHTTP status: "+r.status+"\nRows visible: "+a.length};
other.onclick=async()=>{let r=await ShopDropR3A.other(),a=Array.isArray(r.body)?r.body:[];o.textContent=r.ok&&a.length===0?"RLS BLOCK PASS\nNo other user's profile was visible.\nHTTP status: "+r.status:"RLS REVIEW REQUIRED\nHTTP status: "+r.status+"\nOther rows visible: "+a.length};
</script></body></html>
