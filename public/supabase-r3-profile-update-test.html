<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop&Drop R3-B</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.5}label{display:block;margin-top:12px}input{width:100%;box-sizing:border-box;padding:12px}button{display:block;margin-top:14px;padding:12px}pre{white-space:pre-wrap;background:#f5f5f5;padding:16px}</style></head><body><h1>Shop&amp;Drop R3-B Profile Update Ownership Test</h1><p><b>Isolated diagnostic.</b> No V26.24 page is modified. The own-profile test temporarily changes one test field and immediately restores its original value.</p><label>Email</label><input id=e type=email><label>Shop&amp;Drop password</label><input id=p type=password><button id=si>1. Sign In</button><button id=own>2. Test Own Profile Update + Restore</button><button id=other>3. Try To Update Another Profile</button><pre id=o>READY.</pre><script src="./supabase-r3-profile-update.js"></script><script>
si.onclick=async()=>{let r=await ShopDropR3B.signIn(e.value.trim(),p.value);o.textContent=r.ok?"SIGN IN PASS\nHTTP status: "+r.status:"SIGN IN REVIEW REQUIRED\nHTTP status: "+r.status};
own.onclick=async()=>{o.textContent="TESTING OWN UPDATE AND RESTORE...";let r=await ShopDropR3B.ownUpdate();o.textContent=r.pass?"OWN UPDATE PASS\nOwn profile update succeeded and original value was restored.":"OWN UPDATE REVIEW REQUIRED\nStage: "+r.stage+"\nHTTP status: "+r.status};
other.onclick=async()=>{o.textContent="TESTING OTHER-PROFILE UPDATE BLOCK...";let r=await ShopDropR3B.otherUpdate();o.textContent=r.pass?"RLS UPDATE BLOCK PASS\nNo other user's profile was updated.\nHTTP status: "+r.status:"RLS UPDATE REVIEW REQUIRED\nHTTP status: "+r.status+"\nRows updated: "+r.rows};
</script></body></html>
