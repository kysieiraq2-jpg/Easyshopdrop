<h1>Shop&amp;Drop R4 Listing Reports Browser Test</h1>
<p class="note"><b>Non-destructive diagnostic.</b> No authenticated user token is supplied, so no listing report can be created. V26.24 is not modified.</p>
<button id="test">Run Browser CORS + Auth Protection Test</button><pre id="out">READY.</pre>
<script>
const endpoint='https://dtkdvvxpwonywtsgqmdx.supabase.co/functions/v1/listing-reports',apikey='sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q',out=document.getElementById("out");
document.getElementById("test").onclick=async()=>{
 out.textContent="TESTING...";
 try{
  const r=await fetch(endpoint,{method:"POST",mode:"cors",headers:{"apikey":apikey,"content-type":"application/json","x-client-info":"shopdrop-r4-listing-reports-test"},body:JSON.stringify({diagnostic_only:true}),cache:"no-store"});
  const text=await r.text();
  out.textContent=r.status===401
   ?"R4 LISTING REPORTS PASS\nBrowser cross-origin request completed.\nUnauthenticated request blocked.\nHTTP status: 401\nResponse: "+text
   :"R4 LISTING REPORTS REVIEW REQUIRED\nHTTP status: "+r.status+"\nResponse: "+text;
 }catch(e){out.textContent="R4 LISTING REPORTS REVIEW REQUIRED\nBrowser blocked the cross-origin request.\nError: "+String(e);}
};
</script></body></html>
