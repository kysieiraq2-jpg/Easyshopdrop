name: ShopDrop Fix 199S Private Contact Save
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix199s-private-contact-save.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: shopdrop-fix199s
  cancel-in-progress: false
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
        persist-credentials: true
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Correct and verify private contact save
      shell: bash
      run: "set -euo pipefail\npython3 <<'PYCODE'\nfrom pathlib import Path\nimport\
        \ hashlib, os, subprocess, tempfile\nfrom html.parser import HTMLParser\n\
        PATCHES = {'public/shopdrop-private-contact.js': ('29bfd82da3b7c7c0659ed1e12d0c4635a43b25a8',\
        \ [(\" const form=document.createElement('form');form.autocomplete='on';panel.append(form);\"\
        , \" const form=document.createElement('form');form.autocomplete='on';form.addEventListener('submit',e=>e.preventDefault());panel.append(form);\"\
        ), (\"button.textContent='Save private contact details';form.append(button);\"\
        , \"button.textContent='Save private contact details';button.disabled=true;form.append(button);\"\
        ), (\"  form.addEventListener('submit',async e=>{\\n   e.preventDefault();button.disabled=true;message.textContent='Saving…';\\\
        n   try {\", \"  button.disabled=false;\\n  form.addEventListener('submit',async\
        \ e=>{\\n   e.preventDefault();if(button.disabled)return;button.disabled=true;message.textContent='Saving…';\\\
        n   let profileSaved=false;\\n   try {\\n    const {data:verified,error:verifyError}=await\
        \ sb.auth.getUser();\\n    if(verifyError||verified?.user?.id!==user.id)throw\
        \ Error('Your sign-in changed. Refresh this page and sign in again.');\"),\
        \ (\"    const {error:pe}=await sb.from('profiles').update({full_name:person,mobile_number:mobile,country_code:cc}).eq('id',user.id);if(pe)throw\
        \ pe;\", \"    const {data:savedProfile,error:pe}=await sb.from('profiles').update({full_name:person,mobile_number:mobile,country_code:cc}).eq('id',user.id).select('id').single();if(pe)throw\
        \ pe;\\n    if(savedProfile?.id!==user.id)throw Error('Profile update could\
        \ not be confirmed. Refresh before retrying.');\\n    profileSaved=true;\"\
        ), (\"    if(result.error)throw result.error;a.id=result.data.id;message.textContent='Private\
        \ contact details saved.';\", \"    if(result.error)throw result.error;\\\
        n    if(!result.data?.id||(a.id&&result.data.id!==a.id))throw Error('Address\
        \ update could not be confirmed. Refresh before retrying.');\\n    a.id=result.data.id;message.textContent='Private\
        \ contact details saved.';\"), (\"   } catch(err){message.textContent='Save\
        \ failed: '+(err?.message||'Please try again.')} finally{button.disabled=false}\"\
        , \"   } catch(err){message.textContent=(profileSaved?'Profile saved, but\
        \ address save was not confirmed. ':'Save failed: ')+(err?.message||'Please\
        \ try again.')} finally{button.disabled=false}\")]), 'public/account.html':\
        \ ('c3d96edbc8f5adb5c33d50472ee531f65582e689', [('./shopdrop-private-contact.js?v=199r',\
        \ './shopdrop-private-contact.js?v=199s')])}\nTEST = \"const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');\\\
        nconst source=fs.readFileSync(process.argv[2],'utf8').replace(/^import .*;$/m,'');\\\
        nconst uid='test-user',addressId='test-address';\\nasync function simulate(mode){\\\
        n const nodes=[],calls=[];\\n class El {constructor(tag){this.tag=tag;this.style={};this.handlers={};this.value='';this.disabled=false;nodes.push(this)}append(){}after(){}setAttribute(){}addEventListener(name,fn){(this.handlers[name]??=[]).push(fn)}}\\\
        n const host=new El('main');let authCalls=0,release;\\n const gate=new Promise(r=>{release=r});\\\
        n const profile={full_name:'Example Person',mobile_number:'+27821234567',country_code:'ZA'};\\\
        n const address={id:addressId,recipient_name:'Example Person',address_line_1:'Example\
        \ Street',city:'Pretoria',country_code:'ZA'};\\n const db={auth:{getUser:async()=>({data:{user:{id:++authCalls>1&&mode==='changed'?'another-user':uid}},error:null})},from(table){let\
        \ write=false;const chain={select(){return chain},eq(){return chain},limit:async()=>({data:[address],error:null}),maybeSingle:async()=>{await\
        \ gate;return {data:profile,error:mode==='loadError'?Error('load error'):null}},update(){write=true;calls.push(table);return\
        \ chain},insert(){write=true;calls.push(table);return chain},single:async()=>{assert(write);if(table==='profiles')return\
        \ {data:mode==='zeroProfile'?null:{id:uid},error:null};if(mode==='addressError')return\
        \ {data:null,error:Error('address rejected')};return {data:{id:addressId},error:null}}};return\
        \ chain}};\\n const run=vm.runInNewContext('(async()=>{'+source+'})()',{createClient:()=>db,document:{createElement:tag=>new\
        \ El(tag),querySelector:()=>host,getElementById:()=>null},Error,Promise});\\\
        n await new Promise(r=>setImmediate(r));\\n const form=nodes.find(n=>n.tag==='form'),button=nodes.find(n=>n.tag==='button');assert(form&&button);assert.equal(button.disabled,true);\\\
        n let prevented=false;for(const fn of form.handlers.submit)await fn({preventDefault(){prevented=true}});assert(prevented);assert.equal(calls.length,0);\\\
        n release();await run;\\n const message=nodes.filter(n=>n.tag==='p').at(-1);\\\
        n if(mode==='loadError'){assert(button.disabled);assert.equal(form.handlers.submit.length,1);return}\\\
        n assert.equal(button.disabled,false);\\n prevented=false;for(const fn of\
        \ form.handlers.submit)await fn({preventDefault(){prevented=true}});assert(prevented);\\\
        n if(mode==='changed'){assert.deepEqual(calls,[]);assert.match(message.textContent,/sign-in\
        \ changed/)}\\n else if(mode==='zeroProfile'){assert.deepEqual(calls,['profiles']);assert.match(message.textContent,/Profile\
        \ update could not be confirmed/)}\\n else if(mode==='addressError'){assert.deepEqual(calls,['profiles','addresses']);assert.match(message.textContent,/Profile\
        \ saved, but address save was not confirmed/)}\\n else {assert.deepEqual(calls,['profiles','addresses']);assert.equal(message.textContent,'Private\
        \ contact details saved.')}\\n}\\n(async()=>{for(const mode of ['ok','loadError','changed','zeroProfile','addressError'])await\
        \ simulate(mode);console.log('PASS: five mocked scenarios including early\
        \ submission, load failure, changed session, unconfirmed profile and partial\
        \ address save.');})().catch(e=>{console.error(e);process.exitCode=1});\"\n\
        BRANCH = 'shopdrop-phase6-integration'\ndef git(*args):\n    return subprocess.check_output(['git',\
        \ *map(str,args)], text=True).strip()\ndef blob(data):\n    return hashlib.sha1(b'blob\
        \ '+str(len(data)).encode()+b'\\0'+data).hexdigest()\ndef require(ok, message):\n\
        \    if not ok: raise SystemExit('SAFETY STOP: '+message)\ndef update(data,\
        \ changes):\n    result=data\n    for a,b in changes:\n        a,b=a.encode(),b.encode()\n\
        \        require(result.count(a)==1,'unexpected replacement anchor count')\n\
        \        result=result.replace(a,b,1)\n    original=result\n    for a,b in\
        \ reversed(changes):\n        a,b=a.encode(),b.encode()\n        require(original.count(b)==1,'unexpected\
        \ reverse anchor count')\n        original=original.replace(b,a,1)\n    require(original==data,'unrelated\
        \ code changed')\n    return result\nrequire(os.environ.get('GITHUB_REF_NAME')==BRANCH\
        \ and git('branch','--show-current')==BRANCH,'incorrect branch')\nrequire(not\
        \ git('status','--porcelain'),'dirty checkout')\noriginals={}; updates={};\
        \ backups={}\nfor path,(expected,changes) in PATCHES.items():\n    p=Path(path);\
        \ b=Path('backups/fix199s')/p\n    require(p.is_file() and not p.is_symlink()\
        \ and not b.is_symlink(),'unexpected path '+path)\n    backups[path]=b\n \
        \   if b.exists():\n        old=b.read_bytes()\n        require(blob(old)==expected\
        \ and p.read_bytes()==update(old,changes),'partial or modified prior fix '+path)\n\
        \        originals[path]=old; updates[path]=p.read_bytes()\n    else:\n  \
        \      old=p.read_bytes()\n        require(blob(old)==expected,'current source\
        \ changed '+path)\n        originals[path]=old; updates[path]=update(old,changes)\n\
        existing=sum(p.exists() for p in backups.values())\nrequire(existing in (0,len(PATCHES)),'partial\
        \ prior backup')\nclass Scripts(HTMLParser):\n    def __init__(self):\n  \
        \      super().__init__(); self.scripts=[]; self.current=None\n    def handle_starttag(self,tag,attrs):\n\
        \        if tag=='script':\n            attrs=dict(attrs)\n            self.current=None\
        \ if 'src' in attrs else (attrs.get('type',''),[])\n    def handle_data(self,data):\n\
        \        if self.current is not None: self.current[1].append(data)\n    def\
        \ handle_endtag(self,tag):\n        if tag=='script' and self.current is not\
        \ None:\n            self.scripts.append((self.current[0],''.join(self.current[1])));\
        \ self.current=None\nwith tempfile.TemporaryDirectory() as td:\n    t=Path(td)\n\
        \    for path,data in updates.items():\n        if path.endswith('.js'):\n\
        \            f=t/(Path(path).stem+('.mjs' if path.endswith('shopdrop-private-contact.js')\
        \ else '.js'));f.write_bytes(data)\n            subprocess.run(['node','--check',str(f)],check=True)\n\
        \        else:\n            before=Scripts();before.feed(originals[path].decode());after=Scripts();after.feed(data.decode())\n\
        \            require(before.scripts==after.scripts,'inline operational script\
        \ changed '+path)\n            for i,(kind,code) in enumerate(after.scripts):\n\
        \                if kind not in ('','module','text/javascript','application/javascript'):\
        \ continue\n                f=t/(Path(path).stem+str(i)+('.mjs' if kind=='module'\
        \ else '.js'));f.write_text(code)\n                subprocess.run(['node','--check',str(f)],check=True)\n\
        \    test=t/'test.cjs';test.write_text(TEST)\n    subprocess.run(['node',str(test),str(t/'shopdrop-private-contact.mjs')],check=True)\n\
        if existing:\n    print('Already installed; all exact backups and patched\
        \ files verified.');raise SystemExit(0)\nfor path,data in updates.items():\n\
        \    b=backups[path];b.parent.mkdir(parents=True,exist_ok=True);b.write_bytes(originals[path]);Path(path).write_bytes(data)\n\
        \    require(b.read_bytes()==originals[path] and Path(path).read_bytes()==data,'write\
        \ mismatch '+path)\nrequire(set(git('diff','--name-only').splitlines())==set(PATCHES),'unexpected\
        \ tracked changes')\nallowed=set(PATCHES)|{str(b) for b in backups.values()}\n\
        subprocess.run(['git','add','--',*sorted(allowed)],check=True)\nrequire(set(git('diff','--cached','--name-only').splitlines())==allowed,'unexpected\
        \ staged changes')\nrequire(not git('diff','--name-only') and not git('ls-files','--others','--exclude-standard'),'unrelated\
        \ files')\nsubprocess.run(['git','diff','--cached','--check','--',*PATCHES],check=True)\n\
        print('PASS: exact source hashes, reversible patches, preserved unrelated\
        \ inline scripts, syntax, private contact mock tests and exact staged paths.')\n\
        PYCODE\nif ! git diff --cached --quiet; then\n  git config user.name 'github-actions[bot]'\n\
        \  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        \  git commit -m 'Fix 199S confirm private contact saves'\n  git push origin\
        \ HEAD:shopdrop-phase6-integration\nfi\n"
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
