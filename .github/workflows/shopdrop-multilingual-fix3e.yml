name: ShopDrop Multilingual Fix 3E - Buyer Pages
on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - .github/workflows/shopdrop-multilingual-fix3e.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true
      - name: Add buyer language bridge preserving original pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          pages=[Path('public/checkout.html'),Path('public/tracking.html'),Path('public/returns.html'),Path('public/categories.html')]
          for p in pages:
              if not p.is_file(): raise SystemExit(f'STOP: missing {p}')
              s=p.read_text()
              if s.count('</body>')!=1 or 'shopdrop-buyer-language.js' in s:
                  raise SystemExit(f'STOP: unexpected baseline {p}')
          target=Path('public/shopdrop-buyer-language.js')
          if target.exists(): raise SystemExit('STOP: shared language file already exists')
          target.write_bytes(base64.b64decode(''))
          for p in pages:
              original=p.read_text()
              updated=original.replace('</body>','<script defer src="shopdrop-buyer-language.js"></script></body>')
              if updated.replace('<script defer src="shopdrop-buyer-language.js"></script>','')!=original:
                  raise SystemExit('STOP: preservation check failed')
              p.write_text(updated)
              print('Preserved original:',p)
          PY
          git diff --check
          git add public/checkout.html public/tracking.html public/returns.html public/categories.html public/shopdrop-buyer-language.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add multilingual UI to buyer-facing pages'
          git push origin HEAD:shopdrop-phase6-integration
