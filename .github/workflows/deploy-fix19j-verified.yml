name: ShopDrop - Fix19J Verified Worker Reconcile

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/deploy-requests/fix19j-reconcile.txt'

permissions:
  contents: read

concurrency:
  group: shopdrop-approved-courier-booking-worker
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify one-time approval and source guard
        shell: bash
        run: |
          set -euo pipefail
          request=.github/deploy-requests/fix19j-reconcile.txt
          test "$(cat "$request")" = 'FIX19J DEPLOY AND VERIFY courier-booking-worker'
          test -s supabase/functions/courier-booking-worker/index.ts
          grep -Fq 'shopdrop_verify_courier_booking_worker' supabase/functions/courier-booking-worker/index.ts
          git diff --name-only HEAD^ HEAD -- "$request" | grep -Fx "$request"
          previous="$(git show "HEAD^:$request" 2>/dev/null || true)"
          test "$previous" != 'FIX19J DEPLOY AND VERIFY courier-booking-worker'
          sha256sum supabase/functions/courier-booking-worker/index.ts
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy only the verified courier worker
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$PROJECT_REF"
          supabase functions deploy courier-booking-worker --project-ref "$PROJECT_REF"
      - name: Download deployed source and compare exact bytes
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/supabase/functions/courier-booking-worker/index.ts"
          mkdir -p "$RUNNER_TEMP/shopdrop-remote-check"
          cd "$RUNNER_TEMP/shopdrop-remote-check"
          supabase init
          supabase functions download courier-booking-worker --project-ref "$PROJECT_REF"
          actual='supabase/functions/courier-booking-worker/index.ts'
          test -s "$actual"
          cmp "$expected" "$actual" || { echo 'Deployed source differs from GitHub. Stop scheduler activation.'; exit 1; }
          grep -Fq 'shopdrop_verify_courier_booking_worker' "$actual"
          echo 'FIX19J VERIFIED: deployed source matches GitHub source.'
