name: ShopDrop - Fix19J Verified Worker Reconcile

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/deploy-requests/fix19j-reconcile.txt'
      - '.github/workflows/deploy-fix19j-verified.yml'

permissions:
  contents: read

concurrency:
  group: shopdrop-approved-courier-booking-worker
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify deployed worker authorization without redeployment
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$PROJECT_REF"
          mkdir -p "$RUNNER_TEMP/shopdrop-remote-check"
          cd "$RUNNER_TEMP/shopdrop-remote-check"
          supabase init
          supabase functions download courier-booking-worker --project-ref "$PROJECT_REF"
          actual='supabase/functions/courier-booking-worker/index.ts'
          test -s "$actual"
          if grep -Fq 'shopdrop_verify_courier_booking_worker' "$actual"; then
            echo 'PASS: deployed worker contains Vault authorization RPC.'
          else
            echo 'FAIL: deployed worker is missing Vault authorization RPC.'
            exit 1
          fi
