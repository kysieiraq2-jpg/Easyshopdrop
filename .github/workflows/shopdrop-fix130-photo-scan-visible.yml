
name: ShopDrop Fix131 - Visible Photo Scan Status

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix130-photo-scan-visible.yml'

permissions:
  contents: write

jobs:
  fix-scan-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration

      - name: Install reliable scan display
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected={
            'public/seller.html':
              '6db7246341e1a67ad54e47a32e480100dfbe7ff7',
            'public/shopdrop-product-photos.js':
              '8ed1f80f67814b9ffdc78ec827ea9293ad5ce7ea',
            'public/shopdrop-free-photo-screen.mjs':
              '81b12f2db4f5017fdce251adf7b3c0125032b7b8'
          }

          for name,sha in expected.items():
            actual=subprocess.check_output(
              ['git','hash-object',name],
              text=True
            ).strip()
            if actual!=sha:
              raise SystemExit(
                'SAFETY STOP: Changed file '+name
              )

          page=Path('public/seller.html')
          source=page.read_text(encoding='utf-8')

          old=(
            '<script type="module" '
            'src="./shopdrop-photo-scan-visible.mjs">'
            '</script>'
          )

          new=(
            '<script defer '
            'src="./shopdrop-photo-scan-status.js">'
            '</script>'
          )

          if source.count(old)!=1:
            raise SystemExit(
              'SAFETY STOP: Scanner script changed'
            )

          source=source.replace(old,new,1)

          page.write_text(
            source,encoding='utf-8'
          )

          js=Path('public/shopdrop-photo-scan-status.js')

          if js.exists():
            raise SystemExit(
              'SAFETY STOP: Status component exists'
            )

          js.write_text(r"""
          (() => {
            'use strict';

            let sequence=0;

            function statusBox(){
              let box=document.getElementById(
                'shopdropVisibleScanStatus'
              );

              if(box)return box;

              const anchor=document.getElementById(
                'uploadStatus'
              );

              if(!anchor)return null;

              box=document.createElement('div');
              box.id='shopdropVisibleScanStatus';
              box.setAttribute('role','status');
              box.setAttribute('aria-live','polite');
              box.style.cssText=
                'display:block;margin:12px 0;'+
                'padding:14px;border-radius:9px;'+
                'border:2px solid #0f766e;'+
                'background:#effcf8;color:#123b32;'+
                'white-space:pre-line;'+
                'font-weight:600';

              box.textContent=
                'Photograph scanner ready. '+
                'Choose a picture to test.';

              anchor.after(box);
              return box;
            }

            async function scan(files){
              const box=statusBox();
              if(!box||!files.length)return;

              const run=++sequence;

              box.textContent=
                'Scanning '+files.length+
                ' photograph(s)… Please wait.';

              try{
                const module=await import(
                  './shopdrop-free-photo-screen.mjs'
                );

                if(run!==sequence)return;

                if(typeof module.scanPhotos!=='function'){
                  throw Error('Scanner unavailable');
                }

                const results=await module.scanPhotos(
                  files,
                  progress=>{
                    if(run!==sequence)return;

                    if(progress?.state==='scanning'){
                      box.textContent=
                        'Scanning photograph '+
                        progress.current+
                        ' of '+progress.total+'…';
                    }
                  }
                );

                if(run!==sequence)return;

                const lines=results.map((result,i)=>{
                  let outcome='No issue detected';

                  if(result.status==='reject'){
                    outcome='Potential problem';
                  }else if(result.status==='review'){
                    outcome='Needs further checking';
                  }

                  return (
                    'Photograph '+(i+1)+': '+
                    outcome+
                    (result.reason
                      ?' — '+result.reason
                      :'')
                  );
                });

                box.textContent=
                  'Scan completed.\n'+
                  lines.join('\n')+
                  '\n\nPreliminary test only. '+
                  'Photograph uploads are unchanged.';

              }catch(error){
                if(run!==sequence)return;

                box.textContent=
                  'Photograph scanning could not finish. '+
                  'The normal photograph uploader '+
                  'still works. Please send a screenshot.';
              }
            }

            function init(){
              statusBox();

              for(const id of [
                'photo',
                'shopdropPhotoCamera'
              ]){
                const input=document.getElementById(id);
                if(!input)continue;

                input.addEventListener(
                  'change',
                  event=>{
                    const files=Array.from(
                      event.target.files||[]
                    );

                    if(files.length){
                      void scan(files);
                    }
                  },
                  true
                );
              }
            }

            if(document.readyState==='loading'){
              document.addEventListener(
                'DOMContentLoaded',init,{once:true}
              );
            }else{
              init();
            }
          })();
          """.lstrip(),encoding='utf-8')

          print('PASS: Visible scanner status installed')
          print('PASS: Original uploader unchanged')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail

          node --check \
            public/shopdrop-photo-scan-status.js

          git diff --check

          test "$(git diff --name-only)" = "public/seller.html"
          test -f public/shopdrop-photo-scan-status.js

          git add \
            public/seller.html \
            public/shopdrop-photo-scan-status.js

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Fix131 make photograph scan status visible"

          git push origin HEAD:shopdrop-phase6-integration
