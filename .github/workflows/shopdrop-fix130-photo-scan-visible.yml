
name: ShopDrop Fix130 - Visible Photograph Scan

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix130-photo-scan-visible.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration

      - name: Connect scanner without changing uploader
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          page=Path('public/seller.html')

          expected={
            'public/seller.html':
              '970976a26f3db38d88285eb7f487fa4f29e2ffa6',
            'public/shopdrop-product-photos.js':
              '8ed1f80f67814b9ffdc78ec827ea9293ad5ce7ea',
            'public/shopdrop-free-photo-screen.mjs':
              '81b12f2db4f5017fdce251adf7b3c0125032b7b8'
          }

          for name,sha in expected.items():
            actual=subprocess.check_output(
              ['git','hash-object',name],
              text=True
            ).strip()

            if actual!=sha:
              raise SystemExit(
                'SAFETY STOP: File changed: '+name
              )

          js=Path(
            'public/shopdrop-photo-scan-visible.mjs'
          )

          if js.exists():
            raise SystemExit(
              'SAFETY STOP: Scanner connection exists'
            )

          js.write_text(r"""
          import {scanPhotos} from
            './shopdrop-free-photo-screen.mjs';

          const ids=[
            'photo',
            'shopdropPhotoCamera'
          ];

          let sequence=0;

          function createStatus(){
            let box=document.getElementById(
              'shopdropVisibleScanStatus'
            );

            if(box)return box;

            const anchor=document.getElementById(
              'uploadStatus'
            );

            if(!anchor)return null;

            box=document.createElement('div');
            box.id='shopdropVisibleScanStatus';
            box.setAttribute('role','status');
            box.setAttribute('aria-live','polite');
            box.style.cssText=
              'margin:12px 0;padding:12px;'+
              'border:1px solid #cbd5e1;'+
              'border-radius:8px;'+
              'background:#f8fafc;'+
              'white-space:pre-line';

            box.textContent=
              'Photograph scanning ready.';

            anchor.after(box);
            return box;
          }

          async function inspect(files){
            const box=createStatus();
            if(!box||!files.length)return;

            const current=++sequence;

            box.textContent=
              'Scanning photographs… Please wait.';

            try{
              const results=await scanPhotos(
                files,
                progress=>{
                  if(current!==sequence)return;

                  if(progress?.state==='finished')return;

                  box.textContent=
                    'Scanning photographs… '+
                    String(progress?.current||0)+
                    ' of '+files.length;
                }
              );

              if(current!==sequence)return;

              const lines=results.map((result,index)=>{
                const state=
                  result.status==='reject'
                    ?'Potential problem'
                    :result.status==='review'
                      ?'Could not confirm'
                      :'No issue detected';

                return (
                  'Photo '+(index+1)+': '+state+
                  (result.reason
                    ?' — '+result.reason
                    :'')
                );
              });

              box.textContent=
                'Photograph scan results:\n'+
                lines.join('\n')+
                '\n\nThis is a preliminary test. '+
                'The existing upload process is unchanged.';

            }catch(error){
              if(current!==sequence)return;

              box.textContent=
                'Scanning could not finish. '+
                'Photograph selection still works normally.';
            }
          }

          function start(){
            createStatus();

            for(const id of ids){
              const input=document.getElementById(id);
              if(!input)continue;

              // Capture files before the existing uploader
              // clears its file input.
              input.addEventListener(
                'change',
                event=>{
                  const files=Array.from(
                    event.target.files||[]
                  );

                  if(files.length){
                    void inspect(files);
                  }
                },
                true
              );
            }
          }

          if(document.readyState==='loading'){
            document.addEventListener(
              'DOMContentLoaded',start,{once:true}
            );
          }else{
            start();
          }
          """.lstrip(),encoding='utf-8')

          source=page.read_text(encoding='utf-8')

          anchor=(
            '<script src="./shopdrop-product-photos.js" defer>'
            '</script>'
          )

          if source.count(anchor)!=1:
            raise SystemExit(
              'SAFETY STOP: Photograph script changed'
            )

          source=source.replace(
            anchor,
            anchor+
            '<script type="module" '+
            'src="./shopdrop-photo-scan-visible.mjs">'
            '</script>',
            1
          )

          page.write_text(
            source,encoding='utf-8'
          )

          print('PASS: Scanner connected to item form')
          print('PASS: Original uploader untouched')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail

          node --check \
            public/shopdrop-photo-scan-visible.mjs

          git diff --check

          test "$(git diff --name-only)" = "public/seller.html"
          test -f public/shopdrop-photo-scan-visible.mjs

          git add \
            public/seller.html \
            public/shopdrop-photo-scan-visible.mjs

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Fix130 show preliminary photo scanning on item form"

          git push origin HEAD:shopdrop-phase6-integration

