        NEW_INTRO='''      const heading=how.querySelector("h2");
              if(heading)heading.insertAdjacentElement("afterend",introWrap);
              else how.prepend(introWrap);'''
        OLD_FEATURED='''    if(featured){
              anchor=moveAfter(featured,anchor||categories);
            }

        '''
        NEW_FEATURED=OLD_FEATURED+'''    // Fix 198L: keep contact and policy links after all marketplace content.
            const support=document.getElementById("v26HomeExtension");
            if(contact)main.appendChild(contact);
            if(support)main.appendChild(support);

        '''
        def require(ok,msg):
         if not ok:raise SystemExit(msg)
        def blob(raw):return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
        def change(s,a,b):
         require(s.count(a)==1,'Unexpected source anchor: '+a[:90]);return s.replace(a,b,1)
        class Links(HTMLParser):
         def __init__(self,s):super().__init__();self.hrefs=[];self.feed(s)
         def handle_starttag(self,tag,attrs):
          if tag=='a':
           d=dict(attrs);h=d.get('href');
           if h:self.hrefs.append(h.removeprefix('./'))
        def scripts(s):return re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
        def transform(original):
         s=original[INDEX].decode();js=original[LAYOUT].decode();before=s
         s=change(s,HERO,NEW_HERO)
         s=change(s,OLD_EXTRA,'')
         s=change(s,STEPS,NEW_STEPS)
         s=change(s,SUPPORT,'')
         s=change(s,EXT,'')
         s=change(s,'\n</main>\n'+FOOTER,'\n'+NEW_SUPPORT+'\n</main>\n<footer id="shopdropFooter198l">Shop&amp;Drop · Marketplace transactions stay inside Shop&amp;Drop · Seller contact details remain private</footer>')
         s=change(s,'<link rel="stylesheet" href="./shopdrop-category-search-198d.css?v=198d">',CSS+'\n<link rel="stylesheet" href="./shopdrop-category-search-198d.css?v=198d">')
         s=change(s,'src="v26-homepage-layout.js?v=198j"','src="v26-homepage-layout.js?v=198l"')
         js=change(js,OLD_MOVE,'')
         js=change(js,OLD_INTRO,NEW_INTRO)
         js=change(js,OLD_FEATURED,NEW_FEATURED)
         require(set(Links(before).hrefs)==set(Links(s).hrefs),'Unique homepage destinations changed')
         require(scripts(before)==scripts(s),'Inline operational scripts changed')
         require(s.index('id="contactAdmin"')<s.index('id="v26HomeExtension"')<s.index('id="shopdropFooter198l"'),'Footer order changed')
         require(s.index('restricted-listings.html',s.index('id="v26HomeExtension"'))<s.index('admin-login.html',s.index('id="v26HomeExtension"')),'Admin link must follow policies')
         require(re.search(r'<header[\s\S]*?</header>',before).group()==re.search(r'<header[\s\S]*?</header>',s).group(),'Header changed')
         require(s.count(NEW_STEPS)==1 and s.count('id="shopdropHomeSupport198k"')==1 and s.count('id="v26HomeExtension"')==1,'Missing introduction or policy panel')
         for id in ['shopdropEmailLink','shopdropWhatsAppLink','shopdropContactNote','contactAdmin','productGrid','shopdropHomeManage198j','shopdropHomeCategoryLink197a','productsCategoriesButton','mainMenuCategories']:
          require(s.count('id="'+id+'"')==1,'Missing or duplicated id: '+id)
         return {INDEX:s.encode(),LAYOUT:js.encode()}
        def main():
         require(os.environ.get('GITHUB_REF_NAME')=='shopdrop-phase6-integration','Wrong branch')
         for path,sha in PROTECTED.items():require(blob(Path(path).read_bytes())==sha,'Protected source differs: '+path)
         original={};already={}
         for path,sha in EXPECTED.items():
          p=Path(path);b=Path('backups/fix198l')/p.name;raw=p.read_bytes()
          if b.exists():require(blob(b.read_bytes())==sha,'Backup collision: '+path)
          if blob(raw)==sha:original[path]=raw;already[path]=False
          elif b.exists():original[path]=b.read_bytes();already[path]=True
          else:raise SystemExit('Unexpected source; nothing installed: '+path)
         out=transform(original)
         for path,done in already.items():
          if done:require(Path(path).read_bytes()==out[path],'Unexpected installed source: '+path)
         subprocess.run(['node','--check','-'],input=out[LAYOUT],check=True)
         for path,raw in original.items():
          b=Path('backups/fix198l')/Path(path).name;b.parent.mkdir(parents=True,exist_ok=True)
          if not b.exists():b.write_bytes(raw)
          Path(path).write_bytes(out[path])
         for path,sha in PROTECTED.items():require(blob(Path(path).read_bytes())==sha,'Protected source changed: '+path)
         print('Fix 198L: introduction, contact position and consolidated footer; all unique link destinations and inline scripts preserved.')
        if __name__=='__main__':main()
        PYCODE
        git diff --check
        git config user.name "ShopDrop Integration"
        git config user.email "actions@users.noreply.github.com"
        git add -- public/index.html public/v26-homepage-layout.js backups/fix198l/index.html backups/fix198l/v26-homepage-layout.js
        if ! git diff --cached --quiet; then
          git commit -m "Fix 198L professional homepage introduction and footer"
          git push origin HEAD:shopdrop-phase6-integration
        fi
  deploy:
