        #help .shopdrop-tagline198l{font-size:1.1em;color:#0f766e}
        #help .shopdrop-steps198l{border-top:1px solid #dce2ea;padding-top:10px}
        #help .shopdrop-steps198l p{margin:10px 0;line-height:1.5}
        #help h3{font-size:18px;line-height:1.35;margin:16px 0 8px}
        #help .v26-shopdrop-introduction strong{color:#17202a}
        #contactAdmin{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:16px;margin:20px 0 12px;text-align:center;gap:10px}
        #contactAdmin h2,#shopdropHomeSupport198k h2{font-size:18px;line-height:1.35;text-align:center;margin:0 0 12px}
        #contactAdmin .v264Actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0;width:100%}
        #contactAdmin .v264Actions>a{display:flex;align-items:center;justify-content:center;width:100%;max-width:100%;min-height:56px;height:100%;margin:0;padding:10px 7px;border:1px solid #0f766e;border-radius:9px;background:#0f766e;color:#fff;text-decoration:none;font-size:14px;line-height:1.35;font-weight:700;white-space:normal;overflow-wrap:anywhere;gap:5px;text-align:center;box-sizing:border-box}
