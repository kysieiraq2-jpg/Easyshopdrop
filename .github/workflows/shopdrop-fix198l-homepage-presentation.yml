        @media(min-width:760px){#shopdropHomeSupport198k .support-grid198k{grid-template-columns:repeat(3,minmax(0,1fr))}#shopdropHomeSupport198k .support-grid198k>a:last-child:nth-child(odd){grid-column:auto;width:100%}}
