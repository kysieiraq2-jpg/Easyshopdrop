    - name: Verify and connect notifications
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REF_NAME\" = shopdrop-phase6-integration\npython3 <<'PYCODE'\nfrom pathlib import Path\nfrom html.parser import HTMLParser\nimport hashlib, subprocess, tempfile\nEXPECTED={'public/account.html': 'cfc1775329c75d5f6ebe4f4d367eba82d19e8cf5', 'public/shopdrop-service-appointments-193d.js': 'ec06c8d20e9f86736c9f02ef802bac18c3f4b756', 'public/shopdrop-dispatch-appointments-192dd.js': '4d9094cc7dd00a081f7642a644fe67c9dbbf186f', 'public/service-appointments-193d.html': '82215e6ae34c13371f9a453ac6fd5b9efe4c515b', 'public/dispatch-appointments-192dd.html': '0742d7e3e25b6a7be9e431d018075c0da0c4c0f8'}\nPROTECTED={'public/checkout.html': 'dd5e286a45f5210d1b2617a1ee7d734beff921c3', 'public/shopdrop-paid-confirmation-199db.js': '06b9e15e56763aca5a1f8ba46704d78c5bebf28f', 'public/shopdrop-payment-selection.js': 'de3c06e87bc2f00b18bb48016932282a3bd328c8', 'public/shopdrop-single-courier-199da.js': '8a0e194dc65f1d131b7ca9ad07eea6a32c9cb7ed', 'public/shopdrop-reference-display-199dc.js': '08c0a192ea04b0a34335a3cfd1f1b8328fb2cd50', 'public/shopdrop-buyer-language.js': 'f9251641c014c9c97dbdd33e5602f0453001dd35', 'supabase/functions/courier-quotes/index.ts': 'f6298222b285084d37b12932806c641e9efa90f9', 'supabase/functions/create-payment-session/index.ts': '1bf49f552fc38c4d17c973fae56c423b0b119bae', '.github/workflows/shopdrop-integration-pages.yml': '5ca27368c51150bdf8f19a8cba91438c66436a1f'}\nPATCHES={'public/shopdrop-service-appointments-193d.js': [(\"if(params.get('role')==='provider')role.value='provider';\", \"if(params.get('role')==='provider')role.value='provider';\\n  let notificationTargetPending199eb=params.get('from_notification')==='1';\"), (\"const provider=role.value==='provider';heading.textContent=provider?\", \"let provider=role.value==='provider';heading.textContent=provider?\"), (\"const rows=await rpc('shopdrop_service_appointments_193d',{p_as_provider:provider});\", \"let rows=await rpc('shopdrop_service_appointments_193d',{p_as_provider:provider});\"), (\"if(!Array.isArray(rows))throw Error('Invalid appointment response');\", \"if(!Array.isArray(rows))throw Error('Invalid appointment response');\\n      const notificationTarget=params.get('booking_id');\\n      if(notificationTargetPending199eb&&uuid(notificationTarget)){\\n        if(!rows.some(r=>r.booking_id===notificationTarget)){\\n          const alternate=await rpc('shopdrop_service_appointments_193d',{p_as_provider:!provider});\\n          if(!Array.isArray(alternate))throw Error('Invalid appointment response');\\n          if(alternate.some(r=>r.booking_id===notificationTarget)){provider=!provider;role.value=provider?'provider':'customer';rows=alternate;}\\n        }\\n        if(!rows.some(r=>r.booking_id===notificationTarget))notice='The linked appointment is unavailable in your account.';\\n        notificationTargetPending199eb=false;\\n        heading.textContent=provider?'Requests for My Service Advertisements':'My Service Appointments';\\n      }\"), ('const ordered=uuid(target)&&!provider?', \"const ordered=uuid(target)&&(!provider||params.get('from_notification')==='1')?\")], 'public/shopdrop-dispatch-appointments-192dd.js': [(\"if(params.get('role')==='provider') role.value='provider';\", \"if(params.get('role')==='provider') role.value='provider';\\n  let notificationTargetPending199eb=params.get('from_notification')==='1';\"), (\"try{const provider=role.value==='provider';const rows=await rpc('shopdrop_dispatch_bag_appointments_192dd',{p_as_provider:provider});if(!Array.isArray(rows))throw Error('Invalid response');\", \"try{let provider=role.value==='provider';let rows=await rpc('shopdrop_dispatch_bag_appointments_192dd',{p_as_provider:provider});if(!Array.isArray(rows))throw Error('Invalid response');\\n      const notificationTarget=params.get('booking_id');\\n      if(notificationTargetPending199eb&&typeof notificationTarget==='string'&&/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(notificationTarget)){\\n        if(!rows.some(r=>r.booking_id===notificationTarget)){\\n          const alternate=await rpc('shopdrop_dispatch_bag_appointments_192dd',{p_as_provider:!provider});\\n          if(!Array.isArray(alternate))throw Error('Invalid response');\\n          if(alternate.some(r=>r.booking_id===notificationTarget)){provider=!provider;role.value=provider?'provider':'customer';rows=alternate;}\\n        }\\n        if(!rows.some(r=>r.booking_id===notificationTarget))notice='The linked appointment is unavailable in your account.';\\n        notificationTargetPending199eb=false;\\n      }\"), (\"const target=params.get('item');const ordered=target&&!provider?[...rows].sort((a,b)=>Number(b.id===target)-Number(a.id===target)):rows;\", \"const bookingTarget=params.get('from_notification')==='1'?params.get('booking_id'):null;const target=params.get('item');const ordered=bookingTarget?[...rows].sort((a,b)=>Number(b.booking_id===bookingTarget)-Number(a.booking_id===bookingTarget)):target&&!provider?[...rows].sort((a,b)=>Number(b.id===target)-Number(a.id===target)):rows;\")], 'public/service-appointments-193d.html': [('shopdrop-service-appointments-193d.js?v=199dc', 'shopdrop-service-appointments-193d.js?v=199eb')], 'public/dispatch-appointments-192dd.html': [('shopdrop-dispatch-appointments-192dd.js?v=199dc', 'shopdrop-dispatch-appointments-192dd.js?v=199eb')]}\nACCOUNT=\"// Fix 199E-B: private account notifications, typed destinations and read receipts.\\nlet notificationGeneration199eb=0;\\nlet notificationOwner199eb=null;\\nconst notificationUuid199eb=value=>typeof value==='string'&&/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(value);\\nfunction clearNotifications199eb(){\\n notificationGeneration199eb++;\\n notificationOwner199eb=null;\\n notifications.textContent='Sign in to view your notifications.';\\n}\\nsupabase.auth.onAuthStateChange((event,session)=>{\\n if(event==='SIGNED_OUT'||(notificationOwner199eb&&session?.user?.id!==notificationOwner199eb))clearNotifications199eb();\\n});\\nfunction notificationLink199eb(item){\\n const targets=[\\n  [item.related_order_id,'Open order','./order.html?id='],\\n  [item.service_booking_id||item.booking_id,'Open service appointment','./service-appointments-193d.html?from_notification=1&booking_id='],\\n  [item.dispatch_booking_id,'Open transport appointment','./dispatch-appointments-192dd.html?from_notification=1&booking_id=']\\n ].filter(([id])=>notificationUuid199eb(id));\\n if(targets.length!==1)return null;\\n const [id,label,path]=targets[0];\\n const link=document.createElement('a');\\n link.textContent=label;link.href=path+encodeURIComponent(id);\\n return link;\\n}\\nasync function loadMyNotifications(userId){\\n const generation=++notificationGeneration199eb;\\n notificationOwner199eb=userId;\\n const current=()=>generation===notificationGeneration199eb&&notificationOwner199eb===userId;\\n notifications.textContent='Loading your notifications\u2026';\\n try{\\n  const [general,service]=await Promise.all([\\n   supabase.from('notifications')\\n    .select('id,notification_type,title,message,is_read,created_at,related_order_id,service_booking_id,dispatch_booking_id')\\n    .eq('user_id',userId).order('created_at',{ascending:false}).limit(30),\\n   supabase.from('service_notifications')\\n    .select('id,notification_type,title,message,is_read,created_at,booking_id,dispatch_booking_id')\\n    .eq('user_id',userId).order('created_at',{ascending:false}).limit(30)\\n  ]);\\n  const {data:owner,error:ownerError}=await supabase.auth.getUser();\\n  if(!current())return;\\n  if(ownerError||owner?.user?.id!==userId){clearNotifications199eb();return;}\\n  if(general.error||service.error)throw Error('Notification read failed');\\n  const entries=[\\n   ...(general.data||[]).map(item=>({...item,source199eb:'notifications'})),\\n   ...(service.data||[]).map(item=>({...item,source199eb:'service_notifications'}))\\n  ].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,50);\\n  notifications.replaceChildren();\\n  const refresh=document.createElement('button');refresh.type='button';refresh.textContent='Refresh notifications';\\n  refresh.addEventListener('click',()=>loadMyNotifications(userId));notifications.append(refresh);\\n  if(!entries.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='No notifications yet.';notifications.append(empty);return;}\\n  for(const item of entries){\\n   const article=document.createElement('div');article.className='item';\\n   const title=document.createElement('strong');title.textContent=item.title||'Shop&Drop notification';article.append(title);\\n   const unread=document.createElement('span');unread.className='muted';unread.textContent=item.is_read===false?' \xB7 Unread':' \xB7 Read';article.append(unread);\\n   const message=document.createElement('p');message.textContent=item.message||'';article.append(message);\\n   const link=notificationLink199eb(item);\\n   if(link){const line=document.createElement('p');line.append(link);article.append(line);}\\n   if(item.created_at){const stamp=document.createElement('small');stamp.className='muted';const date=new Date(item.created_at);stamp.textContent=Number.isNaN(date.getTime())?'':date.toLocaleString('en-ZA');article.append(stamp);}\\n   if(item.is_read===false&&notificationUuid199eb(item.id)){\\n    const button=document.createElement('button');button.type='button';button.textContent='Mark as read';\\n    const feedback=document.createElement('p');feedback.setAttribute('role','status');\\n    button.addEventListener('click',async()=>{\\n     if(!current()||button.disabled)return;\\n     button.disabled=true;feedback.textContent='';\\n     try{\\n      const {data:identity,error:authError}=await supabase.auth.getUser();\\n      if(!current())return;\\n      if(authError||identity?.user?.id!==userId){clearNotifications199eb();return;}\\n      const {data,error}=await supabase.from(item.source199eb).update({is_read:true,read_at:new Date().toISOString()})\\n       .eq('id',item.id).eq('user_id',userId).select('id,is_read');\\n      if(!current())return;\\n      if(error||!Array.isArray(data)||data.length!==1||data[0].id!==item.id||data[0].is_read!==true)throw Error('Read update not confirmed');\\n      unread.textContent=' \xB7 Read';button.remove();feedback.textContent='Marked as read.';\\n     }catch(_){if(current()){feedback.textContent='Could not mark as read. Try again.';button.disabled=false;}}\\n    });article.append(button,feedback);\\n   }\\n   notifications.append(article);\\n  }\\n }catch(_){\\n  if(!current())return;\\n  notifications.textContent='Unable to load notifications right now.';\\n  const retry=document.createElement('button');retry.type='button';retry.textContent='Retry';retry.addEventListener('click',()=>loadMyNotifications(userId));notifications.append(retry);\\n }\\n}\\n\"\nMIGRATION='supabase/migrations/20261127051909_shopdrop_fix199ea_notification_booking_links.sql'\nSQL=\"-- Fix 199E-A: typed booking links and duplicate-event protection.\\nALTER TABLE public.service_notifications ADD COLUMN dispatch_booking_id uuid REFERENCES public.dispatch_bookings(id) ON DELETE SET NULL;\\nALTER TABLE public.service_notifications ADD CONSTRAINT shopdrop_service_notification_one_booking_199ea CHECK (booking_id IS NULL OR dispatch_booking_id IS NULL);\\nALTER TABLE public.notifications ADD COLUMN service_booking_id uuid REFERENCES public.service_bookings(id) ON DELETE SET NULL,\\n ADD COLUMN dispatch_booking_id uuid REFERENCES public.dispatch_bookings(id) ON DELETE SET NULL;\\nALTER TABLE public.notifications ADD CONSTRAINT shopdrop_notification_one_transaction_199ea CHECK (num_nonnulls(related_order_id,service_booking_id,dispatch_booking_id)<=1);\\nCREATE INDEX shopdrop_notifications_service_booking_199ea ON public.notifications(service_booking_id) WHERE service_booking_id IS NOT NULL;\\nCREATE INDEX shopdrop_notifications_dispatch_booking_199ea ON public.notifications(dispatch_booking_id) WHERE dispatch_booking_id IS NOT NULL;\\nCREATE INDEX shopdrop_service_notifications_dispatch_booking_199ea ON public.service_notifications(dispatch_booking_id) WHERE dispatch_booking_id IS NOT NULL;\\n\\n-- Retain existing service notification storage; route transport to its own FK.\\n-- Existing public signature and service-role check remain unchanged.\\nDO $patch$\\nDECLARE\\n src text:=pg_get_functiondef('public.create_transaction_notification(uuid,text,text,text,uuid,uuid,text)'::regprocedure);\\n a text:=$a$    -- Booking/service messages use their existing table.$a$;\\n b text:=$a$            booking_id,\\n            notification_type,$a$;\\n c text:=$a$            p_booking_id,\\n            v_type,$a$;\\nBEGIN\\n IF (length(src)-length(replace(src,a,'')))/length(a)<>1 OR\\n    (length(src)-length(replace(src,b,'')))/length(b)<>1 OR\\n    (length(src)-length(replace(src,c,'')))/length(c)<>1 THEN RAISE EXCEPTION '199ea notification source changed'; END IF;\\n src:=replace(src,a,$a$    -- A supplied transaction must belong to the notification recipient.\\n    if p_order_id is not null and not exists (\\n        select 1 from public.orders o where o.id=p_order_id and p_user_id in(o.buyer_id,o.seller_id)\\n    ) then raise exception 'notification_order_recipient_mismatch' using errcode='42501'; end if;\\n    if p_booking_id is not null and v_type in ('service_booked','service_arrival_verified') and not exists (\\n        select 1 from public.service_bookings b where b.id=p_booking_id and p_user_id in(b.buyer_id,b.provider_id)\\n    ) then raise exception 'notification_service_recipient_mismatch' using errcode='42501'; end if;\\n    if p_booking_id is not null and v_type in ('dispatch_booked','dispatch_arrival_verified') and not exists (\\n        select 1 from public.dispatch_bookings b where b.id=p_booking_id and p_user_id in(b.customer_id,b.provider_id)\\n    ) then raise exception 'notification_dispatch_recipient_mismatch' using errcode='42501'; end if;\\n    -- Booking/service messages use their existing table.$a$);\\n src:=replace(src,b,$a$            booking_id,\\n            dispatch_booking_id,\\n            notification_type,$a$);\\n src:=replace(src,c,$a$            case when v_type in ('service_booked','service_arrival_verified') then p_booking_id end,\\n            case when v_type in ('dispatch_booked','dispatch_arrival_verified') then p_booking_id end,\\n            v_type,$a$);\\n EXECUTE src;\\nEND $patch$;\\n\\n-- Current 193h path: keep existing delivery/preferences/idempotency and attach\\n-- the exact booking to the in-app notification after existing ownership checks.\\nDO $patch$\\nDECLARE\\n src text:=pg_get_functiondef('shopdrop_service_193c.notify_193h(text,uuid,uuid,text,text,text,boolean)'::regprocedure);\\n a text:=$a$insert into public.notifications(user_id,notification_type,title,message) values(u,'account_notice',subject,body) returning id into n;$a$;\\nBEGIN\\n IF (length(src)-length(replace(src,a,'')))/length(a)<>1 THEN RAISE EXCEPTION '199ea 193h source changed'; END IF;\\n src:=replace(src,a,$a$insert into public.notifications(user_id,notification_type,title,message,service_booking_id,dispatch_booking_id)\\n values(u,'account_notice',subject,body,case when k='service' then b end,case when k='dispatch' then b end) returning id into n;$a$);\\n EXECUTE src;\\nEND $patch$;\\n\\n-- Check the identity of retries BEFORE returning an existing notification.\\nDO $patch$\\nDECLARE\\n src text:=pg_get_functiondef('public.process_notification_event(text,uuid,text,text,text,uuid,uuid)'::regprocedure);\\n a text:=$a$    if v_queue.status = 'processed' then$a$;\\n b text:=$a$    -- Do not allow an existing event key to be\\n    -- reused for a different recipient or event.\\n    if v_queue.recipient_id is distinct from p_recipient_id\\n       or v_queue.notification_type is distinct from p_type\\n    then\\n        raise exception 'event_key_conflict';\\n    end if;$a$;\\nBEGIN\\n IF (length(src)-length(replace(src,a,'')))/length(a)<>1 OR (length(src)-length(replace(src,b,'')))/length(b)<>1 THEN RAISE EXCEPTION '199ea event source changed'; END IF;\\n src:=replace(src,b,'');\\n src:=replace(src,a,$a$    if v_queue.recipient_id is distinct from p_recipient_id\\n       or v_queue.notification_type is distinct from p_type\\n       or v_queue.order_id is distinct from p_order_id\\n       or v_queue.booking_id is distinct from p_booking_id\\n    then raise exception 'event_key_conflict'; end if;\\n    if v_queue.status = 'processed' then$a$);\\n EXECUTE src;\\nEND $patch$;\\n\\n-- Ordinary users may mark their own notices read, not rewrite notification content.\\nREVOKE UPDATE ON public.notifications, public.service_notifications FROM authenticated;\\nGRANT UPDATE(is_read,read_at) ON public.notifications,public.service_notifications TO authenticated;\\n\"\nLEDGER='docs/SHOPDROP_FIX199E_NOTIFICATION_LEDGER.md'\nLEDGER_TEXT=\"# Fix 199E \u2014 notification connections\\n\\n- 199E-A database migration installed 2026-11-27; original SQL checksum 7fb0565ff1139223b5cefdcdc165aaaa. Rollback test passed product, service and transport links, appointment triggers, duplicate handling, mismatched-recipient rejection and update-column permissions.\\n- 199E-B: My Account reads both existing notification tables with existing owner RLS. Fixed internal destinations only; mark-as-read updates only is_read/read_at on the signed-in owner's exact row. The appointment page resolves the correct customer/provider view via its existing owner-scoped RPCs; legacy item navigation is preserved. No PIN values, addresses, bank details or contact numbers added to notifications.\\n- Live messaging unchanged. Existing Send-Notifications v14 supports Resend email and Meta WhatsApp, with worker authentication and channel enable flags. Scheduler exists. One historical email recorded sent; no WhatsApp delivery records observed. SMS is not verified. Current service appointment notification path queues email, not automatic WhatsApp for all events. Provider delivery and opt-in/template configuration still require activation and end-to-end tests.\\n- Go-Live Activation Checklist: Administrator 2 to obtain dedicated South African business SIM/phone. Confirm WhatsApp Business Platform onboarding, approved template(s), opt-in, verified phone identity, credentials, channel activation, retry/delivery reconciliation and support handling. Never send completion PINs in external messages. Do not enable anything in this fix.\\n- Payment methods (Visa/Mastercard debit and credit, EFT), settlement gates, courier provider freeze, commission, international code, PIN workflow, photo functionality and main/V26.24 FINAL remain untouched.\\n- Admin2 functional test: buyer and provider notification navigation for both booking categories, product order navigation, read persistence, sign-out, removed/unavailable booking, mobile layout; verify real external messages only after provider approval. Existing older workflow failures remain separate audit items.\\n\"\nALLOWED=['public/account.html', 'public/shopdrop-service-appointments-193d.js', 'public/shopdrop-dispatch-appointments-192dd.js', 'public/service-appointments-193d.html', 'public/dispatch-appointments-192dd.html', 'supabase/migrations/20261127051909_shopdrop_fix199ea_notification_booking_links.sql', 'docs/SHOPDROP_FIX199E_NOTIFICATION_LEDGER.md', 'backups/fix199eb/public/account.html', 'backups/fix199eb/public/shopdrop-service-appointments-193d.js', 'backups/fix199eb/public/shopdrop-dispatch-appointments-192dd.js', 'backups/fix199eb/public/service-appointments-193d.html', 'backups/fix199eb/public/dispatch-appointments-192dd.html']\ndef git_hash(path):\n    return subprocess.check_output(['git','hash-object',path],text=True).strip()\ndef check(path,sha):\n    if not Path(path).is_file() or git_hash(path)!=sha:\n        raise SystemExit('Unexpected source version: '+path)\ndef replace_once(text,old,new,path):\n