
name: ShopDrop Fix40 - Seller Photo Upload

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix40-seller-photos.yml'

permissions:
  contents: write

jobs:
  connect-seller-photos:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Apply guarded seller photo connection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          PHOTO_JS = """/* Shop&Drop Fix40 — up to six seller photos.
   Phone camera, gallery or computer.
   Secure Supabase signed uploads.
   No payment activation. */
          (() => {
            'use strict';

            const selected = [];
            const uploaded = new Map();
            let pending = null;

            const $ = id => document.getElementById(id);

            const validTypes = new Set([
              'image/jpeg',
              'image/png',
              'image/webp'
            ]);

            const maxRaw = 15 * 1024 * 1024;
            const maxPrepared = 10 * 1024 * 1024;

            function message(value) {
              const node = $('uploadStatus');
              if (node) node.textContent = value;
            }

            function render() {
              const area = $('shopdropPhotoPreview');
              if (!area) return;

              area.replaceChildren();

              selected.forEach((item, index) => {
                const tile = document.createElement('div');
                tile.style.cssText =
                  'display:inline-flex;flex-direction:column;' +
                  'align-items:center;gap:4px;margin:6px;' +
                  'padding:5px;border:1px solid #cbd5e1;' +
                  'border-radius:8px';

                const img = document.createElement('img');
                img.src = item.url;
                img.alt = 'Product photograph ' + (index + 1);
                img.style.cssText =
                  'height:80px;width:80px;object-fit:cover;' +
                  'border-radius:6px';

                const remove = document.createElement('button');
                remove.type = 'button';
                remove.textContent = 'Remove ' + (index + 1);

                remove.addEventListener('click', () => {
                  if (pending) {
                    message(
                      'Finish the current listing upload first.'
                    );
                    return;
                  }

                  URL.revokeObjectURL(item.url);
                  selected.splice(index, 1);
                  render();
                });

                tile.append(img, remove);
                area.append(tile);
              });

              message(
                selected.length +
                ' of 6 photographs selected. ' +
                'The first photo is the main image.'
              );
            }

            function selectFiles(files) {
              if (pending) {
                message(
                  'Finish uploading the pending listing first.'
                );
                return;
              }

              for (const file of files) {
                if (selected.length >= 6) {
                  render();
                  message('Maximum six photographs allowed.');
                  return;
                }

                if (
                  !validTypes.has(file.type) ||
                  !file.size ||
                  file.size > maxRaw
                ) {
                  render();
                  message(
                    'Choose JPG, PNG or WebP images ' +
                    'no larger than 15 MB each.'
                  );
                  return;
                }

                const duplicate = selected.some(x =>
                  x.file.name === file.name &&
                  x.file.size === file.size &&
                  x.file.lastModified === file.lastModified
                );

                if (duplicate) continue;

                selected.push({
                  file,
                  url: URL.createObjectURL(file)
                });
              }

              render();
            }

            function init() {
              for (const id of [
                'photo',
                'shopdropPhotoCamera'
              ]) {
                const input = $(id);

                if (
                  !input ||
                  input.dataset.shopdropPhotosReady
                ) continue;

                input.dataset.shopdropPhotosReady = 'true';

                input.addEventListener('change', () => {
                  const files = Array.from(input.files || []);
                  input.value = '';
                  selectFiles(files);
                });
              }

              render();
            }

            if (document.readyState === 'loading') {
              document.addEventListener(
                'DOMContentLoaded',
                init,
                { once: true }
              );
            } else {
              init();
            }

            async function optimize(file) {
              const url = URL.createObjectURL(file);

              try {
                const img = await new Promise(
                  (resolve, reject) => {
                    const node = new Image();

                    node.onload = () => resolve(node);
                    node.onerror = () => reject(
                      Error('Photograph cannot be opened.')
                    );
                    node.src = url;
                  }
                );

                const ratio = Math.min(
                  1,
                  1200 / img.naturalWidth,
                  1200 / img.naturalHeight
                );

                if (
                  !Number.isFinite(ratio) ||
                  ratio <= 0
                ) {
                  throw Error('Invalid photograph dimensions.');
                }

                const canvas = document.createElement('canvas');

                canvas.width = Math.max(
                  1,
                  Math.round(img.naturalWidth * ratio)
                );

                canvas.height = Math.max(
                  1,
                  Math.round(img.naturalHeight * ratio)
                );

                const ctx = canvas.getContext('2d');

                if (!ctx) {
                  throw Error(
                    'Photo preparation is unsupported.'
                  );
                }

                ctx.drawImage(
                  img,
                  0,
                  0,
                  canvas.width,
                  canvas.height
                );

                const blob = await new Promise(resolve =>
                  canvas.toBlob(
                    resolve,
                    'image/webp',
                    0.82
                  )
                );

                if (
                  !blob ||
                  blob.type !== 'image/webp' ||
                  !blob.size ||
                  blob.size > maxPrepared
                ) {
                  throw Error(
                    'Photo preparation failed. ' +
                    'Try a smaller image.'
                  );
                }

                return blob;

              } finally {
                URL.revokeObjectURL(url);
              }
            }

            function clear() {
              selected.forEach(item =>
                URL.revokeObjectURL(item.url)
              );

              selected.length = 0;
              uploaded.clear();
              pending = null;
              render();
            }

            async function attach(
              sb,
              sellerId,
              product,
              report
            ) {
              if (
                !pending ||
                pending.id !== product.id ||
                selected.length < 1 ||
                selected.length > 6
              ) {
                throw Error(
                  'Select one to six photos for this product.'
                );
              }

              const { data: current, error: readError } =
                await sb
                  .from('listing_images')
                  .select('image_position')
                  .eq('product_id', product.id);

              if (readError) {
                throw Error(
                  'Cannot check listing photos: ' +
                  readError.message
                );
              }

              const positions = new Set(
                (current || []).map(
                  x => Number(x.image_position)
                )
              );

              const reference = String(
                product.listing_reference || product.id
              )
                .replace(/[^A-Za-z0-9_-]/g, '_')
                .slice(0, 120);

              for (
                let index = 0;
                index < selected.length;
                index++
              ) {
                const pos = index + 1;

                if (positions.has(pos)) continue;

                report(
                  'Uploading photograph ' +
                  pos + ' of ' + selected.length
                );

                const source = selected[index].file;

                let item = uploaded.get(pos);

                if (!item) {
                  const blob = await optimize(source);

                  const {
                    data: ticket,
                    error: ticketError
                  } = await sb.functions.invoke(
                    'create-signed-upload',
                    {
                      body: {
                        upload_type: 'listing_image',
                        reference,
                        mime_type: 'image/webp',
                        file_size: blob.size
                      }
                    }
                  );

                  if (
                    ticketError ||
                    ticket?.ok !== true ||
                    ticket.bucket !== 'listing-images' ||
                    !ticket.path ||
                    !ticket.token ||
                    !ticket.path.startsWith(sellerId + '/')
                  ) {
                    throw Error(
                      'Secure photo upload could not be prepared.'
                    );
                  }

                  const { error: uploadError } =
                    await sb.storage
                      .from('listing-images')
                      .uploadToSignedUrl(
                        ticket.path,
                        ticket.token,
                        blob,
                        {
                          contentType: 'image/webp'
                        }
                      );

                  if (uploadError) {
                    throw Error(
                      'Photograph ' + pos +
                      ' upload failed: ' +
                      uploadError.message
                    );
                  }

                  item = {
                    path: ticket.path,
                    size: blob.size
                  };

                  uploaded.set(pos, item);
                }

                const { error: linkError } =
                  await sb
                    .from('listing_images')
                    .insert({
                      product_id: product.id,
                      image_reference:
                        'SD-IMG-' + crypto.randomUUID(),
                      storage_bucket: 'listing-images',
                      storage_path: item.path,
                      image_position: pos,
                      is_primary: pos === 1,
                      original_filename:
                        source.name.slice(0, 150),
                      mime_type: 'image/webp',
                      file_size_bytes: item.size
                    });

                if (linkError) {
                  throw Error(
                    'Photograph ' + pos +
                    ' link failed: ' +
                    linkError.message
                  );
                }

                positions.add(pos);
              }

              const {
                data: confirmed,
                error: checkError
              } = await sb
                .from('listing_images')
                .select('image_position')
                .eq('product_id', product.id);

              if (
                checkError ||
                !Array.isArray(confirmed) ||
                confirmed.length !== selected.length ||
                !selected.every(
                  (_, i) => confirmed.some(
                    row => row.image_position === i + 1
                  )
                )
              ) {
                throw Error(
                  'Photo verification incomplete. ' +
                  'Press Submit again to retry.'
                );
              }

              const count = confirmed.length;
              clear();
              return count;
            }

            window.ShopDropProductPhotos = Object.freeze({
              count: () => selected.length,
              pendingProduct: () => pending,
              setPending: product => {
                pending = product;
                uploaded.clear();
              },
              attach
            });
          })();
          """

          from pathlib import Path
          import subprocess
          import textwrap

          expected = {
              'public/seller.html':
                'bd6bb077463543cebeb4f88a169742b514407efb',
              'public/shopdrop-seller-product-supabase.js':
                '47f3b2f333bac7f58f646fb5b2226d02b812fa32',
          }

          files = {}

          for name, sha in expected.items():
              actual = subprocess.check_output(
                  ['git', 'hash-object', name],
                  text=True
              ).strip()

              if actual != sha:
                  raise SystemExit(
                      'STOP: Existing file changed: ' + name
                  )

              files[name] = Path(name).read_text(
                  encoding='utf-8'
              )

          seller = files['public/seller.html']
          bridge = files[
              'public/shopdrop-seller-product-supabase.js'
          ]

          def replace_once(value, old, new, label):
              if value.count(old) != 1:
                  raise SystemExit(
                      'STOP: Unsafe replacement: ' + label
                  )
              return value.replace(old, new, 1)

          seller = replace_once(
              seller,
              '<input id=i placeholder="Photo web link (optional — advanced)"><input id=photo type=file accept="image/jpeg,image/png,image/webp"><button class=btn onclick="uploadPhoto()">Upload product photo</button><span id=uploadStatus></span>',
              '<label class="field"><span>Select 1–6 product photos from your gallery or computer</span><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><label class="field"><span>Or take a photo with your phone camera</span><input id="shopdropPhotoCamera" type="file" accept="image/*" capture="environment"></label><p class="muted">Select more photos in additional steps if needed. Photos are automatically prepared after submission. First photo is the main image.</p><div id="shopdropPhotoPreview" aria-label="Selected product photos"></div><span id="uploadStatus" role="status" aria-live="polite"></span>',
              'seller photo inputs'
          )

          start = seller.find(
              'async function uploadPhoto(){'
          )

          end = seller.find(
              'function duplicateListing(){',
              start
          )

          if (
              start < 0 or
              end <= start or
              seller.count(
                  'async function uploadPhoto(){'
              ) != 1
          ):
              raise SystemExit(
                  'STOP: Old photo uploader not found uniquely'
              )

          old_function = seller[start:end]

          if '/api/seller/images' not in old_function:
              raise SystemExit(
                  'STOP: Unexpected old photo uploader body'
              )

          seller = (
              seller[:start] +
              'async function uploadPhoto(){uploadStatus.textContent="Select photos using the new Shop&Drop photo controls.";}' +
              seller[end:]
          )

          seller = replace_once(
              seller,
              '<script src="./shopdrop-seller-product-supabase.js" defer></script>',
              '<script src="./shopdrop-seller-product-supabase.js" defer></script><script src="./shopdrop-product-photos.js" defer></script>',
              'additive photo helper script'
          )

          old = """      const {data,error}=await sb.from('products')
        .insert(payload)
        .select(
          'id,listing_reference,listing_status'
        )
        .single();

      if(error){
        throw Error(
          'Listing could not be saved: '+
          error.message
        );
      }

      status.textContent=
        'Product saved. Reference: '+
        (data.listing_reference||data.id)+
        '. Status: '+data.listing_status+
        '. Seller asking price preserved.';"""

          new = """      // Fix40: Require 1–6 photos before saving.
      const photos=window.ShopDropProductPhotos;

      if(
        !photos ||
        photos.count()<1 ||
        photos.count()>6
      ){
        throw Error(
          'Select one to six product photographs first.'
        );
      }

      // Resume the same pending product after failed upload.
      let data=photos.pendingProduct();

      if(data){
        const {
          data:saved,
          error:resumeError
        }=await sb.from('products')
          .select('id,listing_reference,listing_status')
          .eq('id',data.id)
          .eq('seller_id',user.id)
          .single();

        if(
          resumeError ||
          !saved ||
          saved.listing_status!=='pending'
        ){
          throw Error(
            'Cannot resume this product. '+
            'Contact Shop&Drop support.'
          );
        }

        data=saved;

      }else{
        const {
          data:created,
          error
        }=await sb.from('products')
          .insert(payload)
          .select('id,listing_reference,listing_status')
          .single();

        if(error){
          throw Error(
            'Listing could not be saved: '+
            error.message
          );
        }

        data=created;
        photos.setPending(data);
      }

      let photoCount;

      try{
        photoCount=await photos.attach(
          sb,
          user.id,
          data,
          text=>{
            status.textContent=text;
          }
        );

      }catch(photoError){
        throw Error(
          'Product '+
          (data.listing_reference||data.id)+
          ' is saved pending approval, '+
          'but photos are incomplete: '+
          (photoError?.message||'upload failed')+
          '. Keep this page open and press Submit '+
          'to retry the SAME product.'
        );
      }

      status.textContent=
        'Product saved with '+photoCount+
        ' photos. Reference: '+
        (data.listing_reference||data.id)+
        '. Status: '+data.listing_status+
        '. Awaiting approval.';"""

          bridge = replace_once(
              bridge,
              old,
              new,
              'product submission and photo linking'
          )

          new_file = Path(
              'public/shopdrop-product-photos.js'
          )

          if new_file.exists():
              raise SystemExit(
                  'STOP: Photo helper already exists'
              )

          new_file.write_text(
              textwrap.dedent(PHOTO_JS),
              encoding='utf-8'
          )

          Path('public/seller.html').write_text(
              seller,
              encoding='utf-8'
          )

          Path(
              'public/shopdrop-seller-product-supabase.js'
          ).write_text(
              bridge,
              encoding='utf-8'
          )

          assert bridge.count(
              'window.add=submitProduct'
          ) == 1

          assert '/api/seller/images' not in seller

          assert 'ShopDropProductPhotos' in bridge

          assert seller.count(
              'shopdrop-product-photos.js'
          ) == 1

          assert len(bridge) > len(
              files[
                'public/shopdrop-seller-product-supabase.js'
              ]
          )

          assert len(seller) > len(
              files['public/seller.html']
          ) - 1000

          print(
              'PASS: Original GitHub files verified'
          )

          print(
              'PASS: Existing seller and service flows preserved'
          )

          print(
              'PASS: Phone camera, gallery and computer support'
          )

          print(
              'PASS: One to six signed Supabase photo uploads'
          )

          print(
              'PASS: No payment or payout activation'
          )
          PY

          node --check public/shopdrop-seller-product-supabase.js
          node --check public/shopdrop-product-photos.js

      - name: Commit photo connection
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git add public/seller.html
          git add public/shopdrop-seller-product-supabase.js
          git add public/shopdrop-product-photos.js

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Fix40 secure seller upload of up to six photographs'

          git push origin HEAD:shopdrop-phase6-integration

