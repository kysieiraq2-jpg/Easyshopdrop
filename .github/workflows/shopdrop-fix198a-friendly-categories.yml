row Error('Please choose a main category and a matching subcategory.');\n    }", "    const chosenCategory198a=$('c').value;\n    const chosenSub198a=$('subcat').value;\n    if(!departmentSubs.has(chosenCategory198a) ||\n       !(departmentSubs.get(chosenCategory198a)||[]).includes(chosenSub198a)){\n      throw Error('Please choose a main category and a matching subcategory.');\n    }\n    const [category,subcategory]=ShopDropCategory198a.storedFor(tax198a,chosenCategory198a,chosenSub198a,originalPair198a);"]], 'public/product-search-194b.html': [['<script src="./shopdrop-product-search-194b.js?v=197a" defer></script>', '<script src="./shopdrop-category-198a.js?v=198a"></script><script src="./shopdrop-product-search-194b.js?v=198a" defer></script>']], 'public/shopdrop-product-search-194b.js': [[" const HANDMADE_DEPARTMENTS=['Arts, Crafts & Handmade','Homemade Food & Pantry'];", ' let tax198a=null;'], ["  if(f.category===HANDMADE_GROUP){\n   p.set('category','in.('+HANDMADE_DEPARTMENTS.map(v=>JSON.stringify(v)).join(',')+')');\n  }else{\n   if(f.category)p.set('category','eq.'+f.category);\n   if(f.subcategory)p.set('subcategory','eq.'+f.subcategory);\n  }", '  if(f.category===HANDMADE_GROUP)ShopDropCategory198a.applyHandmade(p,tax198a);\n  else if(f.category)ShopDropCategory198a.applyCategory(p,tax198a,f.category,f.subcategory);'], ["  const term=String(f.term||'').replace(/[^\\p{L}\\p{N}\\s'-]/gu,' ').replace(/\\s+/g,' ').trim();\n  if(term)p.set('or','(title.ilike.*'+term+'*,description.ilike.*'+term+'*,category.ilike.*'+term+'*,subcategory.ilike.*'+term+'*)');", '  ShopDropCategory198a.applySearch(p,f.term);'], ['[p.category,p.subcategory,names[p.condition]||p.condition,p.location]', '[...ShopDropCategory198a.label(tax198a,p.category,p.subcategory),names[p.condition]||p.condition,p.location]'], ["get('./taxonomy.json'),get('./shopdrop-sa-towns-181.json')", "get('./taxonomy.json',{cache:'no-store'}),get('./shopdrop-sa-towns-181.json')"], ["for(const d of tax.departments)if(typeof d.name==='string'&&Array.isArray(d.subcategories))catalog.set(d.name,d.subcategories);", "tax198a=tax;for(const d of ShopDropCategory198a.publicDepartments(tax))if(typeof d.name==='string'&&Array.isArray(d.subcategories))catalog.set(d.name,d.subcategories);"], ['const handmadeAvailable=HANDMADE_DEPARTMENTS.every(name=>catalog.has(name));', "const handmadeAvailable=['Arts, Crafts & Handmade','Homemade Food & Pantry'].every(name=>tax.departments.some(d=>d.name===name));"]]}
        NEW_TAX = zlib.decompress(base64.b64decode(''))
        NEW_HELPER = zlib.decompress(base64.b64decode(''))
        HELPER = "public/shopdrop-category-198a.js"
        BACKUP = Path("backups/fix198a")
        def sha(b):
            return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
        def revise(name,raw):
            if name=='public/taxonomy.json':
                original=json.loads(raw); new=json.loads(NEW_TAX)
                old={(d['name'],s) for d in original['departments'] for s in d['subcategories']}
                compatible={(d['name'],s) for d in new['departments'] for s in d['subcategories']}
                pub={(d['name'],s) for d in new['publicDepartments'] for s in d['subcategories']}
                mapping=new['legacyMap']
                assert len(old)==320 and len(mapping)==320 and len(pub)==865 and len(new['publicDepartments'])==101
                assert old<=compatible and pub<=compatible and new['legacyDepartments']==original['departments']
                assert {tuple(r[:2]) for r in mapping}==old and all(tuple(r[2:]) in pub for r in mapping)
                assert all(tuple(r[:2]) not in pub or r[:2]==r[2:] for r in mapping)
                for d in new['publicDepartments']:
                    assert d['subcategories']==sorted(d['subcategories'],key=str.casefold)
                    assert len({s.casefold() for s in d['subcategories']})==len(d['subcategories'])
                assert [d['name'] for d in new['publicDepartments']]==sorted((d['name'] for d in new['publicDepartments']),key=str.casefold)
                assert all(c in {d['name'] for d in new['publicDepartments']} for k,v in new['related'].items() for c in [k]+v)
                return NEW_TAX
            src=raw.decode('utf-8'); updated=src
            for before,after in PATCHES[name]:
                if updated.count(before)!=1: raise SystemExit('Unexpected category anchor; no files changed: '+name+' '+repr(before[:100]))
                updated=updated.replace(before,after,1)
            restored=updated
            for before,after in reversed(PATCHES[name]):
                if restored.count(after)!=1: raise SystemExit('Unexpected reverse anchor: '+name+' '+repr(after[:100]))
                restored=restored.replace(after,before,1)
            if restored!=src: raise SystemExit('Unrelated bytes changed: '+name)
            return updated.encode('utf-8')
        def syntax(name,data):
            if name.endswith('.js'):
                subprocess.run(['node','--check','-'],input=data,check=True)
            elif name.endswith('.html'):
                for attrs,code in re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',data.decode('utf-8'),re.I):
                    if re.search(r'\bsrc\s*=',attrs,re.I) or not code.strip():continue
                    if re.search(r'type\s*=\s*["\'](?:application/json|application/ld\+json)["\']',attrs,re.I):continue
                    if 'type="module"' in attrs or "type='module'" in attrs:
                        subprocess.run(['node','--input-type=module','--check','-'],input=code.encode(),check=True)
                    else: subprocess.run(['node','--check','-'],input=code.encode(),check=True)
        def prepare():
            if os.environ.get('GITHUB_REF_NAME')!='shopdrop-phase6-integration':raise SystemExit('Wrong branch; no files changed.')
            planned={}; installed={}
            for name,expected in SHAS.items():
                path=Path(name); raw=path.read_bytes(); backup=BACKUP/path.name
                if sha(raw)==expected:
                    original=raw
                    if backup.exists() and backup.read_bytes()!=original:raise SystemExit('Unexpected backup: '+name)
                    planned[name]=(original,revise(name,original))
                elif backup.is_file() and sha(backup.read_bytes())==expected:
                    original=backup.read_bytes()
                    if raw!=revise(name,original):raise SystemExit('Unexpected installed version: '+name)
                    installed[name]=raw
                else:raise SystemExit('Unexpected source version; no files changed: '+name)
            if planned and installed:raise SystemExit('Mixed installed/source state; no changes.')
            hp=Path(HELPER)
            if hp.exists() and hp.read_bytes()!=NEW_HELPER:raise SystemExit('Helper collision; no changes.')
            if planned and hp.exists():raise SystemExit('Unexpected existing helper; no changes.')
            if installed and not hp.is_file():raise SystemExit('Installed helper missing; no changes.')
            for name,(_,updated) in planned.items():syntax(name,updated)
            for name,raw in installed.items():syntax(name,raw)
            syntax(HELPER,NEW_HELPER)
            return planned
        TESTS = "const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');\nconst data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));\nvm.runInThisContext(fs.readFileSync(process.argv[3],'utf8'));\nconst H=globalThis.ShopDropCategory198a;\nlet count=0;\nfor(const d of H.publicDepartments(data))for(const s of d.subcategories){\n assert(H.hasPair(data,d.name,s));assert(H.pairs(data,d.name,s).some(p=>p[0]===d.name&&p[1]===s));\n const q=new URLSearchParams();H.applyCategory(q,data,d.name,s);assert(q.has('category')||q.has('or'));count++;\n}\nassert.equal(count,865);\nfor(const [a,b,c,d] of data.legacyMap){\n assert.deepEqual(H.recover(data,a,b),[c,d]);\n assert.deepEqual(H.storedFor(data,c,d,[a,b]),[a,b]);\n assert(H.pairs(data,c,d).some(p=>p[0]===a&&p[1]===b));\n assert(H.pairs(data,a,b).some(p=>p[0]===a&&p[1]===b));\n}\nconst q=new URLSearchParams();H.applyCategory(q,data,'Arts & Crafts','Painting and drawing (general)');H.applySearch(q,'painting');\nassert(q.has('and'));assert(!q.has('or'));assert(q.get('and').includes('Painting & Drawing'));assert(q.get('and').includes('title.ilike.*painting*'));\nconst h=new URLSearchParams();H.applyHandmade(h,data);assert(h.get('or').includes('Arts, Crafts & Handmade'));assert(h.get('or').includes('Homemade Food & Pantry'));assert(h.get('or').includes('Homemade spice blends'));assert(!h.get('or').includes('Protein powders'));\nassert(H.expand('weed eater').includes('grass trimmer'));assert(H.expand('BBQ sauce').includes('braai sauce'));assert(H.expand('groeisout').includes('fertiliser'));assert(H.expand('e-bike battery').includes('electric bicycle battery'));\nassert(H.related(data,'Braai & Barbecue').includes('Sauces & Marinades'));\nassert.throws(()=>H.pairs(data,'invalid','invalid'));\nlet max=0;for(const d of H.publicDepartments(data)){let p=new URLSearchParams();H.applyCategory(p,data,d.name);H.applySearch(p,'weed eater');max=Math.max(max,p.toString().length);}assert(max<7500);\nconsole.log('865 public choices, 320 legacy pairs, old links, recovery, search aliases, handmade filters, related links and query size passed; largest test query:',max);\n"
        def tests():
            with tempfile.TemporaryDirectory() as directory:
                d=Path(directory);(d/'taxonomy.json').write_bytes(NEW_TAX);(d/'helper.js').write_bytes(NEW_HELPER);(d/'test.js').write_text(TESTS)
                subprocess.run(['node',str(d/'test.js'),str(d/'taxonomy.json'),str(d/'helper.js')],check=True)
        def main():
            planned=prepare();tests()
            if not planned:print('Fix 198A already installed; verified.');return
            for name,(original,updated) in planned.items():
                p=Path(name); backup=BACKUP/p.name;backup.parent.mkdir(parents=True,exist_ok=True)
                if not backup.exists():backup.write_bytes(original)
                p.write_bytes(updated)
            Path(HELPER).write_bytes(NEW_HELPER)
            print('Fix 198A installed locally; 101 public categories, 865 subcategories, all 320 legacy pairs retained.')
        if __name__=='__main__':main()
        PYCODE
