        PATCHES = {'public/index.html': [['const departments=[...data.departments].sort(', 'const departments=[...(data.publicDepartments||data.departments)].sort('], ['    item.append(links);\n    list.append(item);', "    for(const related of (data.related?.[department.name]||[])){\n     const link=document.createElement('a');\n     link.textContent='See also: '+related;\n     link.href='./categories.html?'+new URLSearchParams({category:related}).toString();\n     links.append(link);\n    }\n    item.append(links);\n    list.append(item);"], ['./v26-consolidated.js?v=26.49', './v26-consolidated.js?v=198a']], 'public/v26-consolidated.js': [['(data.departments||data.categories||[])', '(data.publicDepartments||data.departments||data.categories||[])'], ['  d.appendChild(w);host.appendChild(d);', "  for(const related of (data.related?.[c.name]||[])){const a=document.createElement('a');a.href='./categories.html?'+new URLSearchParams({category:related}).toString();a.textContent='See also: '+related;w.appendChild(a);}\n  d.appendChild(w);host.appendChild(d);"]], 'public/categories.html': [['<script src="./geo.js"></script>', '<script src="./geo.js"></script>\n<script src="./shopdrop-category-198a.js?v=198a"></script>'], ['<script src="./v26-consolidated.js"></script>', '<script src="./v26-consolidated.js?v=198a"></script>'], ['let browseFilters={view:browseView};', 'let browseFilters={view:browseView};\nlet browseTax198a=null;'], [" if(browseFilters.category){\n  params.set('category','eq.'+browseFilters.category);\n }\n if(browseFilters.subcategory){\n  params.set('subcategory','eq.'+browseFilters.subcategory);\n }", ' if(browseFilters.category)ShopDropCategory198a.applyCategory(params,browseTax198a,browseFilters.category,browseFilters.subcategory);'], [" if(browseFilters.term){\n  const safe=browseFilters.term.replace(/[(),.*%]/g,' ').trim();\n  if(safe){\n   params.set('or','(title.ilike.*'+safe+'*,description.ilike.*'+safe+'*)');\n  }\n }", ' if(browseFilters.term)Sho