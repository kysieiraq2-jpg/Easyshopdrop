        python3 <<'PYCODE'
        import subprocess
        allowed={'backups/fix198a/v26-consolidated.js', 'public/v26-consolidated.js', 'backups/fix198a/taxonomy.json', 'public/index.html', 'public/category-results.html', 'public/shopdrop-category-198a.js', 'backups/fix198a/index.html', 'public/taxonomy.json', 'backups/fix198a/category-results.html', 'backups/fix198a/sell-item.html', 'public/shopdrop-product-search-194b.js', 'backups/fix198a/shopdrop-product-search-194b.js', 'public/sell-item.html', 'public/categories.html', 'public/product-search-194b.html', 'backups/fix198a/product-search-194b.html', 'backups/fix198a/categories.html'}
