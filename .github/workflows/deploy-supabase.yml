name: ShopDrop - Manual Supabase Function Deploy

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Exact Edge Function folder name under supabase/functions'
        required: true
        type: string
      confirmation:
        description: 'Type DEPLOY to authorize this one function deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: shopdrop-manual-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
      - name: Check function folder and input
        env:
          FUNCTION_NAME: ${{ inputs.function_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$FUNCTION_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo 'Invalid Edge Function name'; exit 1
          fi
          test -f "supabase/functions/$FUNCTION_NAME/index.ts" || {
            echo 'Function source missing from integration branch'; exit 1;
          }
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy only selected Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          FUNCTION_NAME: ${{ inputs.function_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN secret'; exit 1; }
          test -n "$PROJECT_REF" || { echo 'Missing SUPABASE_PROJECT_REF secret'; exit 1; }
          supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF"
