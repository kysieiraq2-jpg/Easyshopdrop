
name: ShopDrop Fix128A - Correct Provider Prices

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix128a-provider-prices.yml'

permissions:
  contents: write

jobs:
  correct-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration

      - name: Correct provider price display
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          files = {
            "public/shopdrop-customer-service-rates.js":
              "99f1cc038bbe87449a14062b18a3816b1dc22f5d",
            "public/shopdrop-dispatch-customer-rates.js":
              "4c84e5ad461b11658528c97769daf1f360235974"
          }

          for name, expected in files.items():
            actual = subprocess.check_output(
              ["git", "hash-object", name],
              text=True
            ).strip()

            if actual != expected:
              raise SystemExit(
                "SAFETY STOP: File changed: " + name
              )

          def replace_once(source, old, new, label):
            if source.count(old) != 1:
              raise SystemExit(
                "SAFETY STOP: " + label
              )
            return source.replace(old, new, 1)

          service = Path(
            "public/shopdrop-customer-service-rates.js"
          )
          source = service.read_text(encoding="utf-8")

          old = """    const fee=cents<100000
                ?Math.round(cents*0.10)
                :Math.round(cents*0.07);

              return cents+fee;"""

          new = """    // Display provider price only.
              // Commission is added at checkout.
              return cents;"""

          source = replace_once(
            source, old, new,
            "Service price calculation changed"
          )

          source = replace_once(
            source,
            "Estimated customer total: ",
            "Service booking price: ",
            "Service price label changed"
          )

          service.write_text(
            source, encoding="utf-8"
          )

          dispatch = Path(
            "public/shopdrop-dispatch-customer-rates.js"
          )
          source = dispatch.read_text(encoding="utf-8")

          old = """    const commission=cents<100000
                ?Math.round(cents*0.10)
                :Math.round(cents*0.07);

              return cents+commission;"""

          new = """    // Display provider price only.
              // Commission is added at checkout.
              return cents;"""

          source = replace_once(
            source, old, new,
            "Dispatch price calculation changed"
          )

          source = replace_once(
            source,
            "Estimated customer price: ",
            "Dispatch service price: ",
            "Dispatch price label changed"
          )

          dispatch.write_text(
            source, encoding="utf-8"
          )

          print("PASS: Service provider prices only")
          print("PASS: Dispatch provider prices only")
          print("PASS: Existing checkout untouched")
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail

          node --check \
            public/shopdrop-customer-service-rates.js

          node --check \
            public/shopdrop-dispatch-customer-rates.js

          git diff --check

          python3 - <<'PY'
          import subprocess

          expected = {
            "public/shopdrop-customer-service-rates.js",
            "public/shopdrop-dispatch-customer-rates.js"
          }

          changed = set(
            subprocess.check_output(
              ["git", "diff", "--name-only"],
              text=True
            ).splitlines()
          )

          if changed != expected:
            raise SystemExit(
              "SAFETY STOP: Unexpected changed files"
            )

          print("PASS: Only intended files changed")
          PY

          git add \
            public/shopdrop-customer-service-rates.js \
            public/shopdrop-dispatch-customer-rates.js

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Fix128A correct provider price display"

          git push origin HEAD:shopdrop-phase6-integration
