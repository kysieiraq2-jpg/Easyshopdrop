name: ShopDrop Fix 199R Account Section Navigation
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix199r-account-section-navigation.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: shopdrop-fix199r
  cancel-in-progress: false
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
        persist-credentials: true
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Correct and verify account section navigation
      shell: bash
      run: "set -euo pipefail\npython3 <<'PYCODE'\nfrom pathlib import Path\nimport hashlib, os, subprocess, tempfile\nfrom html.parser import HTMLParser\nPATCHES = {'public/shopdrop-auth-return-199ha.js': ('005d7366e4683919b2532557f2329d23b2425e2e', [('const valid={uuid:', \"const accountSections=new Set(['orders','seller-courier-pickup-panel','shopdropPaymentPurpose195a','notifications','shopdropAccountProfile199r']);\\nconst valid={uuid:\"), ('const match=/^(?:\\\\.\\\\/)?([a-z0-9-]+\\\\.html)(?:\\\\?([^#]*))?$/.exec(raw);', 'const match=/^(?:\\\\.\\\\/)?([a-z0-9-]+\\\\.html)(?:\\\\?([^#]*))?(?:#([A-Za-z0-9-]+))?$/.exec(raw);'), (' if(!match||!Object.hasOwn(rules,match[1]))return null;', \" if(!match||!Object.hasOwn(rules,match[1]))return null;\\n if(match[3]&&(match[1]!=='account.html'||!accountSections.has(match[3])))return null;\"), (\" return './'+match[1]+(out.size?'?'+out.toString():'');\", \" return './'+match[1]+(out.size?'?'+out.toString():'')+(match[3]?'#'+match[3]:'');\"), ('function current(){return safe(page+location.search);}', \"function current(){return safe(page+location.search+(location.hash||''));}\")]), 'public/sign-in.html': ('d4fc91da67de79fcd475a7df3d2cd93dd88261d8', [('./shopdrop-auth-return-199ha.js?v=199q', './shopdrop-auth-return-199ha.js?v=199r')]), 'public/register.html': ('9fcc0dc3e9a83e9244f638a6fc97f81d66c65daf', [('./shopdrop-auth-return-199ha.js?v=199q', './shopdrop-auth-return-199ha.js?v=199r')]), 'public/account.html': ('3f72ad4d866210260353d6ef7db0fbce53acb227', [('<section class=\"panel\">\\n<h2>Account & profile</h2>', '<section class=\"panel\" id=\"shopdropAccountProfile199r\">\\n<h2>Account & profile</h2>\\n<p id=\"shopdropProfileSignIn199r\"><a href=\"./sign-in.html?next=account.html%23shopdropAccountProfile199r\">Sign in to manage your private details</a></p>'), ('<script type=\"module\" src=\"./shopdrop-private-contact.js\"></script>', '<script type=\"module\" src=\"./shopdrop-private-contact.js?v=199r\"></script>'), (\" document.getElementById('shopdropPaymentPurpose195a').hidden=false;\", \" document.getElementById('shopdropPaymentPurpose195a').hidden=false;\\n document.getElementById('shopdropProfileSignIn199r').hidden=true;\\n if(location.hash==='#shopdropPaymentPurpose195a')document.getElementById('shopdropPaymentPurpose195a').scrollIntoView();\"), ('<script defer src=\"shopdrop-seller-language.js\"></script>', '<script defer src=\"shopdrop-seller-language.js\"></script>\\n<script src=\"./shopdrop-auth-return-199ha.js?v=199r\"></script>')]), 'public/shopdrop-private-contact.js': ('7f9e89c699be3cf5c5e11e4d6abbca079a6caf80', [(\" const host=document.querySelector('main');host?.append(panel);\", \" const host=document.querySelector('main');const profileSection=document.getElementById('shopdropAccountProfile199r');\\n if(profileSection)profileSection.after(panel);else host?.append(panel);\")]), 'public/my-purchases-sales-198j.html': ('c5933120fe66bef5d56627be6c26920217480b4d', [('<a href=\"./account.html\">My Profile &amp; Account Details</a></header>', '<a href=\"./account.html#shopdropAccountProfile199r\">My Profile &amp; Account Details</a></header>'), ('<a class=\"product-menu-194a\" href=\"./account.html\">My Profile &amp; Account Details</a></section>', '<a class=\"product-menu-194a\" href=\"./account.html#shopdropAccountProfile199r\">My Profile &amp; Account Details</a></section>')])}\nTEST = \"const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');\\nconst source=fs.readFileSync(process.argv[2],'utf8');\\nfunction make(page,search='',hash=''){\\n const window={};\\n vm.runInNewContext(source,{window,location:{pathname:'/'+page,search,hash},document:{querySelectorAll:()=>[],addEventListener:()=>{}},URLSearchParams,encodeURIComponent});\\n return window.ShopDropReturn199h;\\n}\\nconst h=make('account.html');\\nfor(const section of ['orders','seller-courier-pickup-panel','shopdropPaymentPurpose195a','notifications','shopdropAccountProfile199r']){\\n const target='account.html#'+section;\\n const link=make('account.html','', '#'+section).authLink('sign-in.html');\\n assert.equal(make('sign-in.html',link.slice(link.indexOf('?'))).requested(),'./'+target);\\n const reg=make('sign-in.html',link.slice(link.indexOf('?'))).authLink('register.html');\\n assert.equal(make('register.html',reg.slice(reg.indexOf('?'))).requested(),'./'+target);\\n}\\nfor(const target of ['account.html#pin','account.html#123456','account.html#orders#extra','account.html#%6frders','https://evil.example/account.html#orders','//evil.example/account.html#orders','../account.html#orders','checkout.html#orders','admin.html#orders','javascript:alert(1)'])assert.equal(h.safe(target),null);\\nassert.equal(h.safe('account.html?pin=123456#orders'),'./account.html#orders');\\nassert.equal(h.safe('checkout.html?pin=123456'),'./checkout.html');\\nconst id='12345678-1234-1234-1234-123456789abc';\\nassert.equal(h.safe('shopdrop-provider-completion.html?booking_type=service&booking_id='+id),'./shopdrop-provider-completion.html?booking_type=service&booking_id='+id);\\nassert.equal(h.safe('returns.html?order=SD-2026-0001'),'./returns.html?order=SD-2026-0001');\\nassert.equal(h.safe('my-product-advertisements-194d.html'),'./my-product-advertisements-194d.html');\\nconsole.log('PASS: account section returns, registration handoff, fragment and external redirect restrictions; prior routes preserved.');\\n\"\nBRANCH = 'shopdrop-phase6-integration'\ndef git(*args):\n    return subprocess.check_output(['git', *map(str,args)], text=True).strip()\ndef blob(data):\n    return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\\0'+data).hexdigest()\ndef require(ok, message):\n    if not ok: raise SystemExit('SAFETY STOP: '+message)\ndef update(data, changes):\n    result=data\n    for a,b in changes:\n        a,b=a.encode(),b.encode()\n        require(result.count(a)==1,'unexpected replacement anchor count')\n        result=result.replace(a,b,1)\n    original=result\n    for a,b in reversed(changes):\n        a,b=a.encode(),b.encode()\n        require(original.count(b)==1,'unexpected reverse anchor count')\n        original=original.replace(b,a,1)\n    require(original==data,'unrelated code changed')\n    return result\nrequire(os.environ.get('GITHUB_REF_NAME')==BRANCH and git('branch','--show-current')==BRANCH,'incorrect branch')\nrequire(not git('status','--porcelain'),'dirty checkout')\noriginals={}; updates={}; backups={}\nfor path,(expected,changes) in PATCHES.items():\n    p=Path(path); b=Path('backups/fix199r')/p\n    require(p.is_file() and not p.is_symlink() and not b.is_symlink(),'unexpected path '+path)\n    backups[path]=b\n    if b.exists():\n        old=b.read_bytes()\n        require(blob(old)==expected and p.read_bytes()==update(old,changes),'partial or modified prior fix '+path)\n        originals[path]=old; updates[path]=p.read_bytes()\n    else:\n        old=p.read_bytes()\n        require(blob(old)==expected,'current source changed '+path)\n        originals[path]=old; updates[path]=update(old,changes)\nexisting=sum(p.exists() for p in backups.values())\nrequire(existing in (0,len(PATCHES)),'partial prior backup')\nclass Scripts(HTMLParser):\n    def __init__(self):\n        super().__init__(); self.scripts=[]; self.current=None\n    def handle_starttag(self,tag,attrs):\n        if tag=='script':\n            attrs=dict(attrs)\n            self.current=None if 'src' in attrs else (attrs.get('type',''),[])\n    def handle_data(self,data):\n        if self.current is not None: self.current[1].append(data)\n    def handle_endtag(self,tag):\n        if tag=='script' and self.current is not None:\n            self.scripts.append((self.current[0],''.join(self.current[1]))); self.current=None\nwith tempfile.TemporaryDirectory() as td:\n    t=Path(td)\n    for path,data in updates.items():\n        if path.endswith('.js'):\n            f=t/(Path(path).stem+('.mjs' if path.endswith('shopdrop-private-contact.js') else '.js'));f.write_bytes(data)\n            subprocess.run(['node','--check',str(f)],check=True)\n        else:\n            before=Scripts();before.feed(originals[path].decode());after=Scripts();after.feed(data.decode())\n            if path == 'public/account.html':\n                old,new=PATCHES[path][1][2]\n                restored=[(kind,code.replace(new,old)) for kind,code in after.scripts]\n                require(before.scripts==restored,'unrelated account script changed')\n            else:\n                require(before.scripts==after.scripts,'inline operational script changed '+path)\n            for i,(kind,code) in enumerate(after.scripts):\n                if kind not in ('','module','text/javascript','application/javascript'): continue\n                f=t/(Path(path).stem+str(i)+('.mjs' if kind=='module' else '.js'));f.write_text(code)\n                subprocess.run(['node','--check',str(f)],check=True)\n    test=t/'test.cjs';test.write_text(TEST)\n    subprocess.run(['node',str(test),str(t/'shopdrop-auth-return-199ha.js')],check=True)\nif existing:\n    print('Already installed; all exact backups and patched files verified.');raise SystemExit(0)\nfor path,data in updates.items():\n    b=backups[path];b.parent.mkdir(parents=True,exist_ok=True);b.write_bytes(originals[path]);Path(path).write_bytes(data)\n    require(b.read_bytes()==originals[path] and Path(path).read_bytes()==data,'write mismatch '+path)\nrequire(set(git('diff','--name-only').splitlines())==set(PATCHES),'unexpected tracked changes')\nallowed=set(PATCHES)|{str(b) for b in backups.values()}\nsubprocess.run(['git','add','--',*sorted(allowed)],check=True)\nrequire(set(git('diff','--cached','--name-only').splitlines())==allowed,'unexpected staged changes')\nrequire(not git('diff','--name-only') and not git('ls-files','--others','--exclude-standard'),'unrelated files')\nsubprocess.run(['git','diff','--cached','--check','--',*PATCHES],check=True)\nprint('PASS: exact source hashes, reversible patches, preserved unrelated inline scripts, syntax, safe auth links and exact staged paths.')\nPYCODE\nif ! git diff --cached --quiet; then\n  git config user.name 'github-actions[bot]'\n  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n  git commit -m 'Fix 199R preserve account section navigation'\n  git push origin HEAD:shopdrop-phase6-integration\nfi\n"
  deploy:
