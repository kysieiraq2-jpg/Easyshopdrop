      - name: Commit only the two corrected frontend files
        shell: bash
        run: |
          set -euo pipefail
          git add public/shopdrop-product-photos.js public/sell-item.html
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Fix43 preserve camera gallery originals and resume incomplete photo listings'
          git push origin HEAD:shopdrop-phase6-integration

      - name: Configure integrated website deployment
        uses: actions/configure-pages@v5

      - name: Upload updated integration website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy corrected integration website
        id: deployment
        uses: actions/deploy-pages@v4

