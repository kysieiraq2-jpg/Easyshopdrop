          PY
          cat > /tmp/shopdrop-fix43-photo-test.js <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('node:assert/strict');
          const elements = {};
          const createElement = tag => ({
            tagName: tag, style: {}, dataset: {}, children: [],
            append(...els) { this.children.push(...els); },
            replaceChildren(...els) { this.children = els; },
            addEventListener(event, handler) { this[event] = handler; },
          });
          for (const id of ['photo', 'shopdropPhotoCamera', 'shopdropPhotoPreview', 'uploadStatus'])
            elements[id] = createElement(id);
          const fakeDocument = {
            readyState: 'complete',
            getElementById: id => elements[id] || null,
            createElement,
          };
          const context = {
            Blob,
            URL: { createObjectURL: () => 'blob:test', revokeObjectURL:()=>{} },
            document: fakeDocument, window: {}, console, Promise,
            crypto: require('node:crypto'),
          };
          vm.runInNewContext(fs.readFileSync('public/shopdrop-product-photos.js','utf8'), context);
          const photos = context.window.ShopDropProductPhotos;
          const makeFile = (name, raw, lastModified) => ({
            name, size:raw.length, lastModified,
            arrayBuffer: async()=>Uint8Array.from(raw).buffer,
          });
          const jpeg = makeFile('camera.jpg', [255,216,255,8,1,2,3,4,5,6,7,8], 1);
          const gallery = makeFile('download-from-gallery.png', [137,80,78,71,13,10,26,10,0,0,0,0,0,0,0], 2);
          let rows = [];
          let uploaded = [];
          let n = 0;
          const sb = {
            from(table){
              assert.equal(table,'listing_images');
              return {
                select(){return { eq: async()=>({data:rows.map(x=>({image_position:x.image_position})),error:null})};},
                insert: async row => { rows.push(row); return {error:null}; },
              };
            },
            functions: {
              invoke: async (name, opts) => {
                assert.equal(name,'create-signed-upload');
                const mime=opts.body.mime_type;
                assert.equal(opts.body.upload_type,'listing_image');
                const ext = mime==='image/jpeg'?'jpg':mime==='image/png'?'png':'webp';
                return { data:{ok:true,bucket:'listing-images',path:`seller123/${opts.body.reference}/${++n}.${ext}`,token:'token'},error:null};
              }
            },
            storage:{from(bucket){
              assert.equal(bucket,'listing-images');
              return {uploadToSignedUrl: async(path,token,blob,options)=>{
                assert.equal(blob.type,options.contentType);
                uploaded.push({path,blob,contentType:options.contentType});
                return {error:null};
              }};
            }}
          };
          (async()=>{
            elements.photo.files=[jpeg,gallery];
            await elements.photo.change();
            await photos.ready();
            assert.equal(photos.count(),2,'camera and gallery photos selected');
            photos.setPending({id:'a',listing_reference:'SD-TEST'});
            let count = await photos.attach(sb,'seller123',{id:'a',listing_reference:'SD-TEST'},()=>{});
            assert.equal(count,2);
            assert.deepEqual(uploaded.map(x=>x.contentType),['image/jpeg','image/png']);
            assert.deepEqual(uploaded.map(x=>x.blob.size),[jpeg.size,gallery.size]);
            assert.equal(rows[0].is_primary,true);
            assert.equal(rows[1].image_position,2);
            // An earlier attempt already saved image 1; a newly selected gallery file is image 2.
            rows=[{image_position:1,is_primary:true,storage_path:'seller123/ref/1.webp'}];
            uploaded=[];
            photos.recover({id:'b',listing_reference:'SD-RECOVER'},1);
            elements.photo.files=[gallery];
            await elements.photo.change();
            count = await photos.attach(sb,'seller123',{id:'b',listing_reference:'SD-RECOVER'},()=>{});
            assert.equal(count,2);
            assert.equal(rows[1].image_position,2);
            assert.equal(uploaded[0].contentType,'image/png');
            // Resuming with just the already-uploaded image must also be valid.
            rows=[{image_position:1,is_primary:true}];
            photos.recover({id:'c',listing_reference:'SD-SAVED'},1);
            count = await photos.attach(sb,'seller123',{id:'c',listing_reference:'SD-SAVED'},()=>{});
            assert.equal(count,1);
            console.log('PASS: originals unchanged, two photos uploaded, recovered item extends or publishes');
          })().catch(e=>{console.error(e);process.exit(1)});
