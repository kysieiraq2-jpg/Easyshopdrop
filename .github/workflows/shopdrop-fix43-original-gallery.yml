                  data:product,''', 'save recovered edits')
          page_file.write_text(page, encoding='utf-8')
          print('PASS: Original photo bytes retained without canvas or encoding changes')
          print('PASS: Selection buffers all gallery files before picker reset')
          print('PASS: Existing incomplete item can be resumed')
