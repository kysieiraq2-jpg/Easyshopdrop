          PY
          node --check public/shopdrop-product-photos.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('public/sell-item.html').read_text(encoding='utf-8')
          match=re.search(r'<script type="module">([\s\S]*?)</script>',html)
          if not match: raise SystemExit('STOP: inline selling script missing')
          subprocess.run(['node','--input-type=module','--check'],input=match.group(1),text=True,check=True)
          js=Path('public/shopdrop-product-photos.js').read_text(encoding='utf-8')
