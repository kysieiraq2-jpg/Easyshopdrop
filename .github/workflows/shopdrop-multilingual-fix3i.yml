name: ShopDrop Multilingual Fix 3I - Form Labels
on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - .github/workflows/shopdrop-multilingual-fix3i.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true
      - name: Add form-label translations preserving all existing code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          pages=[Path('public/register.html'),Path('public/seller-apply.html'),Path('public/checkout.html')]
          for p in pages:
              if not p.is_file(): raise SystemExit('STOP missing '+str(p))
              s=p.read_text()
              if s.count('</body>')!=1 or 'shopdrop-form-language.js' in s:
                  raise SystemExit('STOP unexpected source '+str(p))
          target=Path('public/shopdrop-form-language.js')
          if target.exists(): raise SystemExit('STOP existing script')
          target.write_bytes(base64.b64decode(''))
          for p in pages:
              old=p.read_text()
              new=old.replace('</body>','<script defer src="shopdrop-form-language.js"></script></body>')
              if new.replace('<script defer src="shopdrop-form-language.js"></script>','')!=old:
                  raise SystemExit('STOP preservation check failed')
              p.write_text(new)
          PY
          git diff --check
          git add public/register.html public/seller-apply.html public/checkout.html public/shopdrop-form-language.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add multilingual form labels without changing validation or checkout'
          git push origin HEAD:shopdrop-phase6-integration
