name: ShopDrop Fix 198E Seller Category and Subcategory Search
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix198e-seller-category-search.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
    - name: Add seller category and subcategory suggestions
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REF_NAME" = shopdrop-phase6-integration
        python3 <<'PYCODE'
        from pathlib import Path
        import hashlib, os, subprocess
        SHAS={'public/sell-item.html': 'decd510df961c359cd0ca428c552732b8e185708'}
        TAX_SHA="43d0163d8238ebaabdba04b919c75e3c8b696191"
        PATCHES={'public/sell-item.html': [('<link rel="stylesheet" href="./shopdrop-payment-purpose-195a.css?v=195a">\n</head>', '<link rel="stylesheet" href="./shopdrop-payment-purpose-195a.css?v=195a">\n<link rel="stylesheet" href="./shopdrop-seller-category-198e.css?v=198e">\n</head>'), ('<input id="p" type="number" min="1" step="0.01" inputmode="decimal" required placeholder="e.g. 450">\n\n<label for="c">Category</label>\n<select id="c" required>\n\n</select>\n<label for="subcat">Subcategory</label>\n<select id="subcat" required disabled>\n\n</select>\n\n<label for="condition">Condition</label>', '<input id="p" type="number" min="1" step="0.01" inputmode="decimal" required placeholder="e.g. 450">\n\n<label for="condition">Condition</label>'), ('<input id="n" maxlength="150" minlength="2" required placeholder="e.g. Wooden coffee table">\n\n', '<input id="n" maxlength="150" minlength="2" required placeholder="e.g. Wooden coffee table">\n\n<div class="shopdrop-seller-search198e">\n<label for="shopdropSellerCategory198eInput">Find your main category</label>\n<div class="search-row198e">\n<input type="search" id="shopdropSellerCategory198eInput" placeholder="Type the first letters, e.g. Baby" maxlength="100" autocomplete="off" enterkeyhint="done" aria-controls="shopdropSellerCategory198eResults" aria-describedby="shopdropSellerCategory198eStatus">\n<button type="button" id="shopdropSellerCategory198eClear" hidden>Clear</button>\n</div>\n<p id="shopdropSellerCategory198eStatus" role="status" aria-live="polite"></p>\n<div class="search-results198e" id="shopdropSellerCategory198eResults" hidden></div>\n</div>\n<label for="c">Category</label>\n<select id="c" required>\n\n</select>\n<div class="shopdrop-seller-search198e">\n<label for="shopdropSellerSubcategory198eInput">Find your subcategory</label>\n<div class="search-row198e">\n<input type="search" id="shopdropSellerSubcategory198eInput" placeholder="Type the first letters, e.g. Pram" maxlength="100" autocomplete="off" enterkeyhint="done" aria-controls="shopdropSellerSubcategory198eResults" aria-describedby="shopdropSellerSubcategory198eStatus" disabled>\n<button type="button" id="shopdropSellerSubcategory198eClear" hidden>Clear</button>\n</div>\n<p id="shopdropSellerSubcategory198eStatus" role="status" aria-live="polite"></p>\n<div class="search-results198e" id="shopdropSellerSubcategory198eResults" hidden></div>\n</div>\n<label for="subcat">Subcategory</label>\n<select id="subcat" required disabled>\n\n</select>\n\n'), ('<script src="./shopdrop-category-198a.js?v=198a"></script>\n<script type="module">', '<script src="./shopdrop-category-198a.js?v=198a"></script>\n<script src="./shopdrop-seller-category-198e.js?v=198e"></script>\n<script type="module">'), ('let tax198a=null,originalPair198a=null;', 'let tax198a=null,originalPair198a=null;\nlet categoryAssist198e=null;'), ('    fillSubcategories(choice[1]);', '    fillSubcategories(choice[1]);\n    categoryAssist198e?.reset();'), ('    fillSubcategories();\n    if(user)await loadUnfinished(user);', '    fillSubcategories();\n    categoryAssist198e=window.ShopDropSellerCategory198e?.bind(departmentSubs);\n    if(user)await loadUnfinished(user);')]}
        NEWFILES={'public/shopdrop-seller-category-198e.js': "/* Fix 198E: suggestions only. The seller must confirm the actual category and subcategory. */\n(function(root){\n 'use strict';\n const normal=v=>String(v||'').normalize('NFKC').trim().toLocaleLowerCase('en-ZA').replace(/\\s+/g,' ');\n const words=v=>normal(v).match(/[\\p{L}\\p{N}]+/gu)||[];\n const ignored=new Set(['a','an','the','new','used','second','hand','secondhand','homemade','handmade','in','good','great','excellent','condition','for','sale','with','and','very','like','of']);\n const prefix=(names,q)=>names.filter(n=>normal(n).startsWith(normal(q)));\n function titleMatches(catalog,value){\n  const q=normal(value);if(!q)return [];\n  const direct=prefix([...catalog.keys()],q);\n  if(direct.length||q.length<=2)return direct;\n  const tokens=words(q).filter(w=>!ignored.has(w)&&w.length>=2);if(!tokens.length)return [];\n  const ranked=[];\n  for(const [category,subs] of catalog){\n   const base=words(category);\n   let best=0;\n   for(const sub of ['',...subs]){\n    const terms=base.concat(words(sub));\n    const score=tokens.filter(t=>terms.some(w=>w.startsWith(t))).length;\n    best=Math.max(best,score);\n   }\n   if(best)ranked.push([category,best]);\n  }\n  const max=Math.max(0,...ranked.map(r=>r[1]));\n  return ranked.filter(r=>r[1]===max).map(r=>r[0]);\n }\n function bind(catalog){\n  const el=id=>document.getElementById(id);\n  const title=el('n'),category=el('c'),sub=el('subcat');\n  const catInput=el('shopdropSellerCategory198eInput'),subInput=el('shopdropSellerSubcategory198eInput');\n  const catResults=el('shopdropSellerCategory198eResults'),subResults=el('shopdropSellerSubcategory198eResults');\n  const catStatus=el('shopdropSellerCategory198eStatus'),subStatus=el('shopdropSellerSubcategory198eStatus');\n  const catClear=el('shopdropSellerCategory198eClear'),subClear=el('shopdropSellerSubcategory198eClear');\n  if(![title,category,sub,catInput,subInput,catResults,subResults,catStatus,subStatus,catClear,subClear].every(Boolean))return {reset(){}};\n  let showTitle=false;\n  function draw(host,status,values,active,choose){\n   host.replaceChildren();host.hidden=!active||!values.length;\n   status.textContent=!active?'':values.length?`${values.length} matching ${host===catResults?'categories':'subcategories'}. Tap one to select.`:'No matches. Try another letter or use the full dropdown.';\n   if(!active)return;\n   for(const name of values){const b=document.createElement('button');b.type='button';b.textContent=name;b.addEventListener('click',()=>choose(name));host.append(b);}\n  }\n  function renderCat(){\n   const typed=normal(catInput.value),fromTitle=showTitle&&normal(title.value);\n   catClear.hidden=!catInput.value&&!showTitle;\n   const values=typed?prefix([...catalog.keys()],typed):fromTitle?titleMatches(catalog,title.value):[];\n   draw(catResults,catStatus,values,Boolean(typed||fromTitle),name=>{\n    if(category.value!==name){category.value=name;category.dispatchEvent(new Event('change',{bubbles:true}));}\n    catInput.value='';showTitle=false;renderCat();subInput.focus();\n   });\n  }\n  function renderSub(){\n   const available=catalog.get(category.value)||[];\n   subInput.disabled=!available.length;subClear.hidden=!subInput.value;\n   const q=normal(subInput.value);\n   draw(subResults,subStatus,prefix(available,q),Boolean(q&&available.length),name=>{\n    if(!available.includes(name))return;\n    sub.value=name;sub.dispatchEvent(new Event('change',{bubbles:true}));subInput.value='';renderSub();sub.focus();\n   });\n  }\n  function reset(){showTitle=false;catInput.value='';subInput.value='';renderCat();renderSub();}\n  title.addEventListener('input',()=>{showTitle=true;renderCat();});\n  catInput.addEventListener('input',()=>{showTitle=false;renderCat();});\n  subInput.addEventListener('input',renderSub);\n  for(const input of [catInput,subInput]){input.addEventListener('search',()=>input===catInput?renderCat():renderSub());input.addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault();});}\n  catClear.addEventListener('click',()=>{catInput.value='';showTitle=false;renderCat();catInput.focus();});\n  subClear.addEventListener('click',()=>{subInput.value='';renderSub();subInput.focus();});\n  category.addEventListener('change',reset);\n  sub.addEventListener('change',()=>{subInput.value='';renderSub();});\n  // No changes to the real selects until a seller explicitly selects a suggestion.\n  reset();return {reset};\n }\n root.ShopDropSellerCategory198e=Object.freeze({bind,titleMatches,prefix});\n})(globalThis);\n", 'public/shopdrop-seller-category-198e.css': '/* Fix 198E: isolated seller category search. */\n.shopdrop-seller-search198e{margin:10px 0 8px;min-width:0}\n.shopdrop-seller-search198e .search-row198e{display:flex;align-items:stretch;gap:6px;min-width:0}\n.shopdrop-seller-search198e input{flex:1;min-width:0;width:100%;font-size:16px;min-height:44px}\n.shopdrop-seller-search198e .search-row198e button{flex:0 0 auto;width:auto;margin:0;color:#0f766e;background:#fff;border:1px solid #94a3b8;min-height:44px}\n.shopdrop-seller-search198e .search-results198e{max-height:260px;overflow:auto;border:1px solid #cbd5e1;border-radius:7px;margin:5px 0;background:#fff}\n.shopdrop-seller-search198e .search-results198e button{display:block;width:100%;margin:0;padding:11px 10px;min-height:44px;text-align:left;background:#fff;color:#17202a;border-radius:0;border-bottom:1px solid #e2e8f0;font-weight:500;overflow-wrap:anywhere}\n.shopdrop-seller-search198e .search-results198e button:hover{background:#ecfdf5}\n.shopdrop-seller-search198e [hidden]{display:none!important}\n.shopdrop-seller-search198e p{font-size:14px;color:#526273;margin:5px 0}\n.shopdrop-seller-search198e p:empty{display:none}\n'}
        def blob(raw):
            return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
        def revise(raw,name):
            revised=raw
            for old,new in PATCHES[name]:
                old,new=old.encode(),new.encode()
                if revised.count(old)!=1 or new in revised:raise SystemExit('Unexpected source anchor: '+name)
                revised=revised.replace(old,new,1)
            restored=revised
            for old,new in reversed(PATCHES[name]):
                if restored.count(new.encode())!=1:raise SystemExit('Unexpected replacement: '+name)
                restored=restored.replace(new.encode(),old.encode(),1)
            if restored!=raw:raise SystemExit('Unapproved source change: '+name)
            return revised
        def main():
            if os.environ.get('GITHUB_REF_NAME')!='shopdrop-phase6-integration':raise SystemExit('Wrong branch')
            if blob(Path('public/taxonomy.json').read_bytes())!=TAX_SHA:raise SystemExit('Taxonomy changed; nothing installed')
            plans=[]; installed=0
            for name,expected in SHAS.items():
                p=Path(name);b=Path('backups/fix198e')/p.name;raw=p.read_bytes()
                if blob(raw)==expected:
                    if b.exists() and b.read_bytes()!=raw:raise SystemExit('Backup collision: '+name)
                    plans.append((p,b,raw,revise(raw,name)))
                elif b.is_file() and blob(b.read_bytes())==expected and raw==revise(b.read_bytes(),name):installed+=1
                else:raise SystemExit('Unexpected source version; nothing installed: '+name)
            if installed not in (0,len(SHAS)):raise SystemExit('Partial installation; nothing changed')
            for name,source in NEWFILES.items():
                p=Path(name)
                if installed:
                    if not p.is_file() or p.read_bytes()!=source.encode():raise SystemExit('Installed helper differs: '+name)
                elif p.exists():raise SystemExit('New file collision: '+name)
                if name.endswith('.js'):subprocess.run(['node','--check','-'],input=source.encode(),check=True)
            import re
            for p,b,raw,revised in plans:
                for block in re.findall(rb'<script type="module">([\s\S]*?)</script>',revised):
                    subprocess.run(['node','--input-type=module','--check','-'],input=block,check=True)
            if installed:
                print('Fix 198E already installed; verified.');return
            for p,b,raw,revised in plans:
                b.parent.mkdir(parents=True,exist_ok=True)
                if not b.exists():b.write_bytes(raw)
                p.write_bytes(revised)
            for name,source in NEWFILES.items():Path(name).write_bytes(source.encode())
            print('Fix 198E: seller category and subcategory assistance; submission and taxonomy preserved.')
        if __name__=='__main__':main()
        PYCODE
        git diff --check
        git config user.name "ShopDrop Integration"
        git config user.email "actions@users.noreply.github.com"
        git add -- public/sell-item.html public/shopdrop-seller-category-198e.js public/shopdrop-seller-category-198e.css backups/fix198e/sell-item.html
        if ! git diff --cached --quiet; then
          git commit -m "Fix 198E seller category and subcategory search"
          git push origin HEAD:shopdrop-phase6-integration
        fi
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
