
name: ShopDrop Fix134 - Scanner Repair V3

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix134-scanner-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration

      - name: Repair independent photo checks
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected={
            'public/shopdrop-free-photo-screen.mjs':
              '81b12f2db4f5017fdce251adf7b3c0125032b7b8',
            'public/shopdrop-product-photos.js':
              '8ed1f80f67814b9ffdc78ec827ea9293ad5ce7ea'
          }

          for name,sha in expected.items():
            actual=subprocess.check_output(
              ['git','hash-object',name],
              text=True
            ).strip()

            if actual!=sha:
              raise SystemExit(
                'SAFETY STOP: File changed: '+name
              )

          path=Path(
            'public/shopdrop-free-photo-screen.mjs'
          )
          source=path.read_text(encoding='utf-8')

          start='      const [ocr, barcode] ='
          end='      results.push({'

          if source.count(start)!=1:
            raise SystemExit(
              'SAFETY STOP: Scan start changed'
            )

          a=source.index(start)
          b=source.find(end,a)

          if b<0 or b<=a:
            raise SystemExit(
              'SAFETY STOP: Scan result missing'
            )

          replacement="""      const [ocrCheck,barcodeCheck] =
                await Promise.allSettled([
                  getOCRWorker().then(worker =>
                    worker.recognize(file)
                  ),
                  detectBarcode(file)
                ]);

              let decision;

              if(
                barcodeCheck.status==='fulfilled' &&
                barcodeCheck.value===true
              ){
                decision={
                  status:'reject',
                  reason:'QR code or barcode detected'
                };
              }else if(
                ocrCheck.status==='fulfilled'
              ){
                const textDecision=inspectText(
                  ocrCheck.value?.data?.text
                );

                if(textDecision.status==='reject'){
                  decision=textDecision;
                }else if(
                  barcodeCheck.status==='rejected'
                ){
                  decision={
                    status:'review',
                    reason:
                      'Text check completed. '+
                      'Barcode check unavailable: '+
                      String(
                        barcodeCheck.reason?.name||
                        'Unknown error'
                      ).slice(0,80)
                  };
                }else{
                  decision=textDecision;
                }
              }else{
                decision={
                  status:'review',
                  reason:
                    'Text recognition unavailable: '+
                    String(
                      ocrCheck.reason?.name||
                      'Unknown error'
                    ).slice(0,80)+
                    (
                      barcodeCheck.status==='rejected'
                        ?'. Barcode recognition unavailable: '+
                          String(
                            barcodeCheck.reason?.name||
                            'Unknown error'
                          ).slice(0,80)
                        :'. Barcode check completed.'
                    )
                };
              }

          """

          source=source[:a]+replacement+source[b:]

          old="'Scanning unavailable or inconclusive'"

          if source.count(old)!=1:
            raise SystemExit(
              'SAFETY STOP: Error message changed'
            )

          source=source.replace(
            old,
            "'Scanner error: '+String(error?.name||'Unknown error').slice(0,80)",
            1
          )

          path.write_text(
            source,encoding='utf-8'
          )

          print('PASS: Independent scanner checks installed')
          print('PASS: Detailed error reporting installed')
          print('PASS: Product uploader unchanged')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail

          node --check \
            public/shopdrop-free-photo-screen.mjs

          git diff --check

          test "$(git diff --name-only)" = \
            "public/shopdrop-free-photo-screen.mjs"

          git add \
            public/shopdrop-free-photo-screen.mjs

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Fix134 independently report photo scan results"

          git push origin HEAD:shopdrop-phase6-integration
