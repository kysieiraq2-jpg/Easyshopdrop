
name: ShopDrop Fix 188B - Automatic Deployment Repair

'on':
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix188b-deployment-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Preserve and repair integration deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Backup and extend existing deployment
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path(
              ".github/workflows/"
              "shopdrop-integration-pages.yml"
          )

          backup = Path(
              "backups/fix188b/"
              "integration-pages-before-188b.yml"
          )

          expected_sha = (
              "314083e37bc25148257cb8d8c867de0f7831d313"
          )

          actual_sha = subprocess.check_output(
              ["git", "hash-object", str(workflow)],
              text=True
          ).strip()

          if actual_sha != expected_sha:
              raise SystemExit(
                  "SAFETY STOP: Deployment workflow changed."
              )

          original = workflow.read_bytes()
          source = original.decode("utf-8")

          if backup.exists():
              raise SystemExit(
                  "SAFETY STOP: Backup already exists."
              )

          anchor = (
              "      - name: Deploy integrated website\n"
          )

          if source.count(anchor) != 1:
              raise SystemExit(
                  "SAFETY STOP: Deployment step mismatch."
              )

          addition = r"""
          - name: Allow website artifact registration
            shell: bash
            env:
              ARTIFACT_ID: __ARTIFACT_EXPRESSION__
            run: |
              set -euo pipefail

              if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
              then
                echo "::error::Missing website artifact ID."
                exit 1
              fi

              echo "Uploaded artifact ID: $ARTIFACT_ID"
              echo "Waiting for GitHub artifact registration."
              sleep 60
              echo "Artifact registration waiting period completed."
          """

          expression = (
              "$" + "{{ "
              + "steps.website_artifact.outputs.artifact_id"
              + " }}"
          )

          addition = addition.replace(
              "__ARTIFACT_EXPRESSION__",
              expression
          )

          addition = textwrap.dedent(
              addition
          ).strip("\n")

          addition = textwrap.indent(
              addition, "      "
          ) + "\n\n"

          updated = source.replace(
              anchor,
              addition + anchor,
              1
          )

          if updated.replace(addition, "", 1) != source:
              raise SystemExit(
                  "SAFETY STOP: Original code not preserved."
              )

          if expression not in addition:
              raise SystemExit(
                  "SAFETY STOP: Artifact expression missing."
              )

          if any(
              line != line.rstrip()
              for line in addition.splitlines()
          ):
              raise SystemExit(
                  "SAFETY STOP: Trailing whitespace."
              )

          backup.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          backup.write_bytes(original)

          if backup.read_bytes() != original:
              raise SystemExit(
                  "SAFETY STOP: Backup failed."
              )

          workflow.write_bytes(
              updated.encode("utf-8")
          )

          print("PASS: Complete deployment backup")
          print("PASS: Existing deployment code preserved")
          print("PASS: Automatic triggers preserved")
          print("PASS: Artifact expression preserved")
          print("PASS: Artifact registration delay added")
          print("PASS: Website source unchanged")
          PY

          git diff --check

      - name: Commit deployment repair
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ShopDrop Fix Bot"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/shopdrop-integration-pages.yml \
            backups/fix188b/integration-pages-before-188b.yml

          git commit -m \
            "Fix 188B preserve deployment and allow artifact registration"

          git push origin \
            HEAD:shopdrop-phase6-integration

          echo "PASS: Deployment repair committed"
