rt.equal(x.safe(input),null);\nassert.equal(x.safe('order.html?id=one&id=two'),'./order.html');assert.equal(x.safe('order.html?id=SD-ORD-100&redirect=https://evil.test'),'./order.html?id=SD-ORD-100');assert.equal(x.safe('service-checkout-193e.html?booking_id=bad'),'./service-checkout-193e.html');\nconst link=make('service-checkout-193e.html','?booking_id='+id).authLink('sign-in.html');const next=make('sign-in.html',link.slice(link.indexOf('?'))).requested();assert.equal(next,'./service-checkout-193e.html?booking_id='+id);assert.equal(make('sign-in.html',link.slice(link.indexOf('?'))).authLink('register.html'),'./register.html'+link.slice(link.indexOf('?')));\nconsole.log('PASS: 14 allowed routes and redirect/security checks');"
