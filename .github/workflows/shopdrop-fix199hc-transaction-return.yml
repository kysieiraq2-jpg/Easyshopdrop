        def gitsha(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
        def require(ok,msg):
         if not ok:raise SystemExit(msg)
        def transform(p,raw):
         s=raw.decode('utf-8')
         for a,b in PATCHES[p]:
          require(s.count(a)==1,'Unexpected patch anchor: '+p);s=s.replace(a,b,1)
         return s.encode('utf-8')
        class Inline(HTMLParser):
         def __init__(self):super().__init__();self.current=None;self.scripts=[]
         def handle_starttag(self,tag,attrs):
          if tag=='script' and 'src' not in dict(attrs):self.current=''
         def handle_data(self,d):
          if self.current is not None:self.current+=d
         def handle_endtag(self,tag):
          if tag=='script' and self.current is not None:self.scripts.append(self.current);self.current=None
        def check_js(s):
         with tempfile.TemporaryDirectory() as t:
