name: ShopDrop Fix 199M Product Checkout Auth Return
'on':
  push:
    branches: [shopdrop-phase6-integration]
    paths: [.github/workflows/shopdrop-fix199m-product-checkout-auth-return.yml]
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: shopdrop-fix199m
  cancel-in-progress: false
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct and verify product checkout sign-in return
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYCODE'
          from pathlib import Path
          import hashlib, os, subprocess, tempfile
          from html.parser import HTMLParser
          PATCHES = {'public/shopdrop-auth-return-199ha.js': ('db343df30679d06b103e960b41069defc5e0ef1b', [(" 'account.html':{},", " 'account.html':{},\n 'checkout.html':{},")]), 'public/checkout.html': ('dd5e286a45f5210d1b2617a1ee7d734beff921c3', [('<script src="./shopdrop-cart-address-bridge.js?v=199da"></script>', '<script src="./shopdrop-auth-return-199ha.js?v=199m"></script><script src="./shopdrop-cart-address-bridge.js?v=199m"></script>')]), 'public/sign-in.html': ('4a9f430f965133813c2ee3ad16d5f4f492edeeb6', [('./shopdrop-auth-return-199ha.js?v=199hc', './shopdrop-auth-return-199ha.js?v=199m')]), 'public/register.html': ('2d00dd735f74f88ba45de4566776d56f39134c87', [('./shopdrop-auth-return-199ha.js?v=199hc', './shopdrop-auth-return-199ha.js?v=199m')]), 'public/shopdrop-cart-address-bridge.js': ('0e9c601006e226ef91e64020de70284567a9590f', [("  const say = message => { $('orderStatus').textContent = message; };", "  const say = (message, error) => {\n    const status = $('orderStatus');\n    status.textContent = message;\n    if (!error?.needsSignIn) return;\n    for (const [page, label] of [['sign-in.html','Sign in'],['register.html','Create account']]) {\n      const link = document.createElement('a');\n      link.href = window.ShopDropReturn199h?.authLink(page) || './'+page+'?next=checkout.html';\n      link.textContent = label;\n      status.append(document.createTextNode(' '),link);\n    }\n  };"), ("throw new Error('Sign in to view your shopping bag and addresses.');", "throw Object.assign(new Error('Sign in to view your shopping bag and addresses.'),{needsSignIn:true});"), ("say('Cannot load cart/addresses: '+e.message);", "say('Cannot load cart/addresses: '+e.message,e);"), ("say('Cart update failed: '+e.message);", "say('Cart update failed: '+e.message,e);"), ("say('Address save failed: '+e.message);", "say('Address save failed: '+e.message,e);"), ("'Order creation failed: '+(msg||'Please try again.'));", "'Order creation failed: '+(msg||'Please try again.'),e);")])}
          TEST = "const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');\nconst source=fs.readFileSync(process.argv[2],'utf8');\nfunction make(page,search=''){\n  const window={};\n  vm.runInNewContext(source,{window,location:{pathname:'/'+page,search},document:{querySelectorAll:()=>[],addEventListener:()=>{}},URLSearchParams,encodeURIComponent});\n  return window.ShopDropReturn199h;\n}\nconst h=make('checkout.html','?ignored=secret');\nassert.equal(h.authLink('sign-in.html'),'./sign-in.html?next=checkout.html');\nassert.equal(h.authLink('register.html'),'./register.html?next=checkout.html');\nassert.equal(make('sign-in.html','?next=checkout.html').requested(),'./checkout.html');\nassert.equal(make('register.html','?next=checkout.html').authLink('sign-in.html'),'./sign-in.html?next=checkout.html');\nassert.equal(h.safe('checkout.html?redirect=https://evil.example'),'./checkout.html');\nfor(const s of ['https://evil.example/checkout.html','//evil.example','../checkout.html','checkout.html#x','admin.html','javascript:alert(1)','checkout.html/../admin.html'])assert.equal(h.safe(s),null);\nconst id='12345678-1234-1234-1234-123456789abc';\nassert.equal(h.safe('service-checkout-193e.html?booking_id='+id),'./service-checkout-193e.html?booking_id='+id);\nassert.equal(h.safe('dispatch-appointments-192dd.html?role=provider&booking_id='+id),'./dispatch-appointments-192dd.html?role=provider&booking_id='+id);\nconst status={textContent:'',children:[],append(...v){this.children.push(...v);}};\nconst context={$:()=>status,window:{ShopDropReturn199h:h},document:{createElement:()=>({}),createTextNode:s=>s}};\nvm.runInNewContext(fs.readFileSync(process.argv[3],'utf8')+'\\nthis.say=say;',context);\ncontext.say('authentication required',{needsSignIn:true});\nassert.equal(status.children[1].href,'./sign-in.html?next=checkout.html');\nassert.equal(status.children[3].href,'./register.html?next=checkout.html');\nstatus.children=[];context.say('network failure',{});assert.equal(status.children.length,0);\ncontext.window.ShopDropReturn199h=undefined;context.say('authentication required',{needsSignIn:true});assert.equal(status.children[1].href,'./sign-in.html?next=checkout.html');\nconsole.log('PASS: safe checkout authentication return, registration link, existing booking references, external URL rejection, auth-only links and fallback.');\n"
          NEW_SAY = "  const say = (message, error) => {\n    const status = $('orderStatus');\n    status.textContent = message;\n    if (!error?.needsSignIn) return;\n    for (const [page, label] of [['sign-in.html','Sign in'],['register.html','Create account']]) {\n      const link = document.createElement('a');\n      link.href = window.ShopDropReturn199h?.authLink(page) || './'+page+'?next=checkout.html';\n      link.textContent = label;\n      status.append(document.createTextNode(' '),link);\n    }\n  };"
          BRANCH = 'shopdrop-phase6-integration'
          def git(*args):
              return subprocess.check_output(['git', *map(str,args)], text=True).strip()
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def require(ok, message):
              if not ok: raise SystemExit('SAFETY STOP: '+message)
          def update(data, changes):
              result=data
              for a,b in changes:
                  a,b=a.encode(),b.encode()
                  require(result.count(a)==1,'unexpected replacement anchor count')
                  result=result.replace(a,b,1)
              original=result
              for a,b in reversed(changes):
                  a,b=a.encode(),b.encode()
                  require(original.count(b)==1,'unexpected reverse anchor count')
                  original=original.replace(b,a,1)
              require(original==data,'unrelated code changed')
              return result
          require(os.environ.get('GITHUB_REF_NAME')==BRANCH and git('branch','--show-current')==BRANCH,'incorrect branch')
          require(not git('status','--porcelain'),'dirty checkout')
          originals={}; updates={}; backups={}
          for path,(expected,changes) in PATCHES.items():
              p=Path(path); b=Path('backups/fix199m')/p
              require(p.is_file() and not p.is_symlink() and not b.is_symlink(),'unexpected path '+path)
              backups[path]=b
              if b.exists():
                  old=b.read_bytes()
                  require(blob(old)==expected and p.read_bytes()==update(old,changes),'partial or modified prior fix '+path)
                  originals[path]=old; updates[path]=p.read_bytes()
              else:
                  old=p.read_bytes()
                  require(blob(old)==expected,'current source changed '+path)
                  originals[path]=old; updates[path]=update(old,changes)
          existing=sum(p.exists() for p in backups.values())
          require(existing in (0,len(PATCHES)),'partial prior backup')
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]; self.current=None
              def handle_starttag(self,tag,attrs):
                  if tag=='script':
                      attrs=dict(attrs)
                      self.current=None if 'src' in attrs else (attrs.get('type',''),[])
              def handle_data(self,data):
                  if self.current is not None: self.current[1].append(data)
              def handle_endtag(self,tag):
                  if tag=='script' and self.current is not None:
                      self.scripts.append((self.current[0],''.join(self.current[1]))); self.current=None
          with tempfile.TemporaryDirectory() as td:
              t=Path(td)
              for path,data in updates.items():
                  if path.endswith('.js'):
                      f=t/Path(path).name;f.write_bytes(data)
                      subprocess.run(['node','--check',str(f)],check=True)
                  else:
                      before=Scripts();before.feed(originals[path].decode());after=Scripts();after.feed(data.decode())
                      require(before.scripts==after.scripts,'inline operational script changed '+path)
                      for i,(kind,code) in enumerate(after.scripts):
                          if kind not in ('','module','text/javascript','application/javascript'): continue
                          f=t/(Path(path).stem+str(i)+('.mjs' if kind=='module' else '.js'));f.write_text(code)
                          subprocess.run(['node','--check',str(f)],check=True)
              test=t/'test.cjs';test.write_text(TEST)
              say=t/'say.js';say.write_text(NEW_SAY)
              subprocess.run(['node',str(test),str(t/'shopdrop-auth-return-199ha.js'),str(say)],check=True)
          if existing:
              print('Already installed; all exact backups and patched files verified.');raise SystemExit(0)
          for path,data in updates.items():
              b=backups[path];b.parent.mkdir(parents=True,exist_ok=True);b.write_bytes(originals[path]);Path(path).write_bytes(data)
              require(b.read_bytes()==originals[path] and Path(path).read_bytes()==data,'write mismatch '+path)
          require(set(git('diff','--name-only').splitlines())==set(PATCHES),'unexpected tracked changes')
          allowed=set(PATCHES)|{str(b) for b in backups.values()}
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==allowed,'unexpected staged changes')
          require(not git('diff','--name-only') and not git('ls-files','--others','--exclude-standard'),'unrelated files')
          subprocess.run(['git','diff','--cached','--check','--',*PATCHES],check=True)
          print('PASS: exact source hashes, reversible patches, unchanged inline scripts, syntax, safe auth links and exact staged paths.')
          PYCODE
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Fix 199M preserve product checkout sign-in return'
            git push origin HEAD:shopdrop-phase6-integration
          fi
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
