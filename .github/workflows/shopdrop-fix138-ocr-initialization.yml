
name: ShopDrop Fix138 - OCR Initialization V2

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix138-ocr-initialization.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration

      - name: Repair OCR initialization
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path=Path(
            'public/shopdrop-free-photo-screen.mjs'
          )

          expected={
            'public/shopdrop-free-photo-screen.mjs':
              '2bc71d17e1b7cc65289607903b97c74d3545a5b9',
            'public/shopdrop-product-photos.js':
              '8ed1f80f67814b9ffdc78ec827ea9293ad5ce7ea'
          }

          for name,sha in expected.items():
            actual=subprocess.check_output(
              ['git','hash-object',name],
              text=True
            ).strip()

            if actual!=sha:
              raise SystemExit(
                'SAFETY STOP: File changed: '+name
              )

          source=path.read_text(encoding='utf-8')

          start='async function getOCRWorker(){'
          end='async function getBarcodeReader(){'

          if source.count(start)!=1 or source.count(end)!=1:
            raise SystemExit(
              'SAFETY STOP: Scanner structure changed'
            )

          a=source.index(start)
          b=source.index(end,a)

          replacement="""async function getOCRWorker(){
            if(!workerPromise){
              workerPromise=loadLibrary(
                'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
                'Tesseract'
              ).then(async library=>{
                if(typeof library.createWorker!=='function'){
                  throw new Error(
                    'OCR createWorker unavailable'
                  );
                }

                try{
                  return await library.createWorker(
                    'eng',
                    1,
                    {
                      workerPath:
                        'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
                      corePath:
                        'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.0.0',
                      langPath:
                        'https://tessdata.projectnaptha.com/4.0.0',
                      workerBlobURL:true
                    }
                  );
                }catch(error){
                  throw new Error(
                    'OCR initialization failed: '+
                    String(
                      error?.message||
                      error?.name||
                      error
                    ).slice(0,180)
                  );
                }
              }).catch(error=>{
                workerPromise=null;
                throw error;
              });
            }

            return workerPromise;
          }

          """

          source=source[:a]+replacement+source[b:]

          # Preserve the existing barcode and
          # photograph upload functionality.
          # Improve OCR errors without relying
          # on exact indentation or whitespace.
          import re

          pattern=(
            r"ocrCheck\.reason\?\.name\s*\|\|"
          )

          if len(re.findall(pattern,source))!=1:
            raise SystemExit(
              'SAFETY STOP: OCR diagnostic changed'
            )

          source=re.sub(
            pattern,
            "ocrCheck.reason?.message||"
            "ocrCheck.reason?.name||",
            source,
            count=1
          )

          path.write_text(
            source,encoding='utf-8'
          )

          print('PASS: OCR initialization updated')
          print('PASS: OCR diagnostics improved')
          print('PASS: Barcode code preserved')
          print('PASS: Original uploader preserved')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail

          node --check \
            public/shopdrop-free-photo-screen.mjs

          git diff --check

          test "$(git diff --name-only)" = \
            "public/shopdrop-free-photo-screen.mjs"

          git add \
            public/shopdrop-free-photo-screen.mjs

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Fix138 configure OCR initialization"

          git push origin HEAD:shopdrop-phase6-integration
