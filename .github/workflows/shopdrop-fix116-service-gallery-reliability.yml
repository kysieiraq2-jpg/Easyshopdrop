
name: ShopDrop Fix116 - Service Photo Reliability Corrected

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix116-service-gallery-reliability.yml'

permissions:
  contents: write

jobs:
  fix-service-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Correct existing service photo selection
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path=Path(
            "public/shopdrop-seller-product-supabase.js"
          )

          expected=(
            "02e9e56d7c34310cc889f89eaef67ee931256920"
          )

          actual=subprocess.check_output(
            ["git","hash-object",str(path)],
            text=True
          ).strip()

          if actual!=expected:
              raise SystemExit(
                "SAFETY STOP: Service file version changed."
              )

          original=path.read_text(encoding="utf-8")

          start="const serviceCameraPhotos=[];"
          end="  async function submitService(){"

          if original.count(start)!=1 or original.count(end)!=1:
              raise SystemExit(
                "SAFETY STOP: Service photo section changed."
              )

          before,remaining=original.split(start,1)
          previous,after=remaining.split(end,1)

          required=[
            "function serviceSelectedPhotos()",
            "function servicePhotoCount()",
            "function initServicePhotos()",
            "serviceCameraBusy",
            "serviceCameraPhoto",
            "serviceGalleryPhotos"
          ]

          if not all(item in previous for item in required):
              raise SystemExit(
                "SAFETY STOP: Unexpected service photo code."
              )

          replacement="""const serviceCameraPhotos=[];
          const serviceGalleryPhotos=[];
          let serviceCameraBusy=false;
          let serviceGalleryBusy=false;

          function serviceSelectedPhotos(){
            return [
              ...serviceGalleryPhotos,
              ...serviceCameraPhotos
            ];
          }

          function servicePhotoCount(){
            const count=serviceSelectedPhotos().length;
            const label=document.getElementById(
              'servicePhotoCount'
            );

            if(label){
              label.textContent=count
                ?count+' of 6 photographs selected.'
                :'No photographs selected yet.';
            }
          }

          async function preserveServicePhotos(files){
            const reader=
              window.ShopDropSharedPhotoReader;

            if(!reader?.readOriginal){
              throw Error(
                'Picture reader unavailable. Please try again.'
              );
            }

            const prepared=await Promise.all(
              files.map(file=>reader.readOriginal(file))
            );

            return prepared.map((photo,index)=>
              new File(
                [photo.blob],
                'service-photo-'+index+'.'+photo.extension,
                {type:photo.mime}
              )
            );
          }

          function initServicePhotos(){
            const gallery=document.getElementById(
              'serviceGalleryPhotos'
            );
            const camera=document.getElementById(
              'serviceCameraPhoto'
            );

            if(!gallery||!camera)return;

            gallery.addEventListener('change',async()=>{
              if(serviceGalleryBusy)return;
              serviceGalleryBusy=true;

              const label=document.getElementById(
                'servicePhotoCount'
              );

              try{
                const files=Array.from(gallery.files||[]);

                if(
                  serviceSelectedPhotos().length+
                  files.length>6
                ){
                  throw Error(
                    'Maximum 6 pictures. Please choose fewer.'
                  );
                }

                if(label){
                  label.textContent='Preparing your pictures...';
                }

                const saved=await preserveServicePhotos(files);
                serviceGalleryPhotos.push(...saved);
                servicePhotoCount();

              }catch(error){
                if(label){
                  label.textContent=
                    error?.message||
                    'Please choose your pictures again.';
                }
              }finally{
                gallery.value='';
                serviceGalleryBusy=false;
              }
            });

            camera.addEventListener('change',async()=>{
              if(serviceCameraBusy)return;
              serviceCameraBusy=true;

              const label=document.getElementById(
                'servicePhotoCount'
              );

              try{
                const files=Array.from(camera.files||[]);

                if(
                  serviceSelectedPhotos().length+
                  files.length>6
                ){
                  throw Error(
                    'Maximum 6 pictures. Please choose fewer.'
                  );
                }

                if(label){
                  label.textContent='Preparing your picture...';
                }

                const saved=await preserveServicePhotos(files);
                serviceCameraPhotos.push(...saved);
                servicePhotoCount();

              }catch(error){
                if(label){
                  label.textContent=
                    error?.message||
                    'Please try that picture again.';
                }
              }finally{
                camera.value='';
                serviceCameraBusy=false;
              }
            });
          }

          """

          updated=before+replacement+end+after

          old_guard="""      if(serviceCameraBusy){
                throw Error('Please wait for your picture.');
              }"""

          # Match the actual original formatting.
          old_guard=(
            "      if(serviceCameraBusy){\n"
            "        throw Error('Please wait for your picture.');\n"
            "      }"
          )

          new_guard=(
            "      if(serviceCameraBusy||serviceGalleryBusy){\n"
            "        throw Error('Please wait for your pictures.');\n"
            "      }"
          )

          if updated.count(old_guard)!=1:
              raise SystemExit(
                "SAFETY STOP: Submission guard changed."
              )

          updated=updated.replace(
            old_guard,new_guard,1
          )

          old_reset=(
            "      el('sn').value='';\n"
            "      el('sp').value='';\n"
            "\n"
            "      serviceFeePreviewLive();"
          )

          new_reset=(
            "      el('sn').value='';\n"
            "      el('sp').value='';\n"
            "      serviceGalleryPhotos.length=0;\n"
            "      serviceCameraPhotos.length=0;\n"
            "      servicePhotoCount();\n"
            "\n"
            "      serviceFeePreviewLive();"
          )

          if updated.count(old_reset)!=1:
              raise SystemExit(
                "SAFETY STOP: Service completion changed."
              )

          updated=updated.replace(
            old_reset,new_reset,1
          )

          # Preserve the rest of the service code exactly.
          if not updated.startswith(before):
              raise SystemExit("SAFETY STOP: Prefix changed.")

          if "kind:'service'" not in updated:
              raise SystemExit(
                "SAFETY STOP: Existing upload call missing."
              )

          path.write_text(
            updated,encoding="utf-8"
          )

          print("PASS: Gallery photos preserved immediately")
          print("PASS: Phone camera photos preserved")
          print("PASS: Existing uploader reused")
          print("PASS: Existing service submission retained")
          PY

      - name: Verify JavaScript and unchanged product files
        shell: bash
        run: |
          set -euo pipefail

          node --check \
            public/shopdrop-seller-product-supabase.js

          git diff --check

          python3 - <<'PY'
          import subprocess

          changed=set(
            subprocess.check_output(
              ["git","diff","--name-only"],
              text=True
            ).splitlines()
          )

          if changed!={
            "public/shopdrop-seller-product-supabase.js"
          }:
              raise SystemExit(
                "SAFETY STOP: Unexpected files modified."
              )

          protected={
            "public/shopdrop-product-photos.js":
              "8ed1f80f67814b9ffdc78ec827ea9293ad5ce7ea",
            "public/shopdrop-ad-gallery-uploader.js":
              "df15f7e665f0b292c613d92f6a7269340a6e8b5f"
          }

          for name,expected in protected.items():
              actual=subprocess.check_output(
                ["git","hash-object",name],
                text=True
              ).strip()

              if actual!=expected:
                  raise SystemExit(
                    "SAFETY STOP: Protected uploader changed."
                  )

          print("PASS: Only service photograph selection changed")
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail

          git add \
            public/shopdrop-seller-product-supabase.js

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Fix116 correct service photo selection"

          git push origin HEAD:shopdrop-phase6-integration
