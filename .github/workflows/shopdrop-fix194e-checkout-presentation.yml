name: ShopDrop Fix 194E Checkout Presentation
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix194e-checkout-presentation.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
    - name: Install checkout presentation only
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REF_NAME" = shopdrop-phase6-integration
        python3 <<'PYCODE'
        from pathlib import Path
        import subprocess
        p=Path('public/checkout.html')
        style=Path('public/shopdrop-product-checkout-194e.css')
        old='</style></head><body><header>'
        new='</style><link rel="stylesheet" href="./shopdrop-product-checkout-194e.css?v=194e"></head><body><header>'
        css='/* Fix 194E: presentation only. Do not change visibility, order, or behavior of checkout controls. */\nbody{line-height:1.5}\nbody>header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 16px}\nbody>header a{margin:0;overflow-wrap:anywhere}\nmain{max-width:950px;margin:18px auto 32px;padding:0 14px}\nmain>h1{font-size:clamp(25px,5vw,32px);line-height:1.2;margin:12px 0}\nmain>.panel{border:1px solid #dce2ea;border-radius:12px;padding:18px;margin:14px 0;overflow-wrap:anywhere}\nmain>.panel h2{font-size:21px;line-height:1.3;margin:0 0 12px}\nmain>.panel h3{line-height:1.3}\nmain>.panel label{font-weight:700}\nmain>.panel input:not([type=checkbox]):not([type=radio]):not([type=hidden]),main>.panel select{font:inherit;min-height:46px;border-radius:8px}\nmain>.panel button{font:inherit;font-weight:700;min-height:46px;border-radius:8px;padding:10px 14px;white-space:normal;overflow-wrap:anywhere;max-width:100%}\nmain>.panel button:disabled{opacity:.65;cursor:not-allowed}\nmain a:focus-visible,main button:focus-visible,main input:focus-visible,main select:focus-visible,header a:focus-visible{outline:3px solid #0f766e;outline-offset:3px}\nheader a:focus-visible{outline-color:#fff}\n#items .item{padding:14px;border:1px solid #dce2ea;border-radius:10px;background:#f8fafc;margin:0 0 10px;line-height:1.55;overflow-wrap:anywhere}\n#items .item .muted{margin-top:6px;font-size:14px}\n#items .item button{min-width:46px;margin:10px 8px 2px 0}\n#total{padding:12px;background:#f0fdfa;border:1px solid #99d9cc;border-radius:9px;line-height:1.4;overflow-wrap:anywhere}\n#quote,#phase6PaymentNotice,#phase6CourierSelection{line-height:1.5;overflow-wrap:anywhere}\n#deliveryAddressPanel #addAnotherAddressButton,#deliveryAddressPanel #saveDeliveryAddressButton,#deliveryAddressPanel #cancelAddAddress,#previewOrderButton{width:100%;margin:10px 0 0}\n#phase6CourierSearch button{width:100%;margin:8px 0}\n#orderStatus,#addressStatus,#phase6CourierResults{overflow-wrap:anywhere;line-height:1.5}\n#orderStatus:not(:empty){margin-top:12px;padding:12px;border:1px solid #dce2ea;border-radius:8px;background:#f8fafc}\n@media(max-width:480px){main{padding:0 10px}main>.panel{padding:14px}main>.panel h2{font-size:20px}.shopdrop-sa-courier-grid{grid-template-columns:minmax(0,1fr)}}\n'
        expected='5e0133314fd9b3baa347446bdc6514ed715af2ce'
        source=p.read_bytes()
        old=old.encode();new=new.encode();css=css.encode()
        if source.count(new)==1:
            if not style.exists() or style.read_bytes()!=css: raise SystemExit('Unexpected installed CSS; no changes made')
            print('Fix 194E already installed')
        else:
            if subprocess.check_output(['git','hash-object',str(p)],text=True).strip()!=expected: raise SystemExit('Unexpected checkout source; no changes made')
            if source.count(old)!=1: raise SystemExit('Checkout anchor changed; no changes made')
            if style.exists() and style.read_bytes()!=css: raise SystemExit('Unexpected stylesheet collision; no changes made')
            updated=source.replace(old,new,1)
            if updated.replace(new,old,1)!=source: raise SystemExit('Original checkout preservation check failed')
            backup=Path('backups/fix194e/checkout.html')
            if backup.exists() and backup.read_bytes()!=source: raise SystemExit('Unexpected backup; no changes made')
            backup.parent.mkdir(parents=True,exist_ok=True)
            if not backup.exists(): backup.write_bytes(source)
            style.write_bytes(css)
            p.write_bytes(updated)
            assert p.read_bytes().replace(new,old,1)==backup.read_bytes()
            print('Fix 194E checkout presentation only. All original markup and scripts byte-preserved except one stylesheet link.')
        PYCODE
        git diff --check
        git config user.name "ShopDrop Integration"
        git config user.email "actions@users.noreply.github.com"
        git add public/checkout.html public/shopdrop-product-checkout-194e.css
        if test -d backups/fix194e; then git add backups/fix194e; fi
        if ! git diff --cached --quiet; then
          git commit -m "Fix 194E product checkout presentation only"
          git push origin HEAD:shopdrop-phase6-integration
        fi
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
