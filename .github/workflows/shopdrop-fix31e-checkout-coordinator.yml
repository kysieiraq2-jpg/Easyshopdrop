
name: ShopDrop Fix31E Checkout Coordinator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Add provider-neutral coordinator
        shell: bash
        run: |
          mkdir -p supabase/functions/_shared

          cat > supabase/functions/_shared/shopdrop-two-payment-coordinator.ts <<'EOF'
// SHOPDROP-FIX31E
// Provider-neutral checkout calculations.
// No card charges or payouts occur here.

export type PaymentLegType =
  | "courier_direct"
  | "marketplace";

export interface CheckoutAmounts {
  product_amount: number;
  courier_amount: number;
  shopdrop_commission: number;
  seller_payout_amount: number;
  total_paid: number;
  currency: string;
}

export interface PaymentLeg {
  payment_type: PaymentLegType;
  destination_type: string;
  amount: number;
  currency: string;
}

function toCents(value: number): number {
  if (
    !Number.isFinite(value) ||
    value < 0 ||
    Math.abs(value * 100 - Math.round(value * 100)) > 0.000001
  ) {
    throw new Error("invalid_amount");
  }

  return Math.round(value * 100);
}

export function prepareCheckoutLegs(
  payment: CheckoutAmounts,
): PaymentLeg[] {
  if (payment.currency !== "ZAR") {
    throw new Error("unsupported_currency");
  }

  const product = toCents(payment.product_amount);
  const courier = toCents(payment.courier_amount);
  const commission = toCents(payment.shopdrop_commission);
  const seller = toCents(payment.seller_payout_amount);
  const total = toCents(payment.total_paid);

  if (seller !== product) {
    throw new Error("seller_amount_mismatch");
  }

  if (total !== product + courier + commission) {
    throw new Error("checkout_total_mismatch");
  }

  if (product + commission <= 0) {
    throw new Error("empty_marketplace_payment");
  }

  const legs: PaymentLeg[] = [
    {
      payment_type: "marketplace",
      destination_type: "marketplace_provider",
      amount: (product + commission) / 100,
      currency: "ZAR",
    },
  ];

  if (courier > 0) {
    legs.push({
      payment_type: "courier_direct",
      destination_type: "courier_provider",
      amount: courier / 100,
      currency: "ZAR",
    });
  }

  return legs;
}
EOF

      - name: Verify coordinator
        shell: bash
        run: |
          test -s supabase/functions/_shared/shopdrop-two-payment-coordinator.ts
          grep -q 'SHOPDROP-FIX31E' supabase/functions/_shared/shopdrop-two-payment-coordinator.ts
          echo "Fix31E coordinator file verified"

      - name: Commit new file only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add supabase/functions/_shared/shopdrop-two-payment-coordinator.ts

          if ! git diff --cached --quiet; then
            git commit -m "Fix31E add inactive two-payment coordinator"
            git push origin HEAD:shopdrop-phase6-integration
          fi

