name: ShopDrop Fix 198I Single Selling Page
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix198i-single-selling-page.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
    - name: Put seller action buttons on the actual selling page
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REF_NAME" = shopdrop-phase6-integration
        python3 <<'PYCODE'
        from pathlib import Path
        import hashlib, os, re, subprocess
        from html.parser import HTMLParser
        from collections import Counter
        EXPECTED={
         'public/index.html':'5dd608563d36b95663f9d153c854ebd5455d3ae3',
         'public/v26-homepage-layout.js':'5099a31fb2daaae59fff27c4eecd7d57849e138e',
         'public/sell-item.html':'5b25426f3e14a3c16c9367b4f75ea5a5608d4a87',
         'public/product-selling-198h.html':'da60bf98dc71957dd1294cf2f03def528e38c1a2',
         'public/my-product-advertisements-194d.html':'5e9bec9cccf517c285d33cb033496c661ae6b94a',
        }
        PROTECTED={
         'public/product-shopping-194a.html':'dde3b1df7ac4d791e78ccbcf524374a685ebde29',
         'public/taxonomy.json':'43d0163d8238ebaabdba04b919c75e3c8b696191',
         'public/shopdrop-seller-category-198e.js':'f50c50a314027666dac6700da66b55e90e49803c',
         'public/shopdrop-seller-category-198e.css':'e5ded5f771bfdecb1d954c5ec4a17fb1fb2441b8',
        }
        FORM='public/sell-item.html'; OLD='public/product-selling-198h.html'
        DEST='./sell-item.html?v=198i'; LEGACY='./product-selling-198h.html?v=198h'; START='#shopdropSellerStart198i'

        def require(ok,msg):
         if not ok:raise SystemExit(msg)
        def blob(raw):return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
        def change(s,a,b,n=1):
         require(s.count(a)==n,'Unexpected anchor count: '+a[:120]);return s.replace(a,b)
        def inline(s):return re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
        class Links(HTMLParser):
         def __init__(self,src):super().__init__();self.links=[];self.feed(src)
         def handle_starttag(self,tag,attrs):
          if tag=='a':self.links.append(dict(attrs).get('href'))

        def transform(original):
         old=original[OLD].decode(); form=original[FORM].decode()
         before,tail=old.split('<main>\n',1); body,after=tail.split('\n</main>',1)
         sections=re.findall(r'<section class="panel(?: notice)?">[\s\S]*?</section>',body)
         require(len(sections)==3 and '<h2>Sell Your Products — FREE</h2>' in sections[1] and '<h2>Manage Sales</h2>' in sections[2],'Unexpected seller hub structure')
         intro,selling,sales=sections
         require(body=='\n'.join(sections)+'\n<a class="product-menu-194a" href="./index.html">Back to Home</a>','Unknown seller hub content')
         intro=change(intro,'<h1>Sell an Item — FREE</h1>','')
         selling=change(selling,'href="./sell-item.html?v=198g">Sell an Item — FREE','href="'+START+'">Sell an Item — FREE')
         panel='<div id="shopdropSellerOverview198i">\n'+intro+'\n'+selling+'\n'+sales+'\n</div>\n'
         style='''/* Fix 198I: seller guidance and existing action links, scoped to this page. */
        #shopdropSellerOverview198i .panel{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:16px;margin:12px 0;line-height:1.5}
        #shopdropSellerOverview198i .notice{background:#f8fafc}
        #shopdropSellerOverview198i h2{font-size:1.2rem;line-height:1.3;margin:0 0 8px}
        #shopdropSellerOverview198i p{margin:8px 0 12px}
        #shopdropSellerOverview198i .product-menu-194a{display:flex;align-items:center;justify-content:center;min-height:52px;background:#0f766e;color:#fff;text-align:center;text-decoration:none;font-weight:bold;padding:14px;border-radius:8px;margin-top:14px;line-height:1.35;overflow-wrap:anywhere}
        #shopdropSellerOverview198i .product-menu-194a:focus-visible{outline:3px solid #17202a;outline-offset:3px}
        #shopdropSellerOverview198i ol{padding-left:1.5em}
        #shopdropSellerStart198i{scroll-margin-top:12px}
        '''
         result=change(form,'<p><a href="'+LEGACY+'">Back to Sell an Item — FREE</a></p>\n','')
         result=change(result,'<h1>Sell an item — FREE</h1>\n','<h1>Sell an Item — FREE</h1>\n'+panel)
         result=change(result,'<section>\n<p id="accountStatus"','<section id="shopdropSellerStart198i">\n<p><a href="#shopdropSellerOverview198i">Back to selling options</a></p>\n<p id="accountStatus"')
         result=change(result,'</style>\n<link rel="stylesheet" href="./shopdrop-payment-purpose-195a.css?v=195a">',style+'</style>\n<link rel="stylesheet" href="./shopdrop-payment-purpose-195a.css?v=195a">')
         require(inline(result)==inline(form),'Advertising scripts changed')
         require(result.split('<form',1)[1]==form.split('<form',1)[1],'Advertising form or operational code changed')
         require(Counter(Links(panel).links)==Counter(Links('\n'.join(sections)).links)-Counter({'./sell-item.html?v=198g':1})+Counter({START:1}),'Seller action links not preserved')
         require(result.count('id="shopdropSellerStart198i"')==1 and result.count('id="shopdropSellerOverview198i"')==1,'Missing or duplicate anchors')
         index=original['public/index.html'].decode()
         index2=change(index,'href="'+LEGACY+'">Sell an Item — FREE</a>','href="'+DEST+'">Sell an Item — FREE</a>',2)
         index2=change(index2,'src="v26-homepage-layout.js?v=198h"','src="v26-homepage-layout.js?v=198i"')
         require(inline(index2)==inline(index),'Homepage scripts changed')
         layout=original['public/v26-homepage-layout.js'].decode()
         layout2=change(layout,"actions.querySelector('a[href=\"./product-selling-198h.html?v=198h\"],a[href=\"./sell-item.html?v=198g\"],a[href=\"./sell-item.html\"]');","actions.querySelector('a[href=\"./sell-item.html?v=198i\"],a[href=\"./product-selling-198h.html?v=198h\"],a[href=\"./sell-item.html?v=198g\"],a[href=\"./sell-item.html\"]');")
         adverts=original['public/my-product-advertisements-194d.html'].decode()
         adverts2=change(adverts,'href="'+LEGACY+'"','href="'+DEST+'"',2)
         adverts2=change(adverts2,'href="./sell-item.html?v=198g">Sell an Item — FREE / Continue Unfinished Advertisement','href="'+DEST+START+'">Sell an Item — FREE / Continue Unfinished Advertisement')
         require(inline(adverts2)==inline(adverts),'Advertisement management script changed')
         # Retain the old URL as a compatibility route, not a duplicate seller page.
         redirect='''<!doctype html>
        <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell an Item — FREE | Shop&amp;Drop</title></head>
        <body><p>Opening the selling page. <a href="./sell-item.html?v=198i">Sell an Item — FREE</a></p><script>location.replace('./sell-item.html?v=198i');</script></body></html>
        '''
         return {FORM:result.encode(),OLD:redirect.encode(),'public/index.html':index2.encode(),'public/v26-homepage-layout.js':layout2.encode(),'public/my-product-advertisements-194d.html':adverts2.encode()}

        def main():
         require(os.environ.get('GITHUB_REF_NAME')=='shopdrop-phase6-integration','Wrong branch')
         for name,sha in PROTECTED.items():require(blob(Path(name).read_bytes())==sha,'Protected file differs: '+name)
         original={};installed={}
         for name,sha in EXPECTED.items():
          p=Path(name);b=Path('backups/fix198i')/p.name;raw=p.read_bytes()
          if b.exists():require(blob(b.read_bytes())==sha,'Unexpected backup: '+name)
          if blob(raw)==sha:original[name]=raw;installed[name]=False
          elif b.is_file():original[name]=b.read_bytes();installed[name]=True
          else:raise SystemExit('Unexpected source version; nothing changed: '+name)
         updated=transform(original)
         for name,flag in installed.items():
          if flag:require(Path(name).read_bytes()==updated[name],'Installed file differs: '+name)
         subprocess.run(['node','--check','-'],input=updated['public/v26-homepage-layout.js'],check=True)
         if all(installed.values()):print('Fix 198I already installed; verified.');return
         for name,raw in original.items():
          b=Path('backups/fix198i')/Path(name).name;b.parent.mkdir(parents=True,exist_ok=True)
          if not b.exists():b.write_bytes(raw)
          Path(name).write_bytes(updated[name])
         for name,sha in PROTECTED.items():require(blob(Path(name).read_bytes())==sha,'Protected file changed: '+name)
         print('Fix 198I: one canonical selling page; original action links and form preserved; old seller URL retained.')
        if __name__=='__main__':main()
        PYCODE
        git diff --check
        git config user.name "ShopDrop Integration"
        git config user.email "actions@users.noreply.github.com"
        git add -- public/index.html public/v26-homepage-layout.js public/sell-item.html public/product-selling-198h.html public/my-product-advertisements-194d.html backups/fix198i/index.html backups/fix198i/v26-homepage-layout.js backups/fix198i/sell-item.html backups/fix198i/product-selling-198h.html backups/fix198i/my-product-advertisements-194d.html
        if ! git diff --cached --quiet; then
          git commit -m "Fix 198I unify seller instructions and advertising form"
          git push origin HEAD:shopdrop-phase6-integration
        fi
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
