name: ShopDrop Fix 199D-B Completion PIN Display
'on':
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - .github/workflows/shopdrop-fix199db-completion-pin-display.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
      - name: Connect verified payment and customer PIN display
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = shopdrop-phase6-integration
          python3 <<'PYCODE'
          from pathlib import Path
          import hashlib, subprocess, tempfile
          EXPECTED={'public/service-checkout-193e.html': '92efba12546311031efcf2b2f2a44e648262813c', 'public/dispatch-checkout-192de.html': '995b10c06942800799e85b02f545bfb1988723e5', 'public/shopdrop-service-checkout-193e.js': 'a5e477b24b507dbd2a81752ea5b3a7834ba0ca5e', 'public/shopdrop-dispatch-checkout-192de.js': '8a97f5fe178b7a12fd1e1cd61391ae56bb2157cd'}
          PROTECTED={'public/shopdrop-completion-status-193g.js': 'dbd2b42a3b44e3c5240cc28271c9e6c32b062d1e', 'public/service-completion-status-193g.html': '213271eef8d4294bb82630c5fe271c45cc7ed2af', 'public/shopdrop-provider-completion.html': '7685401e4fba45c97d2fee2efd0fe82452791f6c', 'public/shopdrop-service-appointments-193d.js': 'e8d071d313ce85d7860d55709bab4523682c4b25', 'public/shopdrop-dispatch-appointments-192dd.js': '9ee1e9fedc599a6097136bac9c197dbd2c43dc7c', 'public/shopdrop-transport-search-192b.css': 'ecb7d2458b90c65a11d68b794641d307dc077222', 'public/shopdrop-buyer-language.js': 'f9251641c014c9c97dbdd33e5602f0453001dd35', 'public/checkout.html': 'f4f6a9439171d8d8396b055fd431c10646b00761', 'public/shopdrop-checkout-connector.js': '3ee71b42d479f9f88d4128c9f6bb1e3755353e11', 'public/supabase-adapter.js': 'dace209ddf39873e20f8911236b80685f9770c10', '.github/workflows/shopdrop-integration-pages.yml': '5ca27368c51150bdf8f19a8cba91438c66436a1f'}
          PATCHES={'public/service-checkout-193e.html': [('</head>', '<meta name="referrer" content="no-referrer"><style>#shopdropPaid199db{border:2px solid #0f766e}#shopdropPaidHeading199db{color:#166534;font-size:clamp(23px,6vw,32px)}#shopdropPaid199db[data-state="waiting"] #shopdropPaidHeading199db{color:#92400e}#shopdropPaid199db p{overflow-wrap:anywhere}#shopdropPaid199db[hidden],#shopdropPaidPin199db[hidden],#shopdropPaidCopy199db[hidden],#shopdropCheckoutIntro199db[hidden]{display:none!important}</style></head>'), ('<p class="muted">Check the agreed service', '<p id="shopdropCheckoutIntro199db" class="muted">Check the agreed service'), ('<button type="button" id="serviceCheckoutReload193e">Refresh checkout</button>', '<section id="shopdropPaid199db" class="panel" hidden aria-labelledby="shopdropPaidHeading199db">\n<h2 id="shopdropPaidHeading199db" role="status" aria-live="polite"></h2>\n<label for="shopdropPaidLanguage199db">PIN instructions / Taal / Ulimi</label>\n<select id="shopdropPaidLanguage199db"><option value="en">English</option><option value="af">Afrikaans</option><option value="zu">isiZulu</option><option value="xh">isiXhosa</option><option value="st">Sesotho</option></select>\n<p id="shopdropPaidNotice199db" role="status" aria-live="polite"></p>\n<p id="shopdropPaidPin199db" dir="ltr" hidden style="font-size:clamp(30px,9vw,44px);font-weight:bold;letter-spacing:.12em;text-align:center;user-select:text;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:#17202a"></p>\n<button id="shopdropPaidCopy199db" type="button" hidden>Copy PIN</button><p id="shopdropPaidCopied199db" role="status" aria-live="polite"></p>\n<p id="shopdropPaidWarning199db" style="font-weight:bold"></p><p id="shopdropPaidAccount199db"></p>\n<a class="btn" href="./my-purchases-sales-198j.html?v=199a">My Account</a>\n</section>\n<button type="button" id="serviceCheckoutReload193e">Refresh checkout</button>'), ('<script src="./shopdrop-service-checkout-193e.js?v=193f"></script>', '<script src="./shopdrop-paid-confirmation-199db.js?v=199db"></script><script src="./shopdrop-service-checkout-193e.js?v=199db"></script>')], 'public/shopdrop-service-checkout-193e.js': [('current=await verify(await session());draw(current);', "const db=await session();if(!window.ShopDropPaidConfirmation199db?.check)throw safe('Secure payment confirmation is unavailable. Refresh checkout.');if(await window.ShopDropPaidConfirmation199db.check(db,'service',booking,status,reload))return;current=await verify(db);draw(current);")], 'public/dispatch-checkout-192de.html': [('</head>', '<meta name="referrer" content="no-referrer"><style>#shopdropPaid199db{border:2px solid #0f766e}#shopdropPaidHeading199db{color:#166534;font-size:clamp(23px,6vw,32px)}#shopdropPaid199db[data-state="waiting"] #shopdropPaidHeading199db{color:#92400e}#shopdropPaid199db p{overflow-wrap:anywhere}#shopdropPaid199db[hidden],#shopdropPaidPin199db[hidden],#shopdropPaidCopy199db[hidden],#shopdropCheckoutIntro199db[hidden]{display:none!important}</style></head>'), ('<p class="muted">Check your agreed transport', '<p id="shopdropCheckoutIntro199db" class="muted">Check your agreed transport'), ('<button type="button" id="dispatchCheckoutReload192de">Refresh checkout</button>', '<section id="shopdropPaid199db" class="panel" hidden aria-labelledby="shopdropPaidHeading199db">\n<h2 id="shopdropPaidHeading199db" role="status" aria-live="polite"></h2>\n<label for="shopdropPaidLanguage199db">PIN instructions / Taal / Ulimi</label>\n<select id="shopdropPaidLanguage199db"><option value="en">English</option><option value="af">Afrikaans</option><option value="zu">isiZulu</option><option value="xh">isiXhosa</option><option value="st">Sesotho</option></select>\n<p id="shopdropPaidNotice199db" role="status" aria-live="polite"></p>\n<p id="shopdropPaidPin199db" dir="ltr" hidden style="font-size:clamp(30px,9vw,44px);font-weight:bold;letter-spacing:.12em;text-align:center;user-select:text;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:#17202a"></p>\n<button id="shopdropPaidCopy199db" type="button" hidden>Copy PIN</button><p id="shopdropPaidCopied199db" role="status" aria-live="polite"></p>\n<p id="shopdropPaidWarning199db" style="font-weight:bold"></p><p id="shopdropPaidAccount199db"></p>\n<a class="btn" href="./my-purchases-sales-198j.html?v=199a">My Account</a>\n</section>\n<button type="button" id="dispatchCheckoutReload192de">Refresh checkout</button>'), ('<script src="./shopdrop-dispatch-checkout-192de.js?v=192df"></script>', '<script src="./shopdrop-paid-confirmation-199db.js?v=199db"></script><script src="./shopdrop-dispatch-checkout-192de.js?v=199db"></script>')], 'public/shopdrop-dispatch-checkout-192de.js': [('const {db}=await session();current=await verifiedSelection(db);draw(current);', "const {db}=await session();if(!window.ShopDropPaidConfirmation199db?.check)throw safe('Secure payment confirmation is unavailable. Refresh checkout.');if(await window.ShopDropPaidConfirmation199db.check(db,'dispatch',booking,status,reload))return;current=await verifiedSelection(db);draw(current);")]}
          NEW='public/shopdrop-paid-confirmation-199db.js'
          JS="/* Shop&Drop Fix 199D-B: read-only payment confirmation and customer PIN display. */\n(() => {\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const panel=$('shopdropPaid199db'),intro=$('shopdropCheckoutIntro199db');\n  const heading=$('shopdropPaidHeading199db'),notice=$('shopdropPaidNotice199db');\n  const pin=$('shopdropPaidPin199db'),copy=$('shopdropPaidCopy199db');\n  const warning=$('shopdropPaidWarning199db'),account=$('shopdropPaidAccount199db');\n  const copied=$('shopdropPaidCopied199db'),language=$('shopdropPaidLanguage199db');\n  if(![panel,intro,heading,notice,pin,copy,warning,account,copied,language].every(Boolean))return;\n  const words={\n    en:['Payment Successful','Your six-digit Completion PIN','Keep this PIN safe. Give it to the service provider only after all agreed work is complete.','Your PIN is also available in My Account.','Copy PIN','PIN copied.','Unable to copy. You can read or select the number above.'],\n    af:['Betaling suksesvol','Jou sessyfer-voltooiings-PIN','Hou hierdie PIN veilig. Gee dit eers aan die diensverskaffer nadat al die ooreengekome werk voltooi is.','Jou PIN is ook in My Account beskikbaar.','Kopieer PIN','PIN gekopieer.','Kon nie kopieer nie. Lees of kies die nommer hierbo.'],\n    zu:['Inkokhelo iphumelele','I-PIN yakho enamadijithi ayisithupha','Gcina le PIN iphephile. Yinike umhlinzeki wesevisi kuphela uma wonke umsebenzi enivumelene ngawo usuphelile.','I-PIN yakho iyatholakala naku-My Account.','Kopisha i-PIN','I-PIN ikopishiwe.','Ayikwazanga ukukopishwa. Funda noma ukhethe inombolo engenhla.'],\n    xh:['Intlawulo iphumelele','I-PIN yakho enamanani amathandathu','Gcina le PIN ikhuselekile. Yinike umboneleli wenkonzo kuphela xa wonke umsebenzi ekuvunyelwene ngawo ugqityiwe.','I-PIN yakho iyafumaneka nakwi-My Account.','Kopa i-PIN','I-PIN ikotshiwe.','Ayikwazanga ukukotshwa. Funda okanye ukhethe inombolo engentla.'],\n    st:['Tefo e atlehile','PIN ya hao ya dinomoro tse tsheletseng','Boloka PIN ena e bolokehile. E fe mofani wa tshebeletso feela ha mosebetsi wohle oo le dumellaneng ka wona o phethilwe.','PIN ya hao e fumaneha le ho My Account.','Kopitsa PIN','PIN e kopisitswe.','Ha e a kgona ho kopitswa. Bala kapa kgetha nomoro e ka hodimo.']\n  };\n  let lang='en';\n  try{const preferred=localStorage.getItem('shopdrop-ui-language');if(words[preferred])lang=preferred;else{const l=(navigator.language||'en').toLowerCase().split('-')[0];if(words[l])lang=l;}}catch(_){}\n  language.value=lang;\n  let generation=0,owner=null,watchedDb=null,phase='idle',reloadButton=null;\n  const uuid=v=>typeof v==='string'&&/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(v);\n  const safe=()=>Object.assign(Error('Payment status unavailable'),{safeMessage:'Payment status could not be verified. Refresh checkout. If you have already paid, do not pay again.'});\n  const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));\n  function clearPin(){pin.textContent='';pin.hidden=true;copy.hidden=true;copied.textContent='';}\n  function clear(){clearPin();panel.hidden=true;intro.hidden=false;phase='idle';}\n  function translate(){const w=words[lang];panel.lang=lang;if(phase==='pin'){heading.textContent=w[0];notice.textContent=w[1];warning.textContent=w[2];account.textContent=w[3];copy.textContent=w[4];}copied.textContent='';}\n  language.addEventListener('change',()=>{if(words[language.value]){lang=language.value;translate();}});\n  function display(next,text){phase=next;panel.hidden=false;intro.hidden=true;clearPin();panel.dataset.state=next;heading.textContent=next==='waiting'?'Checking payment':words[lang][0];notice.textContent=text;warning.textContent='';account.textContent='';}\n  function invalidate(){generation++;owner=null;clearPin();if(phase!=='idle'){panel.hidden=true;intro.hidden=true;}}\n  function watch(db){if(watchedDb===db)return;watchedDb=db;db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||(owner&&session?.user?.id!==owner))invalidate();});}\n  async function getOwner(db){const {data,error}=await db.auth.getUser();if(error||!uuid(data?.user?.id)||data.user.is_anonymous===true)throw safe();return data.user.id;}\n  async function state(db,args){const {data,error}=await db.rpc('shopdrop_completion_state_193g',args);if(error||data?.booking_id!==args.p_booking_id||data.booking_type!==args.p_booking_type||data.my_role!=='customer'||typeof data.payment_verified!=='boolean'||typeof data.pin_available!=='boolean'||typeof data.completion_verified!=='boolean')throw safe();return data;}\n  async function check(db,kind,booking,status,reload){\n    const request=++generation;clear();reloadButton=reload;watch(db);\n    if(!uuid(booking)||!['service','dispatch'].includes(kind))throw safe();\n    const args={p_booking_type:kind,p_booking_id:booking};\n    const uid=await getOwner(db);if(request!==generation)return true;owner=uid;\n    const returned=new URLSearchParams(location.search).get('payment_return')==='1';\n    let s=await state(db,args);if(request!==generation)return true;\n    // A return flag only triggers read-only polling; never proves payment.\n    if(returned&&!s.payment_verified){\n      display('waiting','Waiting for verified payment confirmation. Do not pay again.');status.textContent='';\n      for(let attempt=0;attempt<5&&!s.payment_verified;attempt++){\n        await pause(2000);if(request!==generation)return true;s=await state(db,args);if(request!==generation)return true;\n      }\n      if(!s.payment_verified){notice.textContent='Payment has not yet been verified. Tap Refresh checkout to check again. Do not pay again until the status is confirmed.';return true;}\n    }\n    if(request!==generation)return true;\n    if(!s.payment_verified)return false;\n    // Do not show or retain a PIN for a completed or unavailable booking.\n    if(await getOwner(db)!==uid||request!==generation)return true;\n    status.textContent='';\n    if(s.completion_verified){display('complete','Your completion has already been verified. View the booking in My Account.');return true;}\n    if(!s.pin_available){display('unavailable','Payment is verified. Your PIN is not currently available. Refresh checkout or open your appointment in My Account. Do not pay again.');return true;}\n    const {data:code,error}=await db.rpc('shopdrop_customer_completion_pin_193g',args);\n    if(request!==generation)return true;\n    if(error||typeof code!=='string'||!/^[0-9]{6}$/.test(code)){display('unavailable','Payment is verified, but the PIN could not be retrieved. Refresh checkout or open your appointment in My Account.');return true;}\n    if(await getOwner(db)!==uid||request!==generation)return true;\n    if(document.hidden){display('unavailable','Payment is verified. Refresh checkout to view your private PIN.');return true;}\n    display('pin','');pin.textContent=code;pin.hidden=false;copy.hidden=false;translate();return true;\n  }\n  copy.addEventListener('click',async()=>{const code=pin.textContent;const request=generation;if(phase!=='pin'||pin.hidden||!/^[0-9]{6}$/.test(code))return;try{await navigator.clipboard.writeText(code);if(request===generation)copied.textContent=words[lang][5];}catch(_){if(request===generation)copied.textContent=words[lang][6];}});\n  window.addEventListener('pagehide',invalidate);\n  window.addEventListener('pageshow',e=>{if(e.persisted&&reloadButton&&!reloadButton.disabled)reloadButton.click();});\n  document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='pin'){clearPin();phase='unavailable';notice.textContent='Your private PIN has been hidden. Refresh checkout to view it again.';} });\n  window.ShopDropPaidConfirmation199db=Object.freeze({check});\n})();\n"
          BACKUP=Path('backups/fix199db')
          def require(condition,message):
              if not condition: raise SystemExit(message)
          def blob(raw): return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          def transform(path, raw):
              s=raw.decode('utf-8')
              for old,new in PATCHES[path]:
                  require(s.count(old)==1,'Unexpected replacement anchor: '+path+' '+old[:80])
                  s=s.replace(old,new,1)
              reverse=s
              for old,new in reversed(PATCHES[path]):
                  require(reverse.count(new)==1,'Reverse guard failed: '+path)
                  reverse=reverse.replace(new,old,1)
              require(reverse==raw.decode('utf-8'),'Unapproved change: '+path)
              return s.encode('utf-8')
          def main():
              for p,sha in PROTECTED.items():require(blob(Path(p).read_bytes())==sha,'Protected source changed: '+p)
              originals={p:Path(p).read_bytes() for p in EXPECTED}
              if Path(NEW).exists():
                  require(Path(NEW).read_bytes()==JS.encode(),'New script already exists with different content')
                  for p,sha in EXPECTED.items():
                      b=BACKUP/Path(p).name
                      require(b.exists() and blob(b.read_bytes())==sha,'Original backup mismatch: '+p)
                      require(originals[p]==transform(p,b.read_bytes()),'Installed source mismatch: '+p)
                  print('Fix 199D-B already installed; exact source verified.');return
              require(not BACKUP.exists(),'Unexpected backup directory already exists')
              for p,sha in EXPECTED.items():require(blob(originals[p])==sha,'Original source mismatch: '+p)
              outputs={p:transform(p,raw) for p,raw in originals.items()}
              with tempfile.TemporaryDirectory() as d:
                  for p,raw in {**outputs,NEW:JS.encode()}.items():
                      if p.endswith('.js'):
                          target=Path(d,Path(p).name);target.write_bytes(raw);subprocess.run(['node','--check',str(target)],check=True)
              for p,raw in originals.items():
                  backup=BACKUP/Path(p).name;backup.parent.mkdir(parents=True,exist_ok=True);backup.write_bytes(raw)
                  Path(p).write_bytes(outputs[p])
              Path(NEW).write_bytes(JS.encode())
              for p,sha in PROTECTED.items():require(blob(Path(p).read_bytes())==sha,'Protected source changed: '+p)
              print('Fix 199D-B: two read-only checkout confirmations; no backend, payment, PIN generator, courier, photo or existing translation changes.')
          if __name__=='__main__': main()
          PYCODE
          git diff --check
          git config user.name "ShopDrop Integration"
          git config user.email "actions@users.noreply.github.com"
          git add -- public/service-checkout-193e.html public/dispatch-checkout-192de.html public/shopdrop-service-checkout-193e.js public/shopdrop-dispatch-checkout-192de.js public/shopdrop-paid-confirmation-199db.js backups/fix199db/service-checkout-193e.html backups/fix199db/dispatch-checkout-192de.html backups/fix199db/shopdrop-service-checkout-193e.js backups/fix199db/shopdrop-dispatch-checkout-192de.js
          python3 <<'CHECK'
          import subprocess
          allowed=set(['public/service-checkout-193e.html', 'public/dispatch-checkout-192de.html', 'public/shopdrop-service-checkout-193e.js', 'public/shopdrop-dispatch-checkout-192de.js', 'public/shopdrop-paid-confirmation-199db.js', 'backups/fix199db/service-checkout-193e.html', 'backups/fix199db/dispatch-checkout-192de.html', 'backups/fix199db/shopdrop-service-checkout-193e.js', 'backups/fix199db/shopdrop-dispatch-checkout-192de.js'])
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if not changed<=allowed: raise SystemExit('Unapproved staged paths: '+str(changed-allowed))
          CHECK
          if ! git diff --cached --quiet; then
            git commit -m "Fix 199D-B display verified service and transport completion PIN after payment"
            git push origin HEAD:shopdrop-phase6-integration
          fi
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
