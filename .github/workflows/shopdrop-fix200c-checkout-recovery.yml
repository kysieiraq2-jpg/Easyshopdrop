tent=option?.value?'Deliver to: '+option.textContent:'Choose a delivery address';\n    recheckOriginalCheckout200c();\n  });")]), 'public/checkout.html': ('6f258790f687b832eba1f6d74b9bfa9b0250d071', [('<div id="orderStatus" role="status" aria-live="polite"></div></section></main>', '<div id="orderStatus" role="status" aria-live="polite"></div><p><button id="refreshCheckout200c" type="button">Refresh checkout</button></p><p class="muted">If your shopping bag or delivery address changed, refresh checkout before preparing the order again. If you already attempted payment, <a href="./product-orders-194f.html?role=buyer">check My Purchases</a> for its status before retrying. Refreshing does not cancel an order or release reserved stock.</p></section></main>'), ('shopdrop-cart-address-bridge.js?v=200b', 'shopdrop-cart-address-bridge.js?v=200c')])}
        TEST = 'const fs=require(\'node:fs\'),vm=require(\'node:vm\'),assert=require(\'node:assert/strict\');\nconst original=fs.readFileSync(process.argv[2],\'utf8\');const remote="import(\'https://esm.sh/@supabase/supabase-js@2\')";assert.equal(original.split(remote).length,2);const source=original.replace(remote,\'mockImport()\');\nconst tick=()=>new Promise(r=>setImmediate(r));\nfunction el(){return {children:[],hidden:false,disabled:false,value:\'\',_text:\'\',set textContent(v){this._text=String(v);this.children=[]},get textContent(){return this._text+this.children.map(c=>typeof c===\'string\'?c:c.textContent||\'\').join(\' \')},append(...v){this.children.push(...v)},replaceChildren(...v){this._text=\'\';this.children=v;this.value=\'\'},add(v){this.children.push(v)},addEventListener(k,f){this[k]=f},setAttribute(){},style:{}}}\nasync function setup(mode=\'ok\'){\n let user=\'A\',cb,fail=false,delayResolve,readCount=0,orders=0,payments=0,reloads=0,refreshes=0,resolveOrder;const nodes=new Map(),events={};const get=id=>{if(!nodes.has(id))nodes.set(id,el());return nodes.get(id)};get(\'newAddressFields\').hidden=true;get(\'country\').value=\'ZA\';\n const cart=[{id:\'c\',product_id:\'p\',quantity:1}],addresses=[{id:\'a\',address_label:\'Private A\',city:\'Town\',is_default:true}],products=[{id:\'p\',title:\'Private item\',price:100,currency:\'ZAR\',quantity:1,listing_status:\'active\'}];\n const db={auth:{getUser:async()=>({data:{user:user?{id:user}:null},error:null}),onAuthStateChange:f=>{cb=f}},from(table){let q={select:()=>q,eq:()=>q,in:()=>q,order:()=>q,then:(r,j)=>{readCount++;if(mode===\'delay\'&&table===\'cart_items\'&&!delayResolve){return new Promise(x=>{delayResolve=x}).then(r,j)}return Promise.resolve({data:table===\'cart_items\'?cart:table===\'addresses\'?addresses:products,error:fail?Error(\'network\'):null}).then(r,j)}};return q},rpc:async()=>({data:{seller_alias:\'Public alias\'},error:null})};\n const window={addEventListener:(k,f)=>events[k]=f,ShopDropSingleCourier199da:{clear(){},canPay:()=>false,refresh:async()=>{refreshes++}},ShopDropReservationCountdown:{clear(){},remember(){},refresh:async()=>{}},ShopDropCheckoutConnector:{createOrder:async()=>{orders++;if(mode===\'orderDelay\')await new Promise(r=>{resolveOrder=r});return {id:\'12345678-1234-1234-1234-123456789abc\'}}},ShopDropSupabaseAdapter:{authenticatedFunctions:{createPaymentSession:async()=>{payments++}}}};\n vm.runInNewContext(source,{window,document:{getElementById:get,createElement:el,createTextNode:s=>s},Option:function(text,value){this.textContent=text;this.value=value},mockImport:async()=>({createClient:()=>db}),Intl,location:{reload(){reloads++}},console});await tick();await tick();\n return {get,window,events,emit(e,u){user=u;cb(e,u?{user:{id:u}}:null)},fail(){fail=true},resolve(){delayResolve({data:cart,error:null})},get orders(){return orders},get payments(){return payments},get reads(){return readCount},get reloads(){return reloads},get refreshes(){return refreshes},finishOrder(){resolveOrder()}};\n}\n(async()=>{let h=await setup();assert.match(h.get(\'items\').textContent,/Private item/);assert.equal(h.get(\'addresses\').value,\'a\');assert.equal(h.get(\'previewOrderButton\').disabled,false);h.emit(\'TOKEN_REFRESHED\',\'A\');assert.match(h.get(\'items\').textContent,/Private item/);h.emit(\'SIGNED_OUT\',null);assert.equal(h.get(\'addresses\').value,\'\');assert.doesNotMatch(h.get(\'items\').textContent,/Private item/);assert.equal(h.get(\'previewOrderButton\').disabled,true);await h.window.place();assert.equal(h.orders,0);assert.equal(h.payments,0);\n h=await setup(\'delay\');h.emit(\'SIGNED_IN\',\'B\');h.resolve();await tick();await tick();assert.doesNotMatch(h.get(\'items\').textContent,/Private item/);assert.equal(h.get(\'previewOrderButton\').disabled,true);\n h=await setup();h.fail();assert.equal(await h.window.ShopDropPhase6CartAddress.load(),false);assert.equal(h.get(\'addresses\').value,\'\');assert.equal(h.get(\'previewOrderButton\').disabled,true);await h.window.place();assert.equal(h.orders,0);\n h=await setup();h.events.pagehide();assert.equal(h.get(\'addresses\').value,\'\');assert.equal(h.get(\'previewOrderButton\').disabled,true);h=await setup();h.get(\'refreshCheckout200c\').click();assert.equal(h.reloads,1);assert.equal(h.orders,0);assert.equal(h.payments,0);\n h=await setup(\'orderDelay\');const placing=h.window.place();await tick();assert.equal(h.get(\'refreshCheckout200c\').disabled,true);h.get(\'refreshCheckout200c\').click();assert.equal(h.reloads,0);h.finishOrder();await placing;assert.equal(h.get(\'refreshCheckout200c\').disabled,false);assert.equal(h.orders,1);assert.equal(h.refreshes,1);\n h.get(\'addresses\').value=\'different\';h.get(\'addresses\').change();await tick();assert.equal(h.refreshes,1);h.get(\'addresses\').value=\'a\';h.get(\'addresses\').change();await tick();assert.equal(h.refreshes,2);assert.equal(h.orders,1);assert.equal(h.payments,0);\n console.log(\'PASS: prior session safeguards, refresh without order or payment, in-flight order guard, changed and restored address recheck\');})().catch(e=>{console.error(e);process.exitCode=1});'
        BRANCH = 'shopdrop-phase6-integration'
        def git(*args):
            return subprocess.check_output(['git', *map(str,args)], text=True).strip()
        def blob(data):
            return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
        def require(ok, message):
            if not ok: raise SystemExit('SAFETY STOP: '+message)
        def update(data, changes):
            result=data
            for a,b in changes:
                a,b=a.encode(),b.encode()
                require(result.count(a)==1,'unexpected replacement anchor count')
                result=result.replace(a,b,1)
            original=result
            for a,b in reversed(changes):
                a,b=a.encode(),b.encode()
                require(original.count(b)==1,'unexpected reverse anchor count')
                original=original.replace(b,a,1)
            require(original==data,'unrelated code changed')
            return result
        require(os.environ.get('GITHUB_REF_NAME')==BRANCH and git('branch','--show-current')==BRANCH,'incorrect branch')
        require(not git('status','--porcelain'),'dirty checkout')
        originals={}; updates={}; backups={}
        for path,(expected,changes) in PATCHES.items():
            p=Path(path); b=Path('backups/fix200c')/p
            require(p.is_file() and not p.is_symlink() and not b.is_symlink(),'unexpected path '+path)
            backups[path]=b
            if b.exists():
                old=b.read_bytes()
                require(blob(old)==expected and p.read_bytes()==update(old,changes),'partial or modified prior fix '+path)
                originals[path]=old; updates[path]=p.read_bytes()
            else:
                old=p.read_bytes()
                require(blob(old)==expected,'current source changed '+path)
                originals[path]=old; updates[path]=update(old,changes)
        existing=sum(p.exists() for p in backups.values())
        require(existing in (0,len(PATCHES)),'partial prior backup')
        class Scripts(HTMLParser):
            def __init__(self):
                super().__init__(); self.scripts=[]; self.current=None
            def handle_starttag(self,tag,attrs):
                if tag=='script':
                    attrs=dict(attrs)
                    self.current=None if 'src' in attrs else (attrs.get('type',''),[])
            def handle_data(self,data):
                if self.current is not None: self.current[1].append(data)
            def handle_endtag(self,tag):
                if tag=='script' and self.current is not None:
                    self.scripts.append((self.current[0],''.join(self.current[1]))); self.current=None
        with tempfile.TemporaryDirectory() as td:
            t=Path(td)
            for path,data in updates.items():
                if path.endswith('.js'):
                    f=t/(Path(path).stem+('.mjs' if path.endswith('shopdrop-private-contact.js') else '.js'));f.write_bytes(data)
                    subprocess.run(['node','--check',str(f)],check=True)
                else:
                    before=Scripts();before.feed(originals[path].decode());after=Scripts();after.feed(data.decode())
                    restored=after.scripts
                    require(before.scripts==restored,'unrelated inline operational script changed '+path)
                    for i,(kind,code) in enumerate(after.scripts):
                        if kind not in ('','module','text/javascript','application/javascript'): continue
                        f=t/(Path(path).stem+str(i)+('.mjs' if kind=='module' else '.js'));f.write_text(code)
                        subprocess.run(['node','--check',str(f)],check=True)
            test=t/'test.cjs';test.write_text(TEST)
            subprocess.run(['node',str(test),str(t/'shopdrop-cart-address-bridge.js')],check=True)
        if existing:
            print('Already installed; all exact backups and patched files verified.');raise SystemExit(0)
        for path,data in updates.items():
            b=backups[path];b.parent.mkdir(parents=True,exist_ok=True);b.write_bytes(originals[path]);Path(path).write_bytes(data)
            require(b.read_bytes()==originals[path] and Path(path).read_bytes()==data,'write mismatch '+path)
        require(set(git('diff','--name-only').splitlines())==set(PATCHES),'unexpected tracked changes')
        allowed=set(PATCHES)|{str(b) for b in backups.values()}
        subprocess.run(['git','add','--',*sorted(allowed)],check=True)
        require(set(git('diff','--cached','--name-only').splitlines())==allowed,'unexpected staged changes')
        require(not git('diff','--name-only') and not git('ls-files','--others','--exclude-standard'),'unrelated files')
        subprocess.run(['git','diff','--cached','--check','--',*PATCHES],check=True)
        print('PASS: exact source hashes, reversible patches, preserved unrelated inline scripts, syntax, checkout session and recovery mock tests and exact staged paths.')
