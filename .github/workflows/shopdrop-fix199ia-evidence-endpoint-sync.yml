name: ShopDrop Fix 199I-A Evidence Endpoint Sync
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix199ia-evidence-endpoint-sync.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
    - name: Synchronize verified backend sources only
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REF_NAME" = shopdrop-phase6-integration
        python3 <<'PYCODE'
        from pathlib import Path
        import hashlib
        FILES = {'supabase/functions/create-signed-upload/index.ts': 'adffcd153e09cd04397a43e1587a03fc5cbc7ae2', 'supabase/functions/dispute-evidence/index.ts': 'c69be779b1152fedcc12dbd96d8e05c819edd234'}
        def sha(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
        def fnv(s):
         h=2166136261
         for c in s: h=((h^ord(c))*16777619)&0xffffffff
         return h
        def transform(p,s):
         s=s.replace('\r\n','\n').strip()
         if 'create-signed-upload' in p:
          anchor='    const config = uploadTypes[uploadType];'
          assert s.count(anchor)==1
          guard='''    // Fix 199I-A: private evidence follows the case-checked Storage/RPC path.
            // Courier proof is backend-only. Do not mint customer upload tickets for either bucket.
            if (uploadType === "dispute_evidence" || uploadType === "proof_of_delivery") {
              return json(
                {
                  code: "protected_evidence_upload_required",
                  user_message: uploadType === "dispute_evidence"
                    ? "Use My Dispute Evidence to upload evidence for your existing case."
                    : "Proof of delivery is recorded through the verified courier process.",
                },
                403,
              );
            }

        '''
          s=s.replace(anchor,guard+anchor)
          assert len(s)==6289 and fnv(s)==0x1b34512f, 'Deployed source fingerprint mismatch'
         else:
          anchor='  const disputeReference = cleanText('
          assert s.count(anchor)==1
          s=s[:s.index(anchor)].replace('SHOPDROP-R7-DISPUTE-EVIDENCE-V2','SHOPDROP-199IA-DISPUTE-EVIDENCE-V3')+'''  // Fix 199I-A: retire the metadata-only route. It did not bind evidence to an
          // authorised dispute or an uploaded file. The current protected page uses
          // participant-owned Storage and the existing registration RPC.
          return json(
            {
              ok: false,
              error: "protected_case_evidence_required",
              user_message: "Open My Dispute Evidence and select your existing dispute to attach a file.",
            },
            410,
          );
        });'''
          assert len(s)==2443 and fnv(s)==0x464159f, 'Deployed source fingerprint mismatch'
         return s.encode()+b'\n'
        for p,expected in FILES.items():
         f=Path(p); backup=Path('backups/fix199ia')/p
         old=backup.read_bytes() if backup.exists() else f.read_bytes()
         assert sha(old)==expected, 'Original source changed: '+p
         new=transform(p,old.decode())
         assert f.read_bytes() in (old,new), 'Unexpected current source: '+p
         backup.parent.mkdir(parents=True,exist_ok=True);backup.write_bytes(old);f.write_bytes(new)
        print('Both deployed source fingerprints verified; exact backups preserved.')
        PYCODE
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- supabase/functions/create-signed-upload/index.ts supabase/functions/dispute-evidence/index.ts backups/fix199ia/supabase/functions/create-signed-upload/index.ts backups/fix199ia/supabase/functions/dispute-evidence/index.ts
        git diff --cached --check -- . ':!backups/**'
        python3 <<'CHECK'
        import subprocess
        allowed={'supabase/functions/create-signed-upload/index.ts', 'backups/fix199ia/supabase/functions/dispute-evidence/index.ts', 'backups/fix199ia/supabase/functions/create-signed-upload/index.ts', 'supabase/functions/dispute-evidence/index.ts'}
        changed=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
        assert changed<=allowed
        CHECK
        if ! git diff --cached --quiet; then
         git commit -m "Fix 199I-A synchronize protected evidence endpoints"
         git push origin HEAD:shopdrop-phase6-integration
        fi
