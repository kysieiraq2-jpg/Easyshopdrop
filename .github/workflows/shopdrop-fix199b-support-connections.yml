s or Transport Services &amp; Equipment Hire, submit a request before the service or hire starts, subject to the applicable policy.</p>\n<p class="muted">Submitting this form records a request. It does not itself cancel a paid transaction, release funds, or issue a refund.</p>\n<form id="shopdropSupportForm199b" data-support-kind="cancellation" method="post"><fieldset>\n<label for="supportType199b">Transaction type</label><select id="supportType199b" name="transaction_type" required><option value="">Choose transaction type</option><option value="product">Product purchase or sale</option><option value="service">Other Services appointment</option><option value="transport">Transport or equipment hire appointment</option></select>\n<label for="supportReference199b">Order or booking reference</label><input id="supportReference199b" name="transaction_reference" required maxlength="100" autocomplete="off" placeholder="Copy the reference from your order or appointment">\n<label for="supportReason199b">Reason for cancellation request</label><textarea id="supportReason199b" name="reason" required maxlength="500" placeholder="Why are you requesting cancellation?"></textarea>\n<label for="supportDetails199b">Additional details (optional)</label><textarea id="supportDetails199b" name="details" maxlength="3000"></textarea>\n<button type="submit" disabled>Request Cancellation</button></fieldset></form><p class="muted">Sign in is required to submit. If you need to sign in, return to this page afterwards.</p><a href="./sign-in.html">Sign in</a> · <a href="./register.html">Register</a><p id="supportStatus199b" role="status" aria-live="polite">Loading secure submission…</p></section><section class="panel"><h2>Find your reference</h2><a class="btn" href="./product-orders-194f.html">My Purchases</a><a class="btn" href="./product-orders-194f.html?role=seller">My Sales</a><a class="btn" href="./service-appointments-193d.html">My Service Appointments</a><a class="btn" href="./service-appointments-193d.html?role=provider">Requests for My Services</a><a class="btn" href="./dispatch-appointments-192dd.html">My Transport Appointments</a><a class="btn" href="./dispatch-appointments-192dd.html?role=provider">Requests for My Transport Advertisements</a></section></main><script src="common.js"></script>\n<script src="v26-consolidated.js"></script><script src="v26-bridge.js"></script><script src="./supabase-adapter.js"></script><script src="./shopdrop-support-199b.js?v=199b" defer></script></body></html>', 'public/report-listing.html': '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Report Listing | Shop&amp;Drop</title><link rel="stylesheet" href="./shopdrop-transport-search-192b.css"><style>input,textarea{display:block;box-sizing:border-box;width:100%;font:inherit;padding:12px;margin-top:8px;border:1px solid #cbd5e1;border-radius:8px}textarea{min-height:90px;resize:vertical}fieldset{border:0;padding:0;margin:0;min-width:0}#supportStatus199b{overflow-wrap:anywhere;line-height:1.5}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #17202a;outline-offset:2px}</style></head><body><header><a href="./index.html">Home</a><a href="./my-purchases-sales-198j.html?v=199a">My Account</a></header><main><section class="panel"><h1>Report Listing</h1><p>Report a specific advertisement if you suspect a scam, prohibited listing, misleading information or another problem. Normal advertising remains automatic.</p><form id="shopdropSupportForm199b" data-support-kind="report" method="post"><fieldset>\n<label for="supportType199b">Listing type</label><select id="supportType199b" name="listing_type" required><option value="">Choose listing type</option><option value="product">Product</option><option value="service">Other Services</option><option value="transport">Transport or equipment hire advertisement</option><option value="dispatch_offer">Transport offer sent to you</option></select>\n<label for="supportReference199b">Listing reference</label><input id="supportReference199b" name="listing_reference" required maxlength="100" autocomplete="off" placeholder="Copy the reference from the advertisement"><p class="muted">Use the listing reference shown on the advertisement, not the advertiser\'s personal details.</p>\n<label for="supportReason199b">Reason</label><select id="supportReason199b" name="reason" required><option value="">Choose reason</option><option>Suspected scam</option><option>Prohibited item/service</option><option>Misleading advertisement</option><option>Duplicate / spam</option><option>Other</option></select>\n<label for="supportDetails199b">Details (optional)</label><textarea id="supportDetails199b" name="details" maxlength="3000" placeholder="Describe the problem"></textarea><button type="submit" disabled>Submit Report</button></fieldset></form><p class="muted">Sign in is required to submit. If you need to sign in, return to this page afterwards.</p><a href="./sign-in.html">Sign in</a> · <a href="./register.html">Register</a><p id="supportStatus199b" role="status" aria-live="polite">Loading secure submission…</p></section><a class="btn" href="./feedback.html">Complaints &amp; Suggestions</a></main><script src="common.js"></script>\n<script src="v26-consolidated.js"></script><script src="v26-bridge.js"></script><script src="./supabase-adapter.js"></script><script src="./shopdrop-support-199b.js?v=199b" defer></script></body></html>', 'supabase/functions/cancellations/index.ts': '\nimport { createClient } from "https://esm.sh/@supabase/supabase-js@2";\n\nconst VERSION = "SHOPDROP-R7-CANCELLATIONS-V3-199B";\n\nconst SUPABASE_URL = Deno.env.get("SUPABASE_URL") ?? "";\nconst SERVICE_ROLE_KEY =\n  Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") ?? "";\n\nconst CORS = {\n  "Access-Control-Allow-Origin": "*",\n  "Access-Control-Allow-Headers":\n    "authorization, x-client-info, apikey, content-type",\n  "Access-Control-Allow-Methods": "POST, OPTIONS",\n};\n\nfunction reply(body: Record<string, unknown>, status = 200) {\n  return new Response(\n    JSON.stringify({ version: VERSION, ...body }),\n    {\n      status,\n      headers: {\n        ...CORS,\n        "content-type": "application/json; charset=utf-8",\n        "cache-control": "no-store",\n      },\n    },\n  );\n}\n\nfunction cleanText(value: unknown, max = 1000) {\n  return String(value ?? "").trim().slice(0, max);\n}\n\nDeno.serve(async (req) => {\n  if (req.method === "OPTIONS") {\n    return new Response("ok", { headers: CORS });\n  }\n\n  if (req.method !== "POST") {\n    return reply(\n      { ok: false, error: "method_not_allowed" },\n      405,\n    );\n  }\n\n  if (!SUPABASE_URL || !SERVICE_ROLE_KEY) {\n    return reply(\n      { ok: false, error: "backend_configuration_error" },\n      500,\n    );\n  }\n\n  const authorization = req.headers.get("Authorization");\n\n  if (!authorization) {\n    return reply(\n      { ok: false, error: "authentication_required" },\n      401,\n    );\n  }\n\n  const db = createClient(\n    SUPABASE_URL,\n    SERVICE_ROLE_KEY,\n    {\n      auth: {\n        persistSession: false,\n        autoRefreshToken: false,\n      },\n    },\n  );\n\n  const token = authorization.replace(/^Bearer\\s+/i, "");\n\n  const {\n    data: { user },\n    error: authError,\n  } = await db.auth.getUser(token);\n\n  if (authError || !user || user.is_anonymous === true) {\n    return reply(\n      { ok: false, error: "invalid_authentication" },\n      401,\n    );\n  }\n\n  let input: Record<string, unknown>;\n\n  try {\n    input = await req.json();\n    if (!input || typeof input !== "object" || Array.isArray(input)) throw new Error("Invalid JSON object");\n  } catch {\n    return reply(\n      { ok: false, error: "invalid_json" },\n      400,\n    );\n  }\n\n  const orderId = cleanText(\n    input.order_id ?? input.orderId,\n    100,\n  );\n\n  const transactionReference = cleanText(\n    input.transaction_reference ??\n    input.order_reference ??\n    input.reference,\n    100,\n  );\n\n  const reason = cleanText(\n    input.reason ?? input.cancellation_reason,\n    500,\n  );\n\n  const details = cleanText(\n    input.details ??\n    input.description ??\n    input.message,\n    3000,\n  );\n\n  if (!orderId && !transactionReference) {\n    return reply(\n      {\n        ok: false,\n        error: "transaction_reference_required",\n      },\n      400,\n    );\n  }\n\n  if (!reason) {\n    return reply(\n      {\n        ok: false,\n        error: "cancellation_reason_required",\n      },\n      400,\n    );\n  }\n\n  // Fix 199B: existing authenticated caller, owned transaction, atomic request only.\n  const { data, error } = await db.rpc("shopdrop_submit_cancellation_199b", {\n    p_user_id: user.id,\n    p_kind: cleanText(input.transaction_type ?? input.booking_type ?? input.kind, 40),\n    p_reference: transactionReference,\n    p_order_id: orderId,\n    p_reason: reason,\n    p_details: details,\n  });\n  if (error) {\n    console.error(VERSION, "cancellation storage failed", error.code);\n    return reply({ ok: false, error: "cancellation_storage_failed" }, 500);\n  }\n  if (data?.ok !== true || typeof data.reference !== "string") {\n    return reply({ ok: false, error: data?.error || "Cancellation request could not be submitted." }, 400);\n  }\n  return reply(data);\n});\n\n', 'supabase/functions/listing-reports/index.ts': '\nimport { createClient } from "https://esm.sh/@supabase/supabase-js@2";\n\nfunction adminClient() {\n  const url = Deno.env.get("SUPABASE_URL")!;\n  const key = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!;\n  return createClient(url, key, {\n    auth: { persistSession: false }\n  });\n}\n\nasync function requireUser(req: Request) {\n  const auth = req.headers.get("Authorization");\n  if (!auth) throw new Error("UNAUTHORIZED");\n\n  const supabase = adminClient();\n  const token = auth.replace(/^Bearer\\s+/i, "");\n  const { data, error } = await supabase.auth.getUser(token);\n\n  if (error || !data.user || data.user.is_anonymous === true) throw new Error("UNAUTHORIZED");\n  return data.user;\n}\n\nconst corsHeaders = {\n  "Access-Control-Allow-Origin": "*",\n  "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",\n  "Access-Control-Allow-Methods": "POST, OPTIONS"\n};\n\nfunction json(data: unknown, status = 200) {\n  return new Response(JSON.stringify(data), {\n    status,\n    headers: {\n      ...corsHeaders,\n      "content-type": "application/json",\n      "cache-control": "no-store"\n    }\n  });\n}\n\nDeno.serve(async req => {\n  if (req.method === "OPTIONS") {\n    return new Response("ok", { headers: corsHeaders });\n  }\n\n  if (req.method !== "POST") return json({ok:false,code:"method_not_allowed",user_message:"POST required."},405);\n  try {\n    const u = await requireUser(req);\n    const b = await req.json();\n    if (!b || typeof b !== "object" || Array.isArray(b)) return json({ok:false,user_message:"Invalid request."},400);\n    const db = adminClient();\n\n    // Fix 199B: resolve the real listing and create one report/admin case.\n    const clean = (v: unknown, max: number) => typeof v === "string" ? v.trim().slice(0,max) : "";\n    const { data, error } = await db.rpc("shopdrop_submit_listing_report_199b", {\n      p_user_id: u.id,\n      p_kind: clean(b.listing_type ?? b.kind,40),\n      p_reference: clean(b.listing_reference ?? b.reference ?? b.listing_id,100),\n      p_reason: clean(b.reason,500),\n      p_details: clean(b.details,3000),\n    });\n    if (error) {\n      console.error("SHOPDROP-199B listing report", error.code);\n      return json({ok:false,code:"report_failed",user_message:"Listing report could not be submitted."},500);\n    }\n    if (data?.ok !== true || typeof data.reference !== "string" || typeof data.report_id !== "string") {\n      return json({ok:false,code:"invalid_report",user_message:data?.error || "Check the listing and report details."},400);\n    }\n    return json(data);\n  } catch (e) {\n    if (e instanceof Error && e.message === "UNAUTHORIZED") {\n      return json({\n        code: "unauthorized",\n        user_message: "Authentication required."\n      }, 401);\n    }\n\n    return json({\n      code: "report_failed",\n      user_message: "Listing report could not be submitted."\n    }, 400);\n  }\n});\n\n'}, 'created': {'public/shopdrop-support-199b.js': '(() => {\n  \'use strict\';\n  const form=document.getElementById(\'shopdropSupportForm199b\');\n  const status=document.getElementById(\'supportStatus199b\');\n  if(!form||!status)return;\n  const kind=form.dataset.supportKind;\n  if(![\'cancellation\',\'report\'].includes(kind))return;\n  const fields=form.querySelector(\'fieldset\');\n  const button=form.querySelector(\'button[type="submit"]\');\n  const type=document.getElementById(\'supportType199b\');\n  const reference=document.getElementById(\'supportReference199b\');\n  if(!fields||!button||!type||!reference)return;\n  const allowed=kind===\'cancellation\'?[\'product\',\'service\',\'transport\']:[\'product\',\'service\',\'transport\',\'dispatch_offer\'];\n  const params=new URLSearchParams(location.search);\n  const preset=params.get(\'kind\');\n  if(allowed.includes(preset))type.value=preset;\n  const ref=params.get(\'reference\');\n  if(ref&&ref.length<=100)reference.value=ref;\n  const method=kind===\'cancellation\'?\'cancellations\':\'listingReports\';\n  const prefix=kind===\'cancellation\'?\'SD-CAN-\':\'SD-RPT-\';\n  let busy=false;\n  function show(text,error=false){status.textContent=text;status.className=error?\'error\':\'muted\';}\n  const submit=window.ShopDropSupabaseAdapter?.authenticatedFunctions?.[method];\n  if(typeof submit!==\'function\'){show(\'Secure connection unavailable. Refresh this page before submitting.\',true);return;}\n  button.disabled=false;\n  s