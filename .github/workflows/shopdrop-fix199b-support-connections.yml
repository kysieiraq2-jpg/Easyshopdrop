        TEST_JS = "'use strict';\nconst fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');\nconst source=fs.readFileSync(process.argv[2],'utf8');\nconst uid='12345678-1234-1234-1234-123456789abc';\nfunction setup(kind,mode='ok',query='?kind=product&reference=SD-LST-0001'){\n const type={value:''},reference={value:''},status={textContent:'',className:''},fields={disabled:false},button={disabled:true};\n const payloads=[];let handler,finish;\n const form={dataset:{supportKind:kind},querySelector:s=>s==='fieldset'?fields:button,reportValidity:()=>true,addEventListener:(name,fn)=>{if(name==='submit')handler=fn}};\n const reason={value:'Test reason'},details={value:'Test details'};\n const method=kind==='cancellation'?'cancellations':'listingReports';\n const prefix=kind==='cancellation'?'SD-CAN-':'SD-RPT-';\n const response=async body=>{\n   payloads.push(body);\n   if(mode==='auth')throw Error('Please sign in to Shop&Drop first.');\n   if(mode==='invalid')throw Error('Transaction not found in your account.');\n   if(mode==='badResponse')return {ok:true,reference:'invalid',status:'submitted'};\n   if(mode==='busy')return new Promise(resolve=>finish=()=>resolve({ok:true,reference:prefix+uid,status:'submitted'}));\n   return {ok:true,reference:prefix+uid,status:'submitted'};\n };\n const map={shopdropSupportForm199b:form,supportStatus199b:status,supportType199b:type,supportReference199b:reference};\n const context={document:{getElementById:id=>map[id]},window:{ShopDropSupabaseAdapter:mode==='missing'?undefined:{authenticatedFunctions:{[method]:response}}},location:{search:query},URLSearchParams,FormData:class{entries(){return Object.entries({[kind==='cancellation'?'transaction_type':'listing_type']:type.value,[kind==='cancellation'?'transaction_reference':'listing_reference']:reference.value,reason:reason.value,details:details.value})}}};\n vm.runInNewContext(source,context);\n return {type,reference,status,fields,button,reason,payloads,subm