        from pathlib import Path
        from collections import Counter
        from html.parser import HTMLParser
        from urllib.parse import urlsplit
        import hashlib, os, re, subprocess, tempfile

        BRANCH='shopdrop-phase6-integration'
        BACKUP=Path('backups/fix199b')

        def require(ok,msg):
            if not ok: raise SystemExit(msg)

        def blob(raw):
            return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()

        def git(*args):
            return subprocess.check_output(['git',*args])

        class Page(HTMLParser):
            def __init__(self,s):
                super().__init__(convert_charrefs=False);self.links=[];self.scripts=[];self.fields=[];self.inline=None;self.feed(s);self.close()
            def handle_starttag(self,tag,attrs):
                attrs=dict(attrs)
                if tag in ('a','link','script'):
                    url=attrs.get('src' if tag=='script' else 'href')
                    if url:self.links.append(url)
                if tag=='script' and 'src' not in attrs:
                    self.inline=[attrs.get('type',''),[]]
                if tag in ('input','textarea','select') and attrs.get('name'):self.fields.append(attrs['name'])
            def handle_endtag(self,tag):
                if tag=='script' and self.inline is not None:
                    self.scripts.append((self.inline[0],''.join(self.inline[1])));self.inline=None
            def handle_data(self,data):
                if self.inline is not None:self.inline[1].append(data)


        def transform(path,raw):
            if path in PLAN['full']:
                return PLAN['full'][path].encode('utf-8')
            s=raw.decode('utf-8')
            for old,new in PLAN['patches'][path]:
                require(s.count(old)==1,'Unexpected replacement anchor in '+path+': '+old[:100])
                s=s.replace(old,new,1)
            return s.encode('utf-8')


        def syntax(raw,suffix):
            with tempfile.TemporaryDirectory() as tmp:
                file=Path(tmp)/('check'+suffix);file.write_bytes(raw)
                args=['node','--check',str(file)] if suffix!='.ts' else ['node','--experimental-strip-types','--check',str(file)]
                subprocess.run(args,check=True)


        def validate_html(path,raw,out,all_targets):
            before=Page(raw.decode('utf-8'));after=Page(out.decode('utf-8'))
            if path in ('public/cancellations.html','public/report-listing.html'):
                expected_fields={'reason','details'}|({'transaction_type','transaction_reference'} if path.endswith('/cancellations.html') else {'listing_type','listing_reference'})
                require(set(after.fields)==expected_fields,'Support fields do not match authenticated contract: '+path)
                require('data-shopdrop-form=' not in out.decode('utf-8'),'Legacy submit listener remains: '+path)
                require('shopdropSupportForm199b' in out.decode('utf-8'),'Missing new form: '+path)
                require(all(x in after.links for x in before.links),'Original shared scripts removed: '+path)
            for href in (Counter(after.links)-Counter(before.links)):
                link=urlsplit(href)
                if link.scheme or link.netloc or not link.path:continue
                dest=(Path(path).parent/link.path).as_posix()
                require(dest in all_targets or Path(dest).is_file(),'Missing local target '+href+' from '+path)
            for typ,body in after.scripts:
                if (typ,body) not in before.scripts and typ in ('','module','text/javascript','application/javascript'):
                    syntax(body.encode('utf-8'),'.mjs' if typ=='module' else '.js')


        def install():
            require(os.environ.get('GITHUB_REF_NAME')==BRANCH,'Wrong workflow branch')
            require(git('symbolic-ref','--short','HEAD').decode().strip()==BRANCH,'Wrong checked-out branch')
            require(not git('status','--porcelain','--untracked-files=all').strip(),'Working tree is not clean')
            expected=PLAN['expected'];protected=PLAN['protected'];new=PLAN['created']
            require(set(expected)==set(PLAN['patches'])|set(PLAN['full']),'Invalid transformation allowlist')
            require(not (set(expected)&set(protected) or set(new)&(set(expected)|set(protected))),'Overlapping paths')
            for path,sha in protected.items():require(blob(Path(path).read_bytes())==sha,'Protected source changed: '+path)
            originals={};outputs={}
            for path,sha in expected.items():
                target=Path(path);backup=BACKUP/path;current=target.read_bytes()
                original=backup.read_bytes() if backup.exists() else current
                require(blob(original)==sha,'Unexpected source or backup: '+path)
                out=transform(path,original)
                require(current in (original,out),'Unexpected current file: '+path)
                originals[path]=original;outputs[path]=out
            for path,s in new.items():
                data=s.encode('utf-8');target=Path(path)
                require(not target.exists() or target.read_bytes()==data,'New-file collision: '+path)
                outputs[path]=data
            for path,sha in {'supabase/functions/cancellations/index.ts':'465e8447f298ae7afa3b27fa35a547087de62088','supabase/functions/listing-reports/index.ts':'09b3abc32fa6fd97c4e030f9936afa43eabb6408'}.items():
                require(blob(outputs[path])==sha,'Deployed Edge source mismatch: '+path)
            # Check all modified scripts and new hrefs before writing any repository files.
            for path,out in outputs.items():
                suffix=Path(path).suffix
                if suffix in ('.js','.ts'):syntax(out,suffix)
                elif suffix=='.html':validate_html(path,originals[path],out,set(outputs))
            # Dynamic links introduced by this patch must resolve to existing pages.
            for path in ('public/cancellations.html','public/report-listing.html'):
                require(path in outputs,'Missing form target '+path)
            with tempfile.TemporaryDirectory() as tmp:
                test=Path(tmp)/'test.cjs';test.write_text(TEST_JS)
                script=Path(tmp)/'support.js';script.write_bytes(outputs['public/shopdrop-support-199b.js'])
                subprocess.run(['node',str(test),str(script)],check=True)
            for path,original in originals.items():
                backup=BACKUP/path
                if not backup.exists():backup.parent.mkdir(parents=True,exist_ok=True);backup.write_bytes(original)
            for path,out in outputs.items():
                target=Path(path);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(out)
            for path,sha in protected.items():require(blob(Path(path).read_bytes())==sha,'Protected source changed after patch: '+path)
            for path,sha in expected.items():require(blob((BACKUP/path).read_bytes())==sha,'Original backup mismatch: '+path)
            allowed=set(outputs)|{(BACKUP/path).as_posix() for path in originals}
            changes=git('status','--porcelain','-z','--untracked-files=all').decode().split('\0')
            require(all(x[:2] in (' M','??') and x[3:] in allowed for x in changes if x),'Unapproved working-tree change')
            subprocess.run(['git','diff','--check','--',*sorted(outputs)],check=True)
            subprocess.run(['git','add','--',*sorted(allowed)],check=True)
            staged=set(x for x in git('diff','--cached','--name-only','-z').decode().split('\0') if x)
            require(staged<=allowed,'Unexpected staged file')
            subprocess.run(['git','diff','--cached','--check','--',*sorted(outputs)],check=True)
            print('Fix 199B: approved forms, reference links, existing exception-case viewer and deployed Edge source mirrors verified. Existing financial, courier, stock and routine publication logic untouched.')
            print('Verified file checksums:')
            for path,out in sorted(outputs.items()):print(blob(out),path)

        if __name__=='__main__':install()
        PYCODE
        if ! git diff --cached --quiet; then
          git config user.name "ShopDrop Integration"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix 199B connect cancellation requests and listing reports"
          git push origin HEAD:shopdrop-phase6-integration
        fi
