name: ShopDrop Fix 193F Other Services Private Details
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix193f-service-private-details.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
    - name: Install private service details and checkout gate
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REF_NAME" = shopdrop-phase6-integration
        python3 <<'PYCODE'
        from pathlib import Path
        import subprocess
        patches={'public/shopdrop-service-appointments-193d.js': [("    if(!provider&&pending&&row.status==='confirmed'){", "    if(pending&&['awaiting_provider','alternative_proposed','confirmed'].includes(row.status)){\n      actions.append(link('Save or update my private service address','./service-location-193f.html?role='+(provider?'provider':'customer')+'&booking_id='+encodeURIComponent(row.booking_id)));\n    }\n    if(!provider&&pending&&row.status==='confirmed'){"), ("    if(!inactive&&row.payment_status==='paid'){", "    if(!inactive&&row.payment_status==='paid'){\n      actions.append(link('View verified contact and service address','./service-location-193f.html?role='+(provider?'provider':'customer')+'&booking_id='+encodeURIComponent(row.booking_id)));")], 'public/service-appointments-193d.html': [('shopdrop-service-appointments-193d.js?v=193e', 'shopdrop-service-appointments-193d.js?v=193f')], 'public/shopdrop-service-checkout-193e.js': [("    const ready=await rpc(db,'shopdrop_service_checkout_readiness',{p_booking_id:booking});", "    const locationState=await rpc(db,'shopdrop_service_location_state_193f',{p_booking_id:booking});\n    if(typeof locationState?.ready!=='boolean'||typeof locationState.customer_ready!=='boolean'||typeof locationState.provider_ready!=='boolean')throw safe('Private address readiness could not be verified. Refresh and try again.');\n    if(!locationState.ready)throw safe(!locationState.customer_ready?'Save your private service address in My Service Appointments before checkout.':'The provider still needs to save their private service address. Return to My Service Appointments and try again later.');\n    const ready=await rpc(db,'shopdrop_service_checkout_readiness',{p_booking_id:booking});")], 'public/service-checkout-193e.html': [('shopdrop-service-checkout-193e.js?v=193e', 'shopdrop-service-checkout-193e.js?v=193f')]}
        shas={'public/shopdrop-service-appointments-193d.js': 'c4a466dac226b4d0dd3317523bbcf301353acc12', 'public/service-appointments-193d.html': '57bf85ae0f5e475d72d83a56d594cd3cff97c74e', 'public/shopdrop-service-checkout-193e.js': '9ecf7995906ae7d21873e45380f20677fd21eb37', 'public/service-checkout-193e.html': 'fd650cd20be499375ebcb3ed5c8c0fd9288f08b5'}
        new_files={'public/service-location-193f.html': '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">\n<title>Private Service Address | Shop&amp;Drop</title><link rel="stylesheet" href="./shopdrop-transport-search-192b.css">\n<style>label{display:block;font-weight:bold}select,textarea{box-sizing:border-box;width:100%;font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0 12px;min-height:46px}textarea{min-height:90px}#locationStatus,#paidDetails{overflow-wrap:anywhere} [hidden]{display:none!important}</style></head>\n<body><header><a href="./index.html">Home</a><a href="./services.html">Other Services</a><a href="./account.html">My Account</a></header><main><section class="panel"><h1>Private Service Address</h1>\n<p>Your address and contact details are not shared with the other party before verified payment. Enter the address relevant to this appointment, not an unrelated home address.</p>\n<p id="locationStatus" role="status" aria-live="polite">Checking your appointment…</p>\n<form id="locationForm" hidden autocomplete="off"><label for="province">Province</label><select id="province" required></select><label for="town">Town or city</label><select id="town" required></select><label for="streetAddress" id="addressLabel">Street address</label><textarea id="streetAddress" required maxlength="500" autocomplete="off"></textarea><button id="saveLocation" type="submit">Save private address</button></form>\n<div id="paidDetails" hidden></div><button id="refreshLocation" type="button">Refresh details</button><a class="btn" id="backAppointments" href="./service-appointments-193d.html">Back to My Service Appointments</a>\n</section></main><script src="./shopdrop-service-location-193f.js?v=193f"></script></body></html>\n', 'public/shopdrop-service-location-193f.js': "(() => {\n  'use strict';\n  const BASE='https://dtkdvvxpwonywtsgqmdx.supabase.co',KEY='sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q';\n  const get=id=>document.getElementById(id), status=get('locationStatus'), form=get('locationForm'), details=get('paidDetails'), province=get('province'),town=get('town'),address=get('streetAddress'),save=get('saveLocation'),refresh=get('refreshLocation'),back=get('backAppointments');\n  if(!status||!form||!details||!province||!town||!address||!save||!refresh||!back)return;\n  const params=new URLSearchParams(location.search),booking=params.get('booking_id'),provider=params.get('role')==='provider';\n  const valid=typeof booking==='string'&&/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(booking);\n  back.href='./service-appointments-193d.html?role='+(provider?'provider':'customer')+(valid?'&booking_id='+encodeURIComponent(booking):'');\n  const el=(tag,text)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;return node;};\n  const safe=message=>Object.assign(Error(message),{safeMessage:message});\n  const authError=()=>Object.assign(Error('Sign in required'),{needsSignIn:true});\n  let clientPromise,catalogPromise,busy=false,row=null,catalog=null;\n  function message(text){status.replaceChildren(document.createTextNode(text));}\n  function fail(e){message(e?.needsSignIn?'Please sign in to view your private appointment.':e?.safeMessage||'Unable to load or save private details. Refresh and try again.');if(e?.needsSignIn){const a=el('a','Sign in');a.href='./sign-in.html';a.className='btn';status.append(a);}}\n  async function session(){\n    if(!clientPromise)clientPromise=import('https://esm.sh/@supabase/supabase-js@2.49.4').then(({createClient})=>createClient(BASE,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})).catch(e=>{clientPromise=undefined;throw e;});\n    const db=await clientPromise;\n    const {data:s,error:se}=await db.auth.getSession();if(se||!s?.session?.access_token)throw authError();\n    const {data:u,error:ue}=await db.auth.getUser(s.session.access_token);if(ue||!u?.user?.id)throw authError();return db;\n  }\n  async function rpc(db,name,args){const {data,error}=await db.rpc(name,args);if(error){if(error.code==='28000'||error.code==='PGRST301')throw authError();const allowed=['Choose a valid location and enter the street address','Customer address must match the booked service area','Booking not editable','Payment already started'];throw safe(allowed.includes(error.message)?error.message+'.':'Private booking details are unavailable.');}return data;}\n  async function locations(){if(!catalogPromise)catalogPromise=fetch('./shopdrop-sa-towns-181.json').then(async r=>{if(!r.ok)throw Error('Location data unavailable');const j=await r.json();if(!j.provinces||!Object.keys(j.provinces).length)throw Error('Location data unavailable');return j.provinces;}).catch(e=>{catalogPromise=undefined;throw e;});return catalogPromise;}\n  function fill(select,items,prompt){select.replaceChildren(new Option(prompt,''));for(const value of items)select.add(new Option(value,value));}\n  function towns(selected=''){fill(town,(catalog?.[province.value]||[]).slice().sort(),'Choose a town or city');if([...town.options].some(x=>x.value===selected))town.value=selected;town.disabled=busy||!provider||!province.value;}\n  function lock(on){busy=on;refresh.disabled=on;save.disabled=on;province.disabled=on||!provider;town.disabled=on||!provider||!province.value;address.disabled=on;}\n  async function selected(db){const rows=await rpc(db,'shopdrop_service_appointments_193d',{p_as_provider:provider});if(!Array.isArray(rows))throw Error('Invalid response');const match=rows.find(r=>r.booking_id===booking);if(!match)throw safe('This appointment is not available in your account.');return match;}\n  function showPaid(d){details.replaceChildren();details.hidden=false;if(d?.contacts_released!==true){details.append(el('p','The other party’s details are not available until payment is independently verified.'));return;}\n    details.append(el('h2',provider?'Customer contact and service address':'Provider contact and service address'));\n    const other=d.other_party||{},where=d.other_location||{};\n    for(const [label,value] of [['Name',other.name],['Mobile number',other.mobile_number],['Street address',where.street_address],['Town or city',where.town],['Province',where.province]])if(typeof value==='string'&&value.trim())details.append(el('p',label+': '+value));\n    if(!where.street_address)details.append(el('p','No private service address was saved for this booking.'));\n  }\n  async function load(notice=''){\n    if(busy)return;lock(true);form.hidden=true;details.hidden=true;details.replaceChildren();address.value='';row=null;message('Checking your private appointment…');\n    try{if(!valid)throw safe('Choose an appointment first.');const db=await session();row=await selected(db);const s=await rpc(db,'shopdrop_service_location_state_193f',{p_booking_id:booking});if(typeof s?.ready!=='boolean'||typeof s.customer_ready!=='boolean'||typeof s.provider_ready!=='boolean')throw Error('Invalid location state');\n      if(row.payment_status==='paid'){showPaid(await rpc(db,'shopdrop_service_paid_details_193f',{p_booking_id:booking}));message('Private appointment details.');return;}\n      if(row.booking_status!=='pending'||row.payment_status!=='pending'||!['awaiting_provider','alternative_proposed','confirmed'].includes(row.status)){message('This appointment is not open for address changes.');return;}\n      catalog=await locations();fill(province,Object.keys(catalog).sort(),'Choose a province');const own=s.own_location||{};\n      province.value=provider?(own.province||''):(row.province||'');towns(provider?(own.town||''):(row.town||''));\n      if(!provider&&(!province.value||!town.value))throw safe('The booked service area is unavailable. Return to your appointments.');address.value=own.street_address||'';\n      get('addressLabel').textContent=provider?'Your service or business address':'Address where the service is required';form.hidden=false;\n      message((notice?notice+' ':'')+(s.ready?'Both private addresses have been saved.':(provider?s.customer_ready:s.provider_ready)?'The other party has saved their address. Please save yours.':(provider?s.provider_ready:s.customer_ready)?'Your address is saved. Waiting for the other party.':'Both parties must save their private service addresses.'));\n    }catch(e){form.hidden=true;details.hidden=true;fail(e);}finally{lock(false);}\n  }\n  province.addEventListener('change',()=>towns());\n  form.addEventListener('submit',async e=>{e.preventDefault();if(busy||!row)return;if(!province.value||!town.value||!address.value.trim()||address.value.trim().length>500){message('Choose a province and town, and enter the street address.');return;}lock(true);let ok=false;try{const db=await session();const result=await rpc(db,'shopdrop_service_save_location_193f',{p_booking_id:booking,p_province:province.value,p_town:town.value,p_address:address.value.trim()});if(result!==true)throw Error('Address not saved');ok=true;}catch(e){fail(e);}finally{lock(false);}if(ok)await load('Your private address was saved.');});\n  refresh.addEventListener('click',()=>load());load();\n})();\n"}
        planned={}
        for name,changes in patches.items():
            p=Path(name); source=p.read_text(encoding='utf-8')
            if all(new in source for old,new in changes): continue
            sha=subprocess.check_output(['git','hash-object',name],text=True).strip()
            if sha!=shas[name]: raise SystemExit('Unexpected source version; no changes installed: '+name)
            updated=source
            for old,new in changes:
                if updated.count(old)!=1: raise SystemExit('Unexpected patch anchor: '+name)
                updated=updated.replace(old,new,1)
            backup=Path('backups/fix193f')/p.name
            if backup.exists() and backup.read_bytes()!=p.read_bytes(): raise SystemExit('Unexpected backup: '+name)
            planned[name]=updated
        for name,content in new_files.items():
            p=Path(name)
            if p.exists() and p.read_text(encoding='utf-8')!=content: raise SystemExit('Unexpected file collision: '+name)
        for name,content in planned.items():
            p=Path(name); backup=Path('backups/fix193f')/p.name
            backup.parent.mkdir(parents=True,exist_ok=True)
            if not backup.exists(): backup.write_bytes(p.read_bytes())
            p.write_text(content,encoding='utf-8')
        for name,content in new_files.items():
            if not Path(name).exists(): Path(name).write_text(content,encoding='utf-8')
        print('Fix 193F private service locations installed.')
        PYCODE
        node --check public/shopdrop-service-appointments-193d.js
        node --check public/shopdrop-service-checkout-193e.js
        node --check public/shopdrop-service-location-193f.js
        git diff --check
        git config user.name 'ShopDrop Integration'
        git config user.email 'actions@users.noreply.github.com'
        git add public/shopdrop-service-appointments-193d.js public/service-appointments-193d.html public/shopdrop-service-checkout-193e.js public/service-checkout-193e.html public/service-location-193f.html public/shopdrop-service-location-193f.js
        if test -d backups/fix193f; then git add backups/fix193f; fi
        if ! git diff --cached --quiet; then
          git commit -m 'Fix 193F private service addresses and verified payment details'
          git push origin HEAD:shopdrop-phase6-integration
        fi
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
