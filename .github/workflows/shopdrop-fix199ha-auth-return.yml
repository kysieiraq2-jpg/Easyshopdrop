name: ShopDrop Fix 199H-A Customer Authentication Return
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix199ha-auth-return.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verify and connect customer authentication return
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REF_NAME\" = shopdrop-phase6-integration\npython3 <<'PYCODE'\nfrom pathlib import\
        \ Path\nimport hashlib, subprocess, tempfile\nfrom html.parser import HTMLParser\nFILES={'public/sign-in.html': '26da37b2951e5dcf4ff669bf7c9d2f3113330f89',\
        \ 'public/register.html': 'c477e7247c9f5eb6a09df0f222a6d1d7d8ce7d9d', 'public/proof-of-delivery.html': 'bdf4f6efaf5cea07792a033378bcd072d857ebc7',\
        \ 'public/cancellations.html': '846a23c0696aff0472b8ecec0a0fb84db5133c7d', 'public/report-listing.html': '56b940048ce56564fcc00966ed4a4fbed56241a6',\
        \ 'public/service-appointments-193d.html': '1c79feacdc1139beadc0aaeb2a54d327c2ff6fd3', 'public/dispatch-appointments-192dd.html':\
        \ '35fad8b1069a2b17073c31dcc8e3c130a8ca8c3e', 'public/customer-dispute-evidence-199gb.html': '93a5b79f10ba3b2620f27010764f836a16530dc1'}\n\
        PROTECTED={'public/checkout.html': 'dd5e286a45f5210d1b2617a1ee7d734beff921c3', 'public/shopdrop-payment-selection.js':\
        \ 'de3c06e87bc2f00b18bb48016932282a3bd328c8', 'public/shopdrop-paid-confirmation-199db.js': '06b9e15e56763aca5a1f8ba46704d78c5bebf28f',\
        \ 'public/shopdrop-single-courier-199da.js': '8a0e194dc65f1d131b7ca9ad07eea6a32c9cb7ed', 'public/shopdrop-customer-evidence-199gb.js':\
        \ '5d643f8f42cb11c278a856ab7687e74e75596c8d', 'public/shopdrop-service-appointments-193d.js': 'c9b9df4d2973f46d6ab166b2463c8ef34e427f97',\
        \ 'public/shopdrop-dispatch-appointments-192dd.js': 'd139934300967800e4d023247e4920984f94cdbc', 'public/financial-statement.html':\
        \ '3f30b32802b2beaeafd85277420eaa3e46c7b9ab', 'public/dispute-evidence.html': '60b46349a1469926b81e6ea62856517ced98ec9d',\
        \ 'public/shopdrop-buyer-language.js': 'f9251641c014c9c97dbdd33e5602f0453001dd35', '.github/workflows/shopdrop-integration-pages.yml':\
        \ '5ca27368c51150bdf8f19a8cba91438c66436a1f'}\nPATCHES={'public/sign-in.html': [(\"  const next=new URLSearchParams(location.search).get('next');\\\
        n  const destination=next==='sell-item.html'?'./sell-item.html':'./account.html';\", \"  const destination=window.ShopDropReturn199h?.requested()||'./account.html';\"\
        )], 'public/register.html': [('if(new URLSearchParams(location.search).get(\\'next\\')===\\'sell-item.html\\'){const\
        \ link=document.querySelector(\\'a[href=\"./sign-in.html\"]\\');if(link)link.href=\\'./sign-in.html?next=sell-item.html\\\
        ';}', '// Safe authentication return links are connected by Fix 199H-A.'), (\"const next=new URLSearchParams(location.search).get('next');if(next==='sell-item.html'){window.location.assign('./sell-item.html');return;}\"\
        , 'const next=window.ShopDropReturn199h?.requested();if(next){window.location.assign(next);return;}')]}\nNEW={'public/shopdrop-auth-return-199ha.js':\
        \ \"/* Fix 199H-A: safe return to the selected customer task after authentication. */\\n(function(){\\n'use strict';\\\
        nconst rules=Object.freeze({\\n 'sell-item.html':{},\\n 'account.html':{},\\n 'proof-of-delivery.html':{order:'ref',shipment:'ref'},\\\
        n 'cancellations.html':{kind:'token',reference:'ref'},\\n 'report-listing.html':{kind:'token',reference:'ref'},\\\
        n 'service-appointments-193d.html':{role:'role',booking_id:'uuid',from_notification:'flag'},\\n 'dispatch-appointments-192dd.html':{role:'role',booking_id:'uuid',item:'uuid',from_notification:'flag'},\\\
        n 'customer-dispute-evidence-199gb.html':{dispute_id:'uuid',booking_type:'type',booking_id:'uuid',role:'role'}\\n});\\\
        nconst valid={uuid:v=>/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(v),ref:v=>/^[A-Za-z0-9_-]{1,120}$/.test(v),token:v=>/^[a-z_]{1,32}$/.test(v),role:v=>['customer','provider','buyer','seller'].includes(v),type:v=>['service','dispatch'].includes(v),flag:v=>v==='1'};\\\
        nfunction safe(raw){\\n if(typeof raw!=='string'||raw.length>900)return null;\\n const match=/^(?:\\\\.\\\\/)?([a-z0-9-]+\\\
        \\.html)(?:\\\\?([^#]*))?$/.exec(raw);\\n if(!match||!Object.hasOwn(rules,match[1]))return null;\\n const out=new\
        \ URLSearchParams(),input=new URLSearchParams(match[2]||'');\\n for(const [key,type] of Object.entries(rules[match[1]])){\\\
        n  const values=input.getAll(key);if(values.length===1&&valid[type](values[0]))out.set(key,values[0]);\\n }\\n return\
        \ './'+match[1]+(out.size?'?'+out.toString():'');\\n}\\nconst page=location.pathname.split('/').pop();\\nfunction\
        \ requested(){return safe(new URLSearchParams(location.search).get('next'));}\\nfunction current(){return safe(page+location.search);}\\\
        nfunction authLink(target){\\n if(target!=='sign-in.html'&&target!=='register.html')return null;\\n const next=(page==='sign-in.html'||page==='register.html')?requested():current();\\\
        n return './'+target+(next?'?next='+encodeURIComponent(next.slice(2)):'');\\n}\\nfunction rewrite(a){\\n if(!a)return;const\
        \ value=a.getAttribute('href')||'';\\n const match=/^(?:\\\\.\\\\/)?(sign-in|register)\\\\.html$/.exec(value);\\n\
        \ if(match){const next=authLink(match[1]+'.html');if(next)a.setAttribute('href',next);}\\n}\\nwindow.ShopDropReturn199h=Object.freeze({safe,requested,authLink});\\\
        nfor(const a of document.querySelectorAll('a[href]'))rewrite(a);\\n// Dynamic sign-in links are also handled on the\
        \ normal click/keyboard activation path.\\ndocument.addEventListener('click',event=>{const a=event.target?.closest?.('a[href]');rewrite(a);},true);\\\
        n})();\\n\", 'docs/SHOPDROP_FIX199HA_AUTH_RETURN.md': '# Fix 199H-A \u2014 Customer navigation\\n\\nVerified source\
        \ audit: 30 customer-facing pages, no missing literal local file links in that sample. Confirmed sign-in and registration\
        \ previously retained only sell-item.html. This fix preserves allowed order, dispute, booking and role references\
        \ for selected customer pages and rejects external destinations and arbitrary query fields. No private contact fields,\
        \ financial operations, provider activation, admin permissions or backend changes. Existing registration confirmation\
        \ behavior remains unchanged when no session is returned. Actual signed-in mobile testing remains outstanding; additional\
        \ dynamic routes and test pages still require audit.\\n'}\nBACKUP='backups/fix199ha/'\ndef require(ok,msg):\n    if\
        \ not ok:raise SystemExit(msg)\ndef gitsha(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\\0'+b).hexdigest()\n\
        def once(s,a,b):\n    require(s.count(a)==1,'Unexpected patch anchor: '+a[:90]);return s.replace(a,b,1)\ndef transform(p,s):\n\
        \    for a,b in PATCHES.get(p,[]):s=once(s,a,b)\n    return once(s,'</body>','<script src=\"./shopdrop-auth-return-199ha.js?v=199ha\"\
        ></script></body>')\nclass Scripts(HTMLParser):\n    def __init__(self):super().__init__();self.active=False;self.buf='';self.scripts=[]\n\
        \    def handle_starttag(self,tag,attrs):\n        if tag=='script' and not dict(attrs).get('src'):\n            self.active=True;self.buf=''\n\
        \    def handle_data(self,data):\n        if self.active:self.buf+=data\n    def handle_endtag(self,tag):\n      \
        \  if tag=='script' and self.active:self.scripts.append(self.buf);self.active=False\ndef check_js(s):\n    with tempfile.NamedTemporaryFile(suffix='.mjs')\
        \ as f:\n        f.write(s.encode());f.flush();subprocess.run(['node','--check',f.name],check=True)\ndef write_new(p,data):\n\
        \    path=Path(p);require(not path.exists() or path.read_bytes()==data,'Unexpected existing file: '+p)\n    path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)\n\
        for p,sha in PROTECTED.items():require(gitsha(Path(p).read_bytes())==sha,'Protected file differs: '+p)\noriginals={};updates={}\n\
        for p,sha in FILES.items():\n    path=Path(p);raw=path.read_bytes();bk=Path(BACKUP+p)\n    old=bk.read_bytes() if\
        \ bk.exists() else raw\n    require(gitsha(old)==sha,'Unexpected original source: '+p)\n    updated=transform(p,old.decode()).encode()\n\
        \    require(raw in (old,updated),'Unexpected current source: '+p)\n    parser=Scripts();parser.feed(updated.decode())\n\
        \    if p in PATCHES:\n        for s in parser.scripts:check_js(s)\n    originals[p]=old;updates[p]=updated\nfor p,s\
        \ in NEW.items():require(not Path(p).exists() or Path(p).read_bytes()==s.encode(),'Unexpected file: '+p)\ncheck_js(NEW['public/shopdrop-auth-return-199ha.js'])\n\
        for p,old in originals.items():write_new(BACKUP+p,old)\nfor p,s in NEW.items():write_new(p,s.encode())\nfor p,b in\
        \ updates.items():Path(p).write_bytes(b)\nfor p,sha in PROTECTED.items():require(gitsha(Path(p).read_bytes())==sha,'Protected\
        \ file changed: '+p)\nprint('Verified safe customer authentication return, exact source backups and protected files.')\n\
        PYCODE\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n\
        git add -- backups/fix199ha/public/cancellations.html backups/fix199ha/public/customer-dispute-evidence-199gb.html\
        \ backups/fix199ha/public/dispatch-appointments-192dd.html backups/fix199ha/public/proof-of-delivery.html backups/fix199ha/public/register.html\
        \ backups/fix199ha/public/report-listing.html backups/fix199ha/public/service-appointments-193d.html backups/fix199ha/public/sign-in.html\
        \ docs/SHOPDROP_FIX199HA_AUTH_RETURN.md public/cancellations.html public/customer-dispute-evidence-199gb.html public/dispatch-appointments-192dd.html\
        \ public/proof-of-delivery.html public/register.html public/report-listing.html public/service-appointments-193d.html\
        \ public/shopdrop-auth-return-199ha.js public/sign-in.html\ngit diff --cached --check -- public/sign-in.html public/register.html\
        \ public/proof-of-delivery.html public/cancellations.html public/report-listing.html public/service-appointments-193d.html\
        \ public/dispatch-appointments-192dd.html public/customer-dispute-evidence-199gb.html public/shopdrop-auth-return-199ha.js\
        \ docs/SHOPDROP_FIX199HA_AUTH_RETURN.md\npython3 <<'CHECK'\nimport subprocess\nallowed={'public/service-appointments-193d.html',\
        \ 'public/dispatch-appointments-192dd.html', 'public/register.html', 'public/shopdrop-auth-return-199ha.js', 'backups/fix199ha/public/dispatch-appointments-192dd.html',\
        \ 'backups/fix199ha/public/service-appointments-193d.html', 'public/sign-in.html', 'public/report-listing.html', 'backups/fix199ha/public/cancellations.html',\
        \ 'public/customer-dispute-evidence-199gb.html', 'backups/fix199ha/public/sign-in.html', 'backups/fix199ha/public/proof-of-delivery.html',\
        \ 'backups/fix199ha/public/customer-dispute-evidence-199gb.html', 'backups/fix199ha/public/report-listing.html', 'public/proof-of-delivery.html',\
        \ 'docs/SHOPDROP_FIX199HA_AUTH_RETURN.md', 'backups/fix199ha/public/register.html', 'public/cancellations.html'}\n\
        changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())\nif changed and\
        \ changed!=allowed:raise SystemExit('Unexpected staged changes: '+str(changed^allowed))\nCHECK\nif ! git diff --cached\
        \ --quiet; then\n git commit -m \"Fix 199H-A preserve safe customer authentication return links\"\n git push origin\
        \ HEAD:shopdrop-phase6-integration\nfi\n"
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
