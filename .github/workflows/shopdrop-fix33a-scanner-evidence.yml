
name: ShopDrop Fix33A - Courier Scanner Evidence

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix33a-scanner-evidence.yml'

permissions:
  contents: write

jobs:
  preserve-and-patch:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Preserve existing webhook and record scanner evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path(
              'supabase/functions/courier-tracking-webhook/index.ts'
          )

          original = path.read_text(encoding='utf-8')

          expected_sha = (
              '7f1d14d91df8444b62ffbc3d81c5f10ec971d319'
          )

          actual_sha = subprocess.check_output(
              ['git', 'hash-object', str(path)],
              text=True
          ).strip()

          if actual_sha != expected_sha:
              raise SystemExit(
                  'STOP: Webhook changed. Nothing replaced.'
              )

          if len(original.splitlines()) != 1366:
              raise SystemExit(
                  'STOP: Unexpected webhook length.'
              )

          required = [
              'scanner_event_code_required',
              'invalid_courier_scan_evidence',
              'collection_notification_enqueue_failed',
              'handleNonDelivery(',
              'recordTrackingEvent(',
              'eventExists(',
              'sendDeliveredToGateway'
          ]

          for marker in required:
              if marker not in original:
                  raise SystemExit(
                      'STOP: Previous fix missing: ' + marker
                  )

          anchor = '''          description:
            body.description ?? null,

          source:
            "authenticated_courier_webhook",'''

          replacement = '''          description:
            body.description ?? null,

          // Fix33A: retain separately validated scanner data.
          // This does not authorize seller payment.
          scan_event_code:
            normalize(
              body.scan_event_code ?? body.scan_code ??
              (normalize(body.event_type) === "scan" ? body.event_code : ""),
            ) || null,
          scan_occurred_at:
            body.scan_occurred_at ?? null,

          source:
            "authenticated_courier_webhook",'''

          if original.count(anchor) != 1:
              raise SystemExit(
                  'STOP: Exact scanner-recording anchor missing.'
              )

          updated = original.replace(
              anchor,
              replacement,
              1
          )

          if updated.replace(replacement, anchor, 1) != original:
              raise SystemExit(
                  'STOP: Preservation check failed.'
              )

          if len(updated.splitlines()) != 1376:
              raise SystemExit(
                  'STOP: Unexpected change size.'
              )

          for marker in required:
              if marker not in updated:
                  raise SystemExit(
                      'STOP: A previous fix was lost.'
                  )

          path.write_text(
              updated,
              encoding='utf-8'
          )

          print(
              'Fix33A prepared: original 1366 lines preserved.'
          )
          print(
              'Validated scanner metadata added without payout changes.'
          )
          PY

      - name: Verify and commit integration branch only
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git add \
            supabase/functions/courier-tracking-webhook/index.ts

          git diff --cached --name-only | grep -Fx \
            'supabase/functions/courier-tracking-webhook/index.ts'

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Fix33A preserve courier scanner event evidence'

          git push origin HEAD:shopdrop-phase6-integration

