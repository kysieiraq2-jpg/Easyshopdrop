
name: ShopDrop Fix62 - Three SA Door-to-Door Couriers

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix62-sa-courier-choices.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shopdrop-integrated-pages
  cancel-in-progress: false

jobs:
  show-sa-couriers:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Install safe courier choice cards
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'public/checkout.html':
                  '0a461bc12d5c037042798d31cf7ac71e46142c91',
              'public/shopdrop-courier-search.js':
                  '93a0c925c4cce35449e5585d3f92809111e1f873'
          }

          for filename, sha in expected.items():
              actual = subprocess.check_output(
                  ['git', 'hash-object', filename],
                  text=True
              ).strip()
              if actual != sha:
                  raise SystemExit(
                      'STOP: Source changed: ' + filename
                  )

          new_script = Path(
              'public/shopdrop-sa-courier-choices.js'
          )

          if new_script.exists():
              raise SystemExit(
                  'STOP: Courier choices script already exists'
              )

          page = Path('public/checkout.html')
          html = page.read_text(encoding='utf-8')

          def change(old, new, label):
              global html
              if html.count(old) != 1:
                  raise SystemExit(
                      'STOP: Unexpected checkout source at ' + label
                  )
              html = html.replace(old, new, 1)

          change(
              'Search supported local or international couriers. Only verified couriers with a real quotation can be booked. No private addresses are shared during search.',
              'Choose from three South African door-to-door courier companies. These options are for preview only until verified courier integrations are activated. Private buyer and seller addresses are not shared during this preview.',
              'courier description'
          )

          change(
              '<label for="phase6CourierQuery">Courier company</label>',
              '''<div id="shopdropSaCourierPanel">
              <h3>Door-to-door courier options</h3>
              <p class="muted">Choose a preferred courier company. No live quotation or booking will be created.</p>
              <div id="shopdropSaCourierGrid"
                   class="shopdrop-sa-courier-grid"
                   role="group"
                   aria-label="South African door-to-door couriers"></div>
              <p id="shopdropSaCourierMessage"
                 class="muted"
                 role="status"
                 aria-live="polite"></p>
              </div>
              <label for="phase6CourierQuery">Search approved couriers</label>''',
              'courier cards'
          )

          change(
              '<script src="./shopdrop-courier-search.js" defer></script>',
              '''<script src="./shopdrop-courier-search.js" defer></script>
              <script src="./shopdrop-sa-courier-choices.js?v=62" defer></script>''',
              'new independent courier script'
          )

          style = '''
          /* Fix62: Three door-to-door courier choices */
          .shopdrop-sa-courier-grid {
            display:grid;
            grid-template-columns:repeat(
              auto-fit,minmax(145px,1fr)
            );
            gap:10px;
            margin:12px 0;
          }

          .shopdrop-sa-courier-grid button {
            width:100%;
            min-width:0;
            min-height:85px;
            margin:0;
            padding:12px;
            background:#f0fdfa;
            color:#134e4a;
            border:1px solid #99d9cc;
            border-radius:10px;
            text-align:left;
            white-space:normal;
            overflow-wrap:anywhere;
          }

          .shopdrop-sa-courier-grid strong {
            display:block;
            font-size:15px;
          }

          .shopdrop-sa-courier-grid small {
            display:block;
            margin-top:7px;
            font-size:12px;
            line-height:1.4;
            color:#526273;
          }

          .shopdrop-sa-courier-grid button[aria-pressed="true"] {
            background:#ccf5e7;
            border:2px solid #0f766e;
          }

          .shopdrop-sa-courier-grid button:focus-visible {
            outline:3px solid #0f766e;
            outline-offset:2px;
          }
          '''

          change(
              '</style></head>',
              style + '</style></head>',
              'courier layout'
          )

          page.write_text(html, encoding='utf-8')

          new_script.write_text(
              """/* Fix62: Display-only SA courier shortlist.
                 Does not request quotes, bookings or payments. */
          (()=>{
            'use strict';

            const grid=document.getElementById(
              'shopdropSaCourierGrid'
            );
            const message=document.getElementById(
              'shopdropSaCourierMessage'
            );

            if(!grid||!message)return;

            const companies=[
              {
                name:'The Courier Guy',
                service:'Direct door-to-door delivery'
              },
              {
                name:'Aramex',
                service:'Click-Way door-to-door delivery'
              },
              {
                name:'RAM Hand-to-Hand',
                service:'Door collection and direct delivery'
              }
            ];

            const buttons=[];

            for(const company of companies){
              const button=document.createElement('button');
              button.type='button';
              button.setAttribute('aria-pressed','false');

              const title=document.createElement('strong');
              title.textContent=company.name;

              const detail=document.createElement('small');
              detail.textContent=company.service;

              button.append(title,detail);

              button.addEventListener('click',()=>{
                for(const other of buttons){
                  other.setAttribute(
                    'aria-pressed',
                    String(other===button)
                  );
                }

                message.textContent=
                  'Preferred courier: '+company.name+
                  '. This is a preview only. '+
                  'No quotation, payment or booking '+
                  'has been requested.';
              });

              buttons.push(button);
              grid.append(button);
            }

            message.textContent=
              'Select a courier company to preview your preference. '+
              'Live quotations and bookings are not active.';
          })();
          """,
              encoding='utf-8'
          )

          updated = page.read_text(encoding='utf-8')
          script = new_script.read_text(encoding='utf-8')

          assert updated.count(
              'id="shopdropSaCourierGrid"'
          ) == 1

          assert (
              'shopdrop-sa-courier-choices.js?v=62'
              in updated
          )

          assert (
              'local or international couriers'
              not in updated
          )

          for company in (
              'The Courier Guy',
              'Aramex',
              'RAM Hand-to-Hand'
          ):
              assert script.count(
                  "name:'" + company + "'"
              ) == 1

          for excluded in (
              'Pargo',
              'PAXI',
              'PostNet',
              'Bob Go'
          ):
              assert excluded not in script

          for element in (
              'phase6CourierQuery',
              'phase6CourierResults',
              'phase6CourierSelection',
              'deliveryAddressPanel',
              'phase6PaymentMethod'
          ):
              assert 'id="' + element + '"' in updated

          assert 'fetch(' not in script
          assert 'createOrder' not in script
          assert 'requestQuotes' not in script
          assert 'selectQuote' not in script

          print('PASS: Three SA courier choices')
          print('PASS: Existing courier search untouched')
          print('PASS: Checkout and address preserved')
          print('PASS: No booking or payment activation')
          PY

          node --check public/shopdrop-sa-courier-choices.js
          git add -N public/shopdrop-sa-courier-choices.js
          git diff --check

      - name: Commit corrected Fix62
        shell: bash
        run: |
          set -euo pipefail

          git add public/checkout.html
          git add public/shopdrop-sa-courier-choices.js

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Fix62 add three SA door-to-door courier previews'

          git push origin HEAD:shopdrop-phase6-integration

      - name: Configure integrated website
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy corrected Fix62
        id: deployment
        uses: actions/deploy-pages@v4
