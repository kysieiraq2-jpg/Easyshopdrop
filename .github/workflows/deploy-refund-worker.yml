name: ShopDrop - Approved Refund Worker Deploy

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/deploy-requests/refund-worker.txt'

permissions:
  contents: read

concurrency:
  group: shopdrop-approved-refund-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved integration revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify fresh deployment authorization and source
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          request='.github/deploy-requests/refund-worker.txt'
          source='supabase/functions/refund-worker/index.ts'
          test -f "$request"
          test "$(cat "$request")" = 'DEPLOY refund-worker'
          test -s "$source"
          grep -Fq 'shopdrop_verify_refund_worker' "$source"
          grep -Fq 'x-shopdrop-worker-token' "$source"
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo 'Cannot verify previous revision; refusing deployment.' >&2
            exit 1
          fi
          git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- "$request" | grep -Fx "$request"
          previous="$(git show "${BEFORE_SHA}:${request}" 2>/dev/null || true)"
          if [ "$previous" = 'DEPLOY refund-worker' ]; then
            echo 'Existing approval cannot be reused. Refusing deployment.' >&2
            exit 1
          fi
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy refund-worker with JWT verification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$PROJECT_REF"
          supabase functions deploy refund-worker --project-ref "$PROJECT_REF" --yes
