
name: ShopDrop Fix136 - Recognition Engines V2

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix136-recognition-engines.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration

      - name: Repair recognition library loading
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path=Path(
            'public/shopdrop-free-photo-screen.mjs'
          )

          expected={
            'public/shopdrop-free-photo-screen.mjs':
              '246b2609ae72ea74d0c0e6b05b6c960cf02bdd97',
            'public/shopdrop-product-photos.js':
              '8ed1f80f67814b9ffdc78ec827ea9293ad5ce7ea'
          }

          for name,sha in expected.items():
            actual=subprocess.check_output(
              ['git','hash-object',name],
              text=True
            ).strip()

            if actual!=sha:
              raise SystemExit(
                'SAFETY STOP: Unexpected file change: '+name
              )

          source=path.read_text(encoding='utf-8')

          start='async function getOCRWorker() {'
          end='function inspectText(text) {'

          if source.count(start)!=1 or source.count(end)!=1:
            raise SystemExit(
              'SAFETY STOP: Scanner structure changed'
            )

          a=source.index(start)
          b=source.index(end,a)

          replacement=r"""
          const scriptLoads=new Map();

          function loadLibrary(url,globalName){
            if(globalThis[globalName]){
              return Promise.resolve(globalThis[globalName]);
            }

            if(!scriptLoads.has(url)){
              const loading=new Promise((resolve,reject)=>{
                const script=document.createElement('script');
                let finished=false;

                const timeout=setTimeout(()=>{
                  fail(new Error(
                    globalName+' library loading timed out'
                  ));
                },30000);

                function fail(error){
                  if(finished)return;
                  finished=true;
                  clearTimeout(timeout);
                  script.remove();
                  reject(error);
                }

                script.src=url;
                script.async=true;

                script.onload=()=>{
                  if(finished)return;
                  clearTimeout(timeout);
                  finished=true;

                  const library=globalThis[globalName];

                  if(library){
                    resolve(library);
                  }else{
                    reject(new Error(
                      globalName+' library did not initialize'
                    ));
                  }
                };

                script.onerror=()=>fail(new Error(
                  globalName+' library download failed'
                ));

                document.head.appendChild(script);
              }).catch(error=>{
                scriptLoads.delete(url);
                throw error;
              });

              scriptLoads.set(url,loading);
            }

            return scriptLoads.get(url);
          }

          async function getOCRWorker(){
            if(!workerPromise){
              workerPromise=loadLibrary(
                'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
                'Tesseract'
              ).then(library=>{
                if(typeof library.createWorker!=='function'){
                  throw new Error(
                    'OCR worker function unavailable'
                  );
                }
                return library.createWorker('eng');
              }).catch(error=>{
                workerPromise=null;
                throw error;
              });
            }

            return workerPromise;
          }

          async function getBarcodeReader(){
            if(!barcodeReaderPromise){
              barcodeReaderPromise=loadLibrary(
                'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',
                'ZXing'
              ).then(library=>{
                if(!library.BrowserMultiFormatReader){
                  throw new Error(
                    'Barcode reader unavailable'
                  );
                }

                return new library.BrowserMultiFormatReader();
              }).catch(error=>{
                barcodeReaderPromise=null;
                throw error;
              });
            }

            return barcodeReaderPromise;
          }

          async function detectBarcode(file){
            if(typeof globalThis.BarcodeDetector==='function'){
              try{
                const detector=new BarcodeDetector();
                const bitmap=await createImageBitmap(file);

                try{
                  const found=await detector.detect(bitmap);
                  return found.length>0;
                }finally{
                  bitmap.close();
                }
              }catch(error){
                // Use ZXing if native detection fails.
              }
            }

            const reader=await getBarcodeReader();
            const url=URL.createObjectURL(file);

            try{
              try{
                const result=await reader.decodeFromImageUrl(
                  url
                );
                return Boolean(result);
              }catch(error){
                if(
                  error?.name==='NotFoundException' ||
                  error?.constructor?.name==='NotFoundException'
                ){
                  return false;
                }

                throw error;
              }
            }finally{
              URL.revokeObjectURL(url);
            }
          }

          """

          source=source[:a]+replacement+source[b:]

          path.write_text(
            source,encoding='utf-8'
          )

          print('PASS: OCR browser loader installed')
          print('PASS: Barcode browser loader installed')
          print('PASS: Native barcode fallback installed')
          print('PASS: Existing uploader unchanged')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail

          node --check \
            public/shopdrop-free-photo-screen.mjs

          git diff --check

          test "$(git diff --name-only)" = \
            "public/shopdrop-free-photo-screen.mjs"

          git add \
            public/shopdrop-free-photo-screen.mjs

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Fix136 repair OCR and barcode library loading"

          git push origin HEAD:shopdrop-phase6-integration
