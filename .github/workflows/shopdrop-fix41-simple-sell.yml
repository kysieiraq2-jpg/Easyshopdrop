
name: ShopDrop Fix41 - Simple Post Item

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix41-simple-sell.yml'

permissions:
  contents: write

jobs:
  quick-sell:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration only
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Install guarded simple seller page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          targets = {
            'public/index.html': 'bf6fa36be1c579d7dde25bb6022e5f5da016521e',
            'public/seller-apply.html': 'f4a6d3db0a0898e3ac0ff3946021f24656675e14'
          }

          for path, expected in targets.items():
              actual = subprocess.check_output(
                  ['git', 'hash-object', path],
                  text=True
              ).strip()
              if actual != expected:
                  raise SystemExit(
                      'STOP: Existing file changed: ' + path
                  )

          if Path('public/sell-item.html').exists():
              raise SystemExit(
                  'STOP: sell-item.html already exists'
              )

          index = Path('public/index.html').read_text(
              encoding='utf-8'
          )

          old = './seller-apply.html?type=product'

          if index.count(old) != 2:
              raise SystemExit(
                  'STOP: Unexpected homepage sell links'
              )

          index = index.replace(
              old,
              './sell-item.html'
          )

          Path('public/index.html').write_text(
              index,
              encoding='utf-8'
          )

          apply = Path(
              'public/seller-apply.html'
          ).read_text(encoding='utf-8')

          before = '<h1>Sell something — FREE</h1>'
          after = '<h1>Seller / business account details</h1><p><a href="./sell-item.html"><strong>Want to sell an item? Take photos and post it now — no application approval needed.</strong></a></p>'

          if apply.count(before) != 1:
              raise SystemExit(
                  'STOP: Existing seller page changed'
              )

          apply = apply.replace(before, after)

          Path('public/seller-apply.html').write_text(
              apply,
              encoding='utf-8'
          )
          PY

          cat > public/sell-item.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Post an Item | Shop&Drop</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#f3f5f8;color:#17202a;font:16px Arial,sans-serif}
          main{max-width:720px;margin:auto;padding:18px}
          section{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:19px;margin:14px 0}
          h1{font-size:27px}
          label{display:block;margin:13px 0 5px;font-weight:600}
          input,select,textarea,button{font:inherit;border-radius:7px;padding:12px;border:1px solid #cbd5e1}
          input,select,textarea{width:100%}
          textarea{min-height:100px}
          button{background:#0f766e;color:white;border:0;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
          button:disabled{opacity:.6}
          a{color:#0f766e}
          .muted{color:#526273}
          .message{background:#eaf7f4;border-radius:8px;padding:12px;white-space:pre-wrap}
          .error{background:#fff0e8}
          #shopdropPhotoPreview{display:flex;flex-wrap:wrap}
          #shopdropPhotoPreview button{width:auto}
          </style>
          </head>
          <body>
          <main>
          <a href="./index.html">← Shop&Drop</a>
          <h1>Sell an item — FREE</h1>
          <p>Take photos, describe your item, set your price and post it. No seller application or manual approval required for ordinary lawful listings.</p>

          <section>
          <p id="accountStatus" class="muted">Checking your sign-in…</p>
          <p class="muted">New? <a href="./register.html">Create a free account</a>. Already registered? <a href="./sign-in.html">Sign in</a>. You only register once; bank card details are not collected to advertise.</p>
          </section>

          <form id="itemForm">
          <section>
          <label for="n">What are you selling?</label>
          <input id="n" maxlength="150" minlength="2" required placeholder="e.g. Wooden coffee table">

          <label for="d">Describe your item</label>
          <textarea id="d" maxlength="3000" minlength="10" required placeholder="Condition, size, age, defects and any details a buyer should know"></textarea>

          <label for="p">Your selling price in rand (R)</label>
          <input id="p" type="number" min="1" step="0.01" inputmode="decimal" required placeholder="e.g. 450">

          <label for="c">Category</label>
          <select id="c" required>
          <option value="">Choose a category</option>
          </select>

          <label for="condition">Condition</label>
          <select id="condition">
          <option value="used">Second-hand / Used</option>
          <option value="new">New</option>
          <option value="like_new">Like new</option>
          <option value="refurbished">Refurbished</option>
          </select>

          <label for="town">Town or area (optional)</label>
          <input id="town" maxlength="120" placeholder="e.g. Pretoria">
          </section>

          <section>
          <h2>Photos (1–6)</h2>
          <label for="photo">Choose pictures from your phone or computer</label>
          <input id="photo" type="file" accept="image/jpeg,image/png,image/webp" multiple>

          <label for="shopdropPhotoCamera">Or take a picture with your phone</label>
          <input id="shopdropPhotoCamera" type="file" accept="image/*" capture="environment">

          <p class="muted">The first picture is the main picture. You can add photos in more than one selection.</p>
          <div id="shopdropPhotoPreview" aria-label="Selected photographs"></div>
          <p id="uploadStatus" class="muted" role="status"></p>
          </section>

          <section>
          <label><input id="ownership" type="checkbox" required style="width:auto"> I own this item or am allowed to sell it. The description and photos are accurate.</label>

          <button id="postButton" type="submit">Post My Item</button>
          <p id="result" class="message" role="status" aria-live="polite" hidden></p>
          </section>
          </form>

          <p class="muted">Shop&Drop handles listing automatically. Payment, courier booking and payout take place separately when an item is purchased. Shop&Drop never asks for your card PIN or OTP.</p>
          </main>

          <script src="./shopdrop-product-photos.js" defer></script>
          <script type="module">
          import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';

          const sb=createClient(
            'https://dtkdvvxpwonywtsgqmdx.supabase.co',
            'sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q',
            {auth:{
              persistSession:true,
              autoRefreshToken:true,
              detectSessionInUrl:true
            }}
          );

          const $=id=>document.getElementById(id);
          let pendingId=null,photosAttached=false,processing=false;

          function show(message,error=false){
            const el=$('result');
            el.hidden=false;
            el.className='message'+(error?' error':'');
            el.textContent=message;
          }

          async function setup(){
            try{
              const {data:{user}}=await sb.auth.getUser();

              $('accountStatus').textContent=user
                ?'Signed in. You can post your item now.'
                :'Sign in to post. You can fill in the form and select photos first.';

              const response=await fetch(
                './taxonomy.json',
                {cache:'no-store'}
              );

              if(!response.ok){
                throw Error('Could not load categories');
              }

              const taxonomy=await response.json();

              for(const department of taxonomy.departments||[]){
                if(
                  typeof department.name==='string' &&
                  department.name.trim()
                ){
                  $('c').add(
                    new Option(
                      department.name,
                      department.name
                    )
                  );
                }
              }
            }catch(e){
              $('accountStatus').textContent=
                'Unable to load account or categories. Refresh and try again.';
            }
          }

          setup();

          $('itemForm').addEventListener('submit',async event=>{
            event.preventDefault();
            if(processing)return;
            if(!$('itemForm').reportValidity())return;

            processing=true;
            $('postButton').disabled=true;

            try{
              const {
                data:{user},
                error:authError
              }=await sb.auth.getUser();

              if(authError||!user){
                throw Error(
                  'Please sign in to your free Shop&Drop account, then return to post your item.'
                );
              }

              const photos=window.ShopDropProductPhotos;

              if(!photos){
                throw Error(
                  'Photo uploader has not loaded. Refresh the page.'
                );
              }

              if(
                !photosAttached &&
                (photos.count()<1||photos.count()>6)
              ){
                throw Error(
                  'Select one to six photographs first.'
                );
              }

              const description=$('d').value.trim();

              if(description.length<10){
                throw Error(
                  'Please describe the item in at least 10 characters.'
                );
              }

              const amount=Number($('p').value);

              if(!Number.isFinite(amount)||amount<=0){
                throw Error('Enter a valid price.');
              }

              if(!pendingId){
                show('Saving your advertisement…');

                const {
                  data:created,
                  error:saveError
                }=await sb.from('products')
                  .insert({
                    seller_id:user.id,
                    title:$('n').value.trim(),
                    description,
                    category:$('c').value,
                    condition:$('condition').value,
                    price:amount,
                    currency:'ZAR',
                    country_code:'ZA',
                    quantity:1,
                    location:$('town').value.trim()||null,
                    listing_status:'pending'
                  })
                  .select(
                    'id,listing_reference,listing_status'
                  )
                  .single();

                if(saveError||!created){
                  throw Error(
                    'Could not save the item: '+
                    (saveError?.message||'Please try again.')
                  );
                }

                pendingId=created.id;
                photos.setPending(created);
              }

              if(!photosAttached){
                const {
                  data:product,
                  error:loadError
                }=await sb.from('products')
                  .select(
                    'id,listing_reference,listing_status'
                  )
                  .eq('id',pendingId)
                  .eq('seller_id',user.id)
                  .single();

                if(loadError||!product){
                  throw Error(
                    'Could not resume the saved item. Contact support.'
                  );
                }

                const count=await photos.attach(
                  sb,
                  user.id,
                  product,
                  message=>show(message)
                );

                if(count<1){
                  throw Error(
                    'Please attach at least one photograph.'
                  );
                }

                photosAttached=true;
              }

              show('Publishing your item…');

              const {
                data:result,
                error:publishError
              }=await sb.functions.invoke(
                'shopdrop-quick-publish',
                {body:{product_id:pendingId}}
              );

              if(publishError||result?.published!==true){
                throw Error(
                  'Your item and photos are saved. Publication could not finish: '+
                  (result?.error||'Please try again')+
                  '. Press Post My Item again to retry without creating another item.'
                );
              }

              show(
                'Your item is posted! Reference: '+
                (result.listing_reference||pendingId)+
                '. No Shop&Drop approval is required.'
              );

              const link=document.createElement('a');
              link.href='./product.html?id'+
                '='+encodeURIComponent(pendingId);
              link.textContent=' View your item';
              $('result').append(link);

              $('postButton').textContent='Item Posted';
              $('postButton').disabled=true;
              return;

            }catch(e){
              show(
                e?.message||'Unable to post this item.',
                true
              );
            }finally{
              processing=false;
              if($('postButton').textContent!=='Item Posted'){
                $('postButton').disabled=false;
              }
            }
          });
          </script>
          </body>
          </html>
          HTML

          git diff --check

      - name: Commit only the three approved changes
        shell: bash
        run: |
          set -euo pipefail
          git add public/index.html
          git add public/seller-apply.html
          git add public/sell-item.html

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Fix41 direct one-page item listing without seller approval'

          git push origin HEAD:shopdrop-phase6-integration

