        BACKUP=Path('backups/fix199a')
        def require(ok,msg):
            if not ok: raise SystemExit(msg)
        def blob(raw):return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
        class Links(HTMLParser):
            def __init__(self,s):super().__init__();self.hrefs=[];self.feed(s)
            def handle_starttag(self,tag,attrs):
                if tag=='a':self.hrefs.extend(v for k,v in attrs if k=='href')
        def scriptblocks(s):return re.findall(r'<script\b[^>]*>[\s\S]*?</script>',s,re.I)
        def transform(path,raw):
            before=raw.decode('utf-8');s=before
            for old,new,count in PATCHES[path]:
                require(s.count(old)==count,'Unexpected anchor: '+path+' '+old[:100])
                s=s.replace(old,new,count)
            require(scriptblocks(before)==scriptblocks(s),'Script changed: '+path)
            # Verify that all link additions/removals exactly match the approved replacements.
            expected=Counter(Links(before).hrefs)
            for old,new,count in PATCHES[path]:
                for href in Links(old).hrefs:expected[href]-=count
                for href in Links(new).hrefs:expected[href]+=count
            require(not any(n<0 for n in expected.values()),'Unexpected anchor count: '+path)
            require(Counter(Links(s).hrefs)==+expected,'Unapproved link change: '+path)
            if path in ('public/account.html','public/my-purchases-sales-198j.html'):
                require(not any(re.search(r'(?:^|/)(?:financial-statement|payment-disputes)\.html(?:[?#]|$)',h) for h in Links(s).hrefs),'Admin-only destination remains in customer account')
            return s.encode('utf-8')
        def main():
            require(os.environ.get('GITHUB_REF_NAME')=='shopdrop-phase6-integration','Wrong branch')
            require(set(EXPECTED)==set(PATCHES) and not(set(EXPECTED)&set(PROTECTED)),'Invalid allowlist')
            for path,sha in PROTECTED.items():require(blob(Path(path).read_bytes())==sha,'Protected file differs: '+path)
            originals={};outputs={}
            for path,sha in EXPECTED.items():
                p=Path(path); raw=p.read_bytes(); backup=BACKUP/p.name
                original=backup.read_bytes() if backup.exists() else raw
                require(blob(original)==sha,'Unexpected source or backup: '+path)
                out=transform(path,original)
                require(raw in (original,out),'Unexpected current file: '+path)
                originals[path]=original;outputs[path]=out
            # All destinations introduced by this fix must exist before writing anything.
            for path,patches in PATCHES.items():
                for old,new,count in patches:
                    for href in Links(new).hrefs:
                        target=href.split('?',1)[0].split('#',1)[0]
                        if target.startswith('./'):target=target[2:]
                        require(Path('public',target).is_file(),'Missing destination: '+href)
            # Ensure the gateway still points to the real profile and transaction sections, not itself.
            h=outputs['public/my-purchases-sales-198j.html'].decode()
            for href in ('./account.html','./account.html#orders','./account.html#notifications','./account.html#seller-courier-pickup-panel','./account.html#shopdropPaymentPurpose195a','./receipts.html','./returns.html','./feedback.html'):
                require(href in Links(h).hrefs,'Missing customer action: '+href)
            for path,raw in originals.items():
                b=BACKUP/Path(path).name
                if not b.exists():b.parent.mkdir(parents=True,exist_ok=True);b.write_bytes(raw)
                Path(path).write_bytes(outputs[path])
            for path,sha in PROTECTED.items():require(blob(Path(path).read_bytes())==sha,'Protected file changed: '+path)
            print('Fix 199A: only approved customer navigation anchors updated; inline and external script tags preserved.')
