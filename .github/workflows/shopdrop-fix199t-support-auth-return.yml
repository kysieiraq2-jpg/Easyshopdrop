name: ShopDrop Fix 199T Support Auth Return
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix199t-support-auth-return.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: shopdrop-fix199t
  cancel-in-progress: false
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
        persist-credentials: true
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Correct and verify support authentication return
      shell: bash
      run: |
        set -euo pipefail
        python3 <<'PYCODE'
        from pathlib import Path
        import hashlib, os, subprocess, tempfile
        from html.parser import HTMLParser
        PATCHES = {'public/shopdrop-auth-return-199ha.js': ('f8d1e3e34dfebbf873025590faa8b20f3b33096b', [(" 'checkout.html':{},", " 'checkout.html':{},\n 'feedback.html':{},\n 'services.html':{},"), (" if(match[3]&&(match[1]!=='account.html'||!accountSections.has(match[3])))return null;", " if(match[3]&&!((match[1]==='account.html'&&accountSections.has(match[3]))||(match[1]==='services.html'&&match[3]==='shopdropCategorySuggestion199t')))return null;"), ('window.ShopDropReturn199h=Object.freeze({safe,requested,authLink});', "function appendSupportLinks(status,error,target){\n const authErrors=['Please sign in to Shop&Drop first.','Session expired. Please sign in again.'];\n if(!status||!authErrors.includes(error?.message))return false;\n const next=safe(target);\n if(!next)return false;\n for(const [page,label] of [['sign-in.html','Sign in'],['register.html','Create account']]){\n  const a=document.createElement('a');\n  a.href='./'+page+'?next='+encodeURIComponent(next.slice(2));\n  a.textContent=label;\n  status.append(document.createTextNode(' '),a);\n }\n return true;\n}\nwindow.ShopDropReturn199h=Object.freeze({safe,requested,authLink,appendSupportLinks});")]), 'public/sign-in.html': ('c19fd7bfa7d963b10785e64ca79abcc4d6a538ba', [('./shopdrop-auth-return-199ha.js?v=199r', './shopdrop-auth-return-199ha.js?v=199t')]), 'public/register.html': ('2f5ba68e1c6d09b7da96f2b0ae8a687d57398f47', [('./shopdrop-auth-return-199ha.js?v=199r', './shopdrop-auth-return-199ha.js?v=199t')]), 'public/feedback.html': ('a30b199689214efc05090a108239020fa0069c0e', [('<script src="supabase-adapter.js"></script>', '<script src="supabase-adapter.js"></script>\n<script src="./shopdrop-auth-return-199ha.js?v=199t"></script>'), ("        'Submission failed. Please try again.';\n\n    } finally {", "        'Submission failed. Please try again.';\n      window.ShopDropReturn199h?.appendSupportLinks(status,error,'feedback.html');\n\n    } finally {")]), 'public/services.html': ('12ae86dfa6d94e0404e5e56faad0dd7fa4a9ebe7', [('<section class="panel">\n<h2>Can\'t find the right category?</h2>', '<section class="panel" id="shopdropCategorySuggestion199t">\n<h2>Can\'t find the right category?</h2>'), ('<!-- SHOPDROP FIX 7: Additive category suggestion integration -->\n<script src="./supabase-adapter.js"></script>', '<!-- SHOPDROP FIX 7: Additive category suggestion integration -->\n<script src="./supabase-adapter.js"></script>\n<script src="./shopdrop-auth-return-199ha.js?v=199t"></script>'), ("    error?.message||'Unable to submit suggestion.';\n  }finally{", "    error?.message||'Unable to submit suggestion.';\n   window.ShopDropReturn199h?.appendSupportLinks(status,error,'services.html#shopdropCategorySuggestion199t');\n  }finally{")])}
        TEST = "const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');\nconst source=fs.readFileSync(process.argv[2],'utf8');\nfunction run(page,search='',hash=''){\n const window={},document={querySelectorAll:()=>[],addEventListener(){},createElement:()=>({}),createTextNode:t=>t};\n vm.runInNewContext(source,{window,document,location:{pathname:'/'+page,search,hash},URLSearchParams});return window.ShopDropReturn199h;\n}\nconst api=run('feedback.html');\nfor (const [target,expected] of [['feedback.html','./feedback.html'],['services.html#shopdropCategorySuggestion199t','./services.html#shopdropCategorySuggestion199t'],['feedback.html?reply_email=private%40example.com&message=private','./feedback.html'],['account.html#notifications','./account.html'],['checkout.html','./checkout.html']]){\n const result=api.safe(target);assert.equal(result, target==='account.html#notifications'?'./account.html#notifications':expected);\n}\nfor(const target of ['https://evil.example/','//evil.example/','../feedback.html','services.html#bad','feedback.html#orders','checkout.html#shopdropCategorySuggestion199t','javascript:alert(1)','admin.html'])assert.equal(api.safe(target),null);\nfor(const [page,target] of [['feedback.html','feedback.html'],['services.html','services.html#shopdropCategorySuggestion199t']]){\n const a=run(page);const status={children:[],append(...v){this.children.push(...v)}};\n assert.equal(a.appendSupportLinks(status,Error('Please sign in to Shop&Drop first.'),target),true);\n assert.equal(status.children.length,4);\n for(const [i,auth] of [[1,'sign-in.html'],[3,'register.html']]){\n  const href=status.children[i].href;assert.equal(href,'./'+auth+'?next='+encodeURIComponent(target));\n  const returner=run(auth,href.slice(href.indexOf('?')));assert.equal(returner.requested(),'./'+target);\n  const other=auth==='sign-in.html'?'register.html':'sign-in.html';assert.equal(returner.authLink(other),'./'+other+'?next='+encodeURIComponent(target));\n }\n const expired={children:[],append(...v){this.children.push(...v)}};assert.equal(a.appendSupportLinks(expired,Error('Session expired. Please sign in again.'),target),true);assert.equal(expired.children.length,4);\n const bad={children:[],append(...v){this.children.push(...v)}};assert.equal(a.appendSupportLinks(bad,Error('Network failed'),target),false);assert.equal(bad.children.length,0);assert.equal(a.appendSupportLinks(bad,Error('Please sign in to Shop&Drop first.'),'https://evil.example'),false);\n}\nassert.equal(run('account.html','','#notifications').authLink('sign-in.html'),'./sign-in.html?next=account.html%23notifications');\nassert.equal(run('sign-in.html','?next=returns.html%3Forder%3DSD-123').requested(),'./returns.html?order=SD-123');\nconsole.log('PASS: support return links, expired session, network errors, account navigation, private query stripping, external redirects');"
        BRANCH = 'shopdrop-phase6-integration'
        def git(*args):
            return subprocess.check_output(['git', *map(str,args)], text=True).strip()
        def blob(data):
            return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
        def require(ok, message):
            if not ok: raise SystemExit('SAFETY STOP: '+message)
        def update(data, changes):
            result=data
            for a,b in changes:
                a,b=a.encode(),b.encode()
                require(result.count(a)==1,'unexpected replacement anchor count')
                result=result.replace(a,b,1)
            original=result
            for a,b in reversed(changes):
                a,b=a.encode(),b.encode()
                require(original.count(b)==1,'unexpected reverse anchor count')
                original=original.replace(b,a,1)
            require(original==data,'unrelated code changed')
            return result
        require(os.environ.get('GITHUB_REF_NAME')==BRANCH and git('branch','--show-current')==BRANCH,'incorrect branch')
        require(not git('status','--porcelain'),'dirty checkout')
        originals={}; updates={}; backups={}
        for path,(expected,changes) in PATCHES.items():
            p=Path(path); b=Path('backups/fix199t')/p
            require(p.is_file() and not p.is_symlink() and not b.is_symlink(),'unexpected path '+path)
            backups[path]=b
            if b.exists():
                old=b.read_bytes()
                require(blob(old)==expected and p.read_bytes()==update(old,changes),'partial or modified prior fix '+path)
                originals[path]=old; updates[path]=p.read_bytes()
            else:
                old=p.read_bytes()
                require(blob(old)==expected,'current source changed '+path)
                originals[path]=old; updates[path]=update(old,changes)
        existing=sum(p.exists() for p in backups.values())
        require(existing in (0,len(PATCHES)),'partial prior backup')
        class Scripts(HTMLParser):
            def __init__(self):
                super().__init__(); self.scripts=[]; self.current=None
            def handle_starttag(self,tag,attrs):
                if tag=='script':
                    attrs=dict(attrs)
                    self.current=None if 'src' in attrs else (attrs.get('type',''),[])
            def handle_data(self,data):
                if self.current is not None: self.current[1].append(data)
            def handle_endtag(self,tag):
                if tag=='script' and self.current is not None:
                    self.scripts.append((self.current[0],''.join(self.current[1]))); self.current=None
        with tempfile.TemporaryDirectory() as td:
            t=Path(td)
            for path,data in updates.items():
                if path.endswith('.js'):
                    f=t/(Path(path).stem+('.mjs' if path.endswith('shopdrop-private-contact.js') else '.js'));f.write_bytes(data)
                    subprocess.run(['node','--check',str(f)],check=True)
                else:
                    before=Scripts();before.feed(originals[path].decode());after=Scripts();after.feed(data.decode())
                    restored=after.scripts
                    if path in ('public/feedback.html','public/services.html'):
                        old,new=PATCHES[path][1][-1]
                        require(sum(code.count(new) for kind,code in restored)==1,'support catch anchor mismatch')
                        restored=[(kind,code.replace(new,old,1)) for kind,code in restored]
                    require(before.scripts==restored,'unrelated inline operational script changed '+path)
                    for i,(kind,code) in enumerate(after.scripts):
                        if kind not in ('','module','text/javascript','application/javascript'): continue
                        f=t/(Path(path).stem+str(i)+('.mjs' if kind=='module' else '.js'));f.write_text(code)
                        subprocess.run(['node','--check',str(f)],check=True)
            test=t/'test.cjs';test.write_text(TEST)
            subprocess.run(['node',str(test),str(t/'shopdrop-auth-return-199ha.js')],check=True)
        if existing:
            print('Already installed; all exact backups and patched files verified.');raise SystemExit(0)
        for path,data in updates.items():
            b=backups[path];b.parent.mkdir(parents=True,exist_ok=True);b.write_bytes(originals[path]);Path(path).write_bytes(data)
            require(b.read_bytes()==originals[path] and Path(path).read_bytes()==data,'write mismatch '+path)
        require(set(git('diff','--name-only').splitlines())==set(PATCHES),'unexpected tracked changes')
        allowed=set(PATCHES)|{str(b) for b in backups.values()}
        subprocess.run(['git','add','--',*sorted(allowed)],check=True)
        require(set(git('diff','--cached','--name-only').splitlines())==allowed,'unexpected staged changes')
        require(not git('diff','--name-only') and not git('ls-files','--others','--exclude-standard'),'unrelated files')
        subprocess.run(['git','diff','--cached','--check','--',*PATCHES],check=True)
        print('PASS: exact source hashes, reversible patches, preserved unrelated inline scripts, syntax, support navigation mock tests and exact staged paths.')
        PYCODE
        if ! git diff --cached --quiet; then
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix 199T connect support sign-in returns'
          git push origin HEAD:shopdrop-phase6-integration
        fi
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
