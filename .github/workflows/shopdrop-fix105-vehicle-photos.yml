
name: ShopDrop Fix105B - Vehicle Photos in Existing Browse

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix105-vehicle-photos.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Connect vehicle photographs
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path=Path("public/categories.html")
          original=path.read_text(encoding="utf-8")

          start=original.find(
            "/* Fix101: Public approved vehicle advertisements."
          )
          end=original.find("</script>",start)

          if start<0 or end<0:
              raise SystemExit(
                "SAFETY STOP: Dispatch browsing section missing"
              )

          section=original[start:end]

          marker="""      card.append(
                  type,title,area,description,link
                );
                fragment.append(card);"""

          # Normalize indentation for matching only.
          # The original file is not reformatted.
          actual="""      card.append(
                  type,title,area,description,link
                );
                fragment.append(card);"""

          normalized=section.replace(
            "        type,title,area,description,link",
            "          type,title,area,description,link"
          )

          if "shopdropVehiclePhotoGallery" in original:
              raise SystemExit(
                "SAFETY STOP: Gallery already connected"
              )

          exact="""      card.append(
                  type,title,area,description,link
                );
                fragment.append(card);"""

          # Use the actual verified source formatting.
          exact=(
            "      card.append(\n"
            "        type,title,area,description,link\n"
            "      );\n"
            "      fragment.append(card);"
          )

          if section.count(exact)!=1:
              raise SystemExit(
                "SAFETY STOP: Dispatch card structure changed"
              )

          replacement="""      card.append(
                  type,title,area,description,link
                );

                // Fix105B: Only published vehicle photos.
                (async()=>{
                  try{
                    const base=
                      'https://dtkdvvxpwonywtsgqmdx.supabase.co';
                    const key=
                      'sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q';

                    const query=new URLSearchParams({
                      select:
                        'photo_position,storage_bucket,storage_path',
                      vehicle_advert_id:'eq.'+item.id,
                      order:'photo_position.asc',
                      limit:'6'
                    });

                    const response=await fetch(
                      base+
                      '/rest/v1/shopdrop_public_vehicle_ad_photos?'+
                      query.toString(),
                      {
                        headers:{
                          apikey:key,
                          Accept:'application/json'
                        }
                      }
                    );

                    if(!response.ok)return;

                    const photos=await response.json();
                    if(!Array.isArray(photos))return;

                    const gallery=document.createElement('div');
                    gallery.className='shopdropVehiclePhotoGallery';
                    gallery.style.cssText=
                      'display:flex;gap:8px;overflow-x:auto;'+
                      'margin:12px 0;';

                    for(const photo of photos.slice(0,6)){
                      if(
                        photo.storage_bucket!==
                          'shopdrop-vehicle-ad-gallery'||
                        !photo.storage_path
                      )continue;

                      const path=photo.storage_path
                        .split('/')
                        .map(encodeURIComponent)
                        .join('/');

                      const signed=await fetch(
                        base+
                        '/storage/v1/object/sign/'+
                        'shopdrop-vehicle-ad-gallery/'+path,
                        {
                          method:'POST',
                          headers:{
                            apikey:key,
                            'Content-Type':'application/json'
                          },
                          body:JSON.stringify({
                            expiresIn:3600
                          })
                        }
                      );

                      if(!signed.ok)continue;

                      const data=await signed.json();
                      if(!data.signedURL)continue;

                      const imageURL=new URL(
                        data.signedURL,base
                      );

                      if(imageURL.origin!==base)continue;

                      const img=document.createElement('img');
                      img.src=imageURL.href;
                      img.alt='Vehicle advertisement photograph';
                      img.loading='lazy';
                      img.style.cssText=
                        'width:150px;height:120px;'+
                        'object-fit:cover;border-radius:8px;'+
                        'flex-shrink:0;';

                      gallery.append(img);
                    }

                    if(gallery.childElementCount){
                      card.insertBefore(gallery,area);
                    }
                  }catch(_){
                    // Existing cards remain functional.
                  }
                })();

                fragment.append(card);"""

          # Convert only the replacement's indentation
          # to the original Dispatch card formatting.
          replacement=replacement.replace(
            "                  type,title,area,description,link",
            "        type,title,area,description,link"
          ).replace(
            "                );\n\n                // Fix105B",
            "      );\n\n                // Fix105B",
            1
          ).replace(
            "                fragment.append(card);",
            "      fragment.append(card);",
            1
          )

          updated_section=section.replace(
            exact,replacement,1
          )

          updated=(
            original[:start]+
            updated_section+
            original[end:]
          )

          # Confirm only the intended block changed.
          restored=updated.replace(
            replacement,exact,1
          )

          if restored!=original:
              raise SystemExit(
                "SAFETY STOP: unrelated website code changed"
              )

          for required in [
              "shopdropPublicProductResults",
              "shopdropCombinedServicesPanel",
              "shopdropVehicleBrowsePanel",
              "shopdropLoadMore"
          ]:
              if required not in updated:
                  raise SystemExit(
                    "SAFETY STOP: existing function missing"
                  )

          path.write_text(
            updated,encoding="utf-8"
          )

          print("PASS: Vehicle photograph display connected")
          print("PASS: Existing browsing functions preserved")
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          test "$(git diff --name-only)" = \
            "public/categories.html"

          git add public/categories.html

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Fix105B vehicle photographs in existing browse"

          git push origin HEAD:shopdrop-phase6-integration
