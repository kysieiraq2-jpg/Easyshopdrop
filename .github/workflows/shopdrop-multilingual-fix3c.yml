name: ShopDrop Multilingual Fix 3C - Account Pages
on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - .github/workflows/shopdrop-multilingual-fix3c.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true
      - name: Add shared account-language script and preserve pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          pages = [Path('public/register.html'),Path('public/sign-in.html')]
          for p in pages:
              if not p.is_file(): raise SystemExit(f'STOP: missing {p}')
              text=p.read_text()
              if text.count('</body>') != 1: raise SystemExit(f'STOP: unexpected body in {p}')
              if 'shopdrop-account-language.js' in text: raise SystemExit(f'STOP: already installed in {p}')
          target=Path('public/shopdrop-account-language.js')
          if target.exists(): raise SystemExit('STOP: shared script already exists')
          target.write_bytes(base64.b64decode(''))
          for p in pages:
              old=p.read_text()
              new=old.replace('</body>','<script defer src="shopdrop-account-language.js"></script></body>')
              if new.replace('<script defer src="shopdrop-account-language.js"></script>','') != old:
                  raise SystemExit('STOP: preservation check failed')
              p.write_text(new)
              print(p, 'original code preserved')
          PY
          git diff --check
          git add public/register.html public/sign-in.html public/shopdrop-account-language.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add multilingual UI to registration and sign-in pages'
          git push origin HEAD:shopdrop-phase6-integration
