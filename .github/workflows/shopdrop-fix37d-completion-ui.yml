
name: ShopDrop Fix37D - Completion PIN UI

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix37d-completion-ui.yml'

permissions:
  contents: write

jobs:
  completion-ui:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Preserve existing files and install completion UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
            'public/account.html':
              '6f8f140b722d7f4d64c3275b985e7e1b3f0b4187',
            'public/shopdrop-service-completion.html':
              'a032ae49d321747454656f9ad1aa8ff61cfdf325',
            'public/dispatching.html':
              '3e922c52539f195cb669d7c21b7988aae53388f2',
            'public/services.html':
              '376a94ac6600607ae39e770ddac5145b3c691307',
          }

          originals = {}
          updates = {}
          replacements = {p: [] for p in expected}

          for path, sha in expected.items():
            actual = subprocess.check_output(
              ['git', 'hash-object', path],
              text=True
            ).strip()
            if actual != sha:
              raise SystemExit('STOP: Original changed: ' + path)
            originals[path] = Path(path).read_text(
              encoding='utf-8'
            )
            updates[path] = originals[path]

          def patch(path, before, after):
            count = updates[path].count(before)
            if count != 1:
              raise SystemExit(
                'STOP: Expected text mismatch: ' +
                path + ' count=' + str(count)
              )
            updates[path] = updates[path].replace(
              before, after
            )
            replacements[path].append((before, after))

          account = 'public/account.html'

          patch(account,
            'My Service Arrival PIN',
            'My Service Completion PIN'
          )

          patch(account,
            'For a paid service booking, enter the booking ID from your confirmation. Share the PIN only when the provider arrives. Sharing it authorizes arrival confirmation and may initiate provider payout.',
            'For a paid Other Services booking, keep this six-digit PIN until the work is fully completed. You may share it with your authorized recipient, who can give it to the service provider after completion. Never share it at arrival.'
          )

          patch(account,
            'View Arrival PIN',
            'View Completion PIN'
          )

          patch(account,
            'Service arrival PIN',
            'Service completion PIN'
          )

          patch(account,
            'Only share your PIN when the provider is physically present.',
            'Only share this PIN after the agreed service has been fully completed.'
          )

          patch(account,
            'My Dispatch Arrival PIN',
            'My Dispatch Completion PIN'
          )

          patch(account,
            'For a paid vehicle-dispatch booking, enter your booking ID. Only give the PIN to the vehicle provider when they arrive at the agreed location.',
            'For a paid dispatch booking, keep this six-digit PIN until the entire delivery job is complete. You may share it with your authorized receiver at the delivery destination. Only give it to the assigned transport provider after completed delivery.'
          )

          patch(account,
            'View Dispatch Arrival PIN',
            'View Dispatch Completion PIN'
          )

          patch(account,
            'Dispatch arrival PIN',
            'Dispatch completion PIN'
          )

          patch(account,
            'Give this PIN to the provider only when they arrive.',
            'Give this PIN to the service provider only after the job is fully completed.'
          )

          patch(account,
            'Only share this PIN when the vehicle provider arrives.',
            'Share this PIN with the assigned transport provider only after delivery is completed.'
          )

          # Correct the existing customer booking UUID validator.
          # Preserve the independent seller shipment validator.
          patch(account,
            '/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i',
            '/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i'
          )

          patch(account,
            '<section class="panel">\n<h2>Available Dispatch Jobs — Transport Providers</h2>',
            '''<section class="panel" id="provider-completion-panel">
          <h2>Providers — Confirm Completed Work</h2>
          <p>For Other Services and Dispatching: after completing your paid job, obtain the six-digit Completion PIN from the customer or their authorized receiver.</p>
          <p><strong>The provider must enter that PIN securely into Shop&amp;Drop.</strong> One valid completion PIN is sufficient for the agreed completion milestone, subject to payment and dispute safeguards.</p>
          <p><a href="./shopdrop-provider-completion.html">Open Provider Completion PIN Form</a></p>
          <p class="muted">This prepares provider-held payment for release. Live transfers remain disabled pending approval.</p>
          </section>

          <section class="panel">
          <h2>Available Dispatch Jobs — Transport Providers</h2>'''
          )

          service = 'public/shopdrop-service-completion.html'

          patch(service,
            '<h1>Service Completion Evidence</h1>',
            '<h1>Other Services — Completion</h1>'
          )

          patch(service,
            '<strong>Important:</strong> Submit photographs only after completing the agreed work.',
            '<strong>Optional photographs:</strong> You may submit photographs after completing the agreed work. Photographs are supporting evidence, not an additional routine PIN-payment requirement.'
          )

          patch(service,
            '<p class="muted">If the customer supplies a six-digit completion PIN, that separate verification option will be connected in a later update. Never share account passwords or arrival codes as completion evidence.</p>',
            '''<section class="panel">
          <h2>Confirm completed work with a customer PIN</h2>
          <p>After you finish the agreed service, ask the paying customer or authorized recipient for their six-digit Completion PIN. Enter it using the secure provider form. Do not request or submit it before finishing.</p>
          <p><a href="./shopdrop-provider-completion.html?booking_type=service">Submit Service Completion PIN</a></p>
          <p class="muted">Photographs on this page are optional supporting evidence. No live payment is released from this page.</p>
          </section>'''
          )

          dispatch = 'public/dispatching.html'

          patch(dispatch,
            '<p class="flow">dispatch request → eligible provider option/offer → provider target proceeds + transparent Shop&Drop marketplace service fee → customer sees the agreed total → <b>Shop&Drop order</b> + provider transaction → payment confirmed → unique Arrival PIN issued privately to customer → provider notified → vehicle arrives at agreed location → customer gives Arrival PIN to provider → PIN verified → automatic provider payout initiated subject to payment and security safeguards → feedback.</p>',
            '<p class="flow">Dispatch request → approved transport offer → verified customer payment → six-digit Completion PIN privately available to customer → delivery job completed → customer or authorized receiver gives PIN to assigned transport provider → provider submits PIN to Shop&amp;Drop → secure completion verification prepares held payment for release → approved provider releases funds when activated, subject to safeguards → feedback.</p>'
          )

          patch(dispatch,
            '<p>Customer-confirmed arrival using the unique booking PIN is the payout milestone, subject to verified payment and applicable safeguards. Dispatch arrival must be distinguished from parcel courier proof of delivery.</p>',
            '<p><strong>Completion, not arrival, is the payout milestone.</strong> After the entire delivery job is finished, the provider obtains the customer-held six-digit Completion PIN from the paying customer or authorized receiver and submits it through Shop&amp;Drop. GPS location records remain optional supporting information.</p>'
          )

          patch(dispatch,
            '<h2>How the transaction works</h2>',
            '''<h2>How the transaction works</h2>
          <p><strong>Transport providers:</strong> After completing your paid dispatch job, <a href="./shopdrop-provider-completion.html?booking_type=dispatch">submit the customer's six-digit Completion PIN here</a>.</p>'''
          )

          services = 'public/services.html'

          patch(services,
            '<p>Choose service → select date/time and units → see the calculated amount → book/pay through Shop&Drop → provider notified → service performed → customer can confirm completion or report a problem → verified arrival → provider payout eligible (subject to payment and safety checks) → provider paid automatically → feedback.</p>',
            '<p>Choose service → agree on date, time, location and price → pay through Shop&amp;Drop → receive a private six-digit Completion PIN → provider completes the work → customer or authorized recipient gives PIN to provider → provider submits PIN through Shop&amp;Drop → verified completion prepares held proceeds for automatic release, subject to provider approval and safeguards → feedback. Photographs are optional supporting evidence.</p>'
          )

          # Full standalone provider submission interface.
          page = r'''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Provider Completion | Shop&amp;Drop</title>
          <style>
          *{box-sizing:border-box}
          body{font:16px Arial,system-ui,sans-serif;line-height:1.55;margin:0;background:#f3f5f8;color:#17202a}
          header{background:#101827;padding:18px;color:white}
          header a{color:white;margin-right:18px}
          main{max-width:820px;margin:auto;padding:20px 14px 48px}
          .panel{background:white;padding:22px;border:1px solid #e2e8f0;border-radius:12px;margin:16px 0}
          h1{font-size:clamp(25px,5vw,36px)}
          h2{font-size:21px}
          .muted{color:#536477}
          label{display:block;font-weight:700;margin:14px 0 5px}
          select,input,button{font:inherit;min-height:46px;border-radius:8px}
          select,input{width:100%;padding:11px;border:1px solid #cbd5e1}
          button{padding:11px 16px;background:#0f766e;color:white;border:0;cursor:pointer;margin-top:14px}
          button:disabled{opacity:.55;cursor:default}
          a{color:#0f766e}
          .notice{border-left:4px solid #0f766e;padding-left:14px}
          .check{display:flex;align-items:flex-start;gap:10px;font-weight:400}
          .check input{min-height:auto;width:auto;flex:none;margin-top:5px}
          #status{font-weight:700;overflow-wrap:anywhere}
          </style>
          </head>
          <body>
          <header>
          <a href="./index.html">Shop&amp;Drop</a>
          <a href="./account.html">My Account</a>
          <a href="./services.html">Other Services</a>
          <a href="./dispatching.html">Dispatching</a>
          </header>
          <main>
          <h1>Confirm Completed Job</h1>
          <section class="panel">
          <p class="notice"><strong>For the assigned service or dispatch provider only.</strong> First finish the agreed work or delivery. Then ask the paying customer or authorized receiving person for the six-digit Completion PIN.</p>
          <p>The code is issued privately to the paying customer after verified payment. The customer may give it to a trusted receiving person for a distant delivery.</p>
          <p class="muted">One valid completion code per booking. Service photographs and dispatch GPS records remain optional supporting information. Do not submit a code before completing the job.</p>
          </section>
          <section class="panel">
          <h2>Submit customer completion PIN</h2>
          <p id="loginStatus" role="status" aria-live="polite">Checking your Shop&amp;Drop sign-in…</p>
          <form id="completionForm">
          <label for="bookingType">Type of completed job</label>
          <select id="bookingType" required>
          <option value="">Choose a category</option>
          <option value="service">Other Services</option>
          <option value="dispatch">Dispatching &amp; Transport</option>
          </select>
          <label for="savedBookings">My paid assigned bookings (optional)</label>
          <select id="savedBookings">
          <option value="">Select a booking or enter the ID below</option>
          </select>
          <button type="button" id="refresh">Refresh my paid bookings</button>
          <label for="bookingId">Completed booking ID</label>
          <input id="bookingId" type="text" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" required>
          <label for="completionPin">Six-digit PIN received from the customer</label>
          <input id="completionPin" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6" placeholder="Six digits" required>
          <label class="check">
          <input type="checkbox" id="workCompleted" required>
          I confirm that I am the assigned provider, that the agreed job has been completed, and that the customer or authorized receiving person supplied this code after completion.
          </label>
          <button type="submit" id="submitButton">Confirm Completed Job</button>
          </form>
          <p id="status" role="status" aria-live="polite"></p>
          <p class="muted">Successful verification records completion and prepares the payment-release request. Funds are not transferred until an approved payment provider is activated and confirms settlement.</p>
          </section>
          </main>
          <script type="module">
          import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
          const sb=createClient(
            'https://dtkdvvxpwonywtsgqmdx.supabase.co',
            'sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q',
            {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
          );
          const $=id=>document.getElementById(id);
          const UUID=/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i;
          let user=null;
          let working=false;
          function message(text){$('status').textContent=text;}
          async function loadBookings(){
            const kind=$('bookingType').value;
            const choices=$('savedBookings');
            choices.replaceChildren(new Option('Select a booking or enter its ID',''));
            if(!user||!['service','dispatch'].includes(kind))return;
            const table=kind==='service'?'service_bookings':'dispatch_bookings';
            const {data,error}=await sb.from(table)
              .select('id,created_at,booking_status')
              .eq('provider_id',user.id)
              .eq('payment_status','paid')
              .order('created_at',{ascending:false})
              .limit(40);
            if(error){
              message('Booking list unavailable. You can enter your assigned paid booking ID manually.');
              return;
            }
            for(const b of data||[]){
              choices.append(new Option(
                String(b.booking_status||'Paid')+' — '+b.id,b.id
              ));
            }
            if(!(data||[]).length){
              message('No paid assigned bookings listed. Enter your booking ID manually if you have one.');
            }else{message('Choose your completed booking or enter its ID.');}
          }
          $('bookingType').addEventListener('change',loadBookings);
          $('savedBookings').addEventListener('change',()=>{
            if($('savedBookings').value){
              $('bookingId').value=$('savedBookings').value;
            }
          });
          $('refresh').addEventListener('click',loadBookings);
          $('completionForm').addEventListener('submit',async event=>{
            event.preventDefault();
            if(working)return;
            const kind=$('bookingType').value;
            const id=$('bookingId').value.trim().toLowerCase();
            const pin=$('completionPin').value.trim();
            if(!user||!['service','dispatch'].includes(kind)||
              !UUID.test(id)||!/^[0-9]{6}$/.test(pin)||
              !$('workCompleted').checked){
              message('Sign in, select a valid booking, enter the six-digit PIN and confirm that the job is finished.');
              return;
            }
            working=true;
            $('submitButton').disabled=true;
            message('Checking your customer completion PIN…');
            try{
              const {data:auth,error:authError}=await sb.auth.getUser();
              if(authError||!auth.user||auth.user.id!==user.id){
                throw new Error('sign_in_required');
              }
              const {data,error}=await sb.functions.invoke(
                'confirm-provider-completion-pin',
                {body:{
                  booking_type:kind,
                  booking_id:id,
                  completion_pin:pin,
                  work_completed:true
                }}
              );
              if(error||data?.verified!==true){
                throw new Error('completion_not_accepted');
              }
              message(
                'Completion verified. Your provider-held payment release request is prepared. The payment provider must be approved and activated before funds can be transferred.'
              );
              $('workCompleted').checked=false;
            }catch{
              message('Completion was not confirmed. Check your assigned paid booking, customer PIN and completion status. Contact Shop&Drop support if the issue continues.');
            }finally{
              $('completionPin').value='';
              $('submitButton').disabled=false;
              working=false;
            }
          });
          try{
            const {data,error}=await sb.auth.getUser();
            if(error||!data.user)throw new Error('not_signed_in');
            user=data.user;
            $('loginStatus').textContent='Signed in. Select your paid job below.';
            const params=new URLSearchParams(location.search);
            const type=params.get('booking_type');
            const id=params.get('booking_id');
            if(type==='service'||type==='dispatch')$('bookingType').value=type;
            if(id&&UUID.test(id))$('bookingId').value=id.toLowerCase();
            await loadBookings();
          }catch{
            $('loginStatus').replaceChildren();
            $('loginStatus').append('Please sign in before confirming completed work. ');
            const a=document.createElement('a');
            a.href='./sign-in.html';
            a.textContent='Sign in';
            $('loginStatus').append(a);
            $('submitButton').disabled=true;
          }
          </script>
          </body>
          </html>
          '''

          # Preserve the deployed Fix37 customer-PIN backend in GitHub.
          endpoint = r'''import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

          const VERSION = "SHOPDROP-FIX37-CUSTOMER-COMPLETION-PIN-V1";
          const URL = Deno.env.get("SUPABASE_URL") ?? "";
          const SERVICE_KEY = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") ?? "";
          const UUID = /^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i;
          const headers = {
            "Access-Control-Allow-Origin": "*",
            "Access-Control-Allow-Headers": "authorization, apikey, content-type, x-client-info",
            "Access-Control-Allow-Methods": "POST, OPTIONS",
            "Content-Type": "application/json; charset=utf-8",
            "Cache-Control": "no-store",
          };
          function reply(body: Record<string, unknown>, status = 200) {
            return new Response(JSON.stringify({ version: VERSION, ...body }), {
              headers, status,
            });
          }
          Deno.serve(async (req: Request) => {
            if (req.method === "OPTIONS") return new Response("ok", { headers });
            if (req.method !== "POST")
              return reply({ ok: false, error: "method_not_allowed" }, 405);
            if (!URL || !SERVICE_KEY)
              return reply({ ok: false, error: "backend_configuration_error" }, 503);

            const authorization = req.headers.get("authorization") ?? "";
            if (!/^Bearer\s+\S+$/i.test(authorization))
              return reply({ ok: false, error: "authentication_required" }, 401);

            const admin = createClient(URL, SERVICE_KEY, {
              auth: { persistSession: false, autoRefreshToken: false },
            });
            const token = authorization.replace(/^Bearer\s+/i, "");
            const { data: authData, error: authError } = await admin.auth.getUser(token);
            const user = authData.user;
            if (authError || !user?.id || user.is_anonymous === true)
              return reply({ ok: false, error: "authentication_failed" }, 401);

            let input: Record<string, unknown>;
            try {
              const body: unknown = await req.json();
              if (!body || typeof body !== "object" || Array.isArray(body))
                return reply({ ok: false, error: "invalid_request" }, 400);
              input = body as Record<string, unknown>;
            } catch {
              return reply({ ok: false, error: "invalid_json" }, 400);
            }

            const bookingType = String(input.booking_type ?? "").trim().toLowerCase();
            const bookingId = String(input.booking_id ?? "").trim().toLowerCase();
            const completionPin = String(input.completion_pin ?? input.pin ?? "");
            if (!["service", "dispatch"].includes(bookingType) ||
                !UUID.test(bookingId) || !/^[0-9]{6}$/.test(completionPin)) {
              return reply({ ok: false, error: "invalid_booking_or_completion_pin" }, 400);
            }

            if (input.work_completed !== true) {
              return reply({ ok: false, error: "completed_work_confirmation_required" }, 400);
            }

            const table = bookingType === "service" ? "service_bookings" : "dispatch_bookings";
            const { data: booking, error: lookupError } = await admin
              .from(table)
              .select("id,provider_id,payment_status,booking_status")
              .eq("id", bookingId)
              .maybeSingle();
            if (lookupError) return reply({ ok: false, error: "booking_lookup_unavailable" }, 503);
            if (!booking || booking.provider_id !== user.id)
              return reply({ ok: false, error: "booking_not_assigned_to_provider" }, 403);
            if (booking.payment_status !== "paid" ||
                ["cancelled", "canceled", "disputed", "refunded"].includes(String(booking.booking_status))) {
              return reply({ ok: false, error: "paid_active_booking_required" }, 409);
            }

            const { data: result, error: verifyError } = await admin.rpc(
              "shopdrop_confirm_provider_completion_pin",
              {
                p_booking_type: bookingType,
                p_booking_id: bookingId,
                p_provider_id: user.id,
                p_pin: completionPin,
              },
            );
            if (verifyError) {
              return reply({ ok: false, error: "completion_verification_or_hold_failed" }, 409);
            }
            if (result?.verified !== true) {
              return reply({
                ok: false, verified: false,
                error: String(result?.reason ?? "completion_pin_not_accepted"),
                funds_moved: false,
              }, 409);
            }
            return reply({
              ok: true,
              verified: true,
              booking_type: bookingType,
              booking_id: bookingId,
              already_verified: result?.already_verified === true,
              release_request_id: result?.request_id ?? null,
              release_status: result?.release_status ?? "awaiting_activation",
              payment_provider_activation_pending: true,
              funds_moved: false,
            });
          });
          '''

          new_files = {
            'public/shopdrop-provider-completion.html': page,
            'supabase/functions/confirm-provider-completion-pin/index.ts':
              endpoint,
          }

          # Verify all changes before touching any file.
          for path in expected:
            restored = updates[path]
            for before, after in reversed(replacements[path]):
              restored = restored.replace(after, before)
            if restored != originals[path]:
              raise SystemExit('STOP: Preservation failed: ' + path)
            if len(updates[path]) < len(originals[path]):
              raise SystemExit('STOP: Unexpected shortening: ' + path)

          for path, content in new_files.items():
            if Path(path).exists():
              raise SystemExit('STOP: New file already exists: ' + path)
            if not content.strip():
              raise SystemExit('STOP: New file is empty: ' + path)

          if 'confirm-provider-completion-pin' not in page:
            raise SystemExit('STOP: Completion form connector missing')
          if 'shopdrop_confirm_provider_completion_pin' not in endpoint:
            raise SystemExit('STOP: Backend verification connector missing')

          for path in expected:
            Path(path).write_text(updates[path], encoding='utf-8')
            print('PRESERVED:', path,
              len(originals[path]), '->', len(updates[path]))

          for path, content in new_files.items():
            Path(path).parent.mkdir(parents=True, exist_ok=True)
            Path(path).write_text(
              content.strip('\n') + '\n',
              encoding='utf-8'
            )
            print('CREATED:', path)

          print('PASS: Four existing pages preserved.')
          print('PASS: Provider completion form installed.')
          print('PASS: Backend source mirrored in GitHub.')
          print('PASS: No live payment or payout activation.')
          PY

      - name: Commit Fix37D
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git add public/account.html
          git add public/shopdrop-service-completion.html
          git add public/dispatching.html
          git add public/services.html
          git add public/shopdrop-provider-completion.html
          git add supabase/functions/confirm-provider-completion-pin/index.ts

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Fix37D customer completion PIN UI and provider submission'

          git push origin HEAD:shopdrop-phase6-integration

