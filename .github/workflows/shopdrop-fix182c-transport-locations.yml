
name: ShopDrop Fix 182C - Transport Dropdown Repair

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix182c-transport-locations.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.ref_name == 'shopdrop-phase6-integration'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Repair transport location fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import json
          import textwrap

          page = Path("public/dispatching.html")
          script = Path("public/shopdrop-transport-location-182d.js")
          datafile = Path("public/shopdrop-sa-towns-181.json")
          backup = Path("backups/fix182c/dispatching-BEFORE-182D.html")

          expected = "035a6b6e185954aa40b3cddae4e26cbf5bf2fedb"

          actual = subprocess.check_output(
              ["git", "hash-object", str(page)],
              text=True
          ).strip()

          if actual != expected:
              raise SystemExit("STOP: Transport HTML has changed")

          data = json.loads(datafile.read_text())

          if data.get("country") != "ZA":
              raise SystemExit("STOP: Invalid town data")

          if len(data.get("provinces", {})) != 9:
              raise SystemExit("STOP: Province data incomplete")

          original = page.read_bytes()
          html = original.decode("utf-8")

          old181 = (
              '<script src="./shopdrop-location-dropdowns-181.js">'
              '</script>'
          )

          old182 = (
              '<script defer '
              'src="./shopdrop-transport-location-182c.js">'
              '</script>'
          )

          new182 = (
              '<script defer '
              'src="./shopdrop-transport-location-182d.js?v=182d">'
              '</script>'
          )

          if html.count(old181) != 1:
              raise SystemExit("STOP: Old 181 connection mismatch")

          if html.count(old182) != 1:
              raise SystemExit("STOP: Old 182C connection mismatch")

          for field in (
              "pickupRegion", "pickup",
              "dropoffRegion", "dropoff",
              "pickupCountry", "dropoffCountry"
          ):
              if html.count('id="' + field + '"') != 1:
                  raise SystemExit("STOP: Location field mismatch")

          backup.parent.mkdir(parents=True, exist_ok=True)
          backup.write_bytes(original)

          if backup.read_bytes() != original:
              raise SystemExit("STOP: Backup failed")

          javascript = r"""
          (() => {
            'use strict';

            const provinces = [
              'Eastern Cape', 'Free State', 'Gauteng',
              'KwaZulu-Natal', 'Limpopo', 'Mpumalanga',
              'North West', 'Northern Cape', 'Western Cape'
            ];

            const pairs = [
              ['pickupRegion', 'pickup', 'pickupCountry'],
              ['dropoffRegion', 'dropoff', 'dropoffCountry']
            ];

            function fill(select, values, prompt) {
              select.replaceChildren(new Option(prompt, ''));
              values.forEach(value => {
                select.add(new Option(value, value));
              });
            }

            function makeSelect(old) {
              const next = document.createElement('select');

              for (const attr of old.attributes) {
                if (!['type', 'placeholder', 'value']
                    .includes(attr.name)) {
                  next.setAttribute(attr.name, attr.value);
                }
              }

              next.id = old.id;
              next.style.width = '100%';
              next.style.minHeight = '46px';

              old.replaceWith(next);
              return next;
            }

            function start() {
              const controls = [];

              for (const [regionId, townId, countryId] of pairs) {
                const country = document.getElementById(countryId);
                let region = document.getElementById(regionId);
                let town = document.getElementById(townId);

                if (!country || !region || !town) continue;

                const originalRegion = region.cloneNode(true);
                const originalTown = town.cloneNode(true);

                let townData = null;

                const isSA = () => {
                  const value = String(country.value).toLowerCase();
                  return value === 'za' ||
                    value === 'south africa';
                };

                const updateTowns = (selected = '') => {
                  const available =
                    townData?.[region.value] || [];

                  fill(
                    town,
                    available,
                    region.value
                      ? (townData
                          ? 'Choose town or area'
                          : 'Loading towns...')
                      : 'Choose province first'
                  );

                  town.disabled = !townData || !region.value;

                  if (available.includes(selected)) {
                    town.value = selected;
                  }
                };

                function setup() {
                  region = document.getElementById(regionId);
                  town = document.getElementById(townId);

                  if (!region || !town) return;

                  const previousRegion = region.value;
                  const previousTown = town.value;

                  if (!isSA()) {
                    if (region.tagName === 'SELECT') {
                      const input = originalRegion.cloneNode(true);
                      input.value = previousRegion;
                      region.replaceWith(input);
                      region = input;
                    }

                    if (town.tagName === 'SELECT') {
                      const input = originalTown.cloneNode(true);
                      input.value = previousTown;
                      town.replaceWith(input);
                      town = input;
                    }
                    return;
                  }

                  if (region.tagName !== 'SELECT') {
                    region = makeSelect(region);
                  }

                  if (town.tagName !== 'SELECT') {
                    town = makeSelect(town);
                  }

                  fill(region, provinces, 'Choose province');

                  if (provinces.includes(previousRegion)) {
                    region.value = previousRegion;
                  }

                  region.onchange = () => updateTowns();
                  updateTowns(previousTown);
                }

                controls.push({
                  setData(data) {
                    townData = data;
                    const selected = town.value;
                    updateTowns(selected);
                  }
                });

                country.addEventListener('change', setup);
                setup();
              }

              fetch('./shopdrop-sa-towns-181.json?v=182d', {
                cache: 'no-store'
              })
                .then(response => {
                  if (!response.ok) {
                    throw Error('Town data unavailable');
                  }
                  return response.json();
                })
                .then(data => {
                  if (data.country !== 'ZA' || !data.provinces) {
                    throw Error('Invalid South African town data');
                  }
                  controls.forEach(control => {
                    control.setData(data.provinces);
                  });
                })
                .catch(error => {
                  console.error('Transport towns:', error);
                  document.querySelectorAll(
                    '#pickup, #dropoff'
                  ).forEach(field => {
                    if (field.tagName !== 'SELECT') return;
                    const input = document.createElement('input');
                    input.id = field.id;
                    input.placeholder = 'Enter town manually';
                    input.style.cssText = field.style.cssText;
                    field.replaceWith(input);
                  });
                });
            }

            if (document.readyState === 'loading') {
              document.addEventListener(
                'DOMContentLoaded', start, {once:true}
              );
            } else {
              start();
            }
          })();
          """

          script.write_text(
              textwrap.dedent(javascript).strip() + "\n"
          )

          updated = html.replace(old181, "", 1)
          updated = updated.replace(old182, new182, 1)

          expected_html = html.replace(
              old181, "", 1
          ).replace(old182, new182, 1)

          if updated != expected_html:
              raise SystemExit("STOP: Unexpected HTML changes")

          page.write_text(updated)

          print("PASS: Original transport HTML backed up")
          print("PASS: Old 181 transport connection disabled")
          print("PASS: Old 182C connection replaced")
          print("PASS: All other transport HTML preserved")
          PY

          node --check public/shopdrop-transport-location-182d.js
          git diff --check

      - name: Commit and publish correction
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ShopDrop Fix Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/dispatching.html \
            public/shopdrop-transport-location-182d.js \
            backups/fix182c/dispatching-BEFORE-182D.html

          git commit -m "Fix 182C-D isolated transport dropdown repair"
          git push origin HEAD:shopdrop-phase6-integration
