
name: ShopDrop Fix 182C - Transport Locations

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix182c-transport-locations.yml'

permissions:
  contents: write

jobs:
  transport-locations:
    runs-on: ubuntu-latest
    if: github.ref_name == 'shopdrop-phase6-integration'

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Backup and install Fix 182C
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import json

          page = Path("public/dispatching.html")
          backup = Path("backups/fix182c/dispatching-BEFORE-182C.html")
          script = Path("public/shopdrop-transport-location-182c.js")
          towns = Path("public/shopdrop-sa-towns-181.json")

          expected = "ce9f0c9b7b84a822703f38ded718d4783b39fa8f"

          actual = subprocess.check_output(
              ["git", "hash-object", str(page)],
              text=True
          ).strip()

          if actual != expected:
              raise SystemExit("STOP: Original transport file changed")

          if not towns.exists():
              raise SystemExit("STOP: Town dataset missing")

          data = json.loads(towns.read_text())
          if data.get("country") != "ZA":
              raise SystemExit("STOP: Incorrect town dataset")

          original = page.read_bytes()
          html = original.decode("utf-8")

          for field in (
              "pickupRegion", "pickup",
              "dropoffRegion", "dropoff",
              "pickupCountry", "dropoffCountry"
          ):
              if html.count('id="' + field + '"') != 1:
                  raise SystemExit("STOP: Field mismatch: " + field)

          marker = '<script defer src="./shopdrop-transport-location-182c.js"></script>'

          if marker in html or html.count("</body>") != 1:
              raise SystemExit("STOP: Unexpected HTML structure")

          backup.parent.mkdir(parents=True, exist_ok=True)
          backup.write_bytes(original)

          if backup.read_bytes() != original:
              raise SystemExit("STOP: Backup verification failed")

          javascript = r"""
          (() => {
            'use strict';

            const provinces = [
              'Eastern Cape', 'Free State', 'Gauteng',
              'KwaZulu-Natal', 'Limpopo', 'Mpumalanga',
              'North West', 'Northern Cape', 'Western Cape'
            ];

            const pairs = [
              ['pickupRegion', 'pickup', 'pickupCountry'],
              ['dropoffRegion', 'dropoff', 'dropoffCountry']
            ];

            function fill(select, values, prompt) {
              select.replaceChildren(new Option(prompt, ''));
              values.forEach(value => {
                select.add(new Option(value, value));
              });
            }

            function start(data) {
              pairs.forEach(([regionId, townId, countryId]) => {
                const country = document.getElementById(countryId);
                if (!country) return;

                let region = document.getElementById(regionId);
                let town = document.getElementById(townId);

                if (!region || !town) return;

                const originalRegion = region.cloneNode(true);
                const originalTown = town.cloneNode(true);

                function isSA() {
                  const value = String(country.value).toLowerCase();
                  return value === 'za' || value === 'south africa';
                }

                function makeSelect(old) {
                  const next = document.createElement('select');

                  for (const attr of old.attributes) {
                    if (!['type', 'value', 'placeholder'].includes(attr.name)) {
                      next.setAttribute(attr.name, attr.value);
                    }
                  }

                  next.id = old.id;
                  next.style.width = '100%';
                  next.style.minHeight = '46px';

                  old.replaceWith(next);
                  return next;
                }

                function updateTowns(selected = '') {
                  const available = data.provinces[region.value] || [];

                  fill(
                    town,
                    available,
                    region.value ? 'Choose town or area' : 'Choose province first'
                  );

                  town.disabled = !available.length;

                  if (available.includes(selected)) {
                    town.value = selected;
                  }
                }

                function setup() {
                  region = document.getElementById(regionId);
                  town = document.getElementById(townId);

                  if (!region || !town) return;

                  if (!isSA()) {
                    if (town.tagName === 'SELECT') {
                      town.replaceWith(originalTown.cloneNode(true));
                    }
                    return;
                  }

                  const previousRegion = region.value;
                  const previousTown = town.value;

                  if (region.tagName !== 'SELECT') {
                    region = makeSelect(region);
                  }

                  if (town.tagName !== 'SELECT') {
                    town = makeSelect(town);
                  }

                  fill(region, provinces, 'Choose province');

                  if (provinces.includes(previousRegion)) {
                    region.value = previousRegion;
                  }

                  region.addEventListener('change', () => updateTowns());
                  updateTowns(previousTown);
                }

                country.addEventListener('change', setup);
                setup();
              });
            }

            window.addEventListener('load', () => {
              fetch('./shopdrop-sa-towns-181.json', {
                cache: 'no-store'
              })
                .then(response => {
                  if (!response.ok) throw Error('Town data unavailable');
                  return response.json();
                })
                .then(data => {
                  if (data.country !== 'ZA' || !data.provinces) {
                    throw Error('Invalid South African town data');
                  }
                  start(data);
                })
                .catch(error => {
                  console.warn('Transport dropdowns unavailable:', error);
                });
            });
          })();
          """

          script.write_text(javascript.strip() + "\n")

          updated = html.replace("</body>", marker + "</body>", 1)

          if updated.replace(marker, "", 1) != html:
              raise SystemExit("STOP: Unrelated HTML change detected")

          page.write_text(updated)

          print("Backup verified")
          print("Transport location dropdowns installed")
          print("Other transport code preserved")
          PY

          node --check public/shopdrop-transport-location-182c.js
          git diff --check

      - name: Commit Fix 182C
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ShopDrop Fix Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/dispatching.html \
            public/shopdrop-transport-location-182c.js \
            backups/fix182c/dispatching-BEFORE-182C.html

          git commit -m "Fix 182C transport dropdowns with original backup"
          git push origin HEAD:shopdrop-phase6-integration
