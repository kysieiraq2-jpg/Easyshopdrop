
name: ShopDrop Fix 182C - Transport Locations

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix182c-transport-locations.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.ref_name == 'shopdrop-phase6-integration'

    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Backup and repair only transport dropdowns
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import json

          page = Path("public/dispatching.html")
          script = Path("public/shopdrop-transport-location-182c.js")
          datafile = Path("public/shopdrop-sa-towns-181.json")
          backup = Path("backups/fix182c/transport-script-BEFORE-182C-R.js")

          expected_page = "035a6b6e185954aa40b3cddae4e26cbf5bf2fedb"
          expected_script = "fb2a49d5b394b83e30bf2d64d1c304cfb7506f64"

          def verify(path, expected):
              actual = subprocess.check_output(
                  ["git", "hash-object", str(path)],
                  text=True
              ).strip()
              if actual != expected:
                  raise SystemExit(
                      "SAFETY STOP: File changed: " + str(path)
                  )

          verify(page, expected_page)
          verify(script, expected_script)

          if not datafile.is_file():
              raise SystemExit("SAFETY STOP: Town data missing")

          data = json.loads(datafile.read_text())
          provinces = data.get("provinces", {})

          if data.get("country") != "ZA" or len(provinces) != 9:
              raise SystemExit("SAFETY STOP: Invalid town data")

          html = page.read_text()

          for field in (
              "pickupRegion", "pickup",
              "dropoffRegion", "dropoff",
              "pickupCountry", "dropoffCountry"
          ):
              if html.count('id="' + field + '"') != 1:
                  raise SystemExit("SAFETY STOP: Field " + field)

          if html.count(
              'src="./shopdrop-transport-location-182c.js"'
          ) != 1:
              raise SystemExit("SAFETY STOP: Script not connected")

          backup.parent.mkdir(parents=True, exist_ok=True)
          original = script.read_bytes()
          backup.write_bytes(original)

          if backup.read_bytes() != original:
              raise SystemExit("SAFETY STOP: Backup mismatch")

          code = r"""
          (() => {
            'use strict';

            const provinceNames = [
              'Eastern Cape',
              'Free State',
              'Gauteng',
              'KwaZulu-Natal',
              'Limpopo',
              'Mpumalanga',
              'North West',
              'Northern Cape',
              'Western Cape'
            ];

            const fields = [
              ['pickupRegion', 'pickup', 'pickupCountry'],
              ['dropoffRegion', 'dropoff', 'dropoffCountry']
            ];

            const fill = (element, values, prompt) => {
              element.replaceChildren(new Option(prompt, ''));
              for (const value of values) {
                element.add(new Option(value, value));
              }
            };

            const createSelect = input => {
              const select = document.createElement('select');

              for (const attr of input.attributes) {
                if (!['type', 'value', 'placeholder'].includes(attr.name)) {
                  select.setAttribute(attr.name, attr.value);
                }
              }

              select.id = input.id;
              select.style.width = '100%';
              select.style.minHeight = '46px';

              input.replaceWith(select);
              return select;
            };

            function install(data) {
              for (const [regionId, townId, countryId] of fields) {
                const country = document.getElementById(countryId);
                let region = document.getElementById(regionId);
                let town = document.getElementById(townId);

                if (!country || !region || !town) continue;

                const originalRegion = region.cloneNode(true);
                const originalTown = town.cloneNode(true);

                let originalRegionValue = region.value;
                let originalTownValue = town.value;

                const southAfrica = () => {
                  const value = String(country.value).trim().toLowerCase();
                  return value === 'za' || value === 'south africa';
                };

                const updateTowns = selected => {
                  const available = data.provinces[region.value] || [];

                  fill(
                    town,
                    available,
                    region.value
                      ? 'Choose town or area'
                      : 'Choose province first'
                  );

                  town.disabled = !region.value;

                  if (available.includes(selected)) {
                    town.value = selected;
                  }
                };

                function setup() {
                  region = document.getElementById(regionId);
                  town = document.getElementById(townId);

                  if (!region || !town) return;

                  if (!southAfrica()) {
                    const regionValue = region.value;
                    const townValue = town.value;

                    if (region.tagName === 'SELECT') {
                      const input = originalRegion.cloneNode(true);
                      input.value = regionValue;
                      region.replaceWith(input);
                      region = input;
                    }

                    if (town.tagName === 'SELECT') {
                      const input = originalTown.cloneNode(true);
                      input.value = townValue;
                      town.replaceWith(input);
                      town = input;
                    }

                    return;
                  }

                  const previousRegion = region.value || originalRegionValue;
                  const previousTown = town.value || originalTownValue;

                  if (region.tagName !== 'SELECT') {
                    region = createSelect(region);
                  }

                  if (town.tagName !== 'SELECT') {
                    town = createSelect(town);
                  }

                  fill(region, provinceNames, 'Choose province');

                  if (provinceNames.includes(previousRegion)) {
                    region.value = previousRegion;
                  }

                  region.onchange = () => {
                    originalRegionValue = region.value;
                    originalTownValue = '';
                    updateTowns('');
                  };

                  town.onchange = () => {
                    originalTownValue = town.value;
                  };

                  updateTowns(previousTown);
                }

                country.addEventListener('change', setup);
                setup();
              }
            }

            function start() {
              fetch('./shopdrop-sa-towns-181.json', {
                cache: 'no-store'
              })
                .then(response => {
                  if (!response.ok) {
                    throw new Error('Town dataset unavailable');
                  }
                  return response.json();
                })
                .then(data => {
                  if (data.country !== 'ZA' || !data.provinces) {
                    throw new Error('Invalid South African town data');
                  }
                  install(data);
                })
                .catch(error => {
                  console.error('Fix 182C:', error);
                });
            }

            if (document.readyState === 'loading') {
              document.addEventListener(
                'DOMContentLoaded', start, {once: true}
              );
            } else {
              start();
            }
          })();
          """

          script.write_text(code.strip() + "\n")

          print("PASS: Original transport HTML unchanged")
          print("PASS: Previous transport script backed up")
          print("PASS: New dropdown script prepared")
          PY

          node --check public/shopdrop-transport-location-182c.js
          git diff --check

          test "$(git hash-object public/dispatching.html)" = \
            "035a6b6e185954aa40b3cddae4e26cbf5bf2fedb"

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ShopDrop Fix Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            public/shopdrop-transport-location-182c.js \
            backups/fix182c/transport-script-BEFORE-182C-R.js

          git commit -m "Fix 182C-R transport dropdown repair"
          git push origin HEAD:shopdrop-phase6-integration
