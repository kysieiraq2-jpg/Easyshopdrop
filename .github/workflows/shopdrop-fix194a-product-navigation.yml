name: ShopDrop Fix 194A Product Navigation
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix194a-product-navigation.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
    - name: Install product navigation only
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REF_NAME" = shopdrop-phase6-integration
        python3 <<'PYCODE'
        from pathlib import Path
        import subprocess
        patches={'public/index.html': [('          <a href="./categories.html#browse-all-items">BROWSE ALL ITEMS</a>', '          <a href="./product-shopping-194a.html">Product Shopping &amp; Selling</a>\n          <a href="./categories.html#browse-all-items">BROWSE ALL ITEMS</a>'), ('    <a class="v264Card" href="./categories.html"><h2>Shop Products</h2><p>New, handmade & second-hand</p></a>', '    <a class="v264Card" href="./product-shopping-194a.html"><h2>Shop Products</h2><p>New, handmade & second-hand</p></a>')]}
        shas={'public/index.html': 'ceff8a292e7efac2e3e8713274f2789c2d9b6df7'}
        new_files={'public/product-shopping-194a.html': '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Product Shopping &amp; Selling | Shop&amp;Drop</title>\n<style>\n*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17202a;font:16px/1.5 Arial,system-ui,sans-serif}header{background:#101827;color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 20px}header a{color:#fff;text-decoration:none;font-weight:bold}main{max-width:950px;margin:0 auto;padding:12px 14px 32px}.panel{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:18px;margin:12px 0}.notice{background:#f8fafc}h1{font-size:26px;line-height:1.2;margin:0 0 12px}h2{font-size:21px;margin:0 0 8px}p{margin:8px 0 12px}.muted{color:#536477}.product-menu-194a{display:flex;align-items:center;justify-content:center;min-height:52px;background:#0f766e;color:#fff;text-align:center;text-decoration:none;font-weight:bold;padding:14px;border-radius:8px;margin-top:14px;line-height:1.25;overflow-wrap:anywhere}.product-menu-194a:focus-visible,header a:focus-visible{outline:3px solid #17202a;outline-offset:3px}header a:focus-visible{outline-color:#fff}.product-menu-194a:hover{background:#0b625c}\n</style>\n</head>\n<body>\n<header><a href="./index.html">Shop&amp;Drop Home</a><a href="./checkout.html">My Bag</a><a href="./account.html">My Account</a></header>\n<main>\n<section class="panel notice"><h1>Product Shopping &amp; Selling</h1><p>Browse new, handmade and second-hand products across South Africa. Browsing, registration and advertising are free.</p><p class="muted">Sign in when buying, advertising or managing your own orders. Private buyer and seller contact details remain protected.</p></section>\n<section class="panel"><h2>Sell Your Products — FREE</h2><p>Advertise your own products, including handmade items and second-hand goods.</p><a class="product-menu-194a" href="./sell-item.html">Sell a Product — FREE</a></section>\n<section class="panel"><h2>Shop Products</h2><p>Choose how you would like to browse.</p><a class="product-menu-194a" href="./categories.html#browse-all-items">Browse All Items</a><a class="product-menu-194a" href="./categories.html?view=new">Shop New Products</a><a class="product-menu-194a" href="./categories.html?view=preowned">Second-Hand &amp; Pre-Owned Products</a><a class="product-menu-194a" href="./categories.html">Products &amp; Categories / Search</a><a class="product-menu-194a" href="./checkout.html">My Shopping Bag / Checkout</a></section>\n<section class="panel"><h2>Manage Purchases &amp; Sales</h2><a class="product-menu-194a" href="./account.html#orders">My Purchases &amp; Sales</a><a class="product-menu-194a" href="./tracking.html">Track My Order</a><a class="product-menu-194a" href="./account.html#seller-courier-pickup-panel">Seller — Confirm Courier Collection</a><a class="product-menu-194a" href="./account.html#notifications">My Notifications</a><a class="product-menu-194a" href="./returns.html">Returns &amp; Disputes</a><p class="muted">For sold products, record the courier company\'s own reference only after physical collection. Independent courier verification is required before seller funds can be released.</p></section>\n<a class="product-menu-194a" href="./index.html">Back to Home</a>\n</main>\n</body>\n</html>\n'}
        planned={}
        for name,changes in patches.items():
            p=Path(name); source=p.read_text(encoding='utf-8')
            if all(source.count(new)==1 for old,new in changes): continue
            sha=subprocess.check_output(['git','hash-object',name],text=True).strip()
            if sha!=shas[name]: raise SystemExit('Unexpected source version; no changes installed: '+name)
            updated=source
            for old,new in changes:
                if updated.count(old)!=1: raise SystemExit('Unexpected patch anchor: '+name)
                updated=updated.replace(old,new,1)
            backup=Path('backups/fix194a')/p.name
            if backup.exists() and backup.read_bytes()!=p.read_bytes(): raise SystemExit('Unexpected backup: '+name)
            planned[name]=updated
        for name,content in new_files.items():
            p=Path(name)
            if p.exists() and p.read_text(encoding='utf-8')!=content: raise SystemExit('Unexpected file collision: '+name)
        for name,content in planned.items():
            p=Path(name); backup=Path('backups/fix194a')/p.name
            backup.parent.mkdir(parents=True,exist_ok=True)
            if not backup.exists(): backup.write_bytes(p.read_bytes())
            p.write_text(content,encoding='utf-8')
        for name,content in new_files.items():
            if not Path(name).exists(): Path(name).write_text(content,encoding='utf-8')
        print('Fix 194A navigation only; original product pages and backend untouched.')
        PYCODE
        git diff --check
        git config user.name 'ShopDrop Integration'
        git config user.email 'actions@users.noreply.github.com'
        git add public/index.html public/product-shopping-194a.html
        if test -d backups/fix194a; then git add backups/fix194a; fi
        if ! git diff --cached --quiet; then
          git commit -m 'Fix 194A product navigation only'
          git push origin HEAD:shopdrop-phase6-integration
        fi
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
