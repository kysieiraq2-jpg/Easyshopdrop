name: ShopDrop Multilingual Fix 3H - Arabic Text Direction
on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - .github/workflows/shopdrop-multilingual-fix3h.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true
      - name: Append Arabic direction support without changing existing scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          paths=['public/shopdrop-language.js', 'public/shopdrop-account-language.js', 'public/shopdrop-seller-language.js', 'public/shopdrop-buyer-language.js', 'public/shopdrop-info-language.js']
          marker='Shop&Drop Fix 3H: Arabic text direction'
          addition=base64.b64decode('').decode('utf-8')
          for name in paths:
              p=Path(name)
              if not p.is_file(): raise SystemExit('STOP: missing '+name)
              original=p.read_text()
              if marker in original: raise SystemExit('STOP: already installed '+name)
              if 'shopdrop-ui-language' not in original: raise SystemExit('STOP: wrong source '+name)
          for name in paths:
              p=Path(name)
              original=p.read_text()
              updated=original+addition
              if not updated.startswith(original): raise SystemExit('STOP: preservation failure')
              p.write_text(updated)
              print('Preserved and extended:',name)
          PY
          git diff --check
          git add public/shopdrop-language.js public/shopdrop-account-language.js public/shopdrop-seller-language.js public/shopdrop-buyer-language.js public/shopdrop-info-language.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add Arabic text direction safeguards to existing language scripts'
          git push origin HEAD:shopdrop-phase6-integration
