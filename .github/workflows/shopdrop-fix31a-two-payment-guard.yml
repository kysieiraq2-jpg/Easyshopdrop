
name: ShopDrop Fix31A Two Payment Guard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Patch webhook safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/payment-webhook/index.ts")
          source = path.read_text()
          marker = "SHOPDROP-FIX31A-TWO-PAYMENT-GUARD"
          anchor = "    const paidAt ="

          if marker in source:
              print("Already installed")
              raise SystemExit(0)

          if source.count(anchor) != 1:
              raise SystemExit("Unexpected source; stopped")

          guard = "\n".join([
              "    // SHOPDROP-FIX31A-TWO-PAYMENT-GUARD",
              "    const { data: legs, error: legError } = await supabase",
              '      .from("shopdrop_checkout_payment_legs")',
              '      .select("id")',
              '      .eq("order_id", orderId)',
              '      .limit(1);',
              "    if (legError) {",
              '      return reply({ ok: false, error: "leg_lookup_failed" }, 500);',
              "    }",
              "    if ((legs ?? []).length > 0) {",
              "      const { data: confirmed, error: checkError } =",
              "        await supabase.rpc(",
              '          "shopdrop_two_payment_confirmed",',
              "          { p_order_id: orderId },",
              "        );",
              "      if (checkError || confirmed !== true) {",
              '        return reply({ ok: false, error: "two_payments_required" }, 409);',
              "      }",
              "    }",
              "",
              "",
          ])

          path.write_text(source.replace(anchor, guard + anchor, 1))
          print("Fix31A inserted; previous code preserved")
          PY

      - name: Commit webhook change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/payment-webhook/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Fix31A two payment guard"
            git push origin HEAD:shopdrop-phase6-integration
          fi
