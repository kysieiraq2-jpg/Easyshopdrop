
name: ShopDrop Integrated Website Deployment

'on':
  workflow_dispatch:

  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - 'public/**'
      - '.github/workflows/shopdrop-integration-pages.yml'

  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shopdrop-integrated-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish integrated ShopDrop website

    if: github.ref_name == 'shopdrop-phase6-integration'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: false

      - name: Verify correct branch and website files
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REF_NAME}" = \
            "shopdrop-phase6-integration"

          test -f public/index.html
          test -f public/account.html
          test -f public/checkout.html
          test -f public/register.html
          test -f public/sign-in.html
          test -f public/dispatching.html
          test -f public/services.html
          test -f public/sell-item.html
          test -f public/supabase-adapter.js

          echo "Integration website files verified."

      - name: Verify transport location script
        shell: bash
        run: |
          set -euo pipefail

          if grep -Fq \
            'shopdrop-transport-location-182d.js' \
            public/dispatching.html
          then
            test -s \
              public/shopdrop-transport-location-182d.js

            node --check \
              public/shopdrop-transport-location-182d.js
          fi

          echo "Transport script verification passed."

      - name: Verify normal item location script
        shell: bash
        run: |
          set -euo pipefail

          if grep -Fq \
            'shopdrop-location-182a.js' \
            public/sell-item.html
          then
            test -s public/shopdrop-location-182a.js

            node --check \
              public/shopdrop-location-182a.js
          fi

          echo "Normal item script verification passed."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload integrated website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy integrated website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm deployment completed
        shell: bash
        run: |
          set -euo pipefail

          echo "ShopDrop integration deployment completed."
          echo "Branch: shopdrop-phase6-integration"
          echo "Commit: ${GITHUB_SHA}"
