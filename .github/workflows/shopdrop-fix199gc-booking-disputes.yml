        PATCHES={'public/customer-dispute-evidence-199gb.html': [('Choose your existing product dispute and attach photographs or documents.', 'Choose your existing product, service or transport dispute and attach photographs or documents.'), ('<section class="panel"><h2>Choose your dispute</h2>', '<section class="panel" id="bookingDispute199gc" hidden><h2>Open a booking dispute</h2><p id="bookingLabel199gc"></p><p class="muted">For an eligible paid booking only. Submit the case first, then attach your own evidence. Do not share your Completion PIN.</p><form id="bookingForm199gc"><label for="bookingReason199gc">Reason</label><select id="bookingReason199gc" required><option value="">Choose a reason</option><option value="not_completed">Work not completed</option><option value="not_as_described">Not as described</option><option value="damaged">Damage</option><option value="late">Late or missed appointment</option><option value="other">Other</option></select><label for="bookingDetails199gc">Describe the problem</label><textarea id="bookingDetails199gc" maxlength="5000" required></textarea><button id="bookingSubmit199gc" type="submit">Open dispute</button></form><p id="bookingStatus199gc" role="status" aria-live="polite"></p></section>\n<section class="panel"><h2>Choose your dispute</h2>'), ('Cannot find your case? <a href="./returns.html">Open a dispute</a> first if you are the buyer of a paid product order.', 'Cannot find your case? Open a dispute from a paid <a href="./returns.html">product order</a>, <a href="./service-appointments-193d.html">Other Services appointment</a> or <a href="./dispatch-appointments-192dd.html">Transport appointment</a>.'), ('<option value="other">Other</option></select><label for="file">', '<option value="service_evidence">Service evidence</option><option value="transport_evidence">Transport evidence</option><option value="other">Other</option></select><label for="file">'), ('shopdrop-customer-evidence-199gb.js?v=199gb', 'shopdrop-customer-evidence-199gb.js?v=199gc')], 'public/shopdrop-customer-evidence-199gb.js': [(" try{const u=await user();const fields='id,order_id,customer_dispute_reference,dispute_reason,dispute_status,created_at';const own=()=>db.from('disputes').select(fields).or('buyer_id.eq.'+u.id+',seller_id.eq.'+u.id);\n const {data,error}=await own().order('created_at',{ascending:false}).limit(100);if(error||!Array.isArray(data))throw Error('Unable to load disputes.');\n if(validUuid(preferred)&&!data.some(r=>r.id===preferred)){const result=await own().eq('id',preferred).maybeSingle();if(result.error)throw Error('Unable to check selected dispute.');if(result.data)data.unshift(result.data);}\n const orderIds=[...new Set(data.map(r=>r.order_id).filter(validUuid))];const refs=new Map();if(orderIds.length){const orders=await db.from('orders').select('id,order_reference').in('id',orderIds);if(!orders.error)for(const r of orders.data||[])refs.set(r.id,r.order_reference);}\n for(const r of data){if(!validUuid(r.id))continue;allowedCases.set(r.id,r);const label=[r.customer_dispute_reference||r.id,refs.get(r.order_id),r.dispute_status].filter(Boolean).join(' · ');const option=el('option',label);option.value=r.id;cases.append(option);}\n", " try{const u=await user();const configs=[{kind:'product',table:'disputes',party:'buyer_id',other:'seller_id',ref:'order_id',column:'dispute_id',label:'Products'},{kind:'service',table:'service_disputes',party:'buyer_id',other:'provider_id',ref:'booking_id',column:'service_dispute_id',label:'Other Services'},{kind:'dispatch',table:'shopdrop_dispatch_disputes_199gc',party:'customer_id',other:'provider_id',ref:'booking_id',column:'dispatch_dispute_id',label:'Transport Services & Equipment Hire'}];\n const all=[];for(const c of configs){const own=()=>db.from(c.table).select('id,'+c.ref+',customer_dispute_reference,dispute_reason,dispute_status,created_at').or(c.party+'.eq.'+u.id+','+c.other+'.eq.'+u.id);let query=own().order('created_at',{ascending:false}).limit(100);if(bookingContext&&c.kind===bookingContext.kind)query=query.eq(c.ref,bookingContext.id);const {data,error}=await query;if(error||!Array.isArray(data))throw Error('Unable to load '+c.label+' disputes.');if(validUuid(preferred)&&!data.some(r=>r.id===preferred)){const result=await own().eq('id',preferred).maybeSingle();if(result.error)throw Error('Unable to check linked dispute.');if(result.data)data.unshift(result.data);}for(const r of data)all.push({...r,kind:c.kind,column:c.column,category:c.label,transaction:r[c.ref]});}\n const counts=new Map();for(const r of all)counts.set(r.id,(counts.get(r.id)||0)+1);const orderIds=[...new Set(all.filter(r=>r.kind==='product').map(r=>r.transaction).filter(validUuid))];const refs=new Map();if(orderIds.length){const orders=await db.from('orders').select('id,order_reference').in('id',orderIds);if(!orders.error)for(const r of orders.data||[])refs.set(r.id,r.order_reference);}\n all.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));for(const r of all){if(!validUuid(r.id)||counts.get(r.id)!==1)continue;allowedCases.set(r.id,r);const label=[r.category,r.customer_dispute_reference||r.id,r.kind==='product'?refs.get(r.transaction):r.transaction,r.dispute_status].filter(Boolean).join(' · ');const option=el('option',label);option.value=r.id;cases.append(option);}\n bookingPanel.hidden=!bookingContext||bookingContext.role!=='customer';if(bookingContext)bookingLabel.textContent=(bookingContext.kind==='service'?'Other Services':'Transport Services & Equipment Hire')+' booking: '+bookingContext.id;\n"), ("const requested=new URLSearchParams(location.search).get('dispute_id');", "const params=new URLSearchParams(location.search);let requested=params.get('dispute_id');\nconst kind=params.get('booking_type'),bookingId=params.get('booking_id');\nconst bookingContext=['service','dispatch'].includes(kind)&&validUuid(bookingId)?{kind,id:bookingId,role:params.get('role')==='customer'?'customer':'provider'}:null;\nconst bookingPanel=by('bookingDispute199gc'),bookingLabel=by('bookingLabel199gc'),bookingForm=by('bookingForm199gc'),bookingSubmit=by('bookingSubmit199gc'),bookingStatus=by('bookingStatus199gc');"), ('panel.hidden=true;area.hidden=true;', 'panel.hidden=true;bookingPanel.hidden=true;area.hidden=true;'), ('refresh.disabled=on;upload.disabled=on;', 'refresh.disabled=on;upload.disabled=on;bookingSubmit.disabled=on;'), ('Showing up to 100 recent cases, plus a permitted linked case.', 'Showing up to 100 recent cases per category, plus a permitted linked case.'), ('No product disputes found.', 'No disputes found.'), ('const id=selected();await permission(id);panel.hidden=false;', 'const id=selected();await permission(id);const column=allowedCases.get(id).column;panel.hidden=false;'), (".select('id,dispute_id,storage_bucket,storage_path,original_filename,evidence_type,description,mime_type,file_size_bytes,created_at').eq('dispute_id',id)", ".select('id,dispute_id,service_dispute_id,dispatch_dispute_id,storage_bucket,storage_path,original_filename,evidence_type,description,mime_type,file_size_bytes,created_at').eq(column,id)"), ('r.dispute_id!==id||typeof r.storage_path', 'r[column]!==id||typeof r.storage_path'), ('if(r.dispute_id!==id||!r.storage_path', 'if(r[allowedCases.get(id).column]!==id||!r.storage_path'), ('await loadCases(requested);', "bookingForm.addEventListener('submit',async e=>{e.preventDefault();if(busy||!bookingContext||bookingContext.role!=='customer')return;lock(true);bookingStatus.textContent='Checking booking and submitting dispute…';try{await user();const reason=by('bookingReason199gc').value,details=by('bookingDetails199gc').value.trim();if(!['not_completed','not_as_described','damaged','late','other'].includes(reason)||!details||details.length>5000)throw Error('Choose a reason and describe the problem.');const {data,error}=await db.rpc('shopdrop_open_booking_dispute_199gc',{p_booking_type:bookingContext.kind,p_booking_id:bookingContext.id,p_reason:reason,p_description:details});if(error){if(error.code==='23514')throw Error('A verified paid booking is required. If your payment is missing, contact Shop&Drop support.');if(error.code==='42501')throw Error('Booking unavailable or access denied.');throw Error('Unable to submit dispute. Please retry or contact support.');}if(data?.ok!==true||data.booking_id!==bookingContext.id||data.booking_type!==bookingContext.kind||!validUuid(data.dispute_id))throw Error('Dispute confirmation unavailable. Refresh before retrying.');requested=data.dispute_id;bookingStatus.textContent=(data.duplicate?'Existing dispute: ':'Dispute registered: ')+String(data.dispute_reference||data.dispute_id)+'. You can attach evidence below.';bookingForm.reset();await loadCases(requested);}catch(err){bookingStatus.textContent=err.message||'Unable to submit dispute.';}finally{lock(false);}});\nawait loadCases(requested);")], 'public/shopdrop-service-appointments-193d.js': [('    card.append(actions,feedback);list.append(card);', "    if((uuid(row.booking_id))&&(row.payment_status==='paid'||row.booking_status==='disputed'))actions.append(link(provider?'View dispute / attach evidence':'Report a problem / attach evidence','./customer-dispute-evidence-199gb.html?booking_type=service&booking_id='+encodeURIComponent(row.booking_id)+'&role='+(provider?'provider':'customer')));\n    card.append(actions,feedback);list.append(card);")], 'public/service-appointments-193d.html': [('shopdrop-service-appointments-193d.js?v=199eb', 'shopdrop-service-appointments-193d.js?v=199gc')], 'public/shopdrop-dispatch-appointments-192dd.js': [('    card.append(actions,msg);list.append(card);', "    if((typeof row.booking_id==='string'&&/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(row.booking_id))&&(row.payment_status==='paid'||row.booking_status==='disputed'))actions.append(link(provider?'View dispute / attach evidence':'Report a problem / attach evidence','./customer-dispute-evidence-199gb.html?booking_type=dispatch&booking_id='+encodeURIComponent(row.booking_id)+'&role='+(provider?'provider':'customer')));\n    card.append(actions,msg);list.append(card);")], 'public/dispatch-appointments-192dd.html': [('shopdrop-dispatch-appointments-192dd.js?v=199eb', 'shopdrop-dispatch-appointments-192dd.js?v=199gc')]}
        NEW={'supabase/migrations/20261127082526_shopdrop_fix199gc1_typed_dispute_evidence.sql': "-- Fix 199G-C1: typed, private case evidence for products, services and transport.\n-- Does not create customer disputes, change booking status, or initiate financial actions.\nALTER TABLE public.service_disputes ADD COLUMN customer_dispute_reference text;\nCREATE UNIQUE INDEX shopdrop_service_dispute_reference_199gc\n ON public.service_disputes(customer_dispute_reference) WHERE customer_dispute_reference IS NOT NULL;\nCREATE TABLE public.shopdrop_dispatch_disputes_199gc(\n id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n booking_id uuid NOT NULL REFERENCES public.dispatch_bookings(id),\n customer_id uuid NOT NULL REFERENCES auth.users(id),\n provider_id uuid NOT NULL REFERENCES auth.users(id),\n customer_dispute_reference text NOT NULL UNIQUE,\n dispute_reason text NOT NULL,\n dispute_details text NOT NULL,\n dispute_status text NOT NULL DEFAULT 'open',\n created_at timestamptz NOT NULL DEFAULT now(),\n resolved_at timestamptz,\n CHECK(customer_id<>provider_id),\n CHECK(length(btrim(dispute_details)) BETWEEN 1 AND 5000)\n);\nALTER TABLE public.shopdrop_dispatch_disputes_199gc ENABLE ROW LEVEL SECURITY;\nREVOKE ALL ON TABLE public.shopdrop_dispatch_disputes_199gc FROM PUBLIC,anon,authenticated;\nGRANT SELECT ON TABLE public.shopdrop_dispatch_disputes_199gc TO authenticated;\nGRANT SELECT,INSERT,UPDATE ON TABLE public.shopdrop_dispatch_disputes_199gc TO service_role;\nCREATE POLICY shopdrop_dispatch_dispute_participants_199gc\n ON public.shopdrop_dispatch_disputes_199gc FOR SELECT TO authenticated\n USING ((select auth.uid()) IN (customer_id,provider_id));\nCREATE INDEX shopdrop_dispatch_dispute_booking_199gc ON public.shopdrop_dispatch_disputes_199gc(booking_id);\nALTER TABLE public.dispute_evidence ALTER COLUMN dispute_id DROP NOT NULL,\n ADD COLUMN service_dispute_id uuid REFERENCES public.service_disputes(id) ON DELETE RESTRICT,\n ADD COLUMN dispatch_dispute_id uuid REFERENCES public.shopdrop_dispatch_disputes_199gc(id) ON DELETE RESTRICT,\n ADD CONSTRAINT shopdrop_evidence_one_case_199gc CHECK(num_nonnulls(dispute_id,service_dispute_id,dispatch_dispute_id)=1);\nCREATE INDEX shopdrop_evidence_service_case_199gc ON public.dispute_evidence(service_dispute_id);\nCREATE INDEX shopdrop_evidence_dispatch_case_199gc ON public.dispute_evidence(dispatch_dispute_id);\n-- Resolve a case only if exactly one typed case exists and the account participates,\n-- or is an active administrator. Check booking identities as well as dispute identities.\nCREATE FUNCTION shopdrop_service_193c.evidence_case_kind_199gc(p_id uuid)\nRETURNS text LANGUAGE sql STABLE SECURITY DEFINER SET search_path TO ''\nAS $fn$\n SELECT CASE WHEN count(*)=1 AND bool_and(c.permitted) THEN min(c.kind) END\n FROM (\n  SELECT 'product'::text kind,(auth.uid() IN(d.buyer_id,d.seller_id) OR public.shopdrop_is_active_admin()) permitted\n  FROM public.disputes d WHERE d.id=p_id\n  UNION ALL\n  SELECT 'service',(auth.uid() IN(d.buyer_id,d.provider_id) OR public.shopdrop_is_active_admin())\n  FROM public.service_disputes d JOIN public.service_bookings b\n    ON b.id=d.booking_id AND b.buyer_id=d.buyer_id AND b.provider_id=d.provider_id\n  WHERE d.id=p_id\n  UNION ALL\n  SELECT 'dispatch',(auth.uid() IN(d.customer_id,d.provider_id) OR public.shopdrop_is_active_admin())\n  FROM public.shopdrop_dispatch_disputes_199gc d JOIN public.dispatch_bookings b\n    ON b.id=d.booking_id AND b.customer_id=d.customer_id AND b.provider_id=d.provider_id\n  WHERE d.id=p_id\n ) c\n WHERE auth.uid() IS NOT NULL\n$fn$;\nREVOKE ALL ON FUNCTION shopdrop_service_193c.evidence_case_kind_199gc(uuid) FROM PUBLIC,anon,authenticated;\nCREATE OR REPLACE FUNCTION public.shopdrop_can_upload_dispute_evidence(p_dispute_id uuid)\nRETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path TO ''\nAS $fn$\n SELECT shopdrop_service_193c.evidence_case_kind_199gc(p_dispute_id) IS NOT NULL\n$fn$;\nCREATE OR REPLACE FUNCTION public.shopdrop_register_dispute_evidence(p_dispute_id uuid, p_storage_path text, p_evidence_type text, p_description text, p_original_filename text)\n RETURNS jsonb\n LANGUAGE plpgsql\n SECURITY DEFINER\n SET search_path TO ''\nAS $function$\ndeclare v_object storage.objects%rowtype; v_id uuid; v_mime text; v_size bigint; v_kind text;\nbegin\n if auth.uid() is null or p_dispute_id is null\n  or not public.shopdrop_can_upload_dispute_evidence(p_dispute_id) then\n  raise exception 'Dispute participant authorization required' using errcode='42501';\n end if;\n v_kind:=shopdrop_service_193c.evidence_case_kind_199gc(p_dispute_id);\n if v_kind IS NULL THEN RAISE EXCEPTION 'Dispute unavailable' USING ERRCODE='42501'; END IF;\n if p_storage_path is null\n  or p_storage_path not like p_dispute_id::text||'/'||auth.uid()::text||'/%'\n  or length(p_storage_path)>500\n  or length(btrim(coalesce(p_evidence_type,''))) not between 2 and 80\n  or length(coalesce(p_description,''))>2000\n  or length(btrim(coalesce(p_original_filename,''))) not between 1 and 255 then\n  raise exception 'Invalid evidence details' using errcode='22023';\n end if;\n select * into v_object from storage.objects\n where bucket_id='dispute-evidence' and name=p_storage_path\n and owner_id=auth.uid()::text;\n if not found then raise exception 'Uploaded evidence object not found or not owned by account' using errcode='P0002'; end if;\n v_mime:=v_object.metadata->>'mimetype';\n v_size:=nullif(v_object.metadata->>'size','')::bigint;\n if v_mime not in ('image/jpeg','image/png','image/webp','application/pdf')\n  or v_size is null or v_size<1 or v_size>20971520 then\n  raise exception 'Evidence file type or size invalid' using errcode='23514';\n end if;\n if exists(select 1 from public.dispute_evidence where storage_bucket='dispute-evidence' and storage_path=p_storage_path) then\n  raise exception 'Evidence already registered' using errcode='23505';\n end if;\n insert into public.dispute_evidence\n (dispute_id,service_dispute_id,dispatch_dispute_id,submitted_by,storage_bucket,storage_path,evidence_type,description,original_filename,mime_type,file_size_bytes)\n values(CASE WHEN v_kind='product' THEN p_dispute_id END,CASE WHEN v_kind='service' THEN p_dispute_id END,CASE WHEN v_kind='dispatch' THEN p_dispute_id END,auth.uid(),'dispute-evidence',p_storage_path,btrim(p_evidence_type),\n nullif(btrim(coalesce(p_description,'')),''),btrim(p_original_filename),v_mime,v_size)\n returning id into v_id;\n return jsonb_build_object('evidence_id',v_id,'dispute_id',p_dispute_id,'registered',true);\nend;\n$function$;\nCREATE OR REPLACE FUNCTION public.shopdrop_admin_dispute_evidence_overview()\n RETURNS TABLE(evidence_id uuid, dispute_id uuid, evidence_type text, description text, mime_type text, file_size_bytes bigint, created_at timestamp with time zone)\n LANGUAGE plpgsql\n STABLE SECURITY DEFINER\n SET search_path TO ''\nAS $function$\nbegin\n if auth.uid() is null or not public.shopdrop_is_active_admin() then\n  raise exception 'Administrator access required' using errcode='42501';\n end if;\n return query\n select e.id,coalesce(e.dispute_id,e.service_dispute_id,e.dispatch_dispute_id),e.evidence_type,e.description,e.mime_type,e.file_size_bytes,e.created_at\n from public.dispute_evidence e\n order by e.created_at desc,e.id desc\n limit 100;\nend;\n$function$;\nCREATE OR REPLACE FUNCTION public.shopdrop_dispute_storage_read_allowed(p_path text)\n RETURNS boolean\n LANGUAGE plpgsql\n STABLE SECURITY DEFINER\n SET search_path TO ''\nAS $function$\nDECLARE parts text[]; u uuid:=auth.uid();\n pattern constant text:='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$';\nBEGIN\n IF u IS NULL OR p_path IS NULL THEN RETURN false; END IF;\n parts:=storage.foldername(p_path);\n IF array_length(parts,1) IS DISTINCT FROM 2 OR parts[1] !~* pattern THEN RETURN false; END IF;\n IF parts[2] ~* pattern AND public.shopdrop_can_upload_dispute_evidence(parts[1]::uuid) THEN\n  IF parts[2]=u::text THEN RETURN true; END IF;\n  IF public.shopdrop_is_active_admin() THEN\n   RETURN EXISTS(SELECT 1 FROM public.dispute_evidence e\n    WHERE coalesce(e.dispute_id,e.service_dispute_id,e.dispatch_dispute_id)=parts[1]::uuid AND e.submitted_by=parts[2]::uuid\n      AND e.storage_bucket='dispute-evidence' AND e.storage_path=p_path);\n  END IF;\n  RETURN false;\n END IF;\n -- Retain the existing owner-only legacy signed-upload layout.\n RETURN parts[1]=u::text AND parts[2] ~ '^[A-Za-z0-9_-]{1,120}$';\nEND $function$;\n-- Existing owner-only metadata RLS, private storage bucket, cleanup checks,\n-- admin-only file path, completion PIN and all payout functions remain unchanged.\n", 'supabase/migrations/20261127082846_shopdrop_fix199gc2_booking_dispute_registration.sql': "-- Fix 199G-C2: customer-owned service and transport disputes.\n-- Existing payment verification, PIN, settlement and release workers are untouched.\nCREATE FUNCTION public.shopdrop_open_booking_dispute_199gc(p_booking_type text,p_booking_id uuid,p_reason text,p_description text)\nRETURNS jsonb LANGUAGE plpgsql SECURITY DEFINER SET search_path TO ''\nAS $fn$\nDECLARE\n u uuid:=auth.uid(); k text:=p_booking_type;\n reason text:=lower(btrim(coalesce(p_reason,''))); details text:=btrim(coalesce(p_description,''));\n sb public.service_bookings%ROWTYPE; db public.dispatch_bookings%ROWTYPE;\n provider uuid; payid uuid; payment_count integer; payout_state text; advert text;\n case_id uuid; ref text; hold_recorded boolean:=false;\nBEGIN\n IF u IS NULL THEN RAISE EXCEPTION 'Sign in required' USING ERRCODE='28000'; END IF;\n IF k IS NULL OR k NOT IN ('service','dispatch') OR p_booking_id IS NULL\n OR reason NOT IN ('not_completed','not_as_described','damaged','late','other')\n OR length(details) NOT BETWEEN 1 AND 5000 THEN\n  RAISE EXCEPTION 'Invalid dispute details' USING ERRCODE='22023';\n END IF;\n -- Same booking row lock used by the existing completion PIN flow.\n IF k='service' THEN\n  SELECT * INTO sb FROM public.service_bookings b WHERE b.id=p_booking_id AND b.buyer_id=u FOR UPDATE;\n  IF NOT FOUND OR sb.provider_id=u THEN RAISE EXCEPTION 'Booking unavailable or access denied' USING ERRCODE='42501'; END IF;\n  provider:=sb.provider_id; advert:=sb.advertisement_reference_snapshot;\n  SELECT d.id,d.customer_dispute_reference INTO case_id,ref FROM public.service_disputes d\n  WHERE d.booking_id=sb.id AND d.buyer_id=u AND d.provider_id=provider AND d.resolved_at IS NULL\n  AND d.dispute_status NOT IN ('resolved','closed','rejected','cancelled','canceled')\n  ORDER BY d.created_at DESC,d.id LIMIT 1;\n  IF FOUND THEN RETURN jsonb_build_object('ok',true,'booking_type',k,'booking_id',p_booking_id,'dispute_id',case_id,'dispute_reference',coalesce(ref,case_id::text),'duplicate',true); END IF;\n  IF sb.payment_status IS DISTINCT FROM 'paid' OR sb.booking_status IN ('cancelled','canceled','refunded') THEN\n   RAISE EXCEPTION 'Verified paid booking required' USING ERRCODE='23514';\n  END IF;\n  SELECT count(*),min(p.id::text)::uuid INTO payment_count,payid FROM public.service_payments p\n  WHERE p.booking_id=sb.id AND p.buyer_id=u AND p.provider_id=provider\n  AND p.payment_status='paid' AND p.paid_at IS NOT NULL AND p.provider_amount>0 AND p.commission_amount>=0\n  AND p.gross_amount=p.provider_amount+p.commission_amount\n  AND length(btrim(coalesce(p.payment_reference,''))) BETWEEN 5 AND 256\n  AND EXISTS(SELECT 1 FROM public.shopdrop_service_dispatch_payment_evidence e\n   WHERE e.payment_kind='service' AND e.payment_id=p.id AND e.verification_status='verified');\n ELSE\n  SELECT * INTO db FROM public.dispatch_bookings b WHERE b.id=p_booking_id AND b.customer_id=u FOR UPDATE;\n  IF NOT FOUND OR db.provider_id=u THEN RAISE EXCEPTION 'Booking unavailable or access denied' USING ERRCODE='42501'; END IF;\n  provider:=db.provider_id; advert:=coalesce(db.advertisement_reference_snapshot,db.offer_reference_snapshot);\n  SELECT d.id,d.customer_dispute_reference INTO case_id,ref FROM public.shopdrop_dispatch_disputes_199gc d\n  WHERE d.booking_id=db.id AND d.customer_id=u AND d.provider_id=provider AND d.resolved_at IS NULL\n  AND d.dispute_status NOT IN ('resolved','closed','rejected','cancelled','canceled')\n  ORDER BY d.created_at DESC,d.id LIMIT 1;\n  IF FOUND THEN RETURN jsonb_build_object('ok',true,'booking_type',k,'booking_id',p_booking_id,'dispute_id',case_id,'dispute_reference',ref,'duplicate',true); END IF;\n  IF db.payment_status IS DISTINCT FROM 'paid' OR db.booking_status='cancelled' THEN\n   RAISE EXCEPTION 'Verified paid booking required' USING ERRCODE='23514';\n  END IF;\n  SELECT count(*),min(p.id::text)::uuid INTO payment_count,payid FROM public.dispatch_payments p\n  WHERE p.booking_id=db.id AND p.payment_status='paid' AND p.paid_at IS NOT NULL\n  AND p.provider_amount=db.provider_amount AND p.provider_amount>0 AND p.commission_amount>=0\n  AND p.gross_amount=p.provider_amount+p.commission_amount AND p.currency=db.currency\n  AND length(btrim(coalesce(p.payment_reference,''))) BETWEEN 5 AND 256\n  AND EXISTS(SELECT 1 FROM public.shopdrop_service_dispatch_payment_evidence e\n   WHERE e.payment_kind='dispatch' AND e.payment_id=p.id AND e.verification_status='verified');\n END IF;\n IF payment_count IS DISTINCT FROM 1 OR payid IS NULL THEN\n  RAISE EXCEPTION 'Exactly one verified paid booking payment required' USING ERRCODE='23514';\n END IF;\n ref:=public.generate_shopdrop_reference('SD-DSP');\n IF k='service' THEN\n  INSERT INTO public.service_disputes(booking_id,buyer_id,provider_id,customer_dispute_reference,dispute_reason,dispute_details)\n  VALUES(p_booking_id,u,provider,ref,reason,details) RETURNING id INTO case_id;\n ELSE\n  INSERT INTO public.shopdrop_dispatch_disputes_199gc(booking_id,customer_id,provider_id,customer_dispute_reference,dispute_reason,dispute_details)\n  VALUES(p_booking_id,u,provider,ref,reason,details) RETURNING id INTO case_id;\n  -- Connect to the existing booking-specific hold check, without changing\n  -- the release algorithm, reversing funds or claiming an external bank hold.\n  SELECT p.provider_payout_status INTO payout_state FROM public.dispatch_payments p WHERE p.id=payid FOR UPDATE;\n  IF payout_state IS DISTINCT FROM 'paid' AND NOT EXISTS(\n   SELECT 1 FROM public.shopdrop_provider_release_requests r\n   WHERE r.booking_type='dispatch' AND r.booking_id=p_booking_id AND r.release_status='confirmed'\n  ) THEN\n   INSERT INTO public.shopdrop_dispatch_payout_holds(booking_id,provider_id,hold_reason)\n   VALUES(p_booking_id,provider,'Customer dispute: '||ref)\n   ON CONFLICT(booking_id) WHERE hold_status='active' DO NOTHING;\n   hold_recorded:=EXISTS(SELECT 1 FROM public.shopdrop_dispatch_payout_holds h\n    WHERE h.booking_id=p_booking_id AND h.provider_id=provider AND h.hold_status='active');\n   IF NOT hold_recorded THEN RAISE EXCEPTION 'Existing transport hold identity requires reconciliation'; END IF;\n  END IF;\n END IF;\n INSERT INTO public.integration_events(event_type,entity_type,entity_id,external_reference,idempotency_key,payload,status)\n VALUES('payment_dispute_opened',CASE WHEN k='service' THEN 'service_dispute' ELSE 'dispatch_dispute' END,case_id,ref,\n 'customer-dispute:'||case_id::text,jsonb_build_object('user_id',u,'dispute_reference',ref,'dispute_id',case_id,\n 'booking_type',k,'booking_id',p_booking_id,'payment_id',payid,'transaction_reference',p_booking_id::text,\n 'advertisement_reference',advert,'reason',reason,'description',details,'created_at',now()),'received');\n RETURN jsonb_build_object('ok',true,'booking_type',k,'booking_id',p_booking_id,'dispute_id',case_id,\n 'dispute_reference',ref,'duplicate',false,'transport_internal_hold_recorded',hold_recorded);\nEND $fn$;\nREVOKE ALL ON FUNCTION public.shopdrop_open_booking_dispute_199gc(text,uuid,text,text) FROM PUBLIC,anon,authenticated;\nGRANT EXECUTE ON FUNCTION public.shopdrop_open_booking_dispute_199gc(text,uuid,text,text) TO authenticated;\n", 'docs/SHOPDROP_FIX199GC_BOOKING_DISPUTES.md': '# Fix 199G-C: Other Services and Transport disputes\n\nC1 and C2 were applied in Supabase; included SQL files are exact source-control copies, not executed by this installer. Product, service and transport cases share the private evidence bucket and typed foreign keys. The customer form is available from paid appointments; the backend independently checks authenticated customer ownership, exactly one verified paid booking payment, and duplicate cases. Provider links allow viewing and attaching their own evidence only. The administrator page continues to use its existing protected reporting and download RPCs. The existing transport internal hold check is connected; no bank hold or release is claimed. No payment, PIN, courier, settlement, provider-activation or international logic changes. Rollback SQL tests verified typed evidence permission, unpaid/unrelated booking rejection, duplicate existing case, and unverified-payment rejection. Positive verified paid service/transport case creation and transport hold tests remain outstanding until the provider verifier is configured. Live signed-in uploads/downloads and admin review are also outstanding. Lists show up to 100 recent cases per category, plus a permitted linked case. No direct changes to main or V26.24 FINAL.\n'}
        CHECKSUMS={'supabase/migrations/20261127082526_shopdrop_fix199gc1_typed_dispute_evidence.sql': '551037af03c8f1c7fc4d02b798df2219', 'supabase/migrations/20261127082846_shopdrop_fix199gc2_booking_dispute_registration.sql': 'b426278192e91629385ba88c893d6547'}
        BACKUP='backups/fix199gc/'

        def require(ok,msg):
            if not ok: raise SystemExit(msg)
        def gitsha(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
        def transform(p,s):
            for a,b in PATCHES[p]:
                require(s.count(a)==1,'Unexpected anchor in '+p+': '+a[:80]);s=s.replace(a,b,1)
            return s
        def write_new(p,b):
            q=Path(p)
            if q.exists():require(q.read_bytes()==b,'Unexpected existing file '+p)
            else:q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(b)
        def check_js(s):
            with tempfile.TemporaryDirectory() as d:
                p=Path(d)/'test.mjs';p.write_text(s);subprocess.run(['node','--check',str(p)],check=True)
        def main():
            for p,h in PROTECTED.items():require(gitsha(Path(p).read_bytes())==h,'Protected source differs '+p)
            for p,h in CHECKSUMS.items():require(hashlib.md5(NEW[p].encode()).hexdigest()==h,'Migration checksum mismatch '+p)
            originals={};updates={}
            for p,h in EXPECTED.items():
                current=Path(p).read_bytes();bp=Path(BACKUP+p);original=bp.read_bytes() if bp.exists() else current
                require(gitsha(original)==h,'Unexpected source '+p);updated=transform(p,original.decode()).encode();require(current in (original,updated),'Unexpected current content '+p)
                if p.endswith('.js'):check_js(updated.decode())
                originals[p]=original;updates[p]=updated
            for p,s in NEW.items():write_new(p,s.encode())
            for p,b in originals.items():write_new(BACKUP+p,b)
            for p,b in updates.items():Path(p).write_bytes(b)
            for p,h in PROTECTED.items():require(gitsha(Path(p).read_bytes())==h,'Protected source changed '+p)
            print('Verified exact original sources, typed evidence JavaScript and migration checksums')
        if __name__=='__main__':main()
