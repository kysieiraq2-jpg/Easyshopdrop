ss="muted">Cannot find your case? <a href="./returns.html">Open a dispute</a> first if you are the buyer of a paid product order.</p></section>\n<section class="panel" id="evidencePanel" hidden><h2>Upload evidence</h2><form id="uploadForm"><label for="evidenceType">Evidence type</label><select id="evidenceType" required><option value="">Select evidence type</option><option value="buyer_item_photos">Buyer item photos</option><option value="original_listing_photos">Original listing photos</option><option value="delivery_evidence">Delivery evidence</option><option value="return_photos">Return photos</option><option value="courier_tracking">Courier / tracking evidence</option><option value="other">Other</option></select><label for="file">Choose one photograph or document</label><input id="file" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf,image/jpeg,image/png,image/webp,application/pdf" required><p class="muted">JPEG, PNG, WebP or PDF, maximum 20 MB per file. You can attach further files after each successful upload. Do not include unnecessary personal information.</p><label for="description">Description (optional)</label><textarea id="description" maxlength="2000"></textarea><button id="upload" type="submit">Upload evidence</button></form><p id="uploadStatus" role="status" aria-live="polite"></p><h2>Your submitted evidence</h2><button id="refresh" type="button">Refresh evidence</button><p id="reportStatus" role="status" aria-live="polite"></p><div id="records"></div></section>\n<p class="muted">Submitting evidence does not resolve the dispute, authorize a refund or release funds. Normal transactions remain automatic.</p></div></main>\n<script type="module" src="./shopdrop-customer-evidence-199gb.js?v=199gb"></script></body></html>\n', 'public/shopdrop-customer-evidence-199gb.js': "import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';\nconst db=createClient('https://dtkdvvxpwonywtsgqmdx.supabase.co','sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});\nconst by=id=>document.getElementById(id);\nconst access=by('access'),area=by('protected'),cases=by('cases'),panel=by('evidencePanel'),caseStatus=by('caseStatus'),uploadStatus=by('uploadStatus'),reportStatus=by('reportStatus'),records=by('records'),form=by('uploadForm'),upload=by('upload'),reload=by('reload'),refresh=by('refresh');\nconst validUuid=v=>typeof v==='string'&&/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(v);\nconst ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf'};\nconst el=(tag,t)=>{const n=document.createElement(tag);if(t!==undefined)n.textContent=t;return n;};\nconst dateText=v=>{const d=new Date(v);return v&&!Number.isNaN(d.getTime())?d.toLocaleString('en-ZA'):'Date unavailable';};\nlet accountId=null, allowedCases=new Map(),busy=false;\nconst requested=new URLSearchParams(location.search).get('dispute_id');\nfunction deny(){accountId=null;allowedCases.clear();records.replaceChildren();cases.replaceChildren(el('option','Choose your dispute'));panel.hidden=true;area.hidden=true;access.hidden=false;access.replaceChildren(document.createTextNode('Sign in to view your private disputes. '));const a=el('a','Sign in');a.href='./sign-in.html';access.append(a);}\nasync function user(){const {data,error}=await db.auth.getUser();if(error||!validUuid(data?.user?.id)){deny();throw Error('Sign in required.');}if(accountId&&accountId!==data.user.id){deny();throw Error('Account changed. Reload this page.');}accountId=data.user.id;return data.user;}\nfunction lock(on){busy=on;cases.disabled=on;reload.disabled=on;refresh.disabled=on;upload.disabled=on;}\nfunction selected(){const id=cases.value;if(!validUuid(id)||!allowedCases.has(id))throw Error('Choose an existing dispute.');return id;}\nasync function permission(id){const {data,error}=await db.rpc('shopdrop_can_upload_dispute_evidence',{p_dispute_id:id});if(error||data!==true)throw Error('Dispute unavailable or access denied.');}\nasync function loadCases(preferred){lock(true);caseStatus.textContent='Loading your disputes…';panel.hidden=true;records.replaceChildren();allowedCases.clear();const placeholder=el('option','Choose your dispute');placeholder.value='';cases.replaceChildren(placeholder);\n try{const u=await user();const fields='id,order_id,customer_dispute_reference,dispute_reason,dispute_status,created_at';const own=()=>db.from('disputes').select(fields).or('buyer_id.eq.'+u.id+',seller_id.eq.'+u.id);\n const {data,error}=await own().order('created_at',{ascending:false}).limit(100);if(error||!Array.isArray(data))throw Error('Unable to load disputes.');\n if(validUuid(preferred)&&!data.some(r=>r.id===preferred)){const result=await own().eq('id',preferred).maybeSingle();if(result.error)throw Error('Unable to check selected dispute.');if(result.data)data.unshift(result.data);}\n const orderIds=[...new Set(data.map(r=>r.order_id).filter(validUuid))];const refs=new Map();if(orderIds.length){const orders=await db.from('orders').select('id,order_reference').in('id',orderIds);if(!orders.error)for(const r of orders.data||[])refs.set(r.id,r.order_reference);}\n for(const r of data){if(!validUuid(r.id))continue;allowedCases.set(r.id,r);const label=[r.customer_dispute_reference||r.id,refs.get(r.order_id),r.dispute_status].filter(Boolean).join(' · ');const option=el('option',label);option.value=r.id;cases.append(option);}\n area.hidden=false;access.hidden=true;caseStatus.textContent=allowedCases.size?'Choose a dispute to view or attach your evidence. Showing up to 100 recent cases, plus a permitted linked case.':'No product disputes found.';\n if(preferred){if(allowedCases.has(preferred)){cases.value=preferred;await loadEvidence();}else caseStatus.textContent='The linked dispute is unavailable to this account. Choose one of your own disputes.';}\n }catch(e){caseStatus.textContent=e.message||'Unable to load disputes.';if(accountId){area.hidden=false;access.hidden=true;}}finally{lock(false);}}\nasync function loadEvidence(){records.replaceChildren();panel.hidden=true;try{const u=await user();const id=selected();await permission(id);panel.hidden=false;reportStatus.textContent='Loading your submitted files…';const {data,error}=await db.from('dispute_evidence').select('id,dispute_id,storage_bucket,storage_path,original_filename,evidence_type,description,mime_type,file_size_bytes,created_at').eq('dispute_id',id).eq('submitted_by',u.id).eq('storage_bucket','dispute-evidence').order('created_at',{ascending:false}).limit(100);if(error||!Array.isArray(data))throw Error('Unable to load your evidence.');\n for(const r of data){if(!validUuid(r.id)||r.dispute_id!==id||typeof r.storage_path!=='string'||!r.storage_path.startsWith(id+'/'+u.id+'/'))continue;const card=el('div');card.className='item';card.append(el('strong',r.original_filename||'Evidence file'),el('p',[String(r.evidence_type||'Evidence').replaceAll('_',' '),dateText(r.created_at),r.file_size_bytes!=null?r.file_size_bytes+' bytes':''].filter(Boolean).join(' · ')));if(r.description)card.append(el('p',r.description));const button=el('button','Download my file');button.type='button';button.addEventListener('click',()=>download(r,button));card.append(button);records.append(card);}\n reportStatus.textContent=data.length?'Showing up to 100 of your most recent submitted files.':'No evidence submitted by you for this dispute yet.';\n }catch(e){reportStatus.textContent=e.message||'Unable to load evidence.';caseStatus.textContent='Choose a permitted dispute or refresh.';}}\nasync function download(r,button){if(busy)return;lock(true);button.disabled=true;try{const u=await user();const id=selected();await permission(id);if(r.dispute_id!==id||!r.storage_path.startsWith(id+'/'+u.id+'/')||!ext[r.mime_type])throw Error('File unavailable.');const {data,error}=await db.storage.from('dispute-evidence').download(r.storage_path);if(error||!data)throw Error('Private file download failed.');const url=URL.createObjectURL(data);const a=el('a');a.href=url;a.download='shopdrop-evidence-'+r.id+'.'+ext[r.mime_type];document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);reportStatus.textContent='File download requested.';}catch(e){reportStatus.textContent=e.message||'File unavailable.';}finally{button.disabled=false;lock(false);}}\nasync function cleanup(path){try{const {data,error}=await db.rpc('shopdrop_evidence_cleanup_allowed',{p_path:path});if(error||data!==true)return false;const r=await db.storage.from('dispute-evidence').remove([path]);return !r.error;}catch{return false;}}\nform.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;lock(true);uploadStatus.textContent='Checking your evidence…';try{const u=await user();const id=selected();await permission(id);const f=by('file').files[0],type=by('evidenceType').value,description=by('description').value.trim();if(!f||!Object.hasOwn(ext,f.type)||f.size<1||f.size>20971520||!f.name||f.name.length>255||!type||description.length>2000)throw Error('Choose an allowed file up to 20 MB and an evidence type.');const path=id+'/'+u.id+'/'+crypto.randomUUID()+'.'+ext[f.type];uploadStatus.textContent='Uploading private file…';const result=await db.storage.from('dispute-evidence').upload(path,f,{contentType:f.type,upsert:false});if(result.error)throw Error('Upload failed. Try again.');uploadStatus.textContent='Registering your evidence…';const registered=await db.rpc('shopdrop_register_dispute_evidence',{p_dispute_id:id,p_storage_path:path,p_evidence_type:type,p_description:description||null,p_original_filename:f.name});if(registered.error||registered.data?.registered!==true||!validUuid(registered.data?.evidence_id)){const cleaned=await cleanup(path);throw Error(cleaned?'Evidence registration failed; the unregistered file was removed. Please retry.':'Evidence registration could not be confirmed. Refresh your evidence before retrying. Contact support if necessary.');}uploadStatus.textContent='Evidence uploaded and registered. You may attach another file.';form.reset();await loadEvidence();}catch(e){uploadStatus.textContent=e.message||'Unable to upload evidence.';}finally{lock(false);}});\ncases.addEventListener('change',async()=>{if(busy)return;lock(true);form.reset();uploadStatus.textContent='';try{if(cases.value)await loadEvidence();else{panel.hidden=true;records.replaceChildren();}}finally{lock(false);}});\nreload.addEventListener('click',()=>{if(!busy)loadCases(cases.value||requested);});refresh.addEventListener('click',async()=>{if(busy)return;lock(true);try{await loadEvidence();}finally{lock(false);}});\nawait loadCases(requested);\n", 'supabase/migrations/20261127073658_shopdrop_fix199gb1_product_dispute_case.sql': "-- Fix 199G-B1: attach eligible customer disputes to real evidence-capable cases.\n-- Existing payout, refund, provider webhook and administrative review rules unchanged.\nALTER TABLE public.disputes ADD COLUMN customer_dispute_reference text;\nCREATE UNIQUE INDEX shopdrop_customer_dispute_reference_199gb\n ON public.disputes(customer_dispute_reference) WHERE customer_dispute_reference IS NOT NULL;\n\nCREATE FUNCTION public.shopdrop_open_product_dispute_199gb(p_user_id uuid,p_order_id uuid,p_reason text,p_description text)\nRETURNS jsonb LANGUAGE plpgsql SET search_path TO ''\nAS $fn$\nDECLARE o public.orders%ROWTYPE; d public.disputes%ROWTYPE; payid uuid; ref text;\n reason text:=lower(btrim(coalesce(p_reason,''))); details text:=btrim(coalesce(p_description,''));\nBEGIN\n IF auth.role() IS DISTINCT FROM 'service_role' THEN RAISE EXCEPTION 'backend_only' USING ERRCODE='42501'; END IF;\n IF p_user_id IS NULL OR p_order_id IS NULL OR reason NOT IN ('not_received','damaged','wrong_item','not_as_described','other')\n    OR length(details) NOT BETWEEN 1 AND 5000 THEN RAISE EXCEPTION 'invalid_dispute_details' USING ERRCODE='22023'; END IF;\n SELECT * INTO o FROM public.orders WHERE id=p_order_id AND buyer_id=p_user_id FOR UPDATE;\n IF NOT FOUND OR o.seller_id IS NULL OR o.seller_id=p_user_id THEN RAISE EXCEPTION 'order_not_found_or_not_owned' USING ERRCODE='42501'; END IF;\n -- Serialize customer cases on the order. Reuse the existing active case on retries.\n SELECT * INTO d FROM public.disputes x\n WHERE x.order_id=o.id AND x.buyer_id=o.buyer_id AND x.seller_id=o.seller_id\n AND x.customer_dispute_reference IS NOT NULL AND x.external_payment_dispute=false\n AND x.resolved_at IS NULL AND x.dispute_status NOT IN ('resolved','closed','cancelled','canceled')\n ORDER BY x.created_at DESC,x.id LIMIT 1;\n IF FOUND THEN\n  RETURN jsonb_build_object('ok',true,'dispute_id',d.id,'dispute_reference',d.customer_dispute_reference,'status','existing_case','duplicate',true);\n END IF;\n IF o.payment_status IS DISTINCT FROM 'paid' OR o.order_status IN ('cancelled','canceled','refunded') THEN\n  RAISE EXCEPTION 'paid_order_required_for_dispute' USING ERRCODE='23514';\n END IF;\n SELECT p.id INTO payid FROM public.payments p\n WHERE p.order_id=o.id AND p.buyer_id=o.buyer_id AND p.seller_id=o.seller_id\n AND p.currency=o.currency AND p.payment_status='paid' AND p.paid_at IS NOT NULL\n AND p.total_paid>0\n ORDER BY p.paid_at DESC,p.id LIMIT 1;\n IF payid IS NULL THEN RAISE EXCEPTION 'paid_order_required_for_dispute' USING ERRCODE='23514'; END IF;\n ref:=public.generate_shopdrop_reference('SD-DSP');\n INSERT INTO public.disputes(order_id,buyer_id,seller_id,dispute_reason,dispute_details,customer_dispute_reference)\n VALUES(o.id,o.buyer_id,o.seller_id,reason,details,ref) RETURNING * INTO d;\n -- Keep the existing customer-support queue and link it to the same case atomically.\n INSERT INTO public.integration_events(event_type,entity_type,entity_id,external_reference,idempotency_key,payload,status)\n VALUES('payment_dispute_opened','dispute',d.id,ref,'customer-dispute:'||d.id::text,\n jsonb_build_object('user_id',o.buyer_id,'dispute_reference',ref,'dispute_id',d.id,'order_id',o.id,\n 'payment_id',payid,'transaction_reference',o.order_reference,'reason',reason,'description',details,'created_at',now()),'received');\n RETURN jsonb_build_object('ok',true,'dispute_id',d.id,'dispute_reference',ref,'status','submitted','duplicate',false);\nEND $fn$;\nREVOKE ALL ON FUNCTION public.shopdrop_open_product_dispute_199gb(uuid,uuid,text,text) FROM PUBLIC,anon,authenticated;\nGRANT EXECUTE ON FUNCTION public.shopdrop_open_product_dispute_199gb(uuid,uuid,text,text) TO service_role;\n", 'supabase/migrations/20261127070613_shopdrop_fix199ga_private_evidence.sql': '-- Fix 199G-A: protect private evidence without changing financial or delivery procedures.\n-- The current proof-of-delivery page reads the existing buyer-only tracking snapshot.\n-- Raw POD is backend-only, including recipient names, notes and storage paths.\nDROP POLICY "V26 POD authenticated select" ON public.proof_of_delivery;\nDROP POLICY "V26 POD authenticated insert" ON public.proof_of_delivery;\nREVOKE ALL ON TABLE public.proof_of_delivery FROM PUBLIC,anon,authenticated;\n-- The authorized courier/backend continues to use its existing service-role access.\nDROP POLICY "V26 proof of delivery authenticated upload" ON storage.objects;\n\n-- Evidence registration must go through the existing protected RPC, which checks\n-- the dispute participant, actual owned storage object, MIME and file size.\nDROP POLICY "V26 dispute evidence own insert" ON public.dispute_evidence;\nDROP POLICY "V26 dispute evidence own delete" ON public.dispute_evidence;\nDROP POLICY "ShopDrop dispute evidence participant metadata insert" ON public.dispute_evidence;\nREVOKE ALL ON TABLE public.dispute_evidence FROM PUBLIC,anon,authenticated;\nGRANT SELECT ON TABLE public.dispute_evidence TO authenticated;\nCREATE UNIQUE INDEX shopdrop_dispute_evidence_object_199ga\nON public.dispute_evidence(storage_bucket,storage_path);\n\n-- Preserve participant uploads, but never expose another participant\'s private\n-- photographs or documents through Storage listing. The existing administrators\n-- can review registered case evidence. Legacy personal uploads stay owner-only.\nCREATE OR REPLACE FUNCTION public.shopdrop_dispute_storage_read_allowed(p_path text)\nRETURNS boolean LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path TO \'\'\nAS $fn$\nDECLARE parts text[]; u uuid:=auth.uid();\n pattern constant text:=\'^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$\';\nBEGIN\n IF u IS NULL OR p_path IS NULL THEN RETURN false; END IF;\n parts:=storage.foldername(p_path);\n IF array_length(parts,1) IS DISTINCT FROM 2 OR parts[1] !~* pattern THEN RETURN false; END IF;\n IF parts[2] ~* pattern AND public.shopdrop_can_upload_dispute_evidence(parts[1]::uuid) THEN\n  IF parts[2]=u::text THEN RETURN true; END IF;\n  IF public.shopdrop_is_active_admin() THEN\n   RETURN EXISTS(SELECT 1 FROM public.dispute_evidence e\n    WHERE e.dispute_id=parts[1]::uuid AND e.submitted_by=parts[2]::uuid\n      AND e.storage_bucket=\'dispute-evidence\' AND e.storage_path=p_path);\n  END IF;\n  RETURN false;\n END IF;\n -- Retain the existing owner-only legacy signed-upload layout.\n RETURN parts[1]=u::text AND parts[2] ~ \'^[A-Za-z0-9_-]{1,120}$\';\nEND $fn$;\n-- Do not allow a client to invent an object owner.\nDROP POLICY "ShopDrop dispute evidence participant upload" ON storage.objects;\nCREATE POLICY "ShopDrop dispute evidence participant upload" ON storage.objects FOR INSERT TO authenticated\nWITH CHECK(bucket_id=\'dispute-evidence\' AND owner_id=auth.uid()::text\n AND public.shopdrop_dispute_storage_upload_allowed(name));\n-- Only unregistered objects remain eligible for existing cleanup.\n-- All transaction, courier, payout and verification functions remain unchanged.\n', 'docs/SHOPDROP_FIX199GB_CUSTOMER_DISPUTE_EVIDENCE.md': "# Fix 199G-B — product disputes and private evidence\n\nDatabase: 199G-A and 199G-B1 already applied. Exact migration copies are included for source control only; this workflow does not execute SQL. The deployed disputes Edge Function v13 (JWT enabled) is mirrored, not redeployed. Database tests used rolled-back fixtures: buyer ownership, paid transaction, same case on retry, unrelated account denied, linked support event, evidence permission, raw POD grants and protected storage-path checks. No payment, payout, courier, refund, PIN or provider activation changes.\n\nCustomer returns page now opens a real case and links to that case's evidence page; files are selected only after case creation. Separate customer evidence page uses authenticated own-case/own-evidence RLS, permission RPC, existing protected storage upload and registration, cleanup only if backend allows, and owner-only download. Administrator evidence page remains unchanged. Customer listing shows up to 100 recent cases and the permitted linked case; evidence list shows up to 100 recent files. No claim of live end-to-end success: signed-in upload/download and administrator review still need testing. Legacy signed-upload/metadata endpoints and service/transport dispute handling are outside this product-page change. Provider-specific dispute resolution/settlement remains a go-live dependency. No change to protected main or V26.24 FINAL.\n"}
