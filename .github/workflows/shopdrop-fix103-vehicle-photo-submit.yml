
name: ShopDrop Fix103B - Vehicle Photo Submission

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix103-vehicle-photo-submit.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Correct vehicle submission form
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path=Path(
            "public/shopdrop-vehicle-draft-private.html"
          )
          original=path.read_text(encoding="utf-8")

          if "id=\"vehiclePhotos\"" in original:
              raise SystemExit(
                "SAFETY STOP: photographs already connected"
              )

          required=[
            '<form id="draftForm">',
            '<button id="submit" type="submit">',
            "listing_status:'draft'",
            "form.reset();",
            '<script type="module">'
          ]

          for marker in required:
              if original.count(marker)!=1:
                  raise SystemExit(
                    "SAFETY STOP: expected structure changed: "
                    +marker
                  )

          if not Path(
            "public/shopdrop-ad-gallery-uploader.js"
          ).exists():
              raise SystemExit(
                "SAFETY STOP: existing uploader missing"
              )

          updated=original

          # Insert photograph selector.
          button='<button id="submit" type="submit">'

          photos="""<label>
            Vehicle photographs (1 to 6)
            <input id="vehiclePhotos"
                   type="file"
                   accept="image/jpeg,image/png,image/webp"
                   multiple required>
          </label>
          <p class="muted">
            Maximum 10 MB per photograph.
          </p>
          """

          updated=updated.replace(
            button,photos+button,1
          )

          updated=updated.replace(
            'Save private draft',
            'Submit vehicle advertisement',
            1
          )

          # Load the existing gallery uploader.
          updated=updated.replace(
            '<script type="module">',
            '<script src="./shopdrop-ad-gallery-uploader.js">'
            '</script>\n<script type="module">',
            1
          )

          # Validate required details and photographs.
          marker="    const record={"

          validation=r"""
              const photos=Array.from(
                document.getElementById(
                  'vehiclePhotos'
                ).files||[]
              );

              if(photos.length<1||photos.length>6){
                throw Error(
                  'Select between 1 and 6 photographs.'
                );
              }

              if(!value('type')||
                 !value('town')||
                 !value('province')||
                 !value('coverage')){
                throw Error(
                  'Vehicle type, town, province and coverage are required.'
                );
              }

              for(const photo of photos){
                if(
                  !['image/jpeg','image/png','image/webp']
                    .includes(photo.type)||
                  photo.size<1||
                  photo.size>10485760
                ){
                  throw Error(
                    'Use JPEG, PNG or WebP photographs, maximum 10 MB each.'
                  );
                }
              }

          """

          if updated.count(marker)!=1:
              raise SystemExit(
                "SAFETY STOP: record insertion missing"
              )

          updated=updated.replace(
            marker,validation+marker,1
          )

          # Replace only the result handling after
          # successful vehicle record creation.
          start=updated.index(
            "    result.textContent=\n"
            "      'Private draft created successfully."
          )

          end=updated.index(
            "    form.reset();",
            start
          )+len("    form.reset();")

          replacement=r"""
              result.textContent=
                'Vehicle saved. Uploading photographs...';

              const uploader=
                window.ShopDropAdGalleryUploader;

              if(!uploader?.uploadGallery){
                throw Error(
                  'Photograph uploader unavailable. '+
                  'Advertisement ID: '+data.id
                );
              }

              try{
                const uploaded=
                  await uploader.uploadGallery({
                    client,
                    kind:'vehicle',
                    advertisementId:data.id,
                    files:photos
                  });

                const {
                  data:published,
                  error:statusError
                }=await client
                  .from('shopdrop_vehicle_adverts')
                  .select('listing_status')
                  .eq('id',data.id)
                  .single();

                if(statusError)throw statusError;

                result.textContent=
                  uploaded.savedCount+
                  ' photograph(s) uploaded.\n'+
                  'Advertisement ID: '+data.id+'\n'+
                  'Status: '+published.listing_status;

                if(published.listing_status==='approved'){
                  result.textContent+=
                    '\nAutomatically published in browsing.';
                }

                form.reset();

              }catch(uploadError){
                result.textContent=
                  'Advertisement ID: '+data.id+
                  '\nPhotograph upload incomplete: '+
                  (uploadError?.message||'Unknown error')+
                  '\nKeep this ID. Do not create a duplicate.';
              }
          """

          updated=(
            updated[:start]+
            replacement+
            updated[end:]
          )

          # Update the outdated explanatory notice.
          updated=updated.replace(
            'Creating a draft does not publish it.',
            'Eligible advertisements publish automatically '
            'after successful photograph submission.',
            1
          )

          updated=updated.replace(
            'Private Vehicle Advertisement Draft',
            'Vehicle Advertisement Submission',
            1
          )

          updated=updated.replace(
            'Create a vehicle advertisement draft',
            'Advertise your vehicle',
            1
          )

          # Verify only the intended additions.
          checks=[
            'id="vehiclePhotos"',
            'shopdrop-ad-gallery-uploader.js',
            "kind:'vehicle'",
            'uploaded.savedCount',
            'Automatically published in browsing.'
          ]

          for marker in checks:
              if marker not in updated:
                  raise SystemExit(
                    "SAFETY STOP: missing "+marker
                  )

          path.write_text(
            updated,
            encoding="utf-8"
          )

          print("PASS: Vehicle submission connected")
          print("PASS: Six-photo uploader connected")
          print("PASS: Automatic publication status connected")
          PY

      - name: Verify changes and commit
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          test "$(git diff --name-only)" = \
            "public/shopdrop-vehicle-draft-private.html"

          git add public/shopdrop-vehicle-draft-private.html

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Fix103B connect vehicle form and photographs"

          git push origin HEAD:shopdrop-phase6-integration
