
name: ShopDrop Fix54 - Photos on Seller Product Pages

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/shopdrop-fix54-seller-photos.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shopdrop-integrated-pages
  cancel-in-progress: false

jobs:
  seller-photos:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout integration branch only
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Install verified seller product photos and product cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          guards = {
              'public/seller-products.html': 'bc2f945ddf0ba0cbec178122a6a1238e609b043f',
              'public/shopdrop-public-seller-products.js': '98be7e4b44cd2064c372a16975b6c648b1290bcc',
              'public/shopdrop-public-advertiser-ui.js': '431aba49e128ce8c4cedfc3e23a6805137282d8a',
              'public/shopdrop-unified-cards.css': 'd22f77025a91be116270fb1e2caf8d78661f4ba2',
          }
          for filename, expected in guards.items():
              actual = subprocess.check_output(
                  ['git', 'hash-object', filename], text=True
              ).strip()
              if actual != expected:
                  raise SystemExit('STOP: Source changed: ' + filename)

          page = Path('public/seller-products.html')
          html = page.read_text(encoding='utf-8')
          old_grid = '<div id="sellerProducts" class="grid"></div>'
          old_script = '<script src="./shopdrop-public-seller-products.js" defer></script>'
          if html.count(old_grid) != 1 or html.count(old_script) != 1 or html.count('</style>') != 1:
              raise SystemExit('STOP: Seller products page layout changed.')
          html = html.replace(
              old_grid,
              old_grid + '<button id="sellerLoadMore" type="button" hidden>Show More Products</button>',
              1
          )
          html = html.replace(
              old_script,
              '<script src="./shopdrop-public-seller-products.js?v=54" defer></script>',
              1
          )
          css = '''
          *{box-sizing:border-box}
          .shopdrop-seller-product-card{display:flex;flex-direction:column;gap:7px;min-width:0;overflow-wrap:anywhere}
          .shopdrop-seller-photo{display:block;width:100%;aspect-ratio:1/1;background:#f1f5f9;border-radius:9px;overflow:hidden;text-decoration:none}
          .shopdrop-seller-photo img{display:block;width:100%;height:100%;object-fit:contain}
          .shopdrop-photo-pending{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12px;color:#64748b}
          .shopdrop-seller-title{font-size:clamp(15px,2.4vw,20px);line-height:1.3;margin:4px 0}
          .shopdrop-seller-title a{color:#17202a;text-decoration:none}
          .shopdrop-seller-title a:hover{text-decoration:underline}
          .shopdrop-seller-price{font-size:clamp(16px,2.4vw,21px);font-weight:800;color:#0f766e;margin:2px 0}
          .shopdrop-seller-product-card .shopdrop-seller-reference{font-size:11px;overflow-wrap:anywhere;margin:3px 0}
          #sellerLoadMore{display:block;margin:20px auto 0;padding:12px 18px;border:0;border-radius:9px;background:#0f766e;color:white;font:inherit;cursor:pointer}
          #sellerLoadMore[hidden]{display:none}
          @media(max-width:699px){.shopdrop-seller-product-card{padding:9px}}
          '''
          html = html.replace('</style>', css + '</style>', 1)
          page.write_text(html, encoding='utf-8')

          source_path = Path('public/shopdrop-public-seller-products.js')
          previous = source_path.read_text(encoding='utf-8')
          if 'shopdrop_public_seller_products' not in previous or './product.html?id=' not in previous:
              raise SystemExit('STOP: Seller directory integration changed.')
          source_path.write_text(r'''/* Shop&Drop Fix54: publicly accessible seller product photographs and cards.
             Existing seller-directory RPC, public aliases and private-data controls retained. */
          (()=>{
            'use strict';
            const endpoint='https://dtkdvvxpwonywtsgqmdx.supabase.co';
            const key='sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q';
            const headers={apikey:key,Accept:'application/json'};
            const alias=new URLSearchParams(location.search).get('alias')?.trim()||'';
            const title=document.getElementById('sellerTitle');
            const status=document.getElementById('sellerStatus');
            const container=document.getElementById('sellerProducts');
            const more=document.getElementById('sellerLoadMore');
            const valid=id=>/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(String(id||''));
            const pageSize=20;
            let products=[],offset=0,busy=false;
            if(!title||!status||!container||!more)return;
            if(!alias||alias.length<2||alias.length>80){status.textContent='Invalid seller name.';return;}
            title.textContent='Products from '+alias;

            function storageUrl(image){
              if(image.storage_bucket!=='listing-images')return null;
              const path=String(image.storage_path||'');
              const segments=path.split('/');
              if(!path||segments.some(s=>!s||s==='.'||s==='..'))return null;
              return endpoint+'/storage/v1/object/public/listing-images/'+
                segments.map(encodeURIComponent).join('/');
            }
            function photoPlaceholder(message){
              const div=document.createElement('div');
              div.className='shopdrop-photo-pending';
              div.textContent=message;
              return div;
            }
            function createCard(p){
              const article=document.createElement('article');
              article.className='item shopdrop-seller-product-card';
              const destination='./product.html?id='+encodeURIComponent(p.product_id);
              const photo=document.createElement('a');
              photo.className='shopdrop-seller-photo';
              photo.href=destination;
              photo.setAttribute('aria-label','View photographs and details for '+(p.product_title||'product'));
              photo.append(photoPlaceholder('Loading photograph…'));
              const heading=document.createElement('h2');
              heading.className='shopdrop-seller-title';
              const link=document.createElement('a');
              link.href=destination;
              link.textContent=String(p.product_title||'View product');
              heading.append(link);
              const price=document.createElement('p');
              price.className='shopdrop-seller-price';
              const amount=Number(p.product_price);
              price.textContent=Number.isFinite(amount)&&/^[A-Z]{3}$/.test(String(p.product_currency||''))
                ?new Intl.NumberFormat('en-ZA',{style:'currency',currency:p.product_currency}).format(amount)
                :'Price shown on product page';
              const reference=document.createElement('p');
              reference.className='muted shopdrop-seller-reference';
              reference.textContent='Item reference: '+String(p.product_reference||'Not available');
              article.append(photo,heading,price,reference);
              container.append(article);
              return {id:p.product_id,title:p.product_title,photo};
            }
            async function attachPhotos(cards){
              if(!cards.length)return;
              const ids=cards.map(c=>c.id);
              const params=new URLSearchParams({
                select:'product_id,storage_bucket,storage_path,is_primary,image_position',
                product_id:'in.('+ids.join(',')+')',
                order:'is_primary.desc,image_position.asc'
              });
              const pictures=new Map();
              try{
                const response=await fetch(endpoint+'/rest/v1/listing_images?'+params,{headers});
                if(!response.ok)throw Error('Photographs unavailable');
                const rows=await response.json();
                if(!Array.isArray(rows))throw Error('Invalid photograph response');
                for(const image of rows){
                  const url=storageUrl(image);
                  if(url&&!pictures.has(image.product_id))pictures.set(image.product_id,url);
                }
              }catch(error){console.warn('ShopDrop seller photographs:',error);}
              for(const card of cards){
                const url=pictures.get(card.id);
                if(!url){card.photo.replaceChildren(photoPlaceholder('Photograph unavailable'));continue;}
                const img=document.createElement('img');
                img.loading='lazy';img.decoding='async';
                img.alt='Photograph of '+(card.title||'product');
                img.onerror=()=>card.photo.replaceChildren(photoPlaceholder('Photograph unavailable'));
                img.src=url;
                card.photo.replaceChildren(img);
              }
            }
            async function showMore(){
              if(busy||offset>=products.length)return;
              busy=true;
              more.disabled=true;
              try{
                const next=products.slice(offset,offset+pageSize);
                const cards=next.map(createCard);
                offset+=next.length;
                more.hidden=offset>=products.length;
                status.textContent='Showing '+offset+' of '+products.length+' available products.';
                await attachPhotos(cards);
              }finally{busy=false;more.disabled=false;}
            }
            more.addEventListener('click',showMore);
            (async()=>{
              try{
                const response=await fetch(endpoint+'/rest/v1/rpc/shopdrop_public_seller_products',{
                  method:'POST',headers:{...headers,'Content-Type':'application/json'},
                  body:JSON.stringify({p_alias:alias})
                });
                if(!response.ok)throw Error('Seller products are currently unavailable.');
                const rows=await response.json();
                if(!Array.isArray(rows))throw Error('Unexpected seller product response.');
                products=rows.filter(p=>valid(p.product_id));
                if(!products.length){status.textContent='No available products from this seller.';return;}
                await showMore();
              }catch(error){status.textContent=error?.message||'Unable to load seller products.';}
            })();
          })();
          '''.replace('\n          ','\n').lstrip(),encoding='utf-8')
          print('PASS: Existing seller directory and item references retained.')
          print('PASS: Product photos now load from public listing-images storage.')
          print('PASS: 20 cards initially, Show More Products for larger sellers.')
          PY
          node --check public/shopdrop-public-seller-products.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('public/seller-products.html').read_text(encoding='utf-8')
          js=Path('public/shopdrop-public-seller-products.js').read_text(encoding='utf-8')
          assert 'id="sellerLoadMore"' in html
          assert 'shopdrop-public-seller-products.js?v=54' in html
          assert 'shopdrop-public-advertiser-ui.js?v=52' in html
          assert 'id="sellerProducts"' in html
          assert "shopdrop_public_seller_products" in js
          assert "rest/v1/listing_images" in js
          assert "shopdrop-seller-photo" in js
          assert "const pageSize=20" in js
          assert "./product.html?id=" in js
          assert "seller_public_alias" not in js
          print('PASS: Safe gallery, public identity and navigation checks.')
          PY
          git diff --check

      - name: Commit only seller directory display files
        shell: bash
        run: |
          set -euo pipefail
          git add public/seller-products.html public/shopdrop-public-seller-products.js
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Fix54 show seller item photos and paginated product cards'
          git push origin HEAD:shopdrop-phase6-integration

      - name: Configure website
        uses: actions/configure-pages@v5

      - name: Upload integrated website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy seller photo cards
        id: deployment
        uses: actions/deploy-pages@v4

