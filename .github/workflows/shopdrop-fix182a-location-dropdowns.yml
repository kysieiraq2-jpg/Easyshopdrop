
name: ShopDrop Fix 182A - Normal Item Locations

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - .github/workflows/shopdrop-fix182a-location-dropdowns.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix182a:
    if: github.ref_name == 'shopdrop-phase6-integration'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Backup and install dropdowns
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap
          import json

          files = {
              "public/sell-item.html":
                  "cf99c0f70ad94794770ad848d1e8390dc4db5bce",
              "public/checkout.html":
                  "5a42ec1d6fa106f97e68a74b5adb3127609f0fe3"
          }

          marker = (
              '<script src="./shopdrop-location-182a.js" '
              'defer></script>'
          )

          data_path = Path("public/shopdrop-sa-towns-181.json")
          if not data_path.is_file():
              raise SystemExit("STOP: Town dataset missing")

          data = json.loads(data_path.read_text())
          if data.get("country") != "ZA":
              raise SystemExit("STOP: Incorrect town dataset")

          originals = {}

          for filename, expected in files.items():
              actual = subprocess.check_output(
                  ["git", "hash-object", filename],
                  text=True
              ).strip()

              if actual != expected:
                  raise SystemExit(
                      "STOP: Original changed: " + filename
                  )

              content = Path(filename).read_bytes()
              text = content.decode("utf-8")

              if text.count("</body>") != 1 or marker in text:
                  raise SystemExit(
                      "STOP: Unsafe HTML: " + filename
                  )

              originals[filename] = content

          js = r"""
          (() => {
            'use strict';

            const provinces = [
              'Eastern Cape', 'Free State', 'Gauteng',
              'KwaZulu-Natal', 'Limpopo', 'Mpumalanga',
              'North West', 'Northern Cape', 'Western Cape'
            ];

            const seller = location.pathname
              .endsWith('/sell-item.html');

            const townId = seller ? 'town' : 'city';
            const provinceId = seller ? null : 'region';

            const originalTown = document.getElementById(townId);
            const originalProvince = provinceId
              ? document.getElementById(provinceId)
              : null;

            if (!originalTown) return;
            if (!seller && !originalProvince) return;

            const makeSelect = (id) => {
              const select = document.createElement('select');
              select.id = id;
              select.style.cssText =
                'display:block;width:100%;min-height:46px;' +
                'padding:11px;margin:8px 0 15px;' +
                'border:1px solid #cbd5e1;border-radius:9px;' +
                'background:#fff;box-sizing:border-box';
              return select;
            };

            const province = makeSelect('locationProvince182A');
            const town = makeSelect('locationTown182A');

            const fill = (element, values, prompt) => {
              element.replaceChildren(new Option(prompt, ''));
              values.forEach(value => {
                element.add(new Option(value, value));
              });
            };

            const provinceLabel = document.createElement('label');
            provinceLabel.htmlFor = province.id;
            provinceLabel.textContent = 'Province';

            const townLabel = document.createElement('label');
            townLabel.htmlFor = town.id;
            townLabel.textContent = 'Town or city';

            const originalTownValue = originalTown.value;
            const originalProvinceValue =
              originalProvince ? originalProvince.value : '';

            fetch('./shopdrop-sa-towns-181.json')
              .then(response => {
                if (!response.ok) throw Error('Town list unavailable');
                return response.json();
              })
              .then(data => {
                if (data.country !== 'ZA' || !data.provinces)
                  throw Error('Invalid town list');

                const towns = data.provinces;

                fill(province, provinces, 'Choose province');
                fill(town, [], 'Choose province first');
                town.disabled = true;

                const sync = () => {
                  if (seller) {
                    originalTown.value = town.value
                      ? town.value + ', ' + province.value
                      : '';
                  } else {
                    originalTown.value = town.value;
                    originalProvince.value = province.value;
                  }
                };

                const updateTowns = (selected = '') => {
                  const available = towns[province.value] || [];
                  fill(town, available, 'Choose town or city');
                  town.disabled = !available.length;

                  if (available.includes(selected))
                    town.value = selected;

                  sync();
                };

                province.addEventListener('change', () => {
                  updateTowns();
                });

                town.addEventListener('change', sync);

                let savedProvince = originalProvinceValue;
                let savedTown = originalTownValue;

                if (seller) {
                  const found = provinces.find(p =>
                    originalTownValue.endsWith(', ' + p)
                  );

                  if (found) {
                    savedProvince = found;
                    savedTown = originalTownValue.slice(
                      0, -(found.length + 2)
                    );
                  }
                }

                if (provinces.includes(savedProvince)) {
                  province.value = savedProvince;
                  updateTowns(savedTown);
                }

                const parent = originalTown.parentNode;
                if (!parent) return;

                if (seller) {
                  originalTown.before(
                    provinceLabel, province,
                    townLabel, town
                  );
                } else {
                  originalProvince.before(
                    provinceLabel, province
                  );
                  originalTown.before(townLabel, town);
                }

                originalTown.type = 'hidden';
                if (originalProvince)
                  originalProvince.type = 'hidden';

                const form = originalTown.closest('form');
                if (form) {
                  form.addEventListener('submit', sync, true);
                }
              })
              .catch(error => {
                console.warn(
                  'ShopDrop location dropdowns unavailable:',
                  error.message
                );
              });
          })();
          """

          script = Path("public/shopdrop-location-182a.js")
          script.write_text(textwrap.dedent(js).strip() + "\n")

          backup_dir = Path("backups/fix182a")
          backup_dir.mkdir(parents=True, exist_ok=True)

          for filename, original in originals.items():
              path = Path(filename)
              backup = backup_dir / (
                  path.stem + "-BEFORE-182A.html"
              )

              backup.write_bytes(original)

              if backup.read_bytes() != original:
                  raise SystemExit("STOP: Backup failed")

              text = original.decode("utf-8")
              updated = text.replace(
                  "</body>", marker + "</body>", 1
              )

              if updated.replace(marker, "", 1) != text:
                  raise SystemExit("STOP: Unexpected HTML change")

              path.write_text(updated)

          print("Fix 182A files prepared.")
          print("Original HTML backed up.")
          print("Only script references added.")
          PY

          node --check public/shopdrop-location-182a.js
          git diff --check

      - name: Commit backups and dropdown fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ShopDrop Fix Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            backups/fix182a/ \
            public/sell-item.html \
            public/checkout.html \
            public/shopdrop-location-182a.js

          git commit -m "Fix 182A normal item location dropdowns with backups"
          git push origin HEAD:shopdrop-phase6-integration
