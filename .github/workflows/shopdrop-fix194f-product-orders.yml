name: ShopDrop Fix 194F Product Orders
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix194f-product-orders.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
    - name: Install read-only product orders overview
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REF_NAME" = shopdrop-phase6-integration
        python3 <<'PYCODE'
        from pathlib import Path
        import subprocess
        menu='public/product-shopping-194a.html'
        old='<a class="product-menu-194a" href="./account.html#orders">My Purchases &amp; Sales</a>'
        new='<a class="product-menu-194a" href="./product-orders-194f.html">My Purchases</a><a class="product-menu-194a" href="./product-orders-194f.html?role=seller">My Sales</a><a class="product-menu-194a" href="./payout-statement.html">My Payout Statement</a><a class="product-menu-194a" href="./account.html#orders">My Purchases &amp; Sales</a>'
        sha='b05e4a0353a049baa94928f44f3fb585b9ee7db6'
        new_files={'public/product-orders-194f.html': '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">\n<title>My Product Orders | Shop&amp;Drop</title><link rel="stylesheet" href="./shopdrop-transport-search-192b.css">\n<style>article p{overflow-wrap:anywhere;line-height:1.5}article h2{overflow-wrap:anywhere}.muted{line-height:1.5}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #17202a;outline-offset:3px}header a:focus-visible{outline-color:white}#orderList194f{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}</style></head>\n<body><header><a href="./index.html">Home</a><a href="./product-shopping-194a.html">Product Shopping &amp; Selling</a><a href="./checkout.html">My Bag</a><a href="./account.html">My Account</a></header>\n<main><section class="panel"><h1 id="orderHeading194f">My Purchases</h1><p>View your own product orders. Select a purchase or sale to see its existing order details and relevant actions.</p>\n<label for="orderRole194f">Choose a view</label><select id="orderRole194f" disabled><option value="buyer">My Purchases</option><option value="seller">My Sales</option></select>\n<button type="button" id="orderRefresh194f" disabled>Refresh orders</button><p id="orderStatus194f" role="status" aria-live="polite">Checking your sign-in…</p><div class="grid" id="orderList194f"></div><button id="orderMore194f" type="button" hidden disabled>Load more orders</button>\n<p class="muted">This page only displays recorded information. For sales, enter the courier company\'s reference after physical collection in the existing collection form. Independent courier verification is required for seller payment release.</p>\n<a class="btn" href="./account.html#orders">Original My Orders</a><a class="btn" href="./product-shopping-194a.html">Back to Product Shopping &amp; Selling</a></section></main>\n<script src="./shopdrop-product-orders-194f.js?v=194f" defer></script></body></html>\n', 'public/shopdrop-product-orders-194f.js': "(() => {\n 'use strict';\n const BASE='https://dtkdvvxpwonywtsgqmdx.supabase.co',KEY='sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q',PAGE=20;\n const uuid=v=>typeof v==='string'&&/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(v);\n function ownerQuery(db,uid,role,offset){\n  if(!uuid(uid)||!['buyer','seller'].includes(role)||!Number.isSafeInteger(offset)||offset<0)throw Error('Invalid order request');\n  return db.from('orders').select('id,order_reference,order_status,payment_status,fulfilment_status,product_total,currency,created_at').eq(role==='buyer'?'buyer_id':'seller_id',uid).order('created_at',{ascending:false}).order('id',{ascending:true}).range(offset,offset+PAGE-1);\n }\n function relatedQueries(db,uid,role,ids){\n  if(!uuid(uid)||!['buyer','seller'].includes(role)||!ids.length||ids.length>PAGE||ids.some(id=>!uuid(id)))throw Error('Invalid order selection');\n  const items=db.from('order_items').select('order_id,product_name,quantity,line_total').in('order_id',ids).limit(1000);\n  const shipments=db.from('shipments').select('order_id,shipment_reference,shipment_status').eq(role==='buyer'?'buyer_id':'seller_id',uid).in('order_id',ids).limit(200);\n  const payouts=role==='seller'?db.from('seller_payouts').select('order_id,payout_status,payout_amount,paid_at').eq('seller_id',uid).in('order_id',ids).limit(200):Promise.resolve({data:[],error:null});\n  return [items,shipments,payouts];\n }\n const $=id=>document.getElementById(id),role=$('orderRole194f'),refresh=$('orderRefresh194f'),more=$('orderMore194f'),list=$('orderList194f'),status=$('orderStatus194f'),heading=$('orderHeading194f');\n if(!role||!refresh||!more||!list||!status||!heading)return;\n if(new URLSearchParams(location.search).get('role')==='seller')role.value='seller';\n const el=(tag,t)=>{const n=document.createElement(tag);if(t!==undefined)n.textContent=t;return n;};\n const link=(t,h)=>{const a=el('a',t);a.href=h;a.className='btn';return a;};\n const label=v=>String(v||'Not available').replaceAll('_',' ');\n const money=(v,c)=>{if(v==null||!Number.isFinite(Number(v)))return 'Not available';try{return new Intl.NumberFormat('en-ZA',{style:'currency',currency:c||'ZAR'}).format(Number(v));}catch{return 'Not available';}};\n let clientPromise,owner=null,offset=0,busy=false,current=role.value,generation=0,watching=false;\n function clearPrivate(){generation++;owner=null;offset=0;list.replaceChildren();more.hidden=true;}\n const authError=()=>Object.assign(Error('Sign in required'),{needsSignIn:true});\n async function session(){\n  if(!clientPromise)clientPromise=import('https://esm.sh/@supabase/supabase-js@2.49.4').then(({createClient})=>createClient(BASE,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})).catch(e=>{clientPromise=undefined;throw e;});\n  const db=await clientPromise;\n  if(!watching){watching=true;db.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'||(owner&&s?.user?.id!==owner)){clearPrivate();status.textContent='Sign-in changed. Refresh to view your orders.';}});}\n  const {data:s,error:se}=await db.auth.getSession();if(se||!s?.session?.access_token)throw authError();\n  const {data:u,error:ue}=await db.auth.getUser(s.session.access_token);if(ue||!uuid(u?.user?.id)||u.user.is_anonymous===true)throw authError();return {db,uid:u.user.id};\n }\n function card(o,kind,items,shipments,payouts){\n  const a=el('article');a.append(el('h2',o.order_reference||'Product order'),el('p','Order: '+label(o.order_status)),el('p','Payment: '+label(o.payment_status)),el('p','Fulfilment: '+label(o.fulfilment_status)),el('p','Item total: '+money(o.product_total,o.currency)));\n  if(o.created_at){const date=new Date(o.created_at);if(!Number.isNaN(date.getTime()))a.append(el('p',date.toLocaleDateString('en-ZA')));}\n  if(items.error)a.append(el('p','Item details unavailable. Open order details to retry.'));\n  else {const rows=items.data.filter(r=>r.order_id===o.id);if(rows.length){const ul=el('ul');for(const r of rows)ul.append(el('li',String(r.product_name||'Product')+' × '+String(r.quantity??'?')));a.append(ul);}else a.append(el('p','No item details returned.'));}\n  a.append(link('View Order Details','./order.html?id='+encodeURIComponent(o.id)));\n  if(kind==='buyer'&&o.order_reference)a.append(link('Track My Order','./tracking.html?order='+encodeURIComponent(o.order_reference)));\n  if(kind==='seller'){\n   if(shipments.error)a.append(el('p','Shipment details unavailable. Check the existing collection form.'));\n   else {const rows=shipments.data.filter(r=>r.order_id===o.id);for(const r of rows)a.append(el('p','Shipment: '+(r.shipment_reference||'Reference unavailable')+' — '+label(r.shipment_status)));}\n   if(o.payment_status==='paid'){a.append(el('p','After physical collection, choose the matching shipment in the existing courier reference form.'),link('Confirm Courier Collection','./account.html#seller-courier-pickup-panel'));}\n   if(payouts.error)a.append(el('p','Payout information unavailable.'));\n   else {const rows=payouts.data.filter(r=>r.order_id===o.id);if(!rows.length)a.append(el('p','No seller payout record is displayed yet. This does not confirm release.'));for(const r of rows)a.append(el('p','Recorded payout: '+label(r.payout_status)+' — '+money(r.payout_amount,o.currency)));}\n   a.append(link('View Payout Statement','./payout-statement.html'));\n  }\n  return a;\n }\n function controls(on){busy=on;role.disabled=on;refresh.disabled=on;more.disabled=on;}\n function result(r){return {error:!!r.error,data:Array.isArray(r.data)?r.data:[]};}\n async function load(append=false){\n  if(busy)return;if(!append){current=role.value;offset=0;list.replaceChildren();}controls(true);more.hidden=true;heading.textContent=current==='seller'?'My Sales':'My Purchases';status.textContent='Loading your private product orders…';\n  try{const {db,uid}=await session();if(owner&&owner!==uid){clearPrivate();append=false;}owner=uid;const request=generation;\n   const {data,error}=await ownerQuery(db,uid,current,offset);if(request!==generation)return;if(error||!Array.isArray(data)||data.some(o=>!uuid(o.id)))throw Error('Orders unavailable');\n   const detail=data.length?await Promise.all(relatedQueries(db,uid,current,data.map(o=>o.id))):[];if(request!==generation)return;\n   if(data.length){const [items,shipments,payouts]=detail.map(result);for(const o of data)list.append(card(o,current,items,shipments,payouts));}\n   offset+=data.length;status.textContent=offset?offset+' order(s) displayed.':current==='seller'?'You have no product sales yet.':'You have no product purchases yet.';more.hidden=data.length<PAGE;\n  }catch(e){if(e.needsSignIn){clearPrivate();status.replaceChildren(document.createTextNode('Please sign in to view your orders. '),link('Sign in','./sign-in.html'),link('Register','./register.html'));}else{status.textContent='Orders could not be loaded. Refresh or use Original My Orders.';more.hidden=!append;}}finally{controls(false);}\n }\n role.addEventListener('change',()=>load());refresh.addEventListener('click',()=>load());more.addEventListener('click',()=>load(true));window.addEventListener('pagehide',clearPrivate);window.addEventListener('pageshow',e=>{if(e.persisted)load();});load();\n})();\n"}
        p=Path(menu); source=p.read_text(encoding='utf-8')
        installed=source.count(new)==1
        backup=Path('backups/fix194f')/p.name
        if not installed:
            if subprocess.check_output(['git','hash-object',menu],text=True).strip()!=sha or source.count(old)!=1:
                raise SystemExit('Unexpected menu source; no changes installed')
            if backup.exists() and backup.read_bytes()!=p.read_bytes():
                raise SystemExit('Unexpected backup; no changes installed')
        else:
            if subprocess.check_output(['git','hash-object','--stdin'],input=source.replace(new,old,1).encode()).decode().strip()!=sha:
                raise SystemExit('Unexpected installed menu version; no changes installed')
        for name,content in new_files.items():
            f=Path(name)
            if f.exists() and f.read_text(encoding='utf-8')!=content:
                raise SystemExit('Unexpected file collision: '+name)
        if not installed:
            backup.parent.mkdir(parents=True,exist_ok=True)
            if not backup.exists():backup.write_bytes(p.read_bytes())
            p.write_text(source.replace(old,new,1),encoding='utf-8')
        for name,content in new_files.items():
            f=Path(name)
            if not f.exists():f.write_text(content,encoding='utf-8')
        print('Fix 194F private read-only product orders page installed.')
        PYCODE
        node --check public/shopdrop-product-orders-194f.js
        git diff --check
        git config user.name 'ShopDrop Integration'
        git config user.email 'actions@users.noreply.github.com'
        git add public/product-shopping-194a.html public/product-orders-194f.html public/shopdrop-product-orders-194f.js
        if test -d backups/fix194f; then git add backups/fix194f; fi
        if ! git diff --cached --quiet; then
          git commit -m 'Fix 194F private product orders overview'
          git push origin HEAD:shopdrop-phase6-integration
        fi
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
