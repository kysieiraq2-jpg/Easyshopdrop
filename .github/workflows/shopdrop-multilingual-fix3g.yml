name: ShopDrop Multilingual Fix 3G - Legal Language Selector
on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - .github/workflows/shopdrop-multilingual-fix3g.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true
      - name: Add legal page language selector without changing legal text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          pages=[Path('public/terms.html'),Path('public/privacy.html')]
          for p in pages:
              if not p.is_file():raise SystemExit(f'STOP missing {p}')
              s=p.read_text()
              if s.count('</body>')!=1 or 'shopdrop-legal-language.js' in s:raise SystemExit(f'STOP unexpected baseline {p}')
          target=Path('public/shopdrop-legal-language.js')
          if target.exists():raise SystemExit('STOP existing language script')
          target.write_bytes(base64.b64decode(''))
          for p in pages:
              old=p.read_text()
              new=old.replace('</body>','<script defer src="shopdrop-legal-language.js"></script></body>')
              if new.replace('<script defer src="shopdrop-legal-language.js"></script>','')!=old:raise SystemExit('STOP preservation failure')
              p.write_text(new)
          PY
          git diff --check
          git add public/terms.html public/privacy.html public/shopdrop-legal-language.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add saved language selector to legal pages without changing legal terms'
          git push origin HEAD:shopdrop-phase6-integration
