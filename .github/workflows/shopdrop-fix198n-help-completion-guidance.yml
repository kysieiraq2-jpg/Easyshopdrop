name: ShopDrop Fix 198N Help Completion Guidance
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix198n-help-completion-guidance.yml
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: shopdrop-phase6-integration
    - name: Clarify public help text only
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REF_NAME" = shopdrop-phase6-integration
        python3 <<'PYCODE'
        from pathlib import Path
        from html.parser import HTMLParser
        import hashlib, os, re
        HELP=Path('public/help.html')
        BACKUP=Path('backups/fix198n/help.html')
        EXPECTED='3d5aed1e62eed7026155978c8e2917a05418f053'
        PATCHES=[("<div class=box><h2>Other Services</h2><p>Independent providers list clearly priced services on Shop&Drop for free. Customers browse Shop&Drop's own approved service listings, book and pay through Shop&Drop. Physical products belong in Product listings.</p></div>", '<div class=box><h2>Other Services</h2><p>Advertise services such as cleaning, gardening, repairs and catering for free. Customers choose a service, agree on the appointment and price, and pay through Shop&amp;Drop.</p><p><strong>Six-digit Completion PIN:</strong> The paying customer receives a private PIN for the paid booking. Keep it private until the agreed work is fully completed and you are satisfied. Only then give it to the assigned service provider.</p><p>The provider obtains the PIN after completing the work and enters it through <strong>My Account — Receive My Payment</strong>. Verified completion is required before held proceeds can be released, subject to payment-provider activation and applicable safeguards.</p></div>'), ('<div class=box><h2>Dispatching & Transport</h2><p>Transport jobs use a dedicated dispatch workflow: request details, provider offer, transparent pricing, booking/payment, job status, completion protection and provider payout.</p></div>', '<div class=box><h2>Transport Services &amp; Equipment Hire</h2><p>Find or advertise transport services, vehicle hire, machinery, equipment and tool hire. Customers choose a provider, agree on the task or hire arrangements and price, and pay through Shop&amp;Drop.</p><p><strong>Six-digit Completion PIN:</strong> The paying customer receives a private PIN for the paid booking. Only after the entire agreed transport task or equipment hire is completed and the customer is satisfied may the customer or their authorised receiver give the PIN to the assigned provider.</p><p>The provider obtains the PIN after completion and enters it through <strong>My Account — Receive My Payment</strong>. Verified completion, not arrival or collection alone, is required before held proceeds can be released, subject to payment-provider activation and applicable safeguards.</p></div>'), ('Other Services and Dispatching have their own completion and payment rules.', 'For Other Services and Transport Services &amp; Equipment Hire, the customer-held six-digit Completion PIN must be verified after the agreed work or hire is completed, before held provider proceeds can be released, subject to payment-provider activation and applicable safeguards.')]
        def require(ok,msg):
         if not ok: raise SystemExit(msg)
        def blob(raw):return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
        class Links(HTMLParser):
         def __init__(self,s):super().__init__();self.links=[];self.feed(s)
         def handle_starttag(self,tag,attrs):
          if tag in ('a','script','link'):self.links.append((tag,attrs))
        def transform(raw):
         s=raw.decode('utf-8');before=s
         for old,new in PATCHES:
          require(s.count(old)==1,'Unexpected help-page anchor; stopped: '+old[:100])
          s=s.replace(old,new,1)
         require(Links(before).links==Links(s).links,'Existing link or script changed')
         require(re.findall(r'<script\b[^>]*>[\s\S]*?</script>',before)==re.findall(r'<script\b[^>]*>[\s\S]*?</script>',s),'Script changed')
         require('Dispatching' not in s,'Old public terminology remains')
         require(s.count('<strong>Six-digit Completion PIN:</strong>')==2,'Both completion instructions required')
         return s.encode('utf-8')
        def main():
         require(os.environ.get('GITHUB_REF_NAME')=='shopdrop-phase6-integration','Wrong branch')
         raw=HELP.read_bytes()
         if BACKUP.exists():
          original=BACKUP.read_bytes()
          require(blob(original)==EXPECTED,'Unexpected backup; stopped')
          out=transform(original)
          if raw==out:print('Fix 198N already installed and verified');return
          require(raw==original,'Unexpected current help; stopped')
         else:
          require(blob(raw)==EXPECTED,'Unexpected help version; stopped')
          original=raw;out=transform(raw)
         if not BACKUP.exists():BACKUP.parent.mkdir(parents=True,exist_ok=True);BACKUP.write_bytes(original)
         HELP.write_bytes(out)
         print('Fix 198N: public guidance updated; all links and scripts preserved.')
        if __name__=='__main__':main()
        PYCODE
        git diff --check
        git config user.name "ShopDrop Integration"
        git config user.email "actions@users.noreply.github.com"
        git add -- public/help.html backups/fix198n/help.html
        if ! git diff --cached --quiet; then
          git commit -m "Fix 198N clarify service completion guidance"
          git push origin HEAD:shopdrop-phase6-integration
        fi
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
