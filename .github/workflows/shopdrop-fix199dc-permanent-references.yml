            installed=all(Path(p).exists() and Path(p).read_bytes()==s.encode() for p,s in NEW.items())
            if installed:
                for p,sha in EXPECTED.items():
                    b=BACKUP/p;require(b.is_file() and blob(b.read_bytes())==sha,'Backup missing or changed: '+p)
                    require(original[p]==patch(p,b.read_bytes()),'Installed source differs: '+p)
                print('Fix 199D-C already installed and source matches.');return
            for p,sha in EXPECTED.items():require(blob(original[p])==sha,'Unexpected starting source: '+p)
            for p in NEW:require(not Path(p).exists(),'New destination exists: '+p)
            for p in EXPECTED:require(not (BACKUP/p).exists(),'Backup already exists: '+p)
            output={p:patch(p,raw) for p,raw in original.items()}
            with tempfile.TemporaryDirectory() as tmp:
                t=Path(tmp)
                for p,raw in {**output,HELPER:NEW[HELPER].encode()}.items():
                    if p.endswith('.js'):
                        f=t/Path(p).name;f.write_bytes(raw);subprocess.run(['node','--check',str(f)],check=True)
                    if p.endswith('.html'):
                        for idx,(attrs,body) in enumerate(Scripts(raw.decode()).blocks):
                            if 'src' in attrs or not body.strip() or attrs.get('type','') not in ('','module','text/javascript','application/javascript'):continue
                            f=t/(Path(p).stem+str(idx)+('.mjs' if attrs.get('type')=='module' else '.js'));f.write_text(body);subprocess.run(['node','--check',str(f)],check=True)
                f=t/'reference-display.js';f.write_text(NEW[HELPER]);test=t/'test.cjs';test.write_text(TEST);subprocess.run(['node',str(test),str(f)],check=True)
            for p,raw in original.items():
                b=BACKUP/p;b.parent.mkdir(parents=True,exist_ok=True);b.write_bytes(raw);Path(p).write_bytes(output[p])
            for p,s in NEW.items():f=Path(p);f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(s.encode())
            for p,sha in PROTECTED.items():require(blob(Path(p).read_bytes())==sha,'Protected source changed: '+p)
            print('Fix 199D-C: permanent references installed; SQL source synchronized without executing migrations.')
        if __name__=='__main__':main()
