        def patch(path,raw):
            s=raw.decode()
            for old,new in PATCHES[path]:
                require(s.count(old)==1,'Unexpected anchor in '+path+': '+old[:100])
                s=s.replace(old,new,1)
            return s.encode()
        def main():
