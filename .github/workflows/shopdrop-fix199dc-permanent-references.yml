  if(!combined.length)clearRows(errors.length?'Payout records could not all be loaded.':'No payout records yet.');", "  for(const record of extra.data){\n   const tr=document.createElement('tr');\n   const reference=cell(tr,label(record.release_reference,record.record_id));\n   const type=document.createElement('small');type.textContent=R.kindLabel(record.record_kind)+' — request record';reference.append(type);\n   const booking=cell(tr,label(record.booking_id));\n   for(const [name,value] of [['Advertisement',record.advertisement_reference],['Transport offer',record.offer_reference],['Payment',record.payment_reference]])if(value){const detail=document.createElement('small');detail.textContent=name+': '+value;booking.append(detail);}\n   const amountText=record.recorded_amount==null||!Number.isFinite(Number(record.recorded_amount))?'Not recorded':String(record.currency||'')+' '+Number(record.recorded_amount).toFixed(2);\n   cell(tr,amountText);cell(tr,label(record.recorded_status));cell(tr,'Release request only');cell(tr,'Not independent bank settlement confirmation');rows.append(tr);\n  }\n  if(!combined.length&&!extra.data.length)clearRows(errors.length?'Payout records could not all be loaded.':'No payout records yet.');"), ("   :combined.length+' payout record(s) displayed. Only your own records are available.';", "   :(combined.length+extra.data.length)+' payout or release request record(s) displayed. Only your own records are available.';")]}
        NEW={'public/shopdrop-reference-display-199dc.js': "/* Fix 199D-C: display server-issued references only; never create or alter a transaction. */\n(()=>{\n 'use strict';\n const uuid=v=>typeof v==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);\n const ref=v=>typeof v==='string'&&v.trim().length>0&&v.length<=256?v.trim():null;\n const list=v=>Array.isArray(v)?v:[];\n const ids=v=>[...new Set(list(v).filter(uuid))];\n const chunks=v=>{const a=ids(v),r=[];for(let i=0;i<a.length;i+=60)r.push(a.slice(i,i+60));return r;};\n async function collect(rpc,kind,keys){\n  const map=new Map();\n  if(!['service_bag','transport_bag','service_booking','dispatch_booking'].includes(kind))return map;\n  for(const batch of chunks(keys)){\n   try{\n    const data=await rpc('shopdrop_my_advert_references_199dc3',{p_kind:kind,p_ids:batch});\n    const permitted=new Set(batch);\n    for(const row of list(data))if(permitted.has(row?.record_id))map.set(row.record_id,{advertisement_reference:ref(row.advertisement_reference),offer_reference:ref(row.offer_reference)});\n   }catch(_){/* Existing page remains usable; unavailable reference is not invented. */}\n  }\n  return map;\n }\n function dbRPC(db){return async(name,args)=>{const {data,error}=await db.rpc(name,args);if(error)throw error;return data;};}\n async function attach(rows,rpc,kind,key){\n  const map=await collect(rpc,kind,list(rows).map(row=>row[key]));\n  for(const row of list(rows)){\n   const r=map.get(row[key]);\n   row.advertisement_reference=r?.advertisement_reference||null;\n   row.offer_reference=r?.offer_reference||null;\n  }\n  return rows;\n }\n async function dispatch(rows,rpc){\n  await attach(list(rows).filter(r=>uuid(r.booking_id)),rpc,'dispatch_booking','booking_id');\n  await attach(list(rows).filter(r=>!uuid(r.booking_id)),rpc,'transport_bag','id');\n  return rows;\n }\n function lines(parent,row){\n  const p=document.createElement('p');p.className='muted';p.textContent='Advertisement reference: '+(ref(row?.advertisement_reference)||'Not available');parent.append(p);\n  if(ref(row?.offer_reference)){const q=document.createElement('p');q.className='muted';q.textContent='Transport offer reference: '+row.offer_reference;parent.append(q);}\n }\n async function orderRefs(db,keys){\n  const map=new Map();\n  for(const batch of chunks(keys)){\n   try{\n    const {data,error}=await db.from('order_items').select('order_id,listing_reference_snapshot').in('order_id',batch).limit(1000);\n    if(error)continue;\n    const permitted=new Set(batch);\n    for(const row of list(data))if(permitted.has(row?.order_id)&&ref(row.listing_reference_snapshot)){\n     if(!map.has(row.order_id))map.set(row.order_id,new Set());map.get(row.order_id).add(row.listing_reference_snapshot);\n    }\n   }catch(_){}\n  }\n  return new Map([...map].map(([k,v])=>[k,[...v].sort().join(', ')]));\n }\n async function financial(db,view){\n  try{\n   const data=await dbRPC(db)('shopdrop_my_provider_financial_references_199dc4',{p_view:view});\n   if(!Array.isArray(data))throw Error('Unavailable');\n   const kinds=view==='payout'?['service_release_request','dispatch_release_request']:['dispatch_customer_payment','dispatch_provider_payment_record','service_release_request','dispatch_release_request'];\n   return {error:false,data:data.filter(r=>kinds.includes(r?.record_kind)&&uuid(r.record_id)&&uuid(r.booking_id))};\n  }catch(_){return {error:true,data:[]};}\n }\n const kindLabel=k=>({dispatch_customer_payment:'Transport customer payment',dispatch_provider_payment_record:'Transport provider payment record',service_release_request:'Service release request',dispatch_release_request:'Transport release request'}[k]||'Financial record');\n window.ShopDropReferences199dc=Object.freeze({collect,dbRPC,attach,dispatch,lines,orderRefs,financial,kindLabel,ref});\n})();\n", 'supabase/migrations/20261126141404_shopdrop_fix199dc1_order_item_identity.sql': "-- Fix 199D-C1: immutable physical-product identity in historical orders.\n-- Existing product references, payment logic and RLS are unchanged.\nALTER TABLE public.order_items\n  ADD COLUMN listing_reference_snapshot text,\n  ADD COLUMN seller_alias_snapshot text;\n\n-- Only recover immutable listing references that still belong to the recorded seller.\n-- The current alias is not proof of a historical alias.\nUPDATE public.order_items AS i\nSET listing_reference_snapshot = nullif(btrim(p.listing_reference),'')\nFROM public.products AS p\nWHERE p.id=i.product_id AND p.seller_id=i.seller_id\n  AND nullif(btrim(p.listing_reference),'') IS NOT NULL;\n\nCREATE FUNCTION public.shopdrop_order_item_identity_199dc1()\nRETURNS trigger\nLANGUAGE plpgsql\nSET search_path TO ''\nAS $fn$\nBEGIN\n  IF TG_OP='INSERT' THEN\n    -- Ignore browser/caller-supplied snapshot values.\n    NEW.listing_reference_snapshot := NULL;\n    NEW.seller_alias_snapshot := NULL;\n    IF NEW.product_id IS NOT NULL THEN\n      SELECT nullif(btrim(p.listing_reference),''),\n             nullif(btrim(pr.seller_public_alias),'')\n      INTO NEW.listing_reference_snapshot, NEW.seller_alias_snapshot\n      FROM public.products p\n      LEFT JOIN public.profiles pr ON pr.id=p.seller_id\n      WHERE p.id=NEW.product_id AND p.seller_id=NEW.seller_id;\n      IF NOT FOUND OR NEW.listing_reference_snapshot IS NULL THEN\n        RAISE EXCEPTION 'original_listing_reference_unavailable' USING ERRCODE='23514';\n      END IF;\n    END IF;\n  ELSE\n    IF NEW.listing_reference_snapshot IS DISTINCT FROM OLD.listing_reference_snapshot\n       OR NEW.seller_alias_snapshot IS DISTINCT FROM OLD.seller_alias_snapshot THEN\n      RAISE EXCEPTION 'order_item_identity_snapshot_immutable' USING ERRCODE='23514';\n    END IF;\n    -- Preserve identity when the existing product foreign key becomes NULL on deletion.\n    IF NEW.order_id IS DISTINCT FROM OLD.order_id\n       OR NEW.seller_id IS DISTINCT FROM OLD.seller_id\n       OR (NEW.product_id IS DISTINCT FROM OLD.product_id AND NEW.product_id IS NOT NULL) THEN\n      RAISE EXCEPTION 'order_item_identity_immutable' USING ERRCODE='23514';\n    END IF;\n  END IF;\n  RETURN NEW;\nEND;\n$fn$;\nREVOKE ALL ON FUNCTION public.shopdrop_order_item_identity_199dc1() FROM PUBLIC, anon, authenticated;\nGRANT EXECUTE ON FUNCTION public.shopdrop_order_item_identity_199dc1() TO service_role;\nCREATE TRIGGER shopdrop_order_item_identity_199dc1\nBEFORE INSERT OR UPDATE ON public.order_items\nFOR EACH ROW EXECUTE FUNCTION public.shopdrop_order_item_identity_199dc1();\n\n-- Keep the existing buyer-only tracking authorization and response shape.\nDO $patch$\nDECLARE\n  src text := pg_get_functiondef('public.shopdrop_buyer_tracking_snapshot(text)'::regprocedure);\n  original text := src;\n  old_item text := $a$'listing_reference',p.listing_reference,\n   'seller_alias',nullif(btrim(pr.seller_public_alias),'')$a$;\n  old_joins text := $a$ LEFT JOIN public.products p ON p.id=i.product_id\n LEFT JOIN public.profiles pr ON pr.id=i.seller_id\n$a$;\n  old_shipment text := $a$'seller_alias',nullif(btrim(pr.seller_public_alias),''),\n   'courier_name'$a$;\n  old_shipment_join text := $a$ LEFT JOIN public.profiles pr ON pr.id=s.seller_id\n$a$;\nBEGIN\n  IF (length(src)-length(replace(src,old_item,'')))/length(old_item)<>1\n     OR (length(src)-length(replace(src,old_joins,'')))/length(old_joins)<>1\n     OR (length(src)-length(replace(src,old_shipment,'')))/length(old_shipment)<>1\n     OR (length(src)-length(replace(src,old_shipment_join,'')))/length(old_shipment_join)<>1 THEN\n    RAISE EXCEPTION '199dc1 tracking source changed';\n  END IF;\n  src := replace(src,old_item,$a$'listing_reference',i.listing_reference_snapshot,\n   'seller_alias',i.seller_alias_snapshot$a$);\n  src := replace(src,old_joins,'');\n  src := replace(src,old_shipment,$a$'seller_alias',(SELECT CASE WHEN count(DISTINCT i.seller_alias_snapshot)=1\n                              THEN min(i.seller_alias_snapshot) ELSE NULL END\n                      FROM public.order_items i\n                      WHERE i.order_id=s.order_id AND i.seller_id=s.seller_id),\n   'courier_name'$a$);\n  src := replace(src,old_shipment_join,'');\n  IF src=original THEN RAISE EXCEPTION '199dc1 tracking patch missing'; END IF;\n  EXECUTE src;\nEND;\n$patch$;\n", 'supabase/migrations/20261126142200_shopdrop_fix199dc2_service_transport_advert_identity.sql': "-- Fix 199D-C2: preserve original service and transport advertisement identities.\n-- Existing SD-SVC, SD-TRN offer and transaction references remain unchanged.\n-- There are no existing service/transport records to backfill at this installation.\nDO $$ BEGIN\n IF EXISTS(SELECT 1 FROM public.services) OR EXISTS(SELECT 1 FROM public.shopdrop_vehicle_adverts)\n OR EXISTS(SELECT 1 FROM public.service_bookings) OR EXISTS(SELECT 1 FROM public.dispatch_bookings)\n OR EXISTS(SELECT 1 FROM public.dispatch_offers) OR EXISTS(SELECT 1 FROM shopdrop_service_193c.bag)\n OR EXISTS(SELECT 1 FROM shopdrop_transport_192dc.bag) OR EXISTS(SELECT 1 FROM public.shopdrop_booking_rate_selections)\n THEN RAISE EXCEPTION '199dc2 existing records require separate verified backfill'; END IF;\nEND $$;\nALTER TABLE public.services ADD CONSTRAINT shopdrop_services_public_number_199dc2 UNIQUE(listing_public_number);\nALTER TABLE public.dispatch_offers ADD CONSTRAINT shopdrop_offers_public_number_199dc2 UNIQUE(listing_public_number);\nALTER TABLE public.shopdrop_vehicle_adverts ADD COLUMN listing_public_number bigint GENERATED ALWAYS AS IDENTITY;\nALTER TABLE public.shopdrop_vehicle_adverts ADD CONSTRAINT shopdrop_transport_advert_number_199dc2 UNIQUE(listing_public_number);\n\nCREATE FUNCTION public.shopdrop_guard_listing_number_199dc2()\nRETURNS trigger LANGUAGE plpgsql SET search_path TO '' AS $$\nBEGIN\n IF NEW.listing_public_number IS DISTINCT FROM OLD.listing_public_number THEN\n  RAISE EXCEPTION 'listing_public_number_immutable' USING ERRCODE='23514';\n END IF;\n RETURN NEW;\nEND $$;\nREVOKE ALL ON FUNCTION public.shopdrop_guard_listing_number_199dc2() FROM PUBLIC,anon,authenticated;\nCREATE TRIGGER shopdrop_guard_listing_number_199dc2 BEFORE UPDATE OF listing_public_number ON public.services FOR EACH ROW EXECUTE FUNCTION public.shopdrop_guard_listing_number_199dc2();\nCREATE TRIGGER shopdrop_guard_listing_number_199dc2 BEFORE UPDATE OF listing_public_number ON public.dispatch_offers FOR EACH ROW EXECUTE FUNCTION public.shopdrop_guard_listing_number_199dc2();\nCREATE TRIGGER shopdrop_guard_listing_number_199dc2 BEFORE UPDATE OF listing_public_number ON public.shopdrop_vehicle_adverts FOR EACH ROW EXECUTE FUNCTION public.shopdrop_guard_listing_number_199dc2();\n\nALTER TABLE shopdrop_service_193c.bag ADD COLUMN advertisement_reference_snapshot text;\nALTER TABLE shopdrop_transport_192dc.bag ADD COLUMN advertisement_reference_snapshot text;\nALTER TABLE public.service_bookings ADD COLUMN advertisement_reference_snapshot text;\nALTER TABLE public.dispatch_bookings ADD COLUMN advertisement_reference_snapshot text, ADD COLUMN offer_reference_snapshot text;\n\n-- Service bags and bookings use the existing service number. Transport bags use\n-- the original advert number, with a distinct prefix from individual offers.\nCREATE FUNCTION public.shopdrop_advert_snapshot_199dc2()\nRETURNS trigger LANGUAGE plpgsql SET search_path TO '' AS $$\nDECLARE ref text;\nBEGIN\n IF TG_OP='INSERT' THEN\n  IF TG_TABLE_NAME='bag' AND TG_TABLE_SCHEMA='shopdrop_transport_192dc' THEN\n   SELECT 'SD-TRN-AD-'||lpad(a.listing_public_number::text,greatest(8,length(a.listing_public_number::text)),'0')\n   INTO ref FROM public.shopdrop_vehicle_adverts a WHERE a.id=NEW.advert_id AND a.provider_id=NEW.provider_id;\n  ELSE\n   SELECT 'SD-SVC-'||lpad(s.listing_public_number::text,greatest(8,length(s.listing_public_number::text)),'0')\n   INTO ref FROM public.services s WHERE s.id=NEW.service_id AND s.provider_id=NEW.provider_id;\n  END IF;\n  IF ref IS NULL THEN RAISE EXCEPTION 'original_advertisement_reference_unavailable' USING ERRCODE='23514'; END IF;\n  NEW.advertisement_reference_snapshot:=ref;\n ELSE\n  IF NEW.advertisement_reference_snapshot IS DISTINCT FROM OLD.advertisement_reference_snapshot\n     OR NEW.provider_id IS DISTINCT FROM OLD.provider_id THEN\n   RAISE EXCEPTION 'advertisement_snapshot_immutable' USING ERRCODE='23514';\n  END IF;\n  IF TG_TABLE_NAME='bag' AND TG_TABLE_SCHEMA='shopdrop_transport_192dc' THEN\n   IF NEW.advert_id IS DISTINCT FROM OLD.advert_id THEN RAISE EXCEPTION 'advertisement_snapshot_immutable'; END IF;\n  ELSE\n   IF NEW.service_id IS DISTINCT FROM OLD.service_id THEN RAISE EXCEPTION 'advertisement_snapshot_immutable'; END IF;\n  END IF;\n END IF;\n RETURN NEW;\nEND $$;\nREVOKE ALL ON FUNCTION public.shopdrop_advert_snapshot_199dc2() FROM PUBLIC,anon,authenticated;\nGRANT EXECUTE ON FUNCTION public.shopdrop_advert_snapshot_199dc2() TO service_role;\nCREATE TRIGGER shopdrop_advert_snapshot_199dc2 BEFORE INSERT OR UPDATE ON shopdrop_service_193c.bag FOR EACH ROW EXECUTE FUNCTION public.shopdrop_advert_snapshot_199dc2();\nCREATE TRIGGER shopdrop_advert_snapshot_199dc2 BEFORE INSERT OR UPDATE ON shopdrop_transport_192dc.bag FOR EACH ROW EXECUTE FUNCTION public.shopdrop_advert_snapshot_199dc2();\nCREATE TRIGGER shopdrop_advert_snapshot_199dc2 BEFORE INSERT OR UPDATE ON public.service_bookings FOR EACH ROW EXECUTE FUNCTION public.shopdrop_advert_snapshot_199dc2();\n\n-- Preserve the offer reference for every dispatch booking, even when the legacy\n-- request has no original equipment advertisement. Only the exact rate binding\n-- may establish the original advertisement reference for rated hire bookings.\nCREATE FUNCTION public.shopdrop_dispatch_identity_199dc2()\nRETURNS trigger LANGUAGE plpgsql SET search_path TO '' AS $$\nDECLARE ref text;\nBEGIN\n IF TG_OP='INSERT' THEN\n  SELECT 'SD-TRN-'||lpad(o.listing_public_number::text,greatest(8,length(o.listing_public_number::text)),'0')\n  INTO ref FROM public.dispatch_offers o WHERE o.id=NEW.offer_id AND o.provider_id=NEW.provider_id AND o.request_id=NEW.request_id;\n  IF ref IS NULL THEN RAISE EXCEPTION 'original_offer_reference_unavailable'; END IF;\n  NEW.offer_reference_snapshot:=ref;\n  NEW.advertisement_reference_snapshot:=NULL;\n ELSE\n  IF NEW.offer_reference_snapshot IS DISTINCT FROM OLD.offer_reference_snapshot\n     OR NEW.offer_id IS DISTINCT FROM OLD.offer_id OR NEW.provider_id IS DISTINCT FROM OLD.provider_id\n     OR NEW.request_id IS DISTINCT FROM OLD.request_id THEN RAISE EXCEPTION 'dispatch_identity_immutable'; END IF;\n  IF NEW.advertisement_reference_snapshot IS DISTINCT FROM OLD.advertisement_reference_snapshot THEN\n   IF OLD.advertisement_reference_snapshot IS NOT NULL THEN RAISE EXCEPTION 'dispatch_advertisement_reference_immutable'; END IF;\n   SELECT 'SD-TRN-AD-'||lpad(a.listing_public_number::text,greatest(8,length(a.listing_public_number::text)),'0')\n   INTO ref FROM public.shopdrop_booking_rate_selections b\n   JOIN public.shopdrop_advert_service_rates r ON r.id=b.rate_id\n   JOIN public.shopdrop_vehicle_adverts a ON a.id=r.dispatch_advert_id\n   WHERE b.dispatch_booking_id=OLD.id AND a.provider_id=OLD.provider_id;\n   IF ref IS NULL OR NEW.advertisement_reference_snapshot IS DISTINCT FROM ref\n      OR OLD.payment_status<>'pending' THEN RAISE EXCEPTION 'dispatch_advertisement_binding_invalid'; END IF;\n  END IF;\n END IF;\n RETURN NEW;\nEND $$;\nREVOKE ALL ON FUNCTION public.shopdrop_dispatch_identity_199dc2() FROM PUBLIC,anon,authenticated;\nGRANT EXECUTE ON FUNCTION public.shopdrop_dispatch_identity_199dc2() TO service_role;\nCREATE TRIGGER shopdrop_dispatch_identity_199dc2 BEFORE INSERT OR UPDATE ON public.dispatch_bookings FOR EACH ROW EXECUTE FUNCTION public.shopdrop_dispatch_identity_199dc2();\n\nCREATE FUNCTION public.shopdrop_bind_dispatch_identity_199dc2()\nRETURNS trigger LANGUAGE plpgsql SET search_path TO '' AS $$\nDECLARE ref text; saved text;\nBEGIN\n IF NEW.dispatch_booking_id IS NULL THEN RETURN NEW; END IF;\n IF TG_OP='UPDATE' AND OLD.dispatch_booking_id IS DISTINCT FROM NEW.dispatch_booking_id THEN\n  RAISE EXCEPTION 'dispatch_booking_identity_immutable';\n END IF;\n SELECT 'SD-TRN-AD-'||lpad(a.listing_public_number::text,greatest(8,length(a.listing_public_number::text)),'0'),d.advertisement_reference_snapshot\n INTO ref,saved FROM public.dispatch_bookings d\n JOIN public.shopdrop_advert_service_rates r ON r.id=NEW.rate_id\n JOIN public.shopdrop_vehicle_adverts a ON a.id=r.dispatch_advert_id AND a.provider_id=d.provider_id\n WHERE d.id=NEW.dispatch_booking_id;\n IF ref IS NULL THEN RAISE EXCEPTION 'dispatch_advertisement_binding_invalid'; END IF;\n IF saved IS NULL THEN\n  UPDATE public.dispatch_bookings SET advertisement_reference_snapshot=ref WHERE id=NEW.dispatch_booking_id;\n ELSIF saved IS DISTINCT FROM ref THEN\n  RAISE EXCEPTION 'dispatch_advertisement_reference_immutable';\n END IF;\n RETURN NEW;\nEND $$;\nREVOKE ALL ON FUNCTION public.shopdrop_bind_dispatch_identity_199dc2() FROM PUBLIC,anon,authenticated;\nGRANT EXECUTE ON FUNCTION public.shopdrop_bind_dispatch_identity_199dc2() TO service_role;\nCREATE TRIGGER shopdrop_bind_dispatch_identity_199dc2 AFTER INSERT OR UPDATE OF rate_id,dispatch_booking_id ON public.shopdrop_booking_rate_selections FOR EACH ROW EXECUTE FUNCTION public.shopdrop_bind_dispatch_identity_199dc2();\n\n-- Existing payment and release records continue to use their verified booking IDs.\n-- No extra settlement trigger, payout release, role grants or RLS changes.\n", 'supabase/migrations/20261126142415_shopdrop_fix199dc3_reference_read_connections.sql': "-- Fix 199D-C3: read-only reference connections. No new transaction or payment path.\nCREATE FUNCTION public.shopdrop_my_advert_references_199dc3(p_kind text,p_ids uuid[])\nRETURNS TABLE(record_id uuid,advertisement_reference text,offer_reference text)\nLANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path TO ''\nAS $fn$\nDECLARE u uuid:=auth.uid();\nBEGIN\n IF u IS NULL THEN RAISE EXCEPTION 'Sign in required' USING ERRCODE='28000'; END IF;\n IF p_kind IS NULL OR p_kind NOT IN ('service_bag','transport_bag','service_booking','dispatch_booking') THEN\n  RAISE EXCEPTION 'Invalid record type' USING ERRCODE='22023';\n END IF;\n IF p_ids IS NULL OR cardinality(p_ids)=0 THEN RETURN; END IF;\n IF cardinality(p_ids)>60 THEN RAISE EXCEPTION 'Too many references' USING ERRCODE='22023'; END IF;\n IF p_kind='service_bag' THEN\n  RETURN QUERY SELECT b.id,b.advertisement_reference_snapshot,NULL::text\n  FROM shopdrop_service_193c.bag b WHERE b.id=ANY(p_ids) AND b.buyer_id=u;\n ELSIF p_kind='transport_bag' THEN\n  RETURN QUERY SELECT b.id,b.advertisement_reference_snapshot,d.offer_reference_snapshot\n  FROM shopdrop_transport_192dc.bag b LEFT JOIN public.dispatch_bookings d\n   ON d.id=b.dispatch_booking_id AND d.customer_id=u AND d.provider_id=b.provider_id\n  WHERE b.id=ANY(p_ids) AND b.customer_id=u;\n ELSIF p_kind='service_booking' THEN\n  RETURN QUERY SELECT b.id,b.advertisement_reference_snapshot,NULL::text\n  FROM public.service_bookings b WHERE b.id=ANY(p_ids) AND u IN(b.buyer_id,b.provider_id);\n ELSE\n  RETURN QUERY SELECT b.id,b.advertisement_reference_snapshot,b.offer_reference_snapshot\n  FROM public.dispatch_bookings b WHERE b.id=ANY(p_ids) AND u IN(b.customer_id,b.provider_id);\n END IF;\nEND $fn$;\nREVOKE ALL ON FUNCTION public.shopdrop_my_advert_references_199dc3(text,uuid[]) FROM PUBLIC,anon,authenticated;\nGRANT EXECUTE ON FUNCTION public.shopdrop_my_advert_references_199dc3(text,uuid[]) TO authenticated,service_role;\n\n-- Extend the existing public identity function only for approved transport ads.\n-- Preserve every existing product, service and dispatch offer branch.\nDO $patch$\nDECLARE\n src text:=pg_get_functiondef('public.shopdrop_public_listing_identity(text,uuid[])'::regprocedure);\n a text:=$a$'product','service','dispatch_offer'$a$;\n b text:=$a$  ELSE\n    IF (select auth.uid()) IS NULL THEN RETURN; END IF;$a$;\nBEGIN\n IF (length(src)-length(replace(src,a,'')))/length(a)<>1 OR\n    (length(src)-length(replace(src,b,'')))/length(b)<>1 THEN RAISE EXCEPTION 'identity source changed'; END IF;\n src:=replace(src,a,$a$'product','service','dispatch_offer','vehicle_advert'$a$);\n src:=replace(src,b,$a$  ELSIF p_kind='vehicle_advert' THEN\n    RETURN QUERY\n    SELECT v.id, NULLIF(btrim(pr.seller_public_alias),''),\n           'SD-ADV-'||lpad(pr.advertiser_public_number::text,8,'0'),\n           'SD-TRN-AD-'||lpad(v.listing_public_number::text,greatest(8,length(v.listing_public_number::text)),'0')\n    FROM public.shopdrop_vehicle_adverts v\n    JOIN public.profiles pr ON pr.id=v.provider_id\n    WHERE v.id=ANY(v_ids) AND v.listing_status='approved';\n  ELSE\n    IF (select auth.uid()) IS NULL THEN RETURN; END IF;$a$);\n EXECUTE src;\nEND $patch$;\n\n-- Existing complaints can resolve the new transport number or the legacy UUID.\nDO $patch$\nDECLARE\n src text:=pg_get_functiondef('public.shopdrop_resolve_listing_report_199b(uuid,text,text)'::regprocedure);\n a text:=$a$select 'vehicle_advert',v.id,v.id::text from public.shopdrop_vehicle_adverts v$a$;\n b text:=$a$and v.listing_status='approved' and upper(v.id::text)=r$a$;\nBEGIN\n IF (length(src)-length(replace(src,a,'')))/length(a)<>1 OR\n    (length(src)-length(replace(src,b,'')))/length(b)<>1 THEN RAISE EXCEPTION 'report resolver source changed'; END IF;\n src:=replace(src,a,$a$select 'vehicle_advert',v.id,'SD-TRN-AD-'||lpad(v.listing_public_number::text,greatest(8,length(v.listing_public_number::text)),'0') from public.shopdrop_vehicle_adverts v$a$);\n src:=replace(src,b,$a$and v.listing_status='approved' and (upper(v.id::text)=r or 'SD-TRN-AD-'||lpad(v.listing_public_number::text,greatest(8,length(v.listing_public_number::text)),'0')=r)$a$);\n EXECUTE src;\nEND $patch$;\n", 'supabase/migrations/20261126143141_shopdrop_fix199dc4_financial_reference_display.sql': "-- Fix 199D-C4: read-only dispatch payment and provider release reference display.\nCREATE FUNCTION public.shopdrop_my_provider_financial_references_199dc4(p_view text)\nRETURNS TABLE(record_kind text,record_id uuid,booking_id uuid,advertisement_reference text,offer_reference text,payment_reference text,release_reference text,recorded_amount numeric,currency text,recorded_status text,recorded_at timestamptz)\nLANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path TO ''\nAS $fn$\nDECLARE u uuid:=auth.uid();\nBEGIN\n IF u IS NULL THEN RAISE EXCEPTION 'Sign in required' USING ERRCODE='28000'; END IF;\n IF p_view IS NULL OR p_view NOT IN ('receipt','payout') THEN RAISE EXCEPTION 'Invalid view' USING ERRCODE='22023'; END IF;\n IF p_view='receipt' THEN\n  RETURN QUERY\n  SELECT CASE WHEN b.customer_id=u THEN 'dispatch_customer_payment' ELSE 'dispatch_provider_payment_record' END,\n   p.id,b.id,b.advertisement_reference_snapshot,b.offer_reference_snapshot,p.payment_reference,NULL::text,\n   CASE WHEN b.customer_id=u THEN p.gross_amount ELSE p.provider_amount END,p.currency,\n   p.payment_status,p.created_at\n  FROM public.dispatch_payments p JOIN public.dispatch_bookings b ON b.id=p.booking_id\n  WHERE u IN(b.customer_id,b.provider_id)\n  ORDER BY p.created_at DESC,p.id LIMIT 50;\n END IF;\n -- These are requests, not proof of bank settlement. Payee-only, with exact booking identity.\n RETURN QUERY\n SELECT 'service_release_request'::text,r.id,b.id,b.advertisement_reference_snapshot,NULL::text,\n  r.payment_reference,r.provider_release_reference,r.amount,r.currency,r.release_status,r.created_at\n FROM public.shopdrop_provider_release_requests r\n JOIN public.service_bookings b ON r.booking_type='service' AND b.id=r.booking_id AND b.provider_id=r.payee_id\n WHERE r.payee_id=u AND b.provider_id=u\n ORDER BY r.created_at DESC,r.id LIMIT 50;\n RETURN QUERY\n SELECT 'dispatch_release_request'::text,r.id,b.id,b.advertisement_reference_snapshot,b.offer_reference_snapshot,\n  r.payment_reference,r.provider_release_reference,r.amount,r.currency,r.release_status,r.created_at\n FROM public.shopdrop_provider_release_requests r\n JOIN public.dispatch_bookings b ON r.booking_type='dispatch' AND b.id=r.booking_id AND b.provider_id=r.payee_id\n WHERE r.payee_id=u AND b.provider_id=u\n ORDER BY r.created_at DESC,r.id LIMIT 50;\nEND $fn$;\nREVOKE ALL ON FUNCTION public.shopdrop_my_provider_financial_references_199dc4(text) FROM PUBLIC,anon,authenticated;\nGRANT EXECUTE ON FUNCTION public.shopdrop_my_provider_financial_references_199dc4(text) TO authenticated;\n", 'docs/SHOPDROP_FIX199DC_REFERENCE_LEDGER.md': '# Fix 199D-C: permanent item and advertisement references\n\nThe four included SQL migration files are exact copies of the already installed Supabase migrations. Do not rerun them on the live project. They record original physical item references, protect service and transport references, expose authorized read-only lookups, and connect transport payments and provider release requests. The installer modifies only the integration branch and does not execute SQL or deploy Edge Functions.\n\nDatabase fixture verification: product, service and transport reference persistence, immutable item identity, and private reference ownership passed with rollback. No actual payment or release occurred. The new financial lookup has verified anonymous access denial; positive financial-record tests and real provider settlement remain outstanding. The website preserves existing payment, PIN, courier, language and photograph flows. Legacy offers without an actual advertisement reference display the preserved offer reference, not a fabricated advert number.\n'}
        TEST="const assert=require('node:assert/strict');const fs=require('node:fs');const vm=require('node:vm');\nconst u='11111111-1111-4111-8111-111111111111',v='22222222-2222-4222-8222-222222222222',w='33333333-3333-4333-8333-333333333333';\nconst ctx={window:{},document:{createElement:()=>({textContent:''})}};vm.createContext(ctx);vm.runInContext(fs.readFileSync(process.argv[2],'utf8'),ctx);const R=ctx.window.ShopDropReferences199dc;\n(async()=>{const calls=[];const rpc=async(name,args)=>{calls.push({name,args});return [{record_id:args.p_ids[0],advertisement_reference:args.p_kind==='transport_bag'?'TRN-bag':'SD-original',offer_reference:args.p_kind==='dispatch_booking'?'OFR-original':null},{record_id:'44444444-4444-4444-8444-444444444444',advertisement_reference:'Unrequested'}]};\nconst rows=[{id:u,booking_id:v,payment_status:'pending'},{id:w}];await R.dispatch(rows,rpc);assert.equal(rows[0].advertisement_reference,'SD-original');assert.equal(rows[0].offer_reference,'OFR-original');assert.equal(rows[0].payment_status,'pending');assert.equal(rows[1].advertisement_reference,'TRN-bag');assert.equal(calls[0].args.p_kind,'dispatch_booking');assert.equal(calls[1].args.p_kind,'transport_bag');\nconst m=await R.collect(rpc,'service_bag',[u,'wrong']);assert.equal(m.has(w),false);assert.equal(m.size,1);\nawait R.attach(rows,async()=>{throw Error('offline')},'service_bag','id');assert.equal(rows[0].advertisement_reference,null);const rendered=[];R.lines({append(x){rendered.push(x.textContent)}},rows[0]);assert.equal(rendered[0],'Advertisement reference: Not available');\nconst db={rpc:async(n,a)=>({error:null,data:[{record_kind:'service_release_request',record_id:u,booking_id:v,recorded_status:'awaiting_activation'},{record_kind:'dispatch_customer_payment',record_id:v,booking_id:u}]})};const f=await R.financial(db,'payout');assert.equal(f.data.length,1);assert.equal(f.data[0].recorded_status,'awaiting_activation');\nconst qr={from:()=>({select:()=>({in:()=>({limit:async()=>({data:[{order_id:u,listing_reference_snapshot:'SD-LST-A'},{order_id:u,listing_reference_snapshot:'SD-LST-A'},{order_id:w,listing_reference_snapshot:'other'}]})})})})};const om=await R.orderRefs(qr,[u]);assert.equal(om.get(u),'SD-LST-A');assert.equal(om.has(w),false);console.log('Reference display simulations passed');})().catch(e=>{console.error(e);process.exit(1)});\n"
        HELPER='public/shopdrop-reference-display-199dc.js'
