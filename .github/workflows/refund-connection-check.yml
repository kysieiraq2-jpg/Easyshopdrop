name: ShopDrop - Refund Connection Check (No Deploy)

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - '.github/workflows/refund-connection-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase management API access (no changes)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'TOKEN_MISSING'; exit 1; }
          test -n "$PROJECT_REF" || { echo 'PROJECT_REF_MISSING'; exit 1; }
          for endpoint in "projects/$PROJECT_REF" "projects/$PROJECT_REF/functions"; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Accept: application/json' \
              "https://api.supabase.com/v1/$endpoint")
            case "$endpoint" in
              projects/*/functions) echo "FUNCTION_LIST_HTTP_STATUS=$status" ;;
              *) echo "PROJECT_HTTP_STATUS=$status" ;;
            esac
          done
          echo 'DIAGNOSTIC_ONLY_NO_DEPLOYMENT'
