name: ShopDrop Fix 200G Edge Source Sync
'on':
  push:
    branches: [shopdrop-phase6-integration]
    paths: [.github/workflows/shopdrop-fix200g-edge-source-sync.yml]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: shopdrop-fix200g-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true
      - name: Synchronize verified deployed sources only
