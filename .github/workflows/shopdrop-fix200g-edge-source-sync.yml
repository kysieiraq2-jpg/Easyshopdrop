ved: false,\n    }, 409);\n  }\n  return reply({\n    ok: true,\n    verified: true,\n    booking_type: bookingType,\n    booking_id: bookingId,\n    already_verified: result?.already_verified === true,\n    release_request_id: result?.request_id ?? null,\n    release_status: result?.release_status ?? "awaiting_activation",\n    payment_provider_activation_pending: true,\n    funds_moved: false,\n  });\n});\n'), 'supabase/functions/feedback/index.ts': ('52415291ff0072c7f28708867f4d743fc9ddd6b0', 'a208a55a4ae3a2fe8c724cd907c7da3ba76fa80d5f72f415b6f10d0c2e556aae', b'import { createClient } from "https://esm.sh/@supabase/supabase-js@2";\n\nconst VERSION = "SHOPDROP-R7-FEEDBACK-V3-CONTACT";\n\nconst SUPABASE_URL = Deno.env.get("SUPABASE_URL") ?? "";\nconst SERVICE_ROLE_KEY =\n  Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") ?? "";\n\nconst CORS = {\n  "Access-Control-Allow-Origin": "*",\n  "Access-Control-Allow-Headers":\n    "authorization, x-client-info, apikey, content-type",\n  "Access-Control-Allow-Methods": "POST, OPTIONS",\n};\n\nfunction json(body: Record<string, unknown>, status = 200) {\n  return new Response(\n    JSON.stringify({ version: VERSION, ...body }),\n    {\n      status,\n      headers: {\n        ...CORS,\n        "content-type": "application/json; charset=utf-8",\n        "cache-control": "no-store",\n      },\n    },\n  );\n}\n\nfunction adminClient() {\n  return createClient(\n    SUPABASE_URL,\n    SERVICE_ROLE_KEY,\n    {\n      auth: {\n        persistSession: false,\n        autoRefreshToken: false,\n      },\n    },\n  );\n}\n\nfunction cleanText(value: unknown, max = 4000) {\n  return String(value ?? "").trim().slice(0, max);\n}\n\nDeno.serve(async (req) => {\n  if (req.method === "OPTIONS") {\n    return new Response("ok", { headers: CORS });\n  }\n\n  if (req.method !== "POST") {\n    return json({ ok: false, error: "method_not_allowed" }, 405);\n  }\n\n  if (!SUPABASE_URL || !SERVICE_ROLE_KEY) {\n    return json(\n      { ok: false, error: 