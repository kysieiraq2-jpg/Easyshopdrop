name: ShopDrop Multilingual Fix 3D - Seller Pages
on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - .github/workflows/shopdrop-multilingual-fix3d.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true
      - name: Add seller language bridge while preserving original pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          pages=[Path('public/seller-apply.html'),Path('public/seller.html'),Path('public/account.html')]
          for p in pages:
              if not p.is_file():raise SystemExit(f'STOP: missing {p}')
              text=p.read_text()
              if text.count('</body>')!=1 or 'shopdrop-seller-language.js' in text:
                  raise SystemExit(f'STOP: unexpected baseline {p}')
          target=Path('public/shopdrop-seller-language.js')
          if target.exists():raise SystemExit('STOP: translation file already exists')
          target.write_bytes(base64.b64decode(''))
          for p in pages:
              original=p.read_text()
              updated=original.replace('</body>','<script defer src="shopdrop-seller-language.js"></script></body>')
              if updated.replace('<script defer src="shopdrop-seller-language.js"></script>','')!=original:
                  raise SystemExit('STOP: preservation failed')
              p.write_text(updated)
          PY
          git diff --check
          git add public/seller-apply.html public/seller.html public/account.html public/shopdrop-seller-language.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add multilingual interface to seller and account pages'
          git push origin HEAD:shopdrop-phase6-integration
