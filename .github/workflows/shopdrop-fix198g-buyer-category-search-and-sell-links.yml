name: ShopDrop Fix 198G Buyer Search and Seller Links
'on':
  push:
    branches:
    - shopdrop-phase6-integration
    paths:
    - .github/workflows/shopdrop-fix198g-buyer-category-search-and-sell-links.yml
  workflow_dispatch: {}
