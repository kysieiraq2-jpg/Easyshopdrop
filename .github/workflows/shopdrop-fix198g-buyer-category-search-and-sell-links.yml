        git diff --check
        git config user.name "ShopDrop Integration"
        git config user.email "actions@users.noreply.github.com"
        git add -- public/index.html public/v26-homepage-layout.js public/product-shopping-194a.html public/product-search-194b.html public/shopdrop-product-search-194b.js public/shopdrop-buyer-picker-198g.js public/shopdrop-buyer-picker-198g.css backups/fix198g/index.html backups/fix198g/v26-homepage-layout.js backups/fix198g/product-shopping-194a.html backups/fix198g/product-search-194b.html backups/fix198g/shopdrop-product-search-194b.js
        if ! git diff --cached --quiet; then
          git commit -m "Fix 198G buyer category filters and consistent sell links"
          git push origin HEAD:shopdrop-phase6-integration
        fi
