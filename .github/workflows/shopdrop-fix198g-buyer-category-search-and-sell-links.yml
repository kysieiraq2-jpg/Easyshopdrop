        PATCHES={'public/index.html': [('\n          <a href="./sell-item.html">Sell a Product — FREE</a>', '\n          <a href="./sell-item.html?v=198g">Sell an Item — FREE</a>'), ('\n      <a href="./sell-item.html">Sell an Item</a>', '\n      <a href="./sell-item.html?v=198g">Sell an Item — FREE</a>'), ('src="v26-homepage-layout.js?v=197a"', 'src="v26-homepage-layout.js?v=198g"')], 'public/v26-homepage-layout.js': [('actions.querySelector(\'a[href="./sell-item.html"]\');', 'actions.querySelector(\'a[href="./sell-item.html?v=198g"],a[href="./sell-item.html"]\');')], 'public/product-shopping-194a.html': [('href="./sell-item.html">Sell a Product — FREE', 'href="./sell-item.html?v=198g">Sell an Item — FREE'), ('Tap Sell a Product — FREE.', 'Tap Sell an Item — FREE.'), ('href="./product-search-194b.html?view=handmade"', 'href="./product-search-194b.html?view=handmade&amp;v=198g"'), ('href="./product-search-194b.html">Search Products — Filters', 'href="./product-search-194b.html?v=198g">Search Products — Filters'), ('href="./categories.html">Products &amp; Categories / Search', 'href="./categories.html?entry=categories&amp;v=198d">Products &amp; Categories / Search')], 'public/product-search-194b.html': [('<link rel="stylesheet" href="./shopdrop-unified-cards.css?v=59">', '<link rel="stylesheet" href="./shopdrop-unified-cards.css?v=59">\n<link rel="stylesheet" href="./shopdrop-buyer-picker-198g.css?v=198g">'), ('<label for="category194b">Category</label><select id="category194b"><option value="">All categories</option></select>', '<div class="shopdrop-buyer-picker198g"><label for="shopdropBuyerCategory198gInput">Main category</label>\n<div class="picker-row198g"><input type="search" id="shopdropBuyerCategory198gInput" placeholder="All categories — tap or type" maxlength="100" autocomplete="off" enterkeyhint="done" aria-controls="shopdropBuyerCategory198gResults" aria-describedby="shopdropBuyerCategory198gStatus" aria-expanded="false"><button type="button" id="shopdrop