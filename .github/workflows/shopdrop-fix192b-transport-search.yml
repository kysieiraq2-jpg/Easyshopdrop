name: ShopDrop Fix 192B Transport Search
"on":
  workflow_dispatch:
  push:
    branches: [shopdrop-phase6-integration]
    paths: ['.github/workflows/shopdrop-fix192b-transport-search.yml']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fix:
    if: github.ref == 'refs/heads/shopdrop-phase6-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
      - name: Install Transport search pages
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import shutil
          root = Path('public')
          backup = Path('backups/fix192b')
          backup.mkdir(parents=True, exist_ok=True)
          dispatch = root / 'dispatching.html'
          provider = root / 'shopdrop-dispatch-equipment-fields.js'
          home = root / 'index.html'
          for path in (dispatch, home):
              target = backup / path.name
              if not target.exists():
                  shutil.copy2(path, target)
          source = provider.read_text()
          start = source.index('const CATEGORIES =')
          end = source.index('function element(', start)
          definitions = source[start:end]
          assert 'const ARRANGEMENTS =' in definitions
          (root / 'shopdrop-transport-taxonomy-192b.js').write_text(
              "(() => {\n'use strict';\n" + definitions +
              "\nwindow.ShopDropTransportTaxonomy = Object.freeze({CATEGORIES, ARRANGEMENTS});\n})();\n")
          html = dispatch.read_text()
          panel = '''
          <section class="panel" id="shopdropTransportSearch192B">
            <h2>Find Transport Services or Equipment for Hire</h2>
            <p>Search available transport services, vehicles, machinery, equipment and tools for hire.</p>
            <a class="shopdrop-provider-advert-link" href="./transport-search.html">Search Transport &amp; Equipment Hire</a>
            <p class="muted">Browse advertisements and photographs without registering.</p>
          </section>
          '''
          if 'id="shopdropTransportSearch192B"' not in html:
              start = html.index('id="shopdropDispatchAdvertise"')
              end = html.index('</section>', start) + len('</section>')
              dispatch.write_text(html[:end] + '\n' + panel + html[end:])
          html = home.read_text().replace('Dispatching &amp; Transport</a>', 'Transport Services &amp; Equipment Hire</a>').replace('<h2>Dispatch & Transport</h2>', '<h2>Transport Services &amp; Equipment Hire</h2>')
          home.write_text(html)
          css = '''
          *{box-sizing:border-box}
          body{margin:0;background:#f4f6f8;color:#17202a;font:16px Arial,sans-serif}
          header{background:#101827;padding:16px;display:flex;flex-wrap:wrap;gap:16px}
          header a{color:white}
          main{max-width:950px;margin:auto;padding:16px}
          .panel{background:white;border-radius:12px;padding:20px;margin-bottom:16px}
          h1{font-size:25px;line-height:1.3} h2{font-size:20px}
          label{display:block;font-weight:bold;margin-top:14px}
          select,button,.btn{font:inherit;width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;margin-top:8px}
          button,.btn{background:#0f766e;color:white;border:0;text-align:center;font-weight:bold;text-decoration:none;display:block;cursor:pointer}
          [hidden]{display:none!important}
          button:disabled{opacity:.5;cursor:default}
          .muted{color:#64748b;line-height:1.5}
          .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
          article{border:1px solid #dbe2ea;border-radius:10px;padding:14px;overflow:hidden}
          article img{width:100%;height:190px;object-fit:contain;background:#f4f6f8;border-radius:8px}
          .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
          .empty{padding:24px;background:#f1f5f9;border-radius:10px;grid-column:1/-1;line-height:1.6}
          .error{color:#991b1b;background:#fef2f2}
          '''
          (root / 'shopdrop-transport-search-192b.css').write_text(css)
          def page(title, content, scripts):
              return '''<!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>''' + title + ''' | Shop&amp;Drop</title>
          <link rel="stylesheet" href="./shopdrop-transport-search-192b.css">
          </head><body><header>
          <a href="./index.html">Home</a>
          <a href="./dispatching.html">Back to Transport</a>
          <a href="./account.html">My Account</a>
          <a href="./checkout.html">Bag</a>
          </header><main>''' + content + '</main>' + scripts + '</body></html>'
          search = '''
          <section class="panel"><h1>Search Transport &amp; Equipment Hire</h1>
          <p class="muted">Choose the service or equipment you need. Leave optional filters open to browse more advertisements.</p>
          <form id="transportSearch">
          <label for="category">Main category</label><select id="category" name="category"></select>
          <label for="subtype">Vehicle or equipment type</label><select id="subtype" name="subtype" disabled></select>
          <label for="arrangement">Service or hire arrangement</label><select id="arrangement" name="arrangement"></select>
          <label for="province">Province</label><select id="province" name="province"></select>
          <label for="town">Town or city</label><select id="town" name="town" disabled></select>
          <p id="searchStatus" role="status" class="muted"></p>
          <button id="searchButton" type="submit" disabled>Search Available Advertisements</button>
          <a class="btn" href="./transport-results.html">Browse All Transport &amp; Equipment</a>
          </form></section>'''
          (root / 'transport-search.html').write_text(page('Search Transport &amp; Equipment Hire', search,
              '<script src="./shopdrop-transport-taxonomy-192b.js"></script><script src="./shopdrop-transport-search-192b.js"></script>'))
          results = '''<section class="panel"><h1>Transport &amp; Equipment Hire Results</h1>
          <a class="btn" href="./transport-search.html">Change Search</a>
          <p id="resultsStatus" role="status" aria-live="polite">Loading advertisements...</p>
          <div class="grid" id="transportResults"></div>
          <button id="nextPage" type="button" hidden>Load More Advertisements</button></section>'''
          (root / 'transport-results.html').write_text(page('Transport Search Results', results,
              '<script src="./shopdrop-transport-results-192b.js"></script>'))
          PY
          cat > public/shopdrop-transport-search-192b.js <<'JS'
          (() => {
            'use strict';
            const byId = id => document.getElementById(id);
            const category = byId('category');
            const subtype = byId('subtype');
            const arrangement = byId('arrangement');
            const province = byId('province');
            const town = byId('town');
            const status = byId('searchStatus');
            const {CATEGORIES, ARRANGEMENTS} = window.ShopDropTransportTaxonomy;
            function fill(select, values, placeholder) {
              select.replaceChildren(new Option(placeholder, ''));
              for (const value of values) {
                const pair = Array.isArray(value) ? value : [value, value];
                select.add(new Option(pair[1], pair[0]));
              }
            }
            fill(category, Object.keys(CATEGORIES).sort(), 'All categories');
            fill(subtype, [], 'Choose a category first');
            fill(arrangement, ARRANGEMENTS, 'Any arrangement');
            fill(province, [], 'All provinces');
            fill(town, [], 'Choose a province first');
            category.addEventListener('change', () => {
              fill(subtype, (CATEGORIES[category.value] || []).slice().sort(), 'All equipment types');
              subtype.disabled = !category.value;
            });
            async function initializeLocations() {
              try {
                const response = await fetch('./shopdrop-sa-towns-181.json');
                if (!response.ok) throw Error('Location data unavailable');
                const data = await response.json();
                const provinces = data.provinces;
                if (!provinces || !Object.keys(provinces).length) throw Error('Location data unavailable');
                fill(province, Object.keys(provinces).sort(), 'All provinces');
                province.addEventListener('change', () => {
                  fill(town, (provinces[province.value] || []).slice().sort(), 'All towns');
                  town.disabled = !province.value;
                });
                byId('searchButton').disabled = false;
              } catch (_) {
                status.textContent = 'Location selections could not load. Please reload this page.';
              }
            }
            byId('transportSearch').addEventListener('submit', event => {
              event.preventDefault();
              const params = new URLSearchParams();
              for (const id of ['category','subtype','arrangement','province','town']) {
                const value = byId(id).value;
                if (value) params.set(id, value);
              }
              location.href = './transport-results.html?' + params.toString();
            });
            initializeLocations();
          })();
          JS
          cat > public/shopdrop-transport-results-192b.js <<'JS'
          (() => {
            'use strict';
            const BASE = 'https://dtkdvvxpwonywtsgqmdx.supabase.co';
            const KEY = 'sb_publishable_yHOcyzuuSWDzshhcAF9N8Q_7JiGFq2q';
            const headers = {apikey: KEY, 'Content-Type': 'application/json'};
            const params = new URLSearchParams(location.search);
            const results = document.getElementById('transportResults');
            const status = document.getElementById('resultsStatus');
            const next = document.getElementById('nextPage');
            let offset = 0;
            const limit = 40;
            function node(tag, text, className) {
              const element = document.createElement(tag);
              if (text != null) element.textContent = text;
              if (className) element.className = className;
              return element;
            }
            function money(value) {
              return new Intl.NumberFormat('en-ZA', {style:'currency',currency:'ZAR'}).format(Number(value));
            }
            async function rpc(body) {
              const response = await fetch(BASE + '/rest/v1/rpc/shopdrop_search_transport_192a', {
                method:'POST', headers, body:JSON.stringify(body)
              });
              if (!response.ok) throw Error('Search unavailable');
              const data = await response.json();
              if (!Array.isArray(data)) throw Error('Invalid results');
              return data;
            }
            async function loadPhoto(photo, img) {
              try {
                if (photo.bucket !== 'shopdrop-vehicle-ad-gallery') throw Error('Invalid gallery');
                const path = String(photo.path || '').split('/').map(encodeURIComponent).join('/');
                const response = await fetch(BASE + '/storage/v1/object/sign/' + photo.bucket + '/' + path, {
                  method:'POST', headers, body:JSON.stringify({expiresIn:3600})
                });
                if (!response.ok) throw Error('Photo unavailable');
                const data = await response.json();
                const url = new URL(BASE + '/storage/v1' + data.signedURL);
                if (url.origin !== BASE) throw Error('Invalid URL');
                img.src = url.href;
                img.hidden = false;
              } catch (_) {
                img.replaceWith(node('p','Photograph temporarily unavailable.','muted'));
              }
            }
            function photoElement(photo) {
              const img = node('img');
              img.alt = 'Transport advertisement photograph';
              img.loading = 'lazy';
              img.hidden = true;
              loadPhoto(photo,img);
              return img;
            }
            function render(advert) {
              const card = node('article');
              const photos = Array.isArray(advert.photos) ? advert.photos : [];
              const rates = Array.isArray(advert.rates) ? advert.rates : [];
              if (photos.length) card.append(photoElement(photos[0]));
              card.append(node('h2',advert.vehicle_title || 'Transport advertisement'));
              card.append(node('p',[advert.dispatch_category,advert.dispatch_subtype].filter(Boolean).join(' — ')));
              card.append(node('p',[advert.base_town,advert.base_province].filter(Boolean).join(', '),'muted'));
              if (rates.length) card.append(node('p','From '+money(rates[0].price_zar)+' / '+rates[0].pricing_unit.replaceAll('_',' ')));
              const details = node('details');
              details.append(node('summary','View Details & Photographs'));
              details.append(node('p',advert.vehicle_description || ''));
              const gallery = node('div',null,'gallery');
              for (const photo of photos) gallery.append(photoElement(photo));
              details.append(gallery);
              for (const rate of rates) details.append(node('p',money(rate.price_zar)+' / '+rate.pricing_unit.replaceAll('_',' ')+' — Minimum: '+rate.minimum_units));
              details.append(node('p','Advertisement reference: '+advert.id,'muted'));
              card.append(details);
              results.append(card);
            }
            async function load() {
              next.hidden = true;
              next.disabled = true;
              status.textContent = 'Searching advertisements...';
              try {
                const body = {p_limit:limit,p_offset:offset};
                for (const key of ['category','subtype','arrangement','province','town']) {
                  if (params.get(key)) body['p_'+key] = params.get(key);
                }
                const adverts = await rpc(body);
                if (!adverts.length && offset === 0) {
                  results.replaceChildren(node('div','No transport services or equipment hire advertisements are currently available for your selection. Please try another search or check again later.','empty'));
                  status.textContent = '0 advertisements found.';
                  return;
                }
                for (const advert of adverts) render(advert);
                offset += adverts.length;
                status.textContent = offset+' advertisement(s) displayed.';
                next.textContent = 'Load More Advertisements';
                next.hidden = adverts.length < limit;
              } catch (_) {
                status.textContent = 'Unable to load advertisements. Please try again.';
                next.hidden = false;
                next.textContent = 'Retry Search';
              } finally {
                next.disabled = false;
              }
            }
            next.addEventListener('click',load);
            load();
          })();
          JS
      - name: Verify new files
        run: |
          set -euo pipefail
          node --check public/shopdrop-transport-taxonomy-192b.js
          node --check public/shopdrop-transport-search-192b.js
          node --check public/shopdrop-transport-results-192b.js
          test -s public/transport-search.html
          test -s public/transport-results.html
          test -s public/shopdrop-sa-towns-181.json
          grep -q 'transport-search.html' public/dispatching.html
          grep -q 'shopdrop_search_transport_192a' public/shopdrop-transport-results-192b.js
          git diff --check
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'ShopDrop Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add backups/fix192b public/index.html public/dispatching.html public/transport-search.html public/transport-results.html public/shopdrop-transport-taxonomy-192b.js public/shopdrop-transport-search-192b.js public/shopdrop-transport-results-192b.js public/shopdrop-transport-search-192b.css
          if git diff --cached --quiet; then
            echo 'Fix already installed.'
          else
            git commit -m 'Fix 192B Transport customer search and results'
            git push origin HEAD:shopdrop-phase6-integration
          fi
  deploy:
    needs: fix
    uses: ./.github/workflows/shopdrop-integration-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
