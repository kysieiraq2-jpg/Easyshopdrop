name: ShopDrop Multilingual Fix 3F - Services and Help
on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - .github/workflows/shopdrop-multilingual-fix3f.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true
      - name: Add multilingual labels without changing page logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          pages=[Path('public/services.html'),Path('public/dispatching.html'),Path('public/help.html'),Path('public/feedback.html')]
          for p in pages:
              if not p.is_file(): raise SystemExit(f'STOP: missing {p}')
              s=p.read_text()
              if s.count('</body>')!=1 or 'shopdrop-info-language.js' in s:
                  raise SystemExit(f'STOP: unexpected baseline {p}')
          target=Path('public/shopdrop-info-language.js')
          if target.exists(): raise SystemExit('STOP: language script already exists')
          target.write_bytes(base64.b64decode(''))
          for p in pages:
              original=p.read_text()
              updated=original.replace('</body>','<script defer src="shopdrop-info-language.js"></script></body>')
              if updated.replace('<script defer src="shopdrop-info-language.js"></script>','')!=original:
                  raise SystemExit('STOP: preservation check failed')
              p.write_text(updated)
          PY
          git diff --check
          git add public/services.html public/dispatching.html public/help.html public/feedback.html public/shopdrop-info-language.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add multilingual interface to services dispatch help and feedback'
          git push origin HEAD:shopdrop-phase6-integration
