
name: ShopDrop Fix 181C Town Database

on:
  push:
    branches:
      - shopdrop-phase6-integration
    paths:
      - .github/workflows/shopdrop-fix181c-town-database.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-town-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true

      - name: Build verified South African town data
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import io
          import json
          import urllib.request
          from pathlib import Path

          destination = Path(
              "public/shopdrop-sa-towns-181.json"
          )

          if destination.exists():
              raise SystemExit(
                  "STOP: Town database already exists."
              )

          source_url = (
              "https://raw.githubusercontent.com/"
              "dirkstrauss/SouthAfrica/master/"
              "SouthAfricanCities.csv"
          )

          request = urllib.request.Request(
              source_url,
              headers={
                  "User-Agent": "ShopDrop-Town-Importer"
              }
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              raw = response.read(3000000)

          content = raw.decode("cp1252")
          reader = csv.DictReader(io.StringIO(content))

          expected_columns = {
              "City", "AccentCity", "ProvinceName",
              "Latitude", "Longitude", "ProvinceID"
          }

          if not expected_columns.issubset(
              set(reader.fieldnames or [])
          ):
              raise SystemExit(
                  "STOP: Unexpected source columns."
              )

          provinces = [
              "Eastern Cape",
              "Free State",
              "Gauteng",
              "KwaZulu-Natal",
              "Limpopo",
              "Mpumalanga",
              "North West",
              "Northern Cape",
              "Western Cape"
          ]

          towns = {name: {} for name in provinces}
          source_count = 0

          for row in reader:
              source_count += 1

              province = (
                  row["ProvinceName"] or ""
              ).strip()

              if province == "KwaZulu Natal":
                  province = "KwaZulu-Natal"

              if province not in towns:
                  raise SystemExit(
                      "STOP: Unknown province: " + province
                  )

              name = (
                  row["AccentCity"] or row["City"] or ""
              ).strip()

              if not name:
                  continue

              if len(name) > 120:
                  continue

              key = name.casefold()

              if key not in towns[province]:
                  towns[province][key] = name

          if source_count < 12000:
              raise SystemExit(
                  "STOP: Town source unexpectedly incomplete."
              )

          result = {}

          for province in provinces:
              values = list(towns[province].values())

              values.sort(
                  key=lambda value: value.casefold()
              )

              if len(values) < 100:
                  raise SystemExit(
                      "STOP: Incomplete province: " + province
                  )

              result[province] = values

          required = {
              "Mpumalanga": [
                  "Delmas", "Secunda", "Evander"
              ],
              "Free State": ["Marquard"],
              "North West": ["Potchefstroom"],
              "KwaZulu-Natal": ["Newcastle"]
          }

          for province, names in required.items():
              available = {
                  name.casefold()
                  for name in result[province]
              }

              for name in names:
                  if name.casefold() not in available:
                      raise SystemExit(
                          "STOP: Missing town: " + name
                      )

          output = {
              "version": "181C",
              "country": "ZA",
              "source": source_url,
              "source_record_count": source_count,
              "provinces": result
          }

          destination.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  separators=(",", ":")
              ) + "\n",
              encoding="utf-8"
          )

          total = sum(
              len(values)
              for values in result.values()
          )

          print("Source records:", source_count)
          print("Unique province/town entries:", total)

          for province, values in result.items():
              print(province, len(values))

          print("Town database created successfully.")
          PY

      - name: Verify and commit town database
        shell: bash
        run: |
          set -e

          python3 -m json.tool \
            public/shopdrop-sa-towns-181.json \
            > /dev/null

          git add public/shopdrop-sa-towns-181.json
          git diff --cached --check

          test "$(git diff --cached --name-only)" = \
            "public/shopdrop-sa-towns-181.json"

          git config user.name "ShopDrop Fix Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Fix 181C SA town reference data"
          git push origin HEAD:shopdrop-phase6-integration
