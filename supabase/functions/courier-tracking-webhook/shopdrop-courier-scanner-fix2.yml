name: ShopDrop Courier Scanner Fix 2 (source only)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-scanner-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shopdrop-phase6-integration
          persist-credentials: true
      - name: Patch existing webhook without removing lines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('supabase/functions/courier-tracking-webhook/index.ts')
          original=p.read_text()
          expected_blob='05aa9904ca586c90b7348da61b8cbe081d8b9786'
          actual=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          if actual != expected_blob:
              raise SystemExit('STOP: webhook changed since verification; no patch applied')
          anchor='    /*\n     * ========================================================\n     * IDEMPOTENCY'
          if original.count(anchor)!=1 or 'SHOPDROP COURIER SCANNER INTEGRATION' in original:
              raise SystemExit('STOP: unexpected code or already patched')
          patch='''    /*
               * SHOPDROP COURIER SCANNER INTEGRATION — authenticated and matched.
               * Scan evidence is a candidate only; existing delivery worker
               * and payout eligibility gates remain unchanged.
               */
              const scannerCode = normalize(
                body.scan_event_code ?? body.scan_code ??
                (normalize(body.event_type) === "scan" ? body.event_code : ""),
              );
              if (scannerCode) {
                const finalScanCodes = new Set([
                  "delivered", "delivery_completed", "proof_of_delivery", "pod_confirmed",
                ]);
                const nonFinalScanCodes = new Set([
                  "picked_up", "pickup", "collected", "in_transit", "at_depot",
                  "out_for_delivery", "delivery_attempted", "exception", "returned",
                ]);
                const scanTime = Date.parse(text(
                  body.scan_occurred_at ?? body.occurred_at ?? body.event_time,
                ));
                const podReference = text(
                  body.proof_of_delivery_reference ?? body.pod_reference,
                );
                if (!eventId || !Number.isFinite(scanTime) ||
                    scanTime > Date.now() + 300000 ||
                    (!finalScanCodes.has(scannerCode) && !nonFinalScanCodes.has(scannerCode))) {
                  return response({ok:false,error:"invalid_courier_scan_evidence",
                    seller_payout_released:false},400);
                }
                if (finalScanCodes.has(scannerCode) &&
                    (!podReference || status !== "delivered")) {
                  return response({ok:false,error:"scan_delivery_requires_pod_and_delivered_status",
                    seller_payout_released:false},400);
                }
                if (nonFinalScanCodes.has(scannerCode) && status === "delivered") {
                  return response({ok:false,error:"non_delivery_scan_cannot_confirm_delivery",
                    seller_payout_released:false},400);
                }
              }

          '''
          updated=original.replace(anchor,patch+anchor)
          if updated.replace(patch,'')!=original:
              raise SystemExit('STOP: original preservation failed')
          p.write_text(updated)
          print(f'Preserved original {len(original.splitlines())} lines; added {len(patch.splitlines())} lines')
          PY
          git diff --check
          git add supabase/functions/courier-tracking-webhook/index.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add scanner evidence guard to existing courier tracking webhook'
          git push origin HEAD:shopdrop-phase6-integration
